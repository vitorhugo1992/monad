  const acc = { day: z(), dayN: z(), daySq: z(), night: z(), nightN: z(), nightSq: z() };
  for (let i = rowAt(t0); i < notebook.count; i++) {
    const o = i * S, L = r[o + NB.LIGHT], k = L > N.dayAbove ? 'day' : L < N.nightBelow ? 'night' : '';
    if (!k) continue;
    for (let f = 0; f < F; f++) {
      const m = r[o + NB.N + f], d = r[o + NB.DEPTH + f], sd = r[o + NB.SD + f];
      acc[k][f] += m * d; acc[k + 'N'][f] += m; acc[k + 'Sq'][f] += m * (sd * sd + d * d);
    }
  }
  return acc;
}

// ---- Opening, turning, zooming ----
function openNotebook(on) {
  notebook.open = on;
  needsRender = true;
}
function turnPage(dir) {
  notebook.page = (notebook.page + dir + PAGES.length) % PAGES.length;
  needsRender = true;
}
function setSpan(i) {
  notebook.span = clamp(i, 0, PARAMS.notebook.spans.length - 1);
  needsRender = true;
}
function onGlyph(p) {
  const G = PARAMS.notebook.glyph;
  return p.x >= G.x - 3 && p.x < G.x + GLYPH[0].length + 3 && p.y >= G.y - 3 && p.y < G.y + GLYPH.length + 4;
}
function notebookKey(key) {
  if (key === 'Escape') openNotebook(false);
  else if (key === 'ArrowLeft') turnPage(-1);
  else if (key === 'ArrowRight') turnPage(1);
  else if (key === 'ArrowUp' || key === '+' || key === '=') setSpan(notebook.span - 1);
  else if (key === 'ArrowDown' || key === '-' || key === '_') setSpan(notebook.span + 1);
  else return false;
  return true;
}
// A finger lifted over the open notebook: a sideways swipe turns the page, a tap outside the page (or on the glyph)
// closes it, a tap on the page presses whatever is there
function notebookRelease(d, p) {
  const P = PARAMS.notebook.page, dx = p.x - d.x;
  needsRender = true;
  if (d.moved > PARAMS.touch.tapMove) {
    if (Math.abs(dx) >= PARAMS.notebook.swipe && Math.abs(dx) > Math.abs(p.y - d.y)) turnPage(dx < 0 ? 1 : -1);
    return;
  }
  if (onGlyph(p) || p.x < P.x || p.x >= P.x + P.w || p.y < P.y || p.y >= P.y + P.h) { openNotebook(false); return; }
  for (const h of notebook.hits) {
    if (p.x >= h.x && p.x < h.x + h.w && p.y >= h.y && p.y < h.y + h.h) { h.fn(); return; }
  }
}

// ---- Ink ----
const textWidth = (s) => s.length * 4 - 1;
const ink = (x, y, text, idx) => drawGlyphs(x, y, text, idx, 1, 0);
const inkRight = (xr, y, text, idx) => ink(xr - textWidth(text) + 1, y, text, idx);
const inkCentre = (y, text, idx) => { const P = PARAMS.notebook.page; ink(P.x + Math.floor((P.w - textWidth(text)) / 2), y, text, idx); };
const hit = (x, y, w, h, fn) => notebook.hits.push({ x, y, w, h, fn });
// Text on a dark backing, readable over a graph
function inkOver(x, y, text, idx) {
  fillRect(x - 1, y - 1, textWidth(text) + 2, 7, PAGE_INK);
  ink(x, y, text, idx);
}
// Words wrapped into lines of at most n characters
function wrap(text, n) {
  const lines = [];
  let line = '';
  for (const word of text.split(' ')) {
    if (line && line.length + 1 + word.length > n) { lines.push(line); line = word; } else line = line ? line + ' ' + word : word;
  }
  if (line) lines.push(line);
  return lines;
}

function fillRect(x, y, w, h, idx) {
  for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) put(i, j, idx);
}
function dotted(x0, x1, y, idx) {
  for (let x = x0; x <= x1; x += 2) put(x, y, idx);
}
// Twice the size: the clock on the day page
function inkBig(x, y, text, idx) {
  for (let n = 0; n < text.length; n++) {
    const glyph = FONT[text[n]] || FONT[' '];
    for (let row = 0; row < 5; row++) {
      for (let col = 0; col < 3; col++) if (glyph[row] & (4 >> col)) fillRect(x + n * 8 + col * 2, y + row * 2, 2, 2, idx);
    }
  }
}
// A three-pixel bar in a ramp (lit top row) on a dotted slate track
function bar(x, y, w, frac, ramp) {
  const len = Math.round(clamp(frac, 0, 1) * w), rb = rampBase(ramp);
  dotted(x, x + w - 1, y + 1, COL.SLATE);
  for (let i = 0; i < len; i++) { put(x + i, y, rb + HIGHLIGHT); put(x + i, y + 1, rb + BASE); put(x + i, y + 2, rb + BASE); }
}
function drawIcon(x, y, f, faded) {
  const rb = rampBase(FORMS[f].ramp), icon = FORMS[f].icon;
  for (let j = 0; j < icon.length; j++) {
    for (let i = 0; i < icon[j].length; i++) {
      const ch = icon[j][i];
      if (ch === '.') continue;
      const t = ch === 'h' ? BRIGHT : ch === 'b' ? HIGHLIGHT : BASE;
      put(x + i, y + j, rb + (faded ? t - 2 : t));
    }
  }
}
// Trichodesmium's icon: a tuft of golden-brown filaments
function drawTrichoIcon(x, y, faint) {
  const rows = ['.o...o.', '..o.o..', 'o.hob.o', '.ohbbo.', '..bbb..', '.o.b.o.', 'o..o..o'];
  rows.forEach((row, dy) => { for (let dx = 0; dx < 7; dx++) { const ch = row[dx]; if (ch !== '.') put(x + dx, y + dy, faint ? COL.SLATE : rampBase(TRI_RAMP) + (ch === 'h' ? BRIGHT : ch === 'b' ? HIGHLIGHT : BASE)); } });
}
// Cyanobacteria's icon: a haze of tiny specks, pink and blue-green
function drawCyanoIcon(x, y, faint) {
  const dots = [[1, 1, ROSE], [4, 0, EMERALD], [2, 3, EMERALD], [5, 3, ROSE], [0, 5, ROSE], [3, 6, EMERALD], [6, 5, ROSE], [4, 4, ROSE]];
  for (const [dx, dy, r] of dots) put(x + dx, y + dy, faint ? COL.SLATE : rampBase(r) + BRIGHT);
}
// Every entry of the species guide: the nine forms, then the two cyanobacteria
const guideIcon = (e, x, y, faint) => (e < FORMS.length ? drawIcon(x, y, e, faint) : e === FORMS.length ? drawCyanoIcon(x, y, faint) : drawTrichoIcon(x, y, faint));
const niceCeil = (v) => [1, 2, 5, 10, 20, 50, 100, 150, 200, 300, 400, 500].find((s) => s >= v) || Math.ceil(v / 100) * 100;

// Real units
const metres = (frac) => Math.round(frac * PARAMS.notebook.depthM);
const mlPerL = (o2) => o2 * PARAMS.notebook.o2mL;
const o2Saturation = (T) => 1 - PARAMS.oxygen.satT * (T - PARAMS.temperature.air);   // the model's own, at temperature T
const moonName = (m) => { const lit = moonLit(m); return lit > 0.95 ? 'FULL' : lit < 0.05 ? 'NEW' : (m < 0.5 ? 'WAXING ' : 'WANING ') + Math.round(lit * 100) + '%'; };

// The notebook glyph, top right: shows with the HUD, bright while the notebook is open
function drawNotebookGlyph(now) {
  const G = PARAMS.notebook.glyph, vis = notebook.open ? 1 : hudVisibility(now);
  if (vis <= 0) return;
  for (const dx of [1, 0]) {
    for (let j = 0; j < GLYPH.length; j++) {
      for (let i = 0; i < GLYPH[j].length; i++) {
        const x = G.x + i, y = G.y + j;
        const ch = GLYPH[j][i];
        if (ch === '.' || (vis < 1 && bayer(x, y) >= vis)) continue;
        put(x + dx, y + dx, dx ? COL.WATER : ch === '-' ? COL.SHAFT : notebook.open ? COL.GLOW : COL.FOAM);
      }
    }
  }
}

// Behind every time graph: day and night as the water saw them (night dark, full sun lighter)
function chartBackground(cols, y0, h) {
  const N = PARAMS.notebook, CX = N.chart.x;
  for (let c = 0; c < N.chart.w; c++) {
    const L = cols.light[c], day = smoothstep(N.nightBelow, 0.7, L);
    for (let y = y0; y < y0 + h; y++) {
      put(CX + c, y, !cols.has[c] ? PAGE_INK : L < N.nightBelow ? COL.WATER : bayer(CX + c, y) < day ? 3 : 2);
    }
  }
  for (let y = y0; y < y0 + h; y++) put(CX - 1, y, COL.SLATE);
}
function drawTimeAxis(cols, y) {
  const N = PARAMS.notebook, CX = N.chart.x, span = cols.t0 > 0;
  ink(CX, y, span ? '-' + clock((cols.t1 - cols.t0) * TICK_DT) : 'BIRTH', COL.SLATE);
  inkRight(CX + N.chart.w - 1, y, span ? 'NOW' : clock(cols.t1 * TICK_DT), COL.SLATE);
  for (const r of notebook.rests) {   // where the water rested while away: a small rose notch under the graph
    if (r.tick < cols.t0 || r.tick > cols.t1) continue;
    const x = CX + (cols.t1 > cols.t0 ? Math.min(N.chart.w - 1, Math.floor((r.tick - cols.t0) / (cols.t1 - cols.t0) * N.chart.w)) : N.chart.w - 1);
    put(x, y - 3, rampBase(ROSE) + HIGHLIGHT); put(x, y - 2, rampBase(ROSE) + BASE);
  }
}
// A line over the window: value(c) gives a row (0 = top) or -1 where there is nothing to draw; gaps break it
function chartLine(y0, valueAt, idx) {
  const N = PARAMS.notebook;
  let prev = -1;
  for (let c = 0; c < N.chart.w; c++) {
    const v = valueAt(c);
    if (v < 0) { prev = -1; continue; }
    const a = prev < 0 ? v : Math.min(prev, v), b = prev < 0 ? v : Math.max(prev, v);
    for (let y = a; y <= b; y++) put(N.chart.x + c, y0 + y, idx);
    prev = v;
  }
}
// The time windows, centred on a row; spans longer than the life so far show the whole life (drawn faint)
function drawSpanRow(y) {
  const N = PARAMS.notebook, life = notebook.count ? notebook.rows[(notebook.count - 1) * NB.STRIDE + NB.TICK] : 0;
  const labels = N.spans.map(spanLabel), gap = 8;
  let x = N.page.x + Math.floor((N.page.w - labels.reduce((s, l) => s + textWidth(l), 0) - gap * (labels.length - 1)) / 2);
  labels.forEach((l, i) => {
    const on = i === notebook.span, tw = textWidth(l);
    ink(x, y, l, on ? COL.FOAM : N.spans[i] && N.spans[i] >= life ? COL.SLATE : COL.SHAFT);
    if (on) for (let k = 0; k < tw; k++) put(x + k, y + 6, COL.FOAM);
    hit(x - 3, y - 3, tw + 6, 12, () => setSpan(i));
    x += tw + gap;
  });
}
// The population over the window, stacked by form (green algae at the bottom), the cyanobacteria on top (biomass,
// about a cell's worth per unit; the filamentous ones hatched), nights dark behind; the scale inside, top left
function drawStack(cols, cy0, ch) {
  const N = PARAMS.notebook, F = FORMS.length, CX = N.chart.x;
  chartBackground(cols, cy0, ch);
  let top = 1;
  for (let c = 0; c < N.chart.w; c++) {
    let tot = cols.cyano[c] + cols.tri[c];
    for (let f = 0; f < F; f++) tot += cols.n[c * F + f];
    top = Math.max(top, tot);
  }
  const scale = niceCeil(top);
  for (let c = 0; c < N.chart.w; c++) {
    if (!cols.has[c]) continue;
    let acc = 0;
    const layer = (v, rb, hatch) => {
      if (!v) return;
      const a = Math.round(acc / scale * ch), b = Math.round((acc + v) / scale * ch), x = CX + c;
      for (let k = a; k < b; k++) { const y = cy0 + ch - 1 - k; put(x, y, rb + (k === b - 1 ? HIGHLIGHT : hatch && (x + y) % 3 === 0 ? SHADOW : BASE)); }
      acc += v;
    };
    for (let f = 0; f < F; f++) layer(cols.n[c * F + f], rampBase(FORMS[f].ramp), false);
    layer(cols.cyano[c], rampBase(CYANO_RAMP), false);
    layer(cols.tri[c], rampBase(TRI_RAMP), true);
  }
  inkOver(CX + 2, cy0 + 2, String(scale), COL.SLATE);
}

// ---- Curiosities: an "i" in an air bubble (render and input only: it never touches the world) ----
// The facts come from facts.json: [{ topic, text, source }]. A topic is a form (green, alexandrium, dinophysis, tripos,
// prorocentrum, centric, pennate, cocco, crypto, cyano, tricho), a group (diatoms, dinos), a place (ocean, column,
// surface, floor), a process (nutrients, deadzone, tides, night, viruses) or an animal (grazers, sardines, salps,
// sunfish, jellies, combs). Which topic is picked depends on what is in view: zoomed in on cells, their forms; near
// the floor, the floor; a visitor on screen, the visitor; zoomed out, the ocean and the column; and what the water is
// doing (a dead zone, milky water, night...). Facts already read are skipped until a topic runs out (kept in this
// browser only).
const curio = { facts: [], bubble: null, card: null, next: 0, count: 0, seen: new Set() };
const KIND_TOPIC = ['green', 'alexandrium', 'dinophysis', 'tripos', 'prorocentrum', 'centric', 'pennate', 'cocco', 'crypto'];
const TOPIC_NAME = {
  green: 'GREEN ALGAE', alexandrium: 'ALEXANDRIUM', dinophysis: 'DINOPHYSIS', tripos: 'TRIPOS', prorocentrum: 'PROROCENTRUM',
  centric: 'CENTRIC DIATOMS', pennate: 'PENNATE DIATOMS', cocco: 'COCCOLITHOPHORES', crypto: 'CRYPTOPHYTES', cyano: 'CYANOBACTERIA',
  tricho: 'FILAMENTOUS CYANOBACTERIA', diatoms: 'DIATOMS', dinos: 'DINOFLAGELLATES', ocean: 'THE OCEAN', column: 'THE WATER COLUMN',
  nutrients: 'NUTRIENTS', surface: 'THE SURFACE', floor: 'THE SEABED', deadzone: 'DEAD ZONES', tides: 'TIDES', night: 'NIGHT',
  viruses: 'VIRUSES', grazers: 'GRAZERS', sardines: 'SARDINES', salps: 'SALPS', sunfish: 'OCEAN SUNFISH', jellies: 'MOON JELLIES',
  combs: 'COMB JELLIES',
};
const fontSafe = (t) => String(t).toUpperCase().replace(/[^A-Z0-9 .,'()?!=;:\-\/%+]/g, ' ').replace(/ +/g, ' ').trim();
function loadFacts() {
  try { curio.seen = new Set(JSON.parse(localStorage.getItem('monad-facts-seen') || '[]')); } catch (e) { /* private mode */ }
  fetch('facts.json').then((r) => (r.ok ? r.json() : [])).then((list) => {
    if (!Array.isArray(list)) return;
    curio.facts = list.filter((f) => f && f.topic && f.text).map((f) => ({ topic: f.topic, text: fontSafe(f.text), source: fontSafe(f.source || ''), id: hashString(f.text) }));
  }).catch(() => { /* offline on a first visit, or file://: no curiosities */ });
}
function markSeen(f) {
  curio.seen.add(f.id);
  try { localStorage.setItem('monad-facts-seen', JSON.stringify([...curio.seen].slice(-400))); } catch (e) { /* private mode */ }
}

// What the water is doing now, as tags
function tipTags(w) {
  const tags = new Set(), F = FORMS.length, counts = new Array(F).fill(0);
  let glow = 0;
  for (const c of w.cells) { if (c.dying) continue; counts[formOf(c)]++; if (isLuminous(c)) glow++; }
  const alive = counts.reduce((s, v) => s + v, 0), night = w.surfaceLight < PARAMS.notebook.nightBelow, cy = cyanoTotal(w);
  if (counts[7] > 30) tags.add('milky');
  if (cy.tri > 20) tags.add('scum');
  if (alive > 150) tags.add('bloom');
  if (alive < 30) tags.add('crash');
  if (night) tags.add('night');
  if (night && glow) tags.add('glow');
  if (w.cysts.length > 10) tags.add('cysts');
  if (w.wind > PARAMS.notebook.seaStates[2]) tags.add('storm');
  if (Math.abs(w.spring - 1) > PARAMS.tide.range / 2) tags.add('tide');
  if (w.pulses.length) tags.add('upwelling');
  if (w.runoffs.length) tags.add('runoff');
  if (bottomOxygen(w).min < PARAMS.oxygen.hypoxic) tags.add('hypoxia');
  return tags;
}

// The topic for what is in view: weights from the cells in frame (when zoomed in), the cyanobacteria and visitors on
// screen, the depth the camera looks at, the zoom, and the water's state; drawn by weight among topics with facts
function curioTopic(w) {
  const wt = new Map(), add = (t, v) => wt.set(t, (wt.get(t) || 0) + v), z = cam.zoom;
  const x0 = cam.x, y0 = cam.y, x1 = x0 + W / z, y1 = y0 + H / z, column = H - PARAMS.world.floor, mid = clamp((y0 + y1) / 2 / column, 0, 1);
  if (z >= 3) {   // close up: the forms in frame
    const counts = new Array(FORMS.length).fill(0);
    let n = 0;
    for (const c of w.cells) if (!c.dying && c.x >= x0 && c.x <= x1 && c.y >= y0 && c.y <= y1) { counts[c.kind]++; n++; }
    counts.forEach((k, f) => { if (k) add(KIND_TOPIC[f], 6 * Math.min(1, n / 4) * k / n); });   // a lone cell counts less
    if (counts[5] + counts[6]) add('diatoms', 1);
    if (counts[1] + counts[2] + counts[3] + counts[4]) add('dinos', 1);
  }
  if (cyanoSeen > 30) add('cyano', z >= 2 ? 2 : 0.8);
  if (triSeen > 10) add('tricho', z >= 2 ? 2.5 : 1);
  for (const v of w.visitors) if (v.x > x0 - 20 && v.x < x1 + 20 && v.y > y0 - 20 && v.y < y1 + 20) add(v.kind, 4);
  if (krillSeen.n > 0) add('grazers', 1.5);
  if (mid > 0.75 || y1 > column - 10 && z >= 2) add('floor', 5);
  if (mid < 0.2 && z >= 2) add('surface', 2.5);
  if (z <= 1) { add('ocean', 2.5); add('column', 2.5); add('nutrients', 1); } else add('column', 0.6);
  const tags = tipTags(w), T = (tag, topic, v) => { if (tags.has(tag)) add(topic, v); };
  T('milky', 'cocco', 1.5); T('scum', 'tricho', 2); T('night', 'night', 1.5); T('glow', 'dinos', 1); T('storm', 'column', 1);
  T('tide', 'tides', 1.5); T('upwelling', 'nutrients', 1.5); T('runoff', 'surface', 1.5); T('hypoxia', 'deadzone', mid > 0.6 ? 4 : 1.5);
  T('bloom', 'ocean', 1); T('bloom', 'grazers', 0.5); T('crash', 'viruses', 1); T('cysts', 'floor', 0.5);
  add('ocean', 0.4); add('viruses', 0.2); add('tides', 0.2);
  const have = new Set(curio.facts.map((f) => f.topic)), pool = [...wt].filter(([t]) => have.has(t));
  let total = 0;
  for (const [, v] of pool) total += v;
  let r = hash01(curio.count * 7919 + world.tick) * total;
  for (const [t, v] of pool) { r -= v; if (r <= 0) return t; }
  return pool.length ? pool[pool.length - 1][0] : null;
}
// A fact on that topic not read yet (when all are read, the topic starts over)
function curioFact(topic) {
  let pool = curio.facts.filter((f) => f.topic === topic && !curio.seen.has(f.id));
  if (!pool.length) {
    for (const f of curio.facts) if (f.topic === topic) curio.seen.delete(f.id);
    pool = curio.facts.filter((f) => f.topic === topic);
  }
  return pool.length ? pool[Math.floor(hash01(curio.count * 104729 + 7) * pool.length)] : null;
}

// Now and then a bubble rises in a corner; ignored, it fades away
function updateCurio(w, now) {
  const C = PARAMS.curio;
  if (!curio.facts.length || notebook.open || catchup.phase) return;
  if (!curio.next) curio.next = now + C.first * 1000;
  const b = curio.bubble;
  if (b && !curio.card && now - b.born > C.life * 1000) curio.bubble = null;
  if (curio.bubble || curio.card || now < curio.next) return;
  const topic = curioTopic(w), fact = topic && curioFact(topic);
  curio.count++;
  curio.next = now + (C.everyMin + (C.everyMax - C.everyMin) * hash01(curio.count * 31 + 5)) * 1000;
  if (!fact) return;
  const [x, y] = C.corners[Math.floor(hash01(curio.count * 17 + 3) * C.corners.length)];
  curio.bubble = { x, y, born: now, fact };
}
function bubblePos(now) {
  const C = PARAMS.curio, b = curio.bubble, age = (now - b.born) / 1000;
  return { x: Math.round(b.x + C.sway * Math.sin(age * 1.3)), y: Math.round(b.y - C.rise * age) };
}
// A tap: on the bubble opens its card; anywhere while a card is open closes it. Returns true if it took the tap.
function curioRelease(p) {
  if (curio.card) { curio.card = null; curio.bubble = null; needsRender = true; return true; }
  if (!curio.bubble) return false;
  const q = bubblePos(performance.now());
  if (Math.abs(p.x - q.x) > PARAMS.curio.r + 5 || Math.abs(p.y - q.y) > PARAMS.curio.r + 5) return false;
  curio.card = { fact: curio.bubble.fact, top: q.y > H / 2 };
  markSeen(curio.bubble.fact);
  bubbleSound(cam.x + q.x / cam.zoom, 0.5, false);
  needsRender = true;
  return true;
}
// The bubble: a ring of foam with a lit cap and an "i" inside, fading in and out; the card: a small page with the
// topic, the fact and its source
function drawCurio(now) {
  curio.box = null;
  if (notebook.open || catchup.phase) return;
  const C = PARAMS.curio, P = PARAMS.notebook.page;
  if (curio.bubble && !curio.card) {
    const q = bubblePos(now), age = (now - curio.bubble.born) / 1000, vis = Math.min(1, age / 1.5, (C.life - age) / 3), r = C.r;
    for (let dy = -r - 1; dy <= r + 1; dy++) {
      for (let dx = -r - 1; dx <= r + 1; dx++) {
        const d = Math.sqrt(dx * dx + dy * dy), x = q.x + dx, y = q.y + dy;
        if (d > r + 0.5 || bayer(x, y) >= vis) continue;
        if (d > r - 0.7) put(x, y, dx + dy < -3 ? COL.GLOW : COL.FOAM);           // the film, lit on the upper left
        else if (dx === -2 && dy === -2) put(x, y, COL.GLOW);                    // a glint
      }
    }
    for (const [dx, dy] of [[0, -2], [0, 0], [0, 1], [0, 2]]) if (bayer(q.x + dx, q.y + dy) < vis) put(q.x + dx, q.y + dy, COL.GLOW);   // the i
    curio.box = [q.x - r - 2, q.y - r - 2, q.x + r + 3, q.y + r + 3];
  }
  if (curio.card) {
    const f = curio.card.fact, lines = wrap(f.text, 38), src = f.source ? wrap('SOURCE: ' + f.source, 38).slice(0, 2) : [];
    const h = 22 + lines.length * 7 + (src.length ? 4 + src.length * 7 : 0), x0 = P.x, y0 = curio.card.top ? 26 : H - 40 - h, x1 = x0 + P.w;
    fillRect(x0, y0, P.w, h, PAGE_INK);
    for (let x = x0 + 1; x < x1 - 1; x++) { put(x, y0, COL.SLATE); put(x, y0 + h - 1, COL.SLATE); }
    for (let y = y0 + 1; y < y0 + h - 1; y++) { put(x0, y, COL.SLATE); put(x1 - 1, y, COL.SLATE); }
    const k = KIND_TOPIC.indexOf(f.topic), gi = k >= 0 ? k : f.topic === 'cyano' ? FORMS.length : f.topic === 'tricho' ? FORMS.length + 1 : -1;
    let tx = x0 + 6;
    if (gi >= 0) { guideIcon(gi, tx, y0 + 5, false); tx += 10; }
    ink(tx, y0 + 6, TOPIC_NAME[f.topic] || fontSafe(f.topic), COL.FOAM);
    inkRight(x1 - 7, y0 + 6, 'X', COL.SLATE);
    dotted(x0 + 6, x1 - 7, y0 + 14, COL.SLATE);
    let y = y0 + 18;
    for (const line of lines) { ink(x0 + 6, y, line, COL.SHAFT); y += 7; }
    if (src.length) { y += 3; for (const line of src) { ink(x0 + 6, y, line, COL.SLATE); y += 7; } }
    curio.box = [x0, y0, x1, y0 + h];
  }
}
// Kept in day colours at every hour, as the notebook is
function inkCurio() {
  if (!curio.box) return;
  const [x0, y0, x1, y1] = curio.box, ib = view.ibuf, buf = view.buf;
  for (let y = Math.max(0, y0); y < Math.min(H, y1); y++) for (let x = Math.max(0, x0); x < Math.min(W, x1); x++) buf[y * W + x] = PAL32[ib[y * W + x]];
}

// ---- The pages ----
function drawNotebook(w) {
  const N = PARAMS.notebook, P = N.page, ib = view.ibuf, x1 = P.x + P.w, y1 = P.y + P.h;
  notebook.hits.length = 0;
  for (let y = 0; y < H; y++) {   // the water stays in view around the page, dimmed
    for (let x = 0; x < W; x++) {
      if (x >= P.x && x < x1 && y >= P.y && y < y1) ib[y * W + x] = PAGE_INK;
      else if (bayer(x, y) < N.dim) ib[y * W + x] = COL.WATER;
    }
  }
  for (let x = P.x + 1; x < x1 - 1; x++) { put(x, P.y, COL.SLATE); put(x, y1 - 1, COL.SLATE); }
  for (let y = P.y + 1; y < y1 - 1; y++) { put(P.x, y, COL.SLATE); put(x1 - 1, y, COL.SLATE); }
  for (let x = P.x + 3; x < x1 - 3; x += 2) { put(x, P.y + 2, 2); put(x, y1 - 3, 2); }
  for (let y = P.y + 3; y < y1 - 3; y += 2) { put(P.x + 2, y, 2); put(x1 - 3, y, 2); }

  ink(P.x + 6, P.y + 6, PAGES[notebook.page], COL.FOAM);
  inkRight(x1 - 7, P.y + 6, (notebook.page + 1) + '/' + PAGES.length, COL.SLATE);
  dotted(P.x + 6, x1 - 7, P.y + 13, COL.SLATE);

  const fy = y1 - 11, dx0 = P.x + Math.floor(P.w / 2) - 3 * PAGES.length;
  ink(P.x + 6, fy, '<', COL.SHAFT);
  inkRight(x1 - 7, fy, '>', COL.SHAFT);
  hit(P.x, fy - 5, 28, 15, () => turnPage(-1));
  hit(x1 - 28, fy - 5, 28, 15, () => turnPage(1));
  for (let i = 0; i < PAGES.length; i++) {
    fillRect(dx0 + i * 6 + 2, fy + 2, 2, 2, i === notebook.page ? COL.FOAM : COL.SLATE);
    hit(dx0 + i * 6, fy - 3, 6, 11, () => { notebook.page = i; });
  }
  if (notebook.page !== PAGES.length - 1 || !notebook.open) notebook.confirm = false;   // a question left unanswered is withdrawn
  [drawDayPage, drawCensusPage, drawSpeciesPage, drawWaterPage, drawColumnPage, drawMigrationPage, drawLedgerPage][notebook.page](w, P.y + 19);
}
const PAGE_END = () => PARAMS.notebook.page.y + PARAMS.notebook.page.h - 17;   // the lowest row a page's content may use, above the page turner

// The notebook keeps day colours at every hour, so it reads the same at night
function inkNotebook() {
  const P = PARAMS.notebook.page, G = PARAMS.notebook.glyph, ib = view.ibuf, buf = view.buf;
  const copy = (x0, y0, x1, y1) => {
    for (let y = y0; y < y1; y++) for (let x = x0; x < x1; x++) buf[y * W + x] = PAL32[ib[y * W + x]];
  };
  copy(P.x, P.y, P.x + P.w, P.y + P.h);
  copy(G.x, G.y, Math.min(W, G.x + GLYPH[0].length + 1), G.y + GLYPH.length + 1);
  const M = PARAMS.hud.music;
  copy(M.x - 1, M.y, M.x + NOTE_GLYPH[0].length + 1, M.y + NOTE_GLYPH.length + 2);
}

// I. The day: a sun and moon dial over the sea, the hour, the weather, the water at the surface and the bottom, the
// life of the world, and the day in one strip
function drawDayPage(w, y) {
  const N = PARAMS.notebook, D = PARAMS.diel, P = N.page, ph = dayPhase(w), R = N.dialR;
  const cx = P.x + (P.w >> 1), cy = y + 33, x1 = P.x + P.w;
  for (let j = 1; j <= 10; j++) {   // the sea under the horizon
    for (let x = cx - R - 12; x <= cx + R + 12; x++) put(x, cy + j, bayer(x, cy + j) < 1 - j / 10 ? 4 : 2);
  }
  for (let x = cx - R - 12; x <= cx + R + 12; x++) put(x, cy, COL.SHAFT);
  for (let a = 0; a <= 32; a++) {
    const t = a / 32 * Math.PI;
    put(Math.round(cx - R * Math.cos(t)), Math.round(cy - R * 0.85 * Math.sin(t)), COL.SLATE);
  }
  ink(cx - R - 11, cy - 7, 'E', COL.SLATE);
  ink(cx + R + 9, cy - 7, 'W', COL.SLATE);
  const day = ph < D.dayFrac, t = day ? ph / D.dayFrac : (ph - D.dayFrac) / (1 - D.dayFrac), moon = moonPhase(w);
  const bx = Math.round(cx - R * Math.cos(Math.PI * t)), by = Math.round(cy - R * 0.85 * Math.sin(Math.PI * t));
  for (let dy = -3; dy <= 3; dy++) {
    for (let dx = -3; dx <= 3; dx++) {
      if (dx * dx + dy * dy > 10 || by + dy >= cy) continue;
      if (day) put(bx + dx, by + dy, rampBase(GOLD) + (dx + dy < -1 ? BRIGHT : HIGHLIGHT));
      else put(bx + dx, by + dy, (moon < 0.5 ? dx : -dx) > 3.2 * dsin(TAU * moon + Math.PI / 2) * Math.sqrt(Math.max(0, 1 - dy * dy / 10.24)) ? COL.FOAM : COL.SLATE);   // the moon in its phase
    }
  }
  if (day) {
    for (const [dx, dy] of [[5, 0], [-5, 0], [0, -5], [0, 5], [4, 4], [-4, 4], [4, -4], [-4, -4]]) {
      if (by + dy < cy) put(bx + dx, by + dy, rampBase(GOLD) + BASE);
    }
  }
  const hhmm = (h) => { const m = Math.round(mod(h, 24) * 60) % 1440; return pad(Math.floor(m / 60), 2) + ':' + pad(m % 60, 2); };
  const hour = mod(N.noonHour + (ph - D.dayFrac / 2) * 24, 24), rise = N.noonHour - D.dayFrac * 12, set = N.noonHour + D.dayFrac * 12;
  const time = hhmm(Math.floor(hour * 60) / 60);
  inkBig(cx - ((time.length * 8 - 2) >> 1), cy + 13, time, COL.FOAM);
  const dayNum = Math.floor(w.tick * TICK_DT / w.dayLength + D.start) + 1;
  inkCentre(cy + 27, 'DAY ' + dayNum + '   ' + (day ? 'SUNSET AT ' + hhmm(set) : 'SUNRISE AT ' + hhmm(rise)), COL.SHAFT);

  let ry = cy + 37;
  const row = (label, draw, indent) => { ink(P.x + 6 + (indent || 0), ry, label, COL.SHAFT); draw(N.bar.x, ry); ry += 9; };
  const value = (text, idx) => (x, yy) => ink(x, yy, text, idx || COL.FOAM);
  const divide = () => { dotted(P.x + 6, x1 - 7, ry, COL.SLATE); ry += 5; };
  let sea = 0;
  while (sea < N.seaStates.length && w.wind >= N.seaStates[sea]) sea++;
  let z = 0;
  for (let i = 0; i < w.fields.graz.length; i++) z += w.fields.graz[i];
  const Td = PARAMS.tide, O = PARAMS.oxygen;
  row('SUNLIGHT', day ? (x, yy) => bar(x, yy + 1, N.bar.w, w.surfaceLight, GOLD) : value('NONE, ONLY THE MOON', COL.SLATE));
  row('SEA ' + SEA_STATES[sea], (x, yy) => bar(x, yy + 1, N.bar.w, w.wind, EMERALD));
  row(w.spring > 1 + Td.range / 2 ? 'SPRING TIDE' : w.spring < 1 - Td.range / 2 ? 'NEAP TIDE' : 'TIDE', (x, yy) => bar(x, yy + 1, N.bar.w, Math.abs(w.tideU) / (1 + Td.range), BLUE));
  const toSprings = mod(-moon, 0.5) * PARAMS.tide.month;   // days to the next new or full moon
  row('MOON', value(moonName(moon) + (toSprings > 1.5 && toSprings < 13.5 ? '  SPRINGS IN ' + Math.round(toSprings) + 'D' : '')));
  row('UPWELLING', value(w.pulses.length ? 'A PLUME RISES' : 'NONE', w.pulses.length ? rampBase(GREEN) + HIGHLIGHT : COL.SLATE));
  row('RUNOFF', value(w.runoffs.length ? 'RAIN, MUD WASHES IN' : 'NONE', w.runoffs.length ? rampBase(AMBER) + HIGHLIGHT : COL.SLATE));
  divide();
  row('SURFACE', value(surfaceTemp(w).toFixed(1) + ' C   ' + surfaceMean(w.fields.sal).toFixed(1) + ' PSU'));
  const nutS = surfaceMean(w.fields.nut) / PARAMS.nutrients.deep;
  row('NUTRIENTS', (x, yy) => { bar(x, yy + 1, 60, nutS, GREEN); inkRight(x1 - 7, yy, Math.round(nutS * 100) + '%', COL.FOAM); }, 4);
  const ox = bottomOxygen(w), Tb = bottomTemp(w), severe = ox.min < O.anoxic, hypoxic = ox.min < O.hypoxic;
  row(severe ? 'DEAD ZONE' : hypoxic ? 'HYPOXIC' : 'BOTTOM O2', value(hypoxic
    ? 'LOWEST ' + mlPerL(ox.min).toFixed(1) + ' ML/L'
    : mlPerL(ox.mean).toFixed(1) + ' ML/L   ' + Math.round(ox.mean / o2Saturation(Tb) * 100) + '%', hypoxic ? rampBase(OLIVE) + BRIGHT : COL.FOAM));
  row('GRAZERS', (x, yy) => bar(x, yy + 1, N.bar.w, z / w.fields.graz.length / 2, ROSE));
  divide();
  if (w.extinctTick >= 0) {
    row('LIVED', value(clock(w.extinctTick * TICK_DT)));
    row('', value('EXTINCT', rampBase(ROSE) + HIGHLIGHT));
  } else {
    row('ALIVE FOR', value(clock(w.tick * TICK_DT)));
    row('POPULATION', value(String(aliveCount(w))));
  }
  // Cysts: the bed now, and those made and woken in the last hour (from the record)
  const r = notebook.rows, S = NB.STRIDE, last = notebook.count - 1, i0 = rowAt(w.tick - 3600 * PARAMS.time.tickRate);
  const known = last >= 0 && r[i0 * S + NB.ENC] >= 0;
  row('CYSTS', value(w.cysts.length + ' IN THE BED'));
  if (known) row('LAST HOUR', value((r[last * S + NB.ENC] - r[i0 * S + NB.ENC]) + ' MADE   ' + (r[last * S + NB.GERM] - r[i0 * S + NB.GERM]) + ' WOKE'), 4);
  // The whole day in one strip, midnight to midnight: surface light by the hour, and where the day is now
  divide();
  const sx = P.x + 6, sw = P.w - 12, toPhase = (h) => mod((h - N.noonHour) / 24 + D.dayFrac / 2, 1);
  for (let i = 0; i < sw; i++) {
    const L = surfaceLightAt(toPhase((i + 0.5) / sw * 24)), lit = smoothstep(D.moon, 1, L);
    for (let k = 0; k < 5; k++) {
      const x = sx + i, yy = ry + 2 + k;
      put(x, yy, toPhase((i + 0.5) / sw * 24) >= D.dayFrac ? 2 : rampBase(GOLD) + (bayer(x, yy) < lit ? HIGHLIGHT : BASE));
    }
  }
  const nx = sx + Math.round(hour / 24 * (sw - 1));
  for (let k = 0; k < 9; k++) put(nx, ry + k, COL.FOAM);
}

// II. The census: how many of each form live in the column now, and who ruled the water over the window
function drawCensusPage(w, y) {
  const N = PARAMS.notebook, P = N.page, F = FORMS.length, x1 = P.x + P.w, counts = new Array(F).fill(0);
  let chained = 0, glow = 0;
  for (const c of w.cells) {
    if (c.dying) continue;
    counts[formOf(c)]++;
    if (c.chainLen > 1) chained++;
    if (isLuminous(c)) glow++;
  }
  const cyT = cyanoTotal(w), most = Math.max(1, ...counts, cyT.syn + cyT.pro, cyT.tri), BX = 82, BW = 58;
  for (let f = 0; f < F; f++) {
    const ry = y + f * 10;
    drawIcon(P.x + 6, ry, f, !counts[f]);
    ink(P.x + 16, ry + 1, FORMS[f].name, counts[f] ? COL.FOAM : COL.SLATE);
    bar(BX, ry + 2, BW, counts[f] / most, FORMS[f].ramp);
    inkRight(x1 - 7, ry + 1, String(counts[f]), counts[f] ? COL.FOAM : COL.SLATE);
  }
  // Cyanobacteria as biomass (about a cell's worth per unit): the single cells together (author: just cyanobacteria),
  // and under them, indented, the filamentous ones (Trichodesmium)
  [['CYANOBACTERIA', cyT.syn + cyT.pro, drawCyanoIcon, CYANO_RAMP, 0], ['FILAMENTOUS', cyT.tri, drawTrichoIcon, TRI_RAMP, 6]].forEach(([name, v, icon, ramp, indent], k) => {
    const n = Math.round(v), ry = y + (F + k) * 10;
    icon(P.x + 6 + indent, ry, !n);
    ink(P.x + 16 + indent, ry + 1, name, n ? COL.FOAM : COL.SLATE);
    bar(BX, ry + 2, BW, n / most, ramp);
    inkRight(x1 - 7, ry + 1, String(n), n ? COL.FOAM : COL.SLATE);
  });
  ink(P.x + 6, y + 112, 'IN CHAINS ' + chained + '   CYSTS ' + w.cysts.length + '   GLOWING ' + glow, COL.SHAFT);
  ink(P.x + 6, y + 120, 'CYANOBACTERIA: CELLS\' WORTH OF BIOMASS', COL.SLATE);
  dotted(P.x + 6, x1 - 7, y + 128, COL.SLATE);
  drawSpanRow(y + 133);

  const cols = notebookColumns(), cy0 = y + 144, ch = PAGE_END() - 9 - cy0;
  drawStack(cols, cy0, ch);
  drawTimeAxis(cols, cy0 + ch + 3);
}

// Example cells for the guide, one per form: a lineage found by trying sprite seeds until the form comes out
// (render only: they never enter the world)
let specimens = null;
function guideSpecimens() {
  if (specimens) return specimens;
  const timbre = [0.12, 0.41, 0.41, 0.41, 0.41, 0.9, 0.9, 0.12, 0.12];
  specimens = timbre.map((tb, kind) => {
    for (let seed = 1; ; seed++) {
      const g = { hue: kind >= 5 && kind <= 6 ? 5.2 : 3.5, size: kind === 3 ? 1.2 : 1.5, depthPref: 0.3, omega: 0.3, coupling: kind >= 5 && kind <= 6 ? 0.55 : 0.2, timbre: tb };
      const c = cellObject(-1 - kind, 0, 0, 0, g, 0.5, 0, seed * 7919);
      deriveTraits(c);
      if (c.kind !== kind) continue;
      if (c.hunter) { c.klepto = 1; c.plastids = [VIOLET, ROSE, BLUE, VIOLET]; }   // Dinophysis wears its prey's colours
      return c;
    }
  });
  return specimens;
}
// A cell drawn as the water draws it (without the water's light), centred at cx, cy, on screen radius rpx
function drawSpecimen(c, cx, cy, rpx, tick) {
  const angle = -0.6, step = Math.round(angle / TAU * PARAMS.sprite.tumbleSteps), key = 'guide' + rpx;
  if (!c.spr || c.spr.key !== key) c.spr = buildSprite(c, rpx, step * TAU / PARAMS.sprite.tumbleSteps, 8, key);
  const spr = c.spr, base = rampBase(hueRamp(c)), base2 = rampBase(hueNeighbour(c));
  c.theta = tick * TICK_DT * TAU * c.g.omega;   // the flagella beat with its pulse
  drawFlagella(c, cx, cy, step * TAU / PARAMS.sprite.tumbleSteps, rpx, spr, base);
  const tones = spr.frames[Math.floor(tick * TICK_DT * PARAMS.sprite.wobbleFps) % spr.frames.length], x0 = cx - spr.half, y0 = cy - spr.half;
  for (let py = 0; py < spr.size; py++) {
    for (let px = 0; px < spr.size; px++) {
      const t0 = tones[py * spr.size + px];
      if (t0 === -1) continue;
      let idx;
      if (t0 === IRIDESCENT) idx = IRID_SET[mod(Math.floor(tick * TICK_DT * PARAMS.sprite.iridSpeed * 8) + ((px + 2 * py) >> 1), IRID_SET.length)];
      else if (t0 <= PLATE_LIT) idx = PLATE_IDX[PLATE_LIT - t0];
      else {
        const slot = t0 >= ALT ? Math.floor(t0 / ALT) : 0, tt = t0 - slot * ALT;
        idx = (slot === 0 ? base : slot === 1 ? base2 : c.plastids && c.plastids[slot - 2] !== undefined ? rampBase(c.plastids[slot - 2]) : base) + tt;
      }
      put(x0 + px, y0 + py, idx);
    }
  }
}
// A bacterial cell seen close up, lit from the upper left: an oval cell wall, rings of thylakoid membrane just inside
// it, and carboxysome specks in the middle (a cyanobacterium has no nucleus and no chloroplast: the cell is one)
function drawBacterium(cx, cy, rx, ry, ramp, tick, seed) {
  const rb = rampBase(ramp);
  for (let y = Math.floor(cy - ry) - 1; y <= cy + ry + 1; y++) {
    for (let x = Math.floor(cx - rx) - 1; x <= cx + rx + 1; x++) {
      const u = (x + 0.5 - cx) / rx, v = (y + 0.5 - cy) / ry, d = Math.sqrt(u * u + v * v);
      if (d > 1) continue;
      const lit = -(u + v) * 0.7;   // the upper left catches the light
      let t;
      if (d > 0.88) t = lit > 0.2 ? BRIGHT : lit < -0.3 ? SHADOW : HIGHLIGHT;   // the cell wall
      else if ((d > 0.66 && d < 0.73) || (d > 0.5 && d < 0.56)) t = HIGHLIGHT;   // thylakoid rings
      else if (d < 0.4 && hash01(seed + x * 31 + y * 17) < 0.12) t = SHADOW;      // carboxysomes
      else t = bayer(x, y) < 0.5 + lit * 0.4 ? BASE : HIGHLIGHT;
      put(x, y, rb + t);
    }
  }
}
// The cyanobacteria, one cell each: Synechococcus, a short pink-orange rod; Prochlorococcus, a smaller round
// blue-green cell (about a thousandth of a millimetre: far smaller than any cell in the water, drawn large)
function drawCyanoSpecimen(x0, y0, w, h, tick) {
  const cy = y0 + (h >> 1), wob = dsin(tick * TICK_DT * 0.6) * 0.6;
  const a = x0 + Math.round(w * 0.26), b = x0 + Math.round(w * 0.76);
  drawBacterium(a, cy + wob, 19, 11, ROSE, tick, 11);
  drawBacterium(b, cy - wob, 11, 11, EMERALD, tick, 23);
  ink(a - (textWidth('SYNECHOCOCCUS') >> 1), y0 + h - 6, 'SYNECHOCOCCUS', COL.SLATE);
  ink(b - (textWidth('PROCHLOROCOCCUS') >> 1), y0 + h - 6, 'PROCHLOROCOCCUS', COL.SLATE);
}
// The filamentous ones: one trichome, a chain of short disc-shaped cells (wider than long) with dark cross walls,
// speckled with gas vesicles, gently curved and swaying; the end cells rounded
function drawTrichoSpecimen(cx, cy, tick) {
  const rb = rampBase(TRI_RAMP), n = 15, cw = 8, half = 5, sway = dsin(tick * TICK_DT * 0.7);
  const x0 = cx - (n * cw) / 2;
  for (let i = 0; i < n; i++) {
    for (let px = 0; px < cw; px++) {
      const x = Math.round(x0 + i * cw + px), s = (x - cx) / (n * cw / 2), mid = cy + Math.round(s * s * 6 * sway);   // a gentle curve
      const fromEnd = i === 0 ? px : i === n - 1 ? cw - 1 - px : cw, hh = fromEnd < 4 ? Math.round(half * Math.sqrt(1 - Math.pow((3.5 - fromEnd) / 4, 2))) : half;   // rounded ends
      for (let dy = -hh; dy <= hh; dy++) {
        const y = mid + dy, v = dy / half;
        let t = v < -0.6 ? BRIGHT : v > 0.6 ? SHADOW : bayer(x, y) < 0.5 ? HIGHLIGHT : BASE;
        if (px === 0 && i > 0) t = Math.abs(v) > 0.8 ? SHADOW : OUTLINE;              // the cross wall
        else if (Math.abs(v) < 0.6 && hash01(x * 13 + y * 7) < 0.1) t = BRIGHT;        // gas vesicles
        put(x, y, rb + t);
      }
    }
  }
}
function drawSpeciesPage(w, y) {

  const gap = 14, gx = P.x + Math.floor((P.w - ((nE - 1) * gap + 7)) / 2);

    hit(gx + k * gap - 3, y - 3, gap, 15, () => { notebook.guide = k; });
  }

  const bx = P.x + 6, by = y + 14, bw = P.w - 12, bh = 66;
  for (let j = 0; j < bh; j++) for (let i = 0; i < bw; i++) put(bx + i, by + j, bayer(bx + i, by + j) < j / bh ? 2 : 3);
