      else if (heardNote(w, c)) { hold = true; sing = m.tokens >= 1 && (c.la || c.lb || m.rng.chance(V.join)); }   // joins (chain mates always)
      else {
        const thrive = c.lum && dark ? 1 : Math.max(V.restFloor, smoothstep(0, V.thriveFull, c.vigor));
        const lock = smoothstep(0, V.lockedFull, c.locked);
        sing = m.rng.chance(V.start * thrive) && m.tokens >= len * (1 + V.lonerRoom * (1 - lock));
        if (sing) c.bout = m.rng.int(PARAMS.harmony.motif.boutMax);
      }
      if (!sing) continue;
      if (c.chainId) arpeggio(w, c);       // a chain arpeggiates its chord
      else if (hold) holdTone(w, c);       // a joiner holds a chord tone under the tune
      else startPhrase(w, c);
    }
  }
  if (w.visitors.length || w.disturb.length) startle(w);
  playPending(w);
}

// Phase 5: the oldest full elder holds the root. When it dies (or stops being an elder) the next oldest takes the
// root and its own note becomes the new tonal centre: the whole water modulates, announced by the new holder's drone.
// With no elder left the root stays where it was. A new key holds for rootRest s: a holder appointed sooner adopts it.
function updateElders(w) {
  const m = w.music, E = PARAMS.elder;
  let k = 0;
  for (let i = 0; i < m.droneEnds.length; i++) if (m.droneEnds[i] > w.tick) m.droneEnds[k++] = m.droneEnds[i];
  m.droneEnds.length = k;
  m.elders.length = 0;
  let holder = null, oldest = null;
  for (const c of w.cells) {
    if (c.dying || c.elder < E.singFrom) continue;
    m.elders.push(c);
    if (c.id === m.rootCell) holder = c;   // the holder keeps the root while it is still an elder
    if (c.elder < 1) continue;
    if (!oldest || c.elderAge > oldest.elderAge || (c.elderAge === oldest.elderAge && c.id < oldest.id)) oldest = c;
  }
  if (holder || !oldest) return;
  const pc = (m.root + m.scale[oldest.deg]) % 12;
  if (pc !== m.root && w.tick - m.rootTick >= PARAMS.harmony.rootRest * PARAMS.time.tickRate) {   // a fresh key holds a while
    m.rootChanges++;
    m.rootTick = w.tick;
    m.root = pc;
  }
  m.rootCell = oldest.id;
  oldest.deg = 0;
  oldest.droneNext = 0;   // the new holder announces the key
}

// An elder drones on its slow pulse, if a drone voice is free and its last drone has mostly faded
function drone(w, c) {
  const m = w.music, D = PARAMS.voices.drone, b = looksBig(c);
  if (w.tick < c.droneNext || m.droneEnds.length >= D.max) return;
  const attack = D.attack[0] + (D.attack[1] - D.attack[0]) * b, release = D.release[0] + (D.release[1] - D.release[0]) * b;
  const pc = (m.root + m.scale[c.deg]) % 12, midi = D.low + ((pc - D.low) % 12 + 12) % 12;
  const end = w.tick + Math.ceil((attack + release) * PARAMS.time.tickRate);
  m.droneEnds.push(end);
  c.droneEnd = end;
  c.droneNext = w.tick + Math.ceil((attack + release * D.again) * PARAMS.time.tickRate);
  m.onsets++;
  m.notes.push({
    id: m.nextNote++, phrase: m.nextPhrase++, tick: w.tick, cell: c.id, c, midi, pc, x: c.x, y: c.y, timbre: c.g.timbre,
    attack, release, soft: 1, dino: 0, glass: 0, last: false, startled: false, muffle: 0, drone: true, level: c.elder,
  });
}

// Pads: a soft cell singing near a droning elder holds its notes longer, as if the elder steadies it
function steadied(w, c) {
  const D = PARAMS.voices.drone, r2 = D.steady * D.steady;
  for (const e of w.music.elders) {
    if (e === c || e.droneEnd <= w.tick) continue;
    const dx = e.x - c.x, dy = e.y - c.y;
    if (dx * dx + dy * dy < r2) return true;
  }
  return false;
}

// Startle: cells brushed by a visitor blurt a staccato note, if the budget allows
function startle(w) {
  const m = w.music, V = PARAMS.voices, St = V.startle, wait = St.refractory * PARAMS.time.tickRate;
  for (const c of w.cells) {
    if (c.dying || w.tick - c.startleTick < wait) continue;
    let rate = 0;
    for (const v of w.visitors) if (brushedBy(v, c)) rate = Math.max(rate, St.rate[v.kind]);
    for (const d of w.disturb) {   // a fresh tap close by
      const dx = c.x - d.x, dy = c.y - d.y, r = PARAMS.hand.radius * 0.6;
      if (w.tick - d.t0 < PARAMS.time.tickRate && dx * dx + dy * dy < r * r) rate = Math.max(rate, St.rate.hand);
    }
    if (rate > 0 && m.rng.chance(rate * TICK_DT) && m.tokens >= 1 && m.ends.length < V.max) {
      c.startleTick = w.tick;
      m.tokens -= 1;
      emitNote(w, c, 0, false, true, m.nextPhrase++, true);
    }
  }
}

function brushedBy(v, c) {
  const Vs = PARAMS.visitors, r = PARAMS.voices.startle.reach;
  if (v.kind === 'sardines') {
    const dx = (c.x - v.x - v.dir * 4) / (Vs.sardines.rx + r), dy = (c.y - v.y) / (Vs.sardines.ry + r);
    return dx * dx + dy * dy < 1;
  }
  if (v.kind === 'salps') {
    const reach = Vs.salps.reach + r;
    for (let b = 0; b < v.alive.length; b++) {
      if (!v.alive[b]) continue;
      const q = salpBarrel(v, b), dx = c.x - q.x, dy = c.y - q.y;
      if (dx * dx + dy * dy < reach * reach) return true;
    }
    return false;
  }
  const reach = Vs.sunfish.r + r, dx = c.x - v.x, dy = c.y - v.y;
  return dx * dx + dy * dy < reach * reach;
}

// A joiner holds one long chord tone under the neighbour's tune
function holdTone(w, c) {
  const m = w.music;
  m.tokens -= 1;
  c.noteTick = w.tick;
  if (m.ends.length < PARAMS.voices.max) emitNote(w, c, 0, false, true, m.nextPhrase++, false, PARAMS.harmony.hold);
}

// A chain's arpeggio: its cells sound in pitch order (up and back for a straight chain, round for rings and stars),
// spread over one period of the singer's pulse. Once per chain until it has rested.
const ARP = [];
function arpeggio(w, c) {
  const m = w.music, A = PARAMS.harmony.arp, head = c.head, period = 1 / c.g.omega;
  if (!head || w.tick - head.arpTick < A.rest * period * PARAMS.time.tickRate) return;
  const order = [];
  for (let k = head; k; k = k.lb) if (!k.dying) order.push({ k, p: notePitch(m, k, 0) });
  if (order.length < 2) return;
  order.sort((a, b) => a.p - b.p || a.k.id - b.k.id);
  ARP.length = 0;
  for (const o of order) ARP.push(o.k);
  if (c.habit === 0) for (let i = order.length - 2; i > 0; i--) ARP.push(order[i].k);
  for (let i = 0; ARP.length < A.minNotes; i++) ARP.push(ARP[i]);
  ARP.length = Math.min(ARP.length, A.maxNotes);
  if (m.tokens < ARP.length) return;
  m.tokens -= ARP.length;
  head.arpTick = w.tick;
  c.noteTick = w.tick;
  const phrase = m.nextPhrase++, step = period / ARP.length;
  for (let i = 0; i < ARP.length; i++) {
    m.pending.push({ due: w.tick + Math.round(i * step * PARAMS.time.tickRate), c: ARP[i], step: 0, phrase, final: i === ARP.length - 1 });
  }
}

// The motif's notes fall on its rhythm grid across one period of the cell's own pulse: fast pulses, quick tunes
function startPhrase(w, c) {
  const m = w.music, mo = c.motif, period = 1 / c.g.omega, phrase = m.nextPhrase++;
  m.tokens -= mo.slots.length;
  c.noteTick = w.tick;
  for (let i = 0; i < mo.slots.length; i++) {
    m.pending.push({
      due: w.tick + Math.round(mo.slots[i] / mo.grid * period * PARAMS.time.tickRate),
      c, step: mo.steps[i], phrase, final: i === 0 || i === mo.slots.length - 1,   // the first note holds the chord
    });
  }
}

// Notes come due; a note finds no free voice, or its singer gone, and is only seen as a flash
function playPending(w) {
  const m = w.music, P = m.pending;
  let k = 0;
  for (let i = 0; i < P.length; i++) {
    const p = P[i];
    if (p.due > w.tick) { P[k++] = p; continue; }
    if (!p.c.dying && m.ends.length < PARAMS.voices.max) emitNote(w, p.c, p.step, false, p.final, p.phrase);
  }
  P.length = k;
}

// Did a neighbour begin a phrase a moment ago?
function heardNote(w, c) {
  const hs = w.hash, since = w.tick - PARAMS.voices.joinWindow * PARAMS.time.tickRate;
  const ci = clamp(Math.floor(c.x / hs.s), 0, hs.cols - 1), cj = clamp(Math.floor(c.y / hs.s), 0, hs.rows - 1);
  for (let j = cj - 1; j <= cj + 1; j++) {
    if (j < 0 || j >= hs.rows) continue;
    for (let i = ci - 1; i <= ci + 1; i++) {
      if (i < 0 || i >= hs.cols) continue;
      const b = j * hs.cols + i;
      for (let k = hs.start[b], end = hs.start[b + 1]; k < end; k++) {
        const o = hs.items[k];
        if (o === c || o.noteTick < since || o.dying) continue;
        const dx = c.x - o.x, dy = c.y - o.y;
        if (dx * dx + dy * dy < LISTEN2) return true;
      }
    }
  }
  return false;
}

// A cell that dies (not one that is eaten) sounds one soft last note, if the budget allows
function lastNote(w, c) {
  const m = w.music;
  if (m.tokens < 1 || m.ends.length >= PARAMS.voices.max) return;
  m.tokens -= 1;
  emitNote(w, c, 0, true, true, m.nextPhrase++);
}

// Rule 7 within a phrase: a motif note that would form a semitone or a tritone with a note still sounding in the
// water bends one scale step, to whichever neighbour degree clashes least (the tune's first note stays put)
function clashes(m, pc) {
  let n = 0;
  for (let i = 0; i < m.sounding.length; i++) { const ic = intervalClass(pc, m.sounding[i]); if (ic === 1 || ic === 6) n++; }
  return n;
}

function bendStep(m, c, step) {
  const base = clashes(m, notePitch(m, c, step) % 12);
  if (!base || !step) return step;
  const down = clashes(m, notePitch(m, c, step - 1) % 12), up = clashes(m, notePitch(m, c, step + 1) % 12);
  if (down < base && down <= up) return step - 1;
  return up < base ? step + 1 : step;
}

function emitNote(w, c, step, last, final, phrase, startled, stretch) {
  const m = w.music, V = PARAMS.voices, Mu = V.muffle, sh = voiceShape(c, last, final);
  if (stretch) sh.release *= stretch;
  let midi = notePitch(m, c, last || startled ? step : bendStep(m, c, step));
  if (startled) {
    midi += 12 * V.startle.octaves;
    sh.attack = V.startle.attack;
    sh.release = V.startle.release;
  }
  if (!last && !startled && sh.soft > 0 && w.music.elders.length && steadied(w, c)) {
    sh.steady = true;
    sh.release *= 1 + V.drone.steadyHold * sh.soft;
    sh.attack *= 1 + V.drone.steadyAttack * sh.soft;
  }
  const muffle = smoothstep(Mu.from, Mu.full, sampleField(w.fields.graz, c.x, c.y));
  sh.release *= 1 - Mu.release * muffle;
  m.ends.push(w.tick + Math.ceil((sh.attack + sh.release) * PARAMS.time.tickRate));
  m.sounding.push(midi % 12);
  m.recent.push(w.tick);
  m.onsets++;
  m.notes.push({
    id: m.nextNote++, phrase, tick: w.tick, cell: c.id, c, midi, pc: midi % 12, x: c.x, y: c.y, timbre: c.g.timbre,
    attack: sh.attack, release: sh.release, soft: sh.soft, dino: sh.dino, glass: sh.glass, big: sh.big, string: sh.string,
    last, startled: !!startled, muffle, steady: !!sh.steady,
  });
}

const keyName = (m) => NOTE_NAMES[m.root] + ' ' + m.scaleName.toUpperCase();

// ===== Persist =====
// A saved world is the same world: the snapshot holds everything the rules read (cells and their links, cysts,
// fields, grazers, wind, plumes, visitors, the harmonic field and voice budget, both random streams), so a restored
// world steps on exactly as if it had never stopped. Shared objects and cycles (chains, the cells notes point at)
// survive; references into PARAMS are kept as paths, so a restored world reads the very same constants. Render
// caches are left out and rebuilt. The snapshot is structured-cloneable (IndexedDB, and later a worker).
const SNAP_SKIP = new Set(['hash', 'spr', 'along', 'songAt', 'songAtk', 'songRel', 'songLast', 'songDrone', 'pluckAt']);
let paramPaths = null;

function paramPathMap() {
  if (paramPaths) return paramPaths;
  paramPaths = new Map();
  const walk = (o, path) => {
    if (!o || typeof o !== 'object' || paramPaths.has(o)) return;
    paramPaths.set(o, path);
    for (const k of Object.keys(o)) walk(o[k], path.concat(k));
  };
  walk(PARAMS, []);
  return paramPaths;
}

function encodeSnap(v, memo) {
  if (!v || typeof v !== 'object') {
    if (typeof v === 'function') throw new Error('snapshot: a function in the world');
    return v;
  }
  if (memo.has(v)) return memo.get(v);
  let out;
  const path = paramPathMap().get(v);
  if (path) out = { $param: path };
  else if (v instanceof Rng) out = { $rng: v.s };
  else if (ArrayBuffer.isView(v)) out = v.slice();
  else if (Array.isArray(v)) {
    out = [];
    memo.set(v, out);
    for (let i = 0; i < v.length; i++) out.push(encodeSnap(v[i], memo));
    return out;
  } else {
    const proto = Object.getPrototypeOf(v);
    if (proto !== Object.prototype && proto !== null) throw new Error('snapshot: cannot store ' + (v.constructor && v.constructor.name));
    out = {};
    memo.set(v, out);
    for (const k of Object.keys(v)) if (!SNAP_SKIP.has(k)) out[k] = encodeSnap(v[k], memo);
    return out;
  }
  memo.set(v, out);
  return out;
}

// In place: markers become random streams and PARAMS objects again (a shared marker stays one shared object)
function decodeSnap(root) {
  const made = new Map(), seen = new Set();
  const revive = (v) => {
    if (!v || typeof v !== 'object' || ArrayBuffer.isView(v)) return v;
    if (made.has(v)) return made.get(v);
    if ('$rng' in v) { const r = new Rng(0); r.s = v.$rng; made.set(v, r); return r; }
    if ('$param' in v) { let o = PARAMS; for (const k of v.$param) o = o[k]; made.set(v, o); return o; }
    if (!seen.has(v)) {
      seen.add(v);
      for (const k of Object.keys(v)) v[k] = revive(v[k]);
    }
    return v;
  };
  return revive(root);
}

function snapshotWorld(w) {
  return { v: PARAMS.persist.version, world: encodeSnap(w, new Map()) };
}

// Restored objects come back with shapes of their own, and the hot loops run at half speed over them; cells and
// genomes are rebuilt in their usual shapes and every reference is pointed at the rebuilt ones. Fields a newer
// version added to cells keep their fresh defaults.
function reshape(w) {
  const swap = new Map(), genomes = new Map();
  const genome = (g) => { if (!genomes.has(g)) { const n = {}; for (const k of GENE_KEYS) n[k] = g[k]; genomes.set(g, n); } return genomes.get(g); };
  const visit = (v, seen) => {
    if (!v || typeof v !== 'object' || ArrayBuffer.isView(v) || seen.has(v) || v instanceof Rng) return;
    seen.add(v);
    if (v.spriteSeed !== undefined && v.g && !swap.has(v)) {   // a cell, living or still referred to
      const n = cellObject(v.id, v.parentId, v.x, v.y, genome(v.g), v.energy, v.theta, v.spriteSeed);
      for (const k of Object.keys(v)) if (k !== 'g') n[k] = v[k];
      swap.set(v, n);
    }
    for (const k of Object.keys(v)) visit(v[k], seen);
  };
  visit(w, new Set());
  const point = (v, seen) => {
    if (!v || typeof v !== 'object' || ArrayBuffer.isView(v) || seen.has(v) || v instanceof Rng) return;
    seen.add(v);
    for (const k of Object.keys(v)) {
      const n = swap.get(v[k]);
      if (n) v[k] = n; else point(v[k], seen);
    }
  };
  const seen = new Set();
  point(w, seen);
  for (const n of swap.values()) point(n, seen);
}

// The world, its fields and its music are copied onto a fresh world's own objects: their usual shapes, and any
// field a newer version added keeps the value a fresh world starts with
function restoreWorld(snap) {
  const w = decodeSnap(snap.world), fresh = createWorld(w.seed, 1, w.dayLength);
  reshape(w);
  const fields = Object.assign(fresh.fields, w.fields), music = Object.assign(fresh.music, w.music);
  Object.assign(fresh, w);
  fresh.fields = fields;
  fresh.music = music;
  return fresh;
}

// Runs inside the catch-up worker (built from this page's own simulation and notebook code): steps the world to the
// target it is given (the page moves it on as real time passes), records the notebook, shows a frame now and then.
function catchupWorker() {
  let w = null, target = 0;
  const run = () => {
    const t0 = performance.now(), S = NB.STRIDE;
    while (w.tick < target && performance.now() - t0 < PARAMS.persist.show * 1000) {
      for (let k = 0; k < 30 && w.tick < target; k++) { stepWorld(w); notebookSample(w); w.music.notes.length = 0; }
    }
    if (w.tick < target) {
      postMessage({ kind: 'progress', snap: snapshotWorld(w) });
      setTimeout(run, 0);   // lets the next target in
      return;
    }
    const rows = notebook.rows.slice(0, notebook.count * S);
    postMessage({ kind: 'done', snap: snapshotWorld(w), nb: notebookState(), rows }, [rows.buffer]);
    w = null;
  };
  self.onmessage = (e) => {
    const m = e.data;
    target = m.target;
    if (m.snap) { w = restoreWorld(m.snap); restoreNotebook(m.nb, [m.rows]); run(); }
  };
}

// ---- Storage: one IndexedDB store; 'world' holds the snapshot, 'rows:i' the notebook in chunks ----
function openStore() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(PARAMS.persist.db, 1);
    req.onupgradeneeded = () => req.result.createObjectStore('kv');
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function storeGet(db, keys) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction('kv', 'readonly'), st = tx.objectStore('kv'), out = {};
    for (const k of keys) st.get(k).onsuccess = (e) => { out[k] = e.target.result; };
    tx.oncomplete = () => resolve(out);
    tx.onerror = () => reject(tx.error);
  });
}

// puts: { key: value }, value undefined deletes the key. One transaction, so a save is all or nothing.
function storeWrite(db, puts) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction('kv', 'readwrite'), st = tx.objectStore('kv');
    for (const k of Object.keys(puts)) { if (puts[k] === undefined) st.delete(k); else st.put(puts[k], k); }
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
    tx.onabort = () => reject(tx.error);
  });
}

function storeClear(db) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction('kv', 'readwrite');
    tx.objectStore('kv').clear();
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

// ===== Audio =====
// Discrete, enveloped notes only: every oscillator starts, swells, fades to 0.0001 and is disconnected.
// voices -> ecosystem bus -> lowpass -> dry + reverb send + delay send -> master -> gentle compressor -> out.
// Deeper voices also send straight into the reverb, so the depths sound quieter and wetter.
const audio = { ctx: null, started: false, muted: false, master: null, bus: null, wet: null, waves: [], active: 0, drones: 0, played: 0 };

// Wave table along the timbre gene, built once. Soft cells: a warm triangle; dinoflagellates: wood, nearly a sine
// with a little body; diatoms: glass, a bright sine. The partner oscillator in playNote adds each family's colour.
function buildWaves(ctx) {
  const A = PARAMS.audio, waves = [];
  for (let i = 0; i < A.waves; i++) {
    const f = formWeights(i / (A.waves - 1)), real = new Float32Array(A.harmonics + 1), imag = new Float32Array(A.harmonics + 1);
    for (let n = 1; n <= A.harmonics; n++) {
      const soft = (n & 1 ? 1 : A.softEven) / (n * n);
      const wood = n === 1 ? 1 : n === 2 ? 0.12 : n === 3 ? 0.04 : 0;
      const glass = n === 1 ? 1 : n <= 5 ? A.glassBright / n : 0;
      imag[n] = f.soft * soft + f.dino * wood + f.glass * glass;
    }
    waves.push(ctx.createPeriodicWave(real, imag));
  }
  return waves;
}

// A dark stereo tail: decaying noise whose highs die first. Its own seeded stream, built once.
function buildImpulse(ctx) {
  const A = PARAMS.audio, rate = ctx.sampleRate, len = Math.floor(A.reverbSeconds * rate);
  const buf = ctx.createBuffer(2, len, rate), rng = makeRng(0x0ce4);
  for (let ch = 0; ch < 2; ch++) {
    const d = buf.getChannelData(ch);
    let lp = 0;
    for (let i = 0; i < len; i++) {
      const t = i / len, k = 1 - A.reverbDark * t;   // one-pole lowpass closing over the tail
      lp += (rng.next() * 2 - 1 - lp) * k;
      d[i] = lp * Math.pow(1 - t, 3) * Math.exp(-3 * t);
    }
  }
  return buf;
}

// Called from a user gesture: browsers only allow sound after one
function startAudio() {
  if (audio.ctx) { if (audio.ctx.state !== 'running') audio.ctx.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  const A = PARAMS.audio, ctx = new AC(), gain = (v) => { const g = ctx.createGain(); g.gain.value = v; return g; };
  const comp = ctx.createDynamicsCompressor();
  comp.threshold.value = A.comp.threshold; comp.knee.value = A.comp.knee; comp.ratio.value = A.comp.ratio;
  comp.attack.value = A.comp.attack; comp.release.value = A.comp.release;
  const out = gain(A.out), limit = ctx.createDynamicsCompressor();
  limit.threshold.value = A.limit.threshold; limit.knee.value = A.limit.knee; limit.ratio.value = A.limit.ratio;
  limit.attack.value = A.limit.attack; limit.release.value = A.limit.release;
  comp.connect(out); out.connect(limit); limit.connect(ctx.destination);
  const master = gain(A.master), bendLP = ctx.createBiquadFilter(), bendShelf = ctx.createBiquadFilter();
  bendLP.type = 'lowpass'; bendLP.frequency.value = A.bend.open; bendLP.Q.value = 0.7;
  bendShelf.type = 'highshelf'; bendShelf.frequency.value = A.bend.shelfHz; bendShelf.gain.value = 0;
  const bendPeak = ctx.createBiquadFilter();
  bendPeak.type = 'peaking'; bendPeak.frequency.value = A.bend.peakLo; bendPeak.Q.value = A.bend.peakQ; bendPeak.gain.value = 0;
  master.connect(bendLP); bendLP.connect(bendShelf); bendShelf.connect(bendPeak); bendPeak.connect(comp);

  const verb = ctx.createConvolver();
  verb.buffer = buildImpulse(ctx);
  verb.connect(master);
  const verbIn = gain(A.reverbSend);
  verbIn.connect(verb);

  const delay = ctx.createDelay(1), fb = gain(A.delayFeedback), dark = ctx.createBiquadFilter(), delayIn = gain(A.delaySend);
  delay.delayTime.value = A.delayTime;
  dark.type = 'lowpass'; dark.frequency.value = A.delayCutoff;
  delayIn.connect(delay); delay.connect(dark); dark.connect(fb); fb.connect(delay); dark.connect(master);

  const bus = gain(audio.muted ? 0.0001 : 1), lp = ctx.createBiquadFilter();   // bus and wet carry the music only
  lp.type = 'lowpass'; lp.frequency.value = A.busCutoff; lp.Q.value = 0.5;
  bus.connect(lp); lp.connect(master); lp.connect(verbIn); lp.connect(delayIn);
  const wet = gain(audio.muted ? 0.0001 : 1);
  wet.connect(verb);

  const Am = A.ambience, amb = gain(Am.gain), ambWet = gain(Am.wet);
  amb.connect(master); amb.connect(ambWet); ambWet.connect(verb);
  const noise = ctx.createBuffer(1, Math.floor(Am.noiseSeconds * ctx.sampleRate), ctx.sampleRate), nrng = makeRng(0x5ea);
  const nd = noise.getChannelData(0);
  for (let i = 0; i < nd.length; i++) nd[i] = nrng.next() * 2 - 1;
  Object.assign(audio, { ctx, master, bendLP, bendShelf, bendPeak, bus, wet, lp, fb, delay, delayIn, verbIn, amb, noise, waves: buildWaves(ctx), started: true });
  if (ctx.state !== 'running') ctx.resume();
}

// One note: the main wave and a partner oscillator through a lowpass and one envelope, panned by x.
// The partner is the family's colour: a slightly detuned twin that breathes (soft), the wood's high partial that
// dies fast (dinoflagellates), the glass's inharmonic ring (diatoms).
// An elder's drone: a sine sub and two soft pad partials, one swell and one long fade under a filter that opens and closes
function playDrone(n) {
  const A = PARAMS.audio, Dr = A.drone, ctx = audio.ctx;
  if (audio.drones >= Dr.maxNodes) return;
  const t0 = ctx.currentTime + A.lookahead, end = t0 + n.attack + n.release, f = 440 * Math.pow(2, (n.midi - 69) / 12);
  const sub = ctx.createOscillator(), padA = ctx.createOscillator(), padB = ctx.createOscillator();
  sub.frequency.value = f;
  padA.setPeriodicWave(audio.waves[0]); padA.frequency.value = f * 2; padA.detune.value = Dr.detune;
  padB.setPeriodicWave(audio.waves[0]); padB.frequency.value = f * 3; padB.detune.value = -Dr.detune;
  const subG = ctx.createGain(), padG = ctx.createGain(), filt = ctx.createBiquadFilter(), env = ctx.createGain();
  padG.gain.value = Dr.pad / Dr.gain;
  filt.type = 'lowpass'; filt.Q.value = 0.5;
  filt.frequency.setValueAtTime(Dr.cutLow, t0);
  filt.frequency.linearRampToValueAtTime(Dr.cutHigh, t0 + n.attack);
  filt.frequency.exponentialRampToValueAtTime(Dr.cutLow, end);
  env.gain.setValueAtTime(0.0001, t0);
  env.gain.linearRampToValueAtTime(Dr.gain * n.level, t0 + n.attack);
  env.gain.exponentialRampToValueAtTime(0.0001, end);
  const pan = ctx.createStereoPanner ? ctx.createStereoPanner() : null;
  const dry = ctx.createGain(), wet = ctx.createGain();
  dry.gain.value = 1 - Dr.wet;
  wet.gain.value = Dr.wet;
  const beat = ctx.createOscillator(), bloom = ctx.createOscillator(), bloomEnv = ctx.createGain();
  beat.frequency.value = f + A.droneBeat;                                    // a second sub, slowly beating
  bloom.setPeriodicWave(audio.waves[0]); bloom.frequency.value = f * 4;      // two octaves up, blooming late
  const bAt = t0 + (n.attack + n.release) * A.droneBloomAt;
  bloomEnv.gain.setValueAtTime(0.0001, t0);
  bloomEnv.gain.linearRampToValueAtTime(A.droneBloom / Dr.gain, bAt);
  bloomEnv.gain.exponentialRampToValueAtTime(0.0001, end);
  sub.connect(subG); beat.connect(subG); padA.connect(padG); padB.connect(padG); bloom.connect(bloomEnv); bloomEnv.connect(filt);
  subG.gain.value = 0.6;
  subG.connect(env); padG.connect(filt); filt.connect(env);
  let out = env;
  if (pan) { pan.pan.value = (n.x / W * 2 - 1) * Dr.pan; env.connect(pan); out = pan; }
  out.connect(dry); out.connect(wet);
  dry.connect(audio.bus); wet.connect(audio.wet);
  for (const o of [sub, beat, padA, padB, bloom]) { o.start(t0); o.stop(end + 0.05); }
  audio.drones++;
  audio.played++;
  sub.onended = () => {
    for (const node of [sub, beat, padA, padB, bloom, bloomEnv, subG, padG, filt, env, pan, dry, wet]) if (node) node.disconnect();
    audio.drones--;
  };
}

function playNote(n) {
  const A = PARAMS.audio, I = A.instruments, ctx = audio.ctx;
  if (audio.active >= A.maxNodes) return;
  const bs = 1 - (1 - n.big) * (1 - n.big);   // the mellow instrument (pad, vibraphone) takes over early as size grows
  const b = n.steady ? Math.max(bs, A.steadyPad) : bs;
  const mixW = { piano: n.soft * (1 - b), pad: n.soft * b, wood: n.dino * (1 - n.string), string: n.dino * n.string, glock: n.glass * (1 - b), vibe: n.glass * b };
  const depth = clamp(n.y / (H - PARAMS.world.floor), 0, 1), wetK = (A.wetMin + (A.wetMax - A.wetMin) * depth) * (n.startled ? A.startleDry : 1);
  const hv = hash01(n.id * 7 + 3) * 2 - 1, ht = hash01(n.id * 7 + 4);   // this note's own small variations
  const t0 = ctx.currentTime + A.lookahead + ht * A.humanTime, end = t0 + n.attack + n.release;
  let level = 0, c0 = 0, c1 = 0, c2 = 0;
  for (const k in mixW) { const q = mixW[k], P = I[k]; level += q * P.level; c0 += q * P.cut[0]; c1 += q * P.cut[1]; c2 += q * P.cut[2]; }
  const bright = (n.last ? 0.6 : 1) * (1 - PARAMS.voices.muffle.cutoff * n.muffle) * (n.startled ? A.startleBright : 1) * (1 + A.humanBright * hv);
  const peak = A.voiceGain * (1 + A.humanGain * hv) * level * (1 - A.depthQuiet * depth) * (n.last ? A.lastGain : 1) * (n.startled ? A.startleGain : 1);
  const freq = 440 * Math.pow(2, (n.midi - 69) / 12);

  // Shared chain: lowpass (strike -> swell -> fade), tremolo stage, envelope, pan, dry and wet sends
  const filt = ctx.createBiquadFilter(), trem = ctx.createGain(), env = ctx.createGain();
  filt.type = 'lowpass'; filt.Q.value = 0.3;
  filt.frequency.setValueAtTime(c0 * bright, t0);
  filt.frequency.linearRampToValueAtTime(c1 * bright, t0 + n.attack);
  filt.frequency.exponentialRampToValueAtTime(Math.max(60, c2 * bright), end);
  trem.gain.value = 1;
  env.gain.setValueAtTime(0.0001, t0);
  env.gain.linearRampToValueAtTime(peak, t0 + n.attack);
  env.gain.exponentialRampToValueAtTime(0.0001, end);
  const pan = ctx.createStereoPanner ? ctx.createStereoPanner() : null;
  const dry = ctx.createGain(), wet = ctx.createGain();
  dry.gain.value = 1 - wetK;
  wet.gain.value = wetK;
  filt.connect(trem); trem.connect(env);
  let out = env;
  if (pan) { pan.pan.value = (n.x / W * 2 - 1) * A.pan; env.connect(pan); out = pan; }
  out.connect(dry); out.connect(wet);
  dry.connect(audio.bus); wet.connect(audio.wet);
  const nodes = [filt, trem, env, pan, dry, wet], voices = [];

  // One partial: its own swell and its own fade (a share of the release), into the shared filter
  const voice = (ratio, gain, decay, wave, detune, late) => {
    const f = freq * ratio;
    if (f > A.partialMaxHz || gain < 0.01) return null;
    const o = ctx.createOscillator(), e = ctx.createGain(), stop = t0 + n.attack + n.release * decay;
    if (wave) o.setPeriodicWave(wave);
    o.frequency.value = f;
    if (detune) o.detune.value = detune;
    e.gain.setValueAtTime(0.0001, t0);
    e.gain.linearRampToValueAtTime(gain, t0 + n.attack * (late || 1));
    e.gain.exponentialRampToValueAtTime(0.0001, stop);
    o.connect(e); e.connect(filt);
    o.start(t0); o.stop(stop + 0.05);
    voices.push(o); nodes.push(e);
    return o;
  };
  for (const k of ['piano', 'wood', 'string', 'glock', 'vibe']) {
    const q = mixW[k];
    if (q >= 0.04) for (const [r, g, d] of I[k].partials) voice(r, g * q, d);
  }
  const padWave = audio.waves[0];
  if (mixW.pad >= 0.04) {   // the pad breathes: a detuned twin and a slow vibrato at the note's own rate
    const a = voice(1, mixW.pad, 1, padWave), tw = voice(A.padTwin, mixW.pad * A.padTwinGain, 1, padWave), V = A.vibrato;
    const lfo = ctx.createOscillator(), depthG = ctx.createGain();
    lfo.frequency.value = V.rateMin + (V.rateMax - V.rateMin) * hash01(n.id * 31 + 7);
    depthG.gain.value = V.cents;
    lfo.connect(depthG);
    if (a) depthG.connect(a.detune);
    if (tw) depthG.connect(tw.detune);
    lfo.start(t0); lfo.stop(end + 0.05);
    nodes.push(lfo, depthG);
  }
  if (mixW.vibe >= 0.1) {   // the vibraphone's slow tremolo
    const P = I.vibe, k = P.tremDepth * mixW.vibe / 2, lfo = ctx.createOscillator(), depthG = ctx.createGain();
    lfo.frequency.value = P.tremolo * (0.9 + 0.2 * hash01(n.id * 13 + 5));
    depthG.gain.value = k;
    trem.gain.value = 1 - k;
    lfo.connect(depthG); depthG.connect(trem.gain);
    lfo.start(t0); lfo.stop(end + 0.05);
    nodes.push(lfo, depthG);
  }
  if (n.steady) voice(2, A.shimmer, 1, padWave, A.shimmerDetune, A.shimmerLate);   // a steadied pad shimmers an octave up, late
  if (!voices.length) { for (const node of nodes) if (node) node.disconnect(); return; }
  audio.active++;
  audio.played++;
  let left = voices.length;
  const done = () => {
    if (--left > 0) return;
    for (const node of [...voices, ...nodes]) if (node) node.disconnect();
    audio.active--;
  };
  for (const o of voices) o.onended = done;
}

// Drains the tick's note events. In time-lapse only a share of the phrases plays (about the real-time density),
// whole phrases so tunes stay whole; the simulation is unchanged. Every note that plays is also seen: its cell
// swells and sends out a ring (even when muted or before the first tap).
function hearNotes(w) {
  const notes = w.music.notes, keep = 1 / playSpeed();
  const sound = audio.started && !audio.muted && audio.ctx.state === 'running', at = performance.now() + PARAMS.audio.lookahead * 1000;
  for (const n of notes) {
    if (keep < 1 && hash01(Math.imul(n.phrase, 0x9e3779b1)) >= keep) continue;
    const c = n.c;
    c.songAt = at; c.songAtk = n.attack; c.songRel = n.release; c.songLast = n.last; c.songDrone = !!n.drone;
    if (n.startled) c.glowTick = w.tick;   // a startled cell flashes
    if (sound) { if (n.drone) playDrone(n); else playNote(n); }
  }
  notes.length = 0;
}

// The world turns the macros: nothing here is scripted, it only follows daylight, wind, blooms and visitors
let weatherAt = 0;
function audioWeather(w, now) {
  const Wt = PARAMS.audio.weather;
  if (!audio.started || now - weatherAt < Wt.update * 1000) return;
  weatherAt = now;
  let bio = 0, shadow = 0;
  for (const c of w.cells) if (!c.dying) bio += c.biomass;
  for (const v of w.visitors) if (v.x > -20 && v.x < W + 20) shadow = Math.max(shadow, Wt.shadow[v.kind] || 0);
  const t = audio.ctx.currentTime, glide = (param, v) => { param.setValueAtTime(param.value, t); param.linearRampToValueAtTime(v, t + Wt.update); };
  glide(audio.lp.frequency, (Wt.dark + (Wt.bright - Wt.dark) * w.surfaceLight) * (1 - shadow));
  glide(audio.fb.gain, Wt.echoCalm + (Wt.echoStorm - Wt.echoCalm) * w.wind);
  const Fl = PARAMS.audio.flutter;
  glide(audio.delay.delayTime, PARAMS.audio.delayTime * (1 + Fl.depth * (0.6 * Math.sin(waterT * Fl.rate) + 0.4 * Math.sin(waterT * Fl.rate2 + 1.3))));
  glide(audio.delayIn.gain, Wt.sendCalm + (Wt.sendStorm - Wt.sendCalm) * w.wind);
  glide(audio.verbIn.gain, Wt.roomClear + (Wt.roomBloom - Wt.roomClear) * clamp(bio / Wt.bloomFull, 0, 1));
}

// ---- Ambience ----
// A noise event: a stretch of the noise buffer through a filter (optionally sweeping), swelling and fading once
function noiseEvent(dur, peak, type, freq, q, panX, freqEnd) {
  const ctx = audio.ctx, t0 = ctx.currentTime + 0.05, end = t0 + dur;
  const src = ctx.createBufferSource();
  src.buffer = audio.noise;
  src.loop = true;
  const f = ctx.createBiquadFilter();
  f.type = type; f.Q.value = q;
  f.frequency.setValueAtTime(freq, t0);
  if (freqEnd) f.frequency.exponentialRampToValueAtTime(freqEnd, end);
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(Math.max(0.0002, peak), t0 + dur * 0.4);
  g.gain.exponentialRampToValueAtTime(0.0001, end);
  const pan = ctx.createStereoPanner ? ctx.createStereoPanner() : null;
  src.connect(f); f.connect(g);
  if (pan) { pan.pan.value = clamp(panX, -1, 1); g.connect(pan); pan.connect(audio.amb); } else g.connect(audio.amb);
  src.start(t0, ambRng.next() * audio.noise.duration);
  src.stop(end + 0.05);
  src.onended = () => { for (const node of [src, f, g, pan]) if (node) node.disconnect(); };
}

// A bubble's chirp: a small sine whose pitch rises as it rings down (smaller bubbles ring higher)
let bubbleBudget = 0, bubbleBudgetAt = 0;
function bubbleSound(x, size, seep) {
  if (!audio.started) return;
  const B = PARAMS.audio.ambience.bubble, ctx = audio.ctx, now = ctx.currentTime;
  bubbleBudget = Math.min(B.perSecond, bubbleBudget + (now - bubbleBudgetAt) * B.perSecond);
  bubbleBudgetAt = now;
  if (bubbleBudget < 1) return;
  bubbleBudget -= 1;
  const t0 = now + 0.02 + ambRng.next() * 0.05, dur = B.durMin + (B.durMax - B.durMin) * ambRng.next();
  const f0 = seep ? B.seepFreq * (0.8 + 0.4 * ambRng.next()) : B.freqMax - (B.freqMax - B.freqMin) * size;
  const osc = ctx.createOscillator(), g = ctx.createGain(), pan = ctx.createStereoPanner ? ctx.createStereoPanner() : null;
  osc.frequency.setValueAtTime(f0, t0);
  osc.frequency.exponentialRampToValueAtTime(f0 * B.rise, t0 + dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(B.gain * (seep ? 1.4 : 1), t0 + 0.004);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(g);
  if (pan) { pan.pan.value = (x / W * 2 - 1) * 0.8; g.connect(pan); pan.connect(audio.amb); } else g.connect(audio.amb);
  osc.start(t0);
  osc.stop(t0 + dur + 0.05);
  osc.onended = () => { for (const node of [osc, g, pan]) if (node) node.disconnect(); };
}

// Krill crackle: a train of tiny bandpassed noise clicks
function krillClicks(x) {
  const K = PARAMS.audio.krill, ctx = audio.ctx, n = K.trainMin + Math.floor(ambRng.next() * (K.trainMax - K.trainMin + 1));
  const f = K.freqMin + (K.freqMax - K.freqMin) * ambRng.next();
  for (let i = 0; i < n; i++) {
    const t0 = ctx.currentTime + 0.02 + i * K.gap * (0.7 + 0.6 * ambRng.next());
    const src = ctx.createBufferSource(), bp = ctx.createBiquadFilter(), g = ctx.createGain();
    const pan = ctx.createStereoPanner ? ctx.createStereoPanner() : null;
    src.buffer = audio.noise;
    bp.type = 'bandpass'; bp.frequency.value = f * (0.9 + 0.2 * ambRng.next()); bp.Q.value = K.q;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(K.gain * (0.6 + 0.4 * ambRng.next()), t0 + 0.001);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + K.dur);
    src.connect(bp); bp.connect(g);
    if (pan) { pan.pan.value = clamp((x / W * 2 - 1) * 0.8 + (ambRng.next() - 0.5) * 0.3, -1, 1); g.connect(pan); pan.connect(audio.amb); } else g.connect(audio.amb);
    src.start(t0, ambRng.next() * (audio.noise.duration - 0.1));
    src.stop(t0 + K.dur + 0.02);
    src.onended = () => { for (const node of [src, bp, g, pan]) if (node) node.disconnect(); };
  }
}

// Each layer schedules its next overlapping event from the state of the world
const ambRng = makeRng(0xa3b1e);
const ambNext = { swell: 0, hum: 0, plume: 0, school: 0, krill: 0 };
function audioAmbience(w) {
  if (!audio.started) return;
  const Am = PARAMS.audio.ambience, t = audio.ctx.currentTime, wind = w.wind, r = () => ambRng.next();
  const lerp = (a, b, k) => a + (b - a) * k;
  if (t >= ambNext.swell) {   // the surface: soft and slow in calm water, loud, bright and quick in a storm
    const S = Am.swell;
    noiseEvent(lerp(S.durCalm, S.durStorm, wind) * (0.8 + 0.4 * r()), lerp(S.gainCalm, S.gainStorm, wind),
               'lowpass', lerp(S.freqCalm, S.freqStorm, wind) * (0.8 + 0.4 * r()), 0.6, r() * 1.6 - 0.8);
    ambNext.swell = t + lerp(S.everyCalm, S.everyStorm, wind) * (0.7 + 0.6 * r());
  }
  if (t >= ambNext.hum) {     // the deep: a low hum of the water column, darker at night
    const S = Am.hum;
    noiseEvent(S.dur, S.gain, 'lowpass', lerp(S.freqNight, S.freqDay, w.surfaceLight), 0.7, r() * 0.6 - 0.3);
    ambNext.hum = t + S.every * (0.8 + 0.4 * r());
  }
  if (w.pulses.length && t >= ambNext.plume) {   // an upwelling plume groans as it rises
    const S = Am.plume, pl = w.pulses[0];
    noiseEvent(S.dur, S.gain, 'lowpass', S.freq, S.q, pl.x / W * 2 - 1, S.freqEnd);
    ambNext.plume = t + S.every;
  }
  if (krillSeen.n > 0 && t >= ambNext.krill) {   // the swarm's crackle, saturating with its size
    const K = PARAMS.audio.krill, rate = K.rate * (1 - Math.exp(-krillSeen.n / K.half));
    krillClicks(krillSeen.x / krillSeen.n);
    ambNext.krill = t + (-Math.log(1 - r() * 0.999)) / rate;
  } else if (!krillSeen.n) ambNext.krill = t;
  const school = w.visitors.find((v) => v.kind === 'sardines' && v.x > -30 && v.x < W + 30);
  if (school && t >= ambNext.school) {           // a school's whoosh as it sweeps by
    const S = Am.school, up = r() < 0.5;
    noiseEvent(S.dur, S.gain, 'bandpass', up ? S.freq : S.freqEnd, S.q, school.x / W * 2 - 1, up ? S.freqEnd : S.freq);
    ambNext.school = t + S.every * (0.7 + 0.6 * r());
  }
}

// The hand bends the master filter: b < 0 closes the lowpass, b > 0 lifts the high shelf; secs to get there
function setBend(b, secs) {
  if (!audio.started) return;
  const Bd = PARAMS.audio.bend, t = audio.ctx.currentTime;
  const to = (param, v) => { param.setValueAtTime(param.value, t); param.linearRampToValueAtTime(v, t + secs); };
  to(audio.bendLP.frequency, Bd.open * Math.pow(2, Math.min(0, b) * Bd.closeOctaves));
  to(audio.bendShelf.gain, Math.max(0, b) * Bd.openDb);
}

// Sideways: the filter rings at a peak (reso 0..1) that follows the finger across the water (x 0..1: left low, right high)
function setPeak(reso, x, secs) {
  if (!audio.started) return;
  const Bd = PARAMS.audio.bend, t = audio.ctx.currentTime;
  const to = (param, v) => { param.setValueAtTime(param.value, t); param.linearRampToValueAtTime(v, t + secs); };
  to(audio.bendPeak.frequency, Bd.peakLo * Math.pow(Bd.peakHi / Bd.peakLo, clamp(x, 0, 1)));
  to(audio.bendPeak.gain, reso * Bd.peakDb);
}

// A cell plucked by the finger sounds its own note at once, outside the budget (the caller caps the rate)
let pluckId = 1;
function pluck(w, c) {
  const m = w.music, sh = voiceShape(c, false, true), midi = notePitch(m, c, 0);
  const n = { id: 0x40000000 + pluckId++, phrase: 0, c, midi, pc: midi % 12, x: c.x, y: c.y, timbre: c.g.timbre,
              attack: sh.attack, release: sh.release, soft: sh.soft, dino: sh.dino, glass: sh.glass, big: sh.big, string: sh.string,
              last: false, startled: false, muffle: 0 };
  c.songAt = performance.now() + PARAMS.audio.lookahead * 1000; c.songAtk = n.attack; c.songRel = n.release; c.songLast = false; c.songDrone = false;
  c.glowTick = w.tick;
  if (audio.started && !audio.muted && audio.ctx.state === 'running') playNote(n);
}

// The music button: the cells' notes, drones and plucks fade out or in; ambience and bubbles go on
function setMuted(muted) {
  audio.muted = muted;
  needsRender = true;
  if (!audio.ctx) return;
  const t = audio.ctx.currentTime;
  for (const g of [audio.bus.gain, audio.wet.gain]) {
    g.setValueAtTime(g.value, t);
    g.linearRampToValueAtTime(muted ? 0.0001 : 1, t + PARAMS.audio.muteRamp);
  }
}

// ===== Render =====
// Every layer writes palette indices into one buffer; it is converted to colour once per frame.
// Light (shafts, caustics, flashes) is applied with LIGHT_UP, so every pixel stays on the palette.
const R = PARAMS.render;
const ZOOMS = PARAMS.camera.levels;
const RAY_DEPTH = H * R.rayDepth, SHIMMER_DEPTH = H * R.shimmerDepth, CAUSTIC_H = Math.ceil(H * R.causticDepth);
const FLOOR_TOP = H - PARAMS.world.floor;
const FLOOR_MIN = FLOOR_TOP - PARAMS.floor.rippleA - PARAMS.floor.rippleB;
const SURFACE_MAX = PARAMS.surface.base + (PARAMS.surface.ampA + PARAMS.surface.ampB) * PARAMS.sea.waveRough + 1;

const view = {
  canvas: null, ctx: null, off: null, offCtx: null, img: null,
  buf: null, ibuf: new Uint8Array(W * H),
  scale: 1, ox: 0, oy: 0,
  bx0: 0, by0: 0,     // camera offset in whole screen pixels, so dithering stays anchored to the world
};
const cam = { level: 0, zoom: 1, x: 0, y: 0 };   // x, y: world point at the screen's top-left

// Ray intensity along the surface, u from -W to 2W (rays from off-screen can lean in)
const rayTable = new Float64Array(3 * W * R.rayRes + 8);
const rowShift = new Float64Array(H);   // refraction offset per screen row, world units
const sun = { x: W / 2, slope: 0 };     // virtual sun (or moon) position above the water
const CAUSTIC_COLS = W + 2, CAUSTIC_ROWS = CAUSTIC_H + 2;
const causticF = new Float32Array(CAUSTIC_COLS * CAUSTIC_ROWS);   // gap between nearest and second-nearest point
let causticPts = null, causticReady = false;
const chl = new Float64Array(PARAMS.grid.cols * PARAMS.grid.rows);   // smoothed cell biomass per grid node
const chlNow = new Float64Array(chl.length);
let chlTick = -1;
const TINT_W = W >> 2, TINT_H = H >> 2;
const bloomTint = new Float64Array(TINT_W * TINT_H);              // per 4x4 screen block
const pebbles = [];
let buildDeadline = 0;

// Allocations that need no DOM (also used by the headless benchmark)
function initRenderBuffers() {
  if (!view.buf) view.buf = new Uint32Array(W * H);
  const cs = R.causticCell;
  causticPts = new Float64Array(2 * (Math.ceil(W / cs) + 3) * (Math.ceil(CAUSTIC_H / cs) + 3));
  const F = PARAMS.floor;
  pebbles.length = 0;
  for (let i = 0; i < F.pebbles; i++) {
    const x = hash01(i * 7 + 101) * W, r = F.pebbleMin + hash01(i * 7 + 102) * (F.pebbleMax - F.pebbleMin);
    pebbles.push({ x, y: floorY(x) + r * 0.35, r, rx: r * (1 + hash01(i * 7 + 103) * 0.6) });
  }
}

function initRender(canvas) {
  view.canvas = canvas;
  view.ctx = canvas.getContext('2d', { alpha: false });
  view.off = document.createElement('canvas');
  view.off.width = W;
  view.off.height = H;
  view.offCtx = view.off.getContext('2d');
  view.img = view.offCtx.createImageData(W, H);
  view.buf = new Uint32Array(view.img.data.buffer);
  initRenderBuffers();
  resize();
}

function resize() {
  const dpr = window.devicePixelRatio || 1;
  const cw = Math.round(window.innerWidth * dpr), ch = Math.round(window.innerHeight * dpr);
  view.canvas.width = cw;
  view.canvas.height = ch;
  // The water fits inside the safe area (clear of a notch or rounded corners when the app runs full screen)
  const st = getComputedStyle(document.getElementById('safe')), inset = (k) => Math.round((parseFloat(st['padding' + k]) || 0) * dpr);
  const l = inset('Left'), r = inset('Right'), t = inset('Top'), b = inset('Bottom'), sw = cw - l - r, sh = ch - t - b;
  // Fractional device pixel ratios can leave the canvas a pixel short of a whole multiple;
  // allow that much overhang rather than dropping a whole scale step.
  view.scale = Math.max(1, Math.floor(Math.min((sw + 2) / W, (sh + 2) / H)));
  view.ox = l + Math.floor((sw - W * view.scale) / 2);
  view.oy = t + Math.floor((sh - H * view.scale) / 2);
  view.ctx.imageSmoothingEnabled = false;
  view.ctx.fillStyle = PALETTE_HEX[COL.WATER];
  view.ctx.fillRect(0, 0, cw, ch);
}

// ---- Camera ----
function clampCamera() {
  cam.x = clamp(cam.x, 0, W - W / cam.zoom);
  cam.y = clamp(cam.y, 0, H - H / cam.zoom);
}

// Change zoom level keeping the world point under screen pixel (sx, sy) in place.
function zoomAt(level, sx, sy) {
  const wx = cam.x + sx / cam.zoom, wy = cam.y + sy / cam.zoom;
  cam.level = clamp(level, 0, ZOOMS.length - 1);
  cam.zoom = ZOOMS[cam.level];
  cam.x = wx - sx / cam.zoom;
  cam.y = wy - sy / cam.zoom;
  clampCamera();
}

function panBy(dx, dy) {
  cam.x -= dx / cam.zoom;
  cam.y -= dy / cam.zoom;
  clampCamera();
}

function nearestLevel(zoom) {
  let best = 0;
  for (let k = 1; k < ZOOMS.length; k++) {
    if (Math.abs(Math.log(ZOOMS[k] / zoom)) < Math.abs(Math.log(ZOOMS[best] / zoom))) best = k;
  }
  return best;
}

const toSX = (wx) => Math.round(wx * cam.zoom) - view.bx0;
const toSY = (wy) => Math.round(wy * cam.zoom) - view.by0;
const worldY = (py) => (view.by0 + py + 0.5) / cam.zoom;
const wb = (x, y) => BAYER[(((y + view.by0) & 3) << 2) | ((x + view.bx0) & 3)];   // world-anchored dither
const mod = (v, m) => ((v % m) + m) % m;

function put(x, y, idx) {
  if (x >= 0 && x < W && y >= 0 && y < H) view.ibuf[y * W + x] = idx;
}

function lift(x, y) {
  if (x >= 0 && x < W && y >= 0 && y < H) { const k = y * W + x; view.ibuf[k] = LIGHT_UP[view.ibuf[k]]; }
}

// ---- Water ----
function waterBand(wy) {
  const f = clamp(wy / H, 0, 1);
  return R.waterBottom + (R.waterTop - R.waterBottom) * Math.pow(1 - f, R.waterCurve);
}

// Clock for the water's own motion (seconds); -1 until the loop starts, then composeFrame falls back to sim time
let ambientT = -1;
// The water's own pace follows the wind, so it is integrated: calm water slows, storms hurry it
let waterT = 0, lastTa = -1;
const seaNow = { wave: 1, shimmer: 1, sway: 1, focus: 1, broken: 0 };
const murkCol = new Float64Array(W);   // ray clarity per screen column

function updateSea(w, ta) {
  const Se = PARAMS.sea, wind = w.wind;
  const dA = lastTa < 0 ? 0 : clamp(ta - lastTa, 0, 2);
  lastTa = ta;
  if (waterT === 0) waterT = ta;
  waterT += dA * (Se.paceCalm + (Se.paceRough - Se.paceCalm) * wind);
  seaNow.wave = Se.waveCalm + (Se.waveRough - Se.waveCalm) * wind;
  seaNow.shimmer = Se.shimmerCalm + (Se.shimmerRough - Se.shimmerCalm) * wind;
  seaNow.sway = Se.swayCalm + (Se.swayRough - Se.swayCalm) * wind;
  seaNow.focus = smoothstep(Se.focusFrom, Se.focusFull, wind);
  seaNow.broken = smoothstep(Se.breakFrom, Se.breakFull, wind) * Se.broken;
  // Murk: bloom biomass summed down the upper half of each grid column
  const { cols, rows } = PARAMS.grid, M = PARAMS.murk, B = PARAMS.bloom, colMurk = updateSea.col || (updateSea.col = new Float64Array(cols));
  for (let i = 0; i < cols; i++) {
    let sum = 0;
    for (let j = 0; j < rows >> 1; j++) sum += chl[j * cols + i];
    colMurk[i] = 1 - smoothstep(M.from, M.full, sum / B.full);
  }
  const invz = 1 / cam.zoom;
  for (let px = 0; px < W; px++) {
    const wx = (view.bx0 + px + 0.5) * invz;
    murkCol[px] = colMurk[clamp(Math.floor(wx / GRID_W), 0, cols - 1)];
  }
  return dA;
}

// Brightness of rays and caustics: sunlight by day, a little moonlight at night
let dayLight = 1;

function shaftFade(wy) {
  const sd = wy < RAY_DEPTH ? 1 - wy / RAY_DEPTH : 0;
  return R.rayStrength * dayLight * Math.pow(sd, R.rayFadePow);
}

// The sun crosses the sky during the day, the moon at night; tilt runs -1..1 and back, so it never jumps.
function updateSun(phase) {
  const D = PARAMS.diel;
  const tilt = phase < D.dayFrac ? 2 * phase / D.dayFrac - 1 : 1 - 2 * (phase - D.dayFrac) / (1 - D.dayFrac);
  sun.x = W / 2 + tilt * R.rayTilt * R.rayFocal;
  sun.slope = tilt * PARAMS.surface.sunSlope;
}

// Rays are where the moving surface focuses light: sharp peaks of a few travelling waves, in waxing groups.
function updateRays(t) {
  const waves = R.rayWaves, thr = R.rayThreshold;
  let norm = 0;
  for (const wv of waves) norm += wv[0];
  for (let k = 0; k < rayTable.length; k++) {
    const u = k / R.rayRes - W;
    let s = 0;
    for (const wv of waves) s += wv[0] * Math.sin(u * wv[1] + t * wv[2] + wv[3]);
    s /= norm;
    if (s <= thr) { rayTable[k] = 0; continue; }
    const r = (s - thr) / (1 - thr), env = 0.55 + 0.45 * Math.sin(u * R.rayGroups + t * R.rayGroupSpeed);
    let v = r * r * env * 4 * seaNow.focus;
    if (seaNow.broken > 0) {   // choppy water shatters rays into flickering fragments
      const f = Math.sin(u * 1.7 + t * 3.1) * Math.sin(u * 0.63 - t * 2.3);
      v *= 1 - seaNow.broken * (f < 0.1 ? 1 : 0.3);
    }
    rayTable[k] = v;
  }
}

// Refraction shimmer per screen row, strongest just under the surface
function updateShimmer(t) {
  const invz = 1 / cam.zoom;
  for (let py = 0; py < H; py++) {
    const wy = (view.by0 + py + 0.5) * invz;
    if (wy >= SHIMMER_DEPTH) { rowShift[py] = 0; continue; }
    const f = 1 - wy / SHIMMER_DEPTH;
    rowShift[py] = R.shimmerAmp * seaNow.shimmer * f * f * (Math.sin(wy * R.shimmerK1 + t * R.shimmerW1) + 0.6 * Math.sin(wy * R.shimmerK2 - t * R.shimmerW2)) / 1.6;
  }
}

// Trace a point back along its ray to the surface, toward the virtual sun
function rayAt(wx, wy) {
  const u = sun.x + (wx - sun.x) * R.rayFocal / (R.rayFocal + wy);
  const k = ((u + W) * R.rayRes) | 0;
  return k >= 0 && k < rayTable.length ? rayTable[k] : 0;
}
const shaftAt = rayAt;

// Cellular caustics in world space; a third of the rows are refreshed each tick.
function updateCaustics(t, tick) {
  const cs = R.causticCell, gw = Math.ceil(W / cs) + 3, gh = Math.ceil(CAUSTIC_H / cs) + 3;
  for (let gj = 0; gj < gh; gj++) {
    for (let gi = 0; gi < gw; gi++) {
      const id = gj * 131 + gi, k = 2 * (gj * gw + gi);
      const sp = R.causticSpeed * (0.6 + hash01(id * 5 + 3));
      causticPts[k] = (gi - 1 + 0.5 + 0.38 * Math.sin(t * sp + hash01(id * 5 + 1) * TAU)) * cs;
      causticPts[k + 1] = (gj - 1 + 0.5 + 0.38 * Math.cos(t * sp * 0.8 + hash01(id * 5 + 2) * TAU)) * cs;
    }
  }
  const phase = tick % R.causticEvery;
  for (let j = 0; j < CAUSTIC_ROWS; j++) {
    if (causticReady && j % R.causticEvery !== phase) continue;
    const gj = Math.floor(j / cs) + 1;
    for (let i = 0; i < CAUSTIC_COLS; i++) {
      const gi = Math.floor(i / cs) + 1;
      let f1 = 1e9, f2 = 1e9;
      for (let dj = -1; dj <= 1; dj++) {
        for (let di = -1; di <= 1; di++) {
          const k = 2 * ((gj + dj) * gw + gi + di);
          const dx = causticPts[k] - i, dy = causticPts[k + 1] - j, d = dx * dx + dy * dy;
          if (d < f1) { f2 = f1; f1 = d; } else if (d < f2) f2 = d;
        }
      }
      causticF[j * CAUSTIC_COLS + i] = Math.sqrt(f2) - Math.sqrt(f1);
    }
  }
  causticReady = true;
}

function causticAt(wx, wy) {
  const i = wx | 0, j = wy | 0;
  if (i >= CAUSTIC_COLS - 1 || j >= CAUSTIC_ROWS - 1) return 1e9;
  const fx = wx - i, fy = wy - j, k = j * CAUSTIC_COLS + i;
  return (causticF[k] * (1 - fx) + causticF[k + 1] * fx) * (1 - fy)
       + (causticF[k + CAUSTIC_COLS] * (1 - fx) + causticF[k + CAUSTIC_COLS + 1] * fx) * fy;
}

// ---- Surface, seen from below ----
function surfaceY(wx, t) {
  const S = PARAMS.surface;
  return S.base + seaNow.wave * (S.ampA * Math.sin(wx * S.freqA + t * S.speedA) + S.ampB * Math.sin(wx * S.freqB - t * S.speedB));
}

function surfacePixel(wx, wy, t, b) {
  const S = PARAMS.surface;
  const slope = seaNow.wave * (S.ampA * S.freqA * Math.cos(wx * S.freqA + t * S.speedA) + S.ampB * S.freqB * Math.cos(wx * S.freqB - t * S.speedB));
  if (Math.abs(slope - sun.slope) < S.glintWidth
      && hash01(Math.floor(wx * 2) * 131 + Math.floor(t * S.twinkle) * 7919) < S.glintChance) return dayLight > 0.6 ? COL.GLOW : COL.FOAM;
  if (rayAt(wx, wy) * dayLight * murkCol[clamp(toSX(wx), 0, W - 1)] > S.rootLit) return COL.FOAM;
  return b < 0.5 ? COL.SHAFT : COL.SHAFT - 1;
}

// ---- Seafloor ----
function floorY(wx) {
  const F = PARAMS.floor;
  return FLOOR_TOP + F.rippleA * Math.sin(wx * F.rippleFreqA) + F.rippleB * Math.sin(wx * F.rippleFreqB + 1.7);
}

function sedimentPixel(wx, wy, d, b) {
  const F = PARAMS.floor, green = rampBase(0), gold = rampBase(1);
  if (b < d / F.fade) return COL.WATER;                                    // sinks into darkness below
  if (d < F.mat && hash01(Math.floor(wx * 1.5) + 7777) > F.matPatch) return b < 0.5 ? green + OUTLINE : green + SHADOW;
  if (d < 0.8) return gold + SHADOW;                                       // lit crest of the sediment
  const grain = hash01(Math.imul(Math.floor(wx * 2), 7919) + Math.floor(wy * 2) * 131 + 17);
  return grain < F.grain ? gold + SHADOW : gold + OUTLINE;
}

function drawPebbles() {
  const z = cam.zoom;
  for (const p of pebbles) {
    const cx = toSX(p.x), cy = toSY(p.y), rx = p.rx * z, ry = p.r * z * 0.7;
    for (let y = Math.floor(cy - ry - 1); y <= cy + ry + 1; y++) {
      for (let x = Math.floor(cx - rx - 1); x <= cx + rx + 1; x++) {
        const dx = (x - cx) / rx, dy = (y - cy) / ry, d = dx * dx + dy * dy;
        if (d > 1) continue;
        const lit = -dx * 0.6 - dy * 0.8 + (wb(x, y) - 0.5) * 0.3;
        put(x, y, d > 0.75 && dx + dy > 0.3 ? COL.WATER + 1 : lit > 0.45 ? COL.WATER + 6 : lit > -0.1 ? COL.SLATE : COL.WATER + 3);
      }
    }
  }
}

// ---- Bloom tint: water greens where cell biomass is dense ----
function updateBloom(w) {
  const B = PARAMS.bloom;
  if (w.tick !== chlTick) {
    const steps = chlTick < 0 ? 1e6 : w.tick - chlTick;
    chlTick = w.tick;
    chlNow.fill(0);
    for (const c of w.cells) if (!c.dying) addField(chlNow, c.x, c.y, c.biomass);
    const k = 1 - Math.exp(-steps * TICK_DT / B.tau);
    for (let i = 0; i < chl.length; i++) chl[i] += (chlNow[i] - chl[i]) * k;
  }
  const z = cam.zoom;
  for (let j = 0; j < TINT_H; j++) {
    for (let i = 0; i < TINT_W; i++) {
      const v = sampleField(chl, (view.bx0 + i * 4 + 2) / z, (view.by0 + j * 4 + 2) / z);
      bloomTint[j * TINT_W + i] = clamp(v / B.full, 0, 1) * B.max;
    }
  }
}

const surfaceLine = new Float64Array(W), floorLine = new Float64Array(W);   // per screen column, per frame

function drawBackground(t) {
  const ib = view.ibuf, z = cam.zoom, invz = 1 / z, bx0 = view.bx0, by0 = view.by0;
  const seamStart = 1 - R.seam, cw = R.causticWidth * invz;
  const wx0 = (bx0 + 0.5) * invz;
  if ((by0 + 0.5) * invz < SURFACE_MAX) for (let px = 0; px < W; px++) surfaceLine[px] = surfaceY(wx0 + px * invz, t);
  if ((by0 + H) * invz > FLOOR_MIN) for (let px = 0; px < W; px++) floorLine[px] = floorY(wx0 + px * invz);
  for (let py = 0; py < H; py++) {
    const by = by0 + py, wy = (by + 0.5) * invz, row = py * W, brow = (by & 3) << 2, brow2 = ((by + 1) & 3) << 2;
    // Ray coordinate is linear in x along a row: trace back toward the virtual sun, bent by refraction
    const base = waterBand(wy), sf = shaftFade(wy), shift = rowShift[py], g = R.rayFocal / (R.rayFocal + wy);
    const u0 = (sun.x + (wx0 + shift - sun.x) * g + W) * R.rayRes, du = invz * g * R.rayRes;
    const cf = wy < CAUSTIC_H ? Math.pow(1 - wy / CAUSTIC_H, R.causticFade) * dayLight : 0;
    const nearSurface = wy < SURFACE_MAX, nearFloor = wy > FLOOR_MIN, tintRow = (py >> 2) * TINT_W;
    for (let px = 0; px < W; px++) {
      const bx = bx0 + px, b = BAYER[brow | (bx & 3)];
      if (nearSurface) {
        const s = surfaceLine[px];
        if (wy < s) { ib[row + px] = surfacePixel(wx0 + px * invz, wy, t, b); continue; }
        if (wy < s + invz) { ib[row + px] = COL.FOAM; continue; }
      }
      if (nearFloor) {
        const fy = floorLine[px];
        if (wy >= fy) { ib[row + px] = sedimentPixel(wx0 + px * invz, wy, wy - fy, b); continue; }
      }
      let v = base;
      if (sf > 0) { const k = (u0 + px * du) | 0; if (k >= 0 && k < rayTable.length) v += rayTable[k] * sf * murkCol[px]; }
      let i = v | 0;
      const frac = v - i;
      if (frac > seamStart && b < (frac - seamStart) / R.seam) i++;      // flat bands, dithered seams
      if (cf > 0 && b < cf && causticAt(wx0 + px * invz + shift, wy) < cw) i++;
      if (i > COL.SHAFT) i = COL.SHAFT;
      if (i >= COL.BLOOM_FROM && i <= COL.BLOOM_TO) {
        const tint = bloomTint[tintRow + (px >> 2)];
        if (tint > 0 && BAYER[brow2 | ((bx + 2) & 3)] < tint) i = COL.BLOOM + i - COL.BLOOM_FROM;
      }
      ib[row + px] = i;
    }
  }
}

// ---- Nutrient pulses: resuspended specks rising in the plume, thinning as it climbs ----
function drawPlumes(w) {
  const P = PARAMS.plume, Pu = PARAMS.pulses;
  for (const p of w.pulses) {
    const span = p.y0 - p.y;
    for (let i = 0; i < P.specks; i++) {
      const h = Math.floor(p.x * 997) + i * 11;
      const off = (hash01(h + 1) + hash01(h + 2) - 1) * Pu.width;
      const y = p.y0 - mod(p.age * Pu.rise * (0.5 + 0.5 * hash01(h + 3)) + hash01(h + 4) * span, span);
      if (hash01(h + 5) > 0.3 + 0.7 * (y - p.y) / span) continue;   // fewer specks near the head
      const x = p.x + off + Math.sin(p.age * 0.7 + i) * 0.8;
      const sx = toSX(x), sy = toSY(y);
      if (sx < 0 || sy < 0 || sx >= W || sy >= H) continue;
      if (hash01(h + 6) < P.sediment) put(sx, sy, rampBase(GOLD) + SHADOW);
      else lift(sx, sy);
    }
  }
}

// Palette for this moment of the day: two keyframes and a world-anchored dither between them
function blitTimeOfDay(w) {
  const keys = PARAMS.timeOfDay.keys, ph = dayPhase(w);
  let k = 0;
  while (k < keys.length - 2 && ph >= keys[k + 1][0]) k++;
  const a = TIME_PAL32[keys[k][1]], b = TIME_PAL32[keys[k + 1][1]];
  const mix = a === b ? 0 : (ph - keys[k][0]) / (keys[k + 1][0] - keys[k][0]);
  const ib = view.ibuf, buf = view.buf, bx0 = view.bx0, by0 = view.by0;
  if (mix <= 0) { for (let i = 0; i < ib.length; i++) buf[i] = a[ib[i]]; return; }
  for (let py = 0; py < H; py++) {
    const row = py * W, brow = ((by0 + py) & 3) << 2;
    for (let px = 0; px < W; px++) {
      const i = row + px;
      buf[i] = BAYER[brow | ((bx0 + px) & 3)] < mix ? b[ib[i]] : a[ib[i]];
    }
  }
}

// ---- Particles in three depth layers (far specks, marine snow, near out-of-focus flocs) ----
function drawParticles(L, seed, t, near) {
  const zp = Math.pow(cam.zoom, L.zoomExp);
  const ccx = cam.x + W / (2 * cam.zoom), ccy = cam.y + H / (2 * cam.zoom);
  const size = near ? Math.max(2, Math.round(L.size * Math.sqrt(zp))) : 1;
  for (let i = 0; i < L.count; i++) {
    const h = seed + i * 5;
    const speed = L.speedMin + hash01(h + 3) * (L.speedMax - L.speedMin);
    const lx = hash01(h + 1) * W + Math.sin(waterT * 0.2 + i) * L.sway * seaNow.sway, ly = hash01(h + 2) * H + t * speed;
    const sx = Math.floor(mod((lx - ccx * L.parallax) * zp + W / 2, W * zp));
    const sy = Math.floor(mod((ly - ccy * L.parallax) * zp + H / 2, H * zp));
    if (sx >= W || sy >= H) continue;
    if (near) {
      for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) if (wb(sx + x, sy + y) < 0.5) lift(sx + x, sy + y);
    } else {
      const wy = worldY(sy);
      if (wy < SURFACE_MAX || wy > FLOOR_MIN) continue;
      put(sx, sy, Math.min(COL.SHAFT, Math.floor(waterBand(wy)) + L.lift));
    }
  }
}

// ---- The finger's wake: dotted foam along its path, thinning as it fades ----
function drawTrail(now) {
  const T = PARAMS.touch;
  let k = 0;
  for (const q of trail) {
    const a = (now - q.t) / 1000 / T.trail;
    if (a >= 1) continue;
    trail[k++] = q;
    const x = toSX(q.x), y = toSY(q.y);
    if (x >= 0 && y >= 0 && x < W && y < H && wb(x, y) < (1 - a) * 0.9) put(x, y, a < 0.3 ? COL.FOAM : COL.SHAFT);
  }
  trail.length = k;
}

// ---- A tap's ripple: rings of light spreading out to the reach of the scatter, thinning as they go (render only) ----
const ripples = [];
function drawRipples(now) {
  const T = PARAMS.touch, R = PARAMS.hand.radius, life = T.ripple + T.rippleGap * (T.rippleRings - 1);
  let k = 0;
  for (const q of ripples) {
    const age = (now - q.t) / 1000;
    if (age >= life) continue;
    ripples[k++] = q;
    const cx = toSX(q.x), cy = toSY(q.y);
    for (let i = 0; i < T.rippleRings; i++) {
      const a = (age - i * T.rippleGap) / T.ripple;
      if (a <= 0 || a >= 1) continue;
      const r = R * (1 - (1 - a) * (1 - a)) * (1 - 0.15 * i) * cam.zoom, fade = (1 - a) * (1 - 0.25 * i);
      const steps = Math.max(12, Math.ceil(TAU * r * 1.5));
      let px = -1e9, py = -1e9;
      for (let n = 0; n < steps; n++) {
        const th = n / steps * TAU, x = Math.round(cx + r * Math.cos(th)), y = Math.round(cy + r * Math.sin(th));
        if ((x === px && y === py) || wb(x, y) >= fade) continue;
        px = x; py = y;
        lift(x, y);
        if (i === 0 && a < 0.5) lift(x, y);   // the leading ring starts bright
      }
    }
  }
  ripples.length = k;
}

// ---- Bubbles ----
const bubbles = [], bubbleRng = makeRng(0xb0bb1e);
let bubbleT = -1;
function spawnBubble(x, y, plunge, seep) {
  const B = PARAMS.bubbles, size = bubbleRng.next();
  if (bubbles.length >= B.max) return;
  bubbles.push({ x, y, vy: plunge, r: B.rMin + (B.rMax - B.rMin) * size, rise: B.riseMin + (B.riseMax - B.riseMin) * size, ph: bubbleRng.next() * TAU });
  bubbleSound(x, size, seep);
}

function updateBubbles(w, ta) {
  const B = PARAMS.bubbles, dt = bubbleT < 0 ? 0 : clamp(ta - bubbleT, 0, 0.5), r = () => bubbleRng.next();
  bubbleT = ta;
  const chop = smoothstep(B.chopFrom, B.chopFull, w.wind);
  if (r() < chop * B.clusters * dt) {
    const x = r() * W, n = B.clusterMin + Math.floor(r() * (B.clusterMax - B.clusterMin + 1));
    for (let i = 0; i < n; i++) {
      const bx = x + (r() - 0.5) * 6;
      spawnBubble(bx, surfaceY(bx, waterT) + B.depthMin + r() * (B.depthMax - B.depthMin), B.plunge * r(), false);
    }
  }
  if (r() < B.seepRate * dt) {
    const x = 8 + r() * (W - 16), n = B.seepMin + Math.floor(r() * (B.seepMax - B.seepMin + 1));
    for (let i = 0; i < n; i++) spawnBubble(x + (r() - 0.5) * 2, H - PARAMS.world.floor - i * 2.5, 0, i === 0);
  }
  let k = 0;
  for (const b of bubbles) {
    b.vy += (-b.rise - b.vy) * Math.min(1, B.drag * dt);
    b.y += b.vy * dt;
    b.ph += B.wobbleRate * dt;
    b.x += Math.sin(b.ph) * B.wobble * dt * b.rise * 0.3;
    if (b.y > surfaceY(b.x, waterT) + 0.5) bubbles[k++] = b;   // reached the surface: it pops
  }
  bubbles.length = k;
}

// A bubble is a lit speck far away, a small bright ring with a glint close up
function drawBubbles() {
  const z = cam.zoom;
  for (const b of bubbles) {
    const cx = toSX(b.x), cy = toSY(b.y), rp = b.r * z;
    if (cx < -4 || cy < -4 || cx >= W + 4 || cy >= H + 4) continue;
    if (rp < 1.2) { if (cx >= 0 && cy >= 0 && cx < W && cy < H) put(cx, cy, rp < 0.6 ? COL.SHAFT : COL.FOAM); continue; }
    const steps = Math.ceil(TAU * rp * 1.5);
    for (let s = 0; s < steps; s++) {
      const a = s / steps * TAU, x = Math.round(cx + Math.cos(a) * rp), y = Math.round(cy + Math.sin(a) * rp);
      if (x >= 0 && y >= 0 && x < W && y < H) put(x, y, a > Math.PI ? COL.FOAM : COL.SHAFT);   // brighter on top
    }
    const gx = Math.round(cx - rp * 0.4), gy = Math.round(cy - rp * 0.4);
    if (gx >= 0 && gy >= 0 && gx < W && gy < H) put(gx, gy, COL.GLOW);
  }
}

// ---- Cells ----
// Morphology follows the genome continuously: size -> cell size and chloroplast count,
// timbre -> round coccoid .. glassy box-like frustule, coupling -> setae reaching for neighbours.
// The lineage seed fixes elongation and chloroplast layout, so relatives look alike.
// Sprites are rebuilt per zoom level and per 1/32 turn of tumbling.
// Tone code for glassy frustule highlights: coloured at draw time, shimmering as the cell turns
// (diatom frustules are photonic crystals with real structural colour).
const IRIDESCENT = -2;
const ALT = 8;   // tone offset: drawn from the neighbouring colour's ramp (mixed chloroplasts)

function buildSprite(c, rpx, angle, z, key) {
  const S = PARAMS.sprite, D = PARAMS.dino, g = c.g, seed = c.spriteSeed;
  // Separate streams per feature, so zooming (which adds or drops details) never reshuffles the rest
  const lin = makeRng(seed), linSetae = makeRng(seed ^ 0x9e3779b9), linPl = makeRng(seed ^ 0x51ed270b);
  const own = makeRng(hash32(c.id * 31 + c.gen));

  // Three overlapping regions of timbre: soft cell -> armoured dinoflagellate theca -> diatom glass
  const aspect = lin.range(S.aspectMin, S.aspectMax);
  const pennate = aspect >= S.polarAspect;
  const sides = pennate ? 0 : S.valveSides[lin.int(S.valveSides.length)];   // 0 = round disc
  const areolae = lin.next() < 0.5;
  const dino = D.forms[lin.int(D.forms.length)];
  const theca = smoothstep(D.from, D.full, g.timbre) * (1 - smoothstep(D.fade, D.gone, g.timbre));
  const glass = smoothstep(S.diatomFrom, S.diatomFull, g.timbre);
  const asp = pennate ? aspect : 1 + (aspect - 1) * (1 - glass) * (1 - theca);
  const a = rpx * Math.sqrt(asp), b = rpx / Math.sqrt(asp);
  const ca = Math.cos(angle), sa = Math.sin(angle);
  const p = 2 + g.timbre * S.squareness;
  const polyR = rpx * S.polygonScale, apothem = sides ? Math.cos(Math.PI / sides) : 1;
  const detail = theca > 0.5 && rpx >= D.detailR;

  // Dinoflagellate bodies, in the body frame: u runs apex (u < 0) to antapex, v across
  const da = rpx * D[dino].a, db = rpx * D[dino].b, cingU = D[dino].cingulum * da;
  const softQ = (u, v, sw) => Math.pow(Math.pow(Math.abs(u / (a * sw)), p) + Math.pow(Math.abs(v / (b * sw)), p), 1 / p);
  const dinoQ = (u, v, sw) => {
    if (dino === 'prorocentrum') {                    // egg narrowing toward the apex
      const bb = db * (1 + D.prorocentrum.taper * u / da);
      return Math.sqrt((u / da) * (u / da) + (v / bb) * (v / bb)) / sw;
    }
    const e = Math.sqrt((u / da) * (u / da) + (v / db) * (v / db)) / sw;
    return dino === 'alexandrium' ? e * (1 + D.alexandrium.plates * Math.cos(6 * Math.atan2(v, u))) : e;
  };
  const glassQ = (u, v, sw) => {
    if (pennate) {                                    // boat: pointed at both ends
      const fu = Math.abs(u) / (a * sw);
      if (fu >= 1) return 1 + fu;
      return Math.max(fu, Math.abs(v) / (b * sw * (1 - fu * fu)));
    }
    const r = Math.sqrt(u * u + v * v);
    if (!sides) return r / (rpx * sw);
    const seg = TAU / sides, m = mod(Math.atan2(v, u), seg) - seg / 2;
    return r * Math.cos(m) / (polyR * sw * apothem);
  };
  const shape = (u, v, sw) => {
    let q = softQ(u, v, sw);
    if (theca > 0) q = q * (1 - theca) + dinoQ(u, v, sw) * theca;
    if (glass > 0) q = q * (1 - glass) + glassQ(u, v, sw) * glass;
    return q;
  };

  // Setae (only once big enough on screen, and not on armoured dinoflagellates): horns at polygon corners,
  // polar spines on elongated cells, corner spines on squat box-like cells, radial spines on round ones
  const sk = clamp((g.coupling - S.setaeFrom) / (1 - S.setaeFrom), 0, 1);
  const setaeLen = rpx >= S.setaeMinR && theca < 0.5 ? sk * S.setaeLen * rpx : 0;
  const setae = [];
  if (setaeLen >= S.setaeMin) {
    const bend = () => linSetae.range(-1, 1) * S.setaeBend;
    if (glass > 0.5 && sides) {
      for (let k = 0; k < sides; k++) setae.push({ du: Math.cos(k * TAU / sides), dv: Math.sin(k * TAU / sides), bend: bend() });
    } else if (aspect >= S.polarAspect) {
      for (const su of [1, -1]) setae.push({ du: su, dv: 0, bend: bend() });
    } else if (p >= S.cornerSetaeP && glass < 0.5) {
      for (const [su, sv] of [[1, 1], [1, -1], [-1, 1], [-1, -1]]) setae.push({ du: su * a, dv: sv * b, bend: bend() });
    } else {
      const n = 2 + linSetae.int(4), off = linSetae.next() * TAU;
      for (let k = 0; k < n; k++) setae.push({ du: Math.cos(off + k * TAU / n), dv: Math.sin(off + k * TAU / n), bend: bend() });
    }
    for (const s of setae) {
      const len = Math.sqrt(s.du * s.du + s.dv * s.dv);
      s.du /= len; s.dv /= len;
      s.start = 1 / shape(s.du, s.dv, 1);
    }
  }

  // Chloroplasts: one cup in small cells, several discs in large ones.
  // A cell whose hue sits near the next colour carries some chloroplasts of that colour.
  const nPl = 1 + Math.floor((g.size - GENES.size[0]) * S.plastidsPerSize);
  const pMix = clamp((g.hue - Math.floor(g.hue) - S.mixFrom) / (1 - S.mixFrom), 0, 1) * S.mixMax;
  const plastids = [];
  for (let k = 0; k < nPl; k++) {
    const ang = linPl.next() * TAU, rad = nPl === 1 ? S.cupOffset : linPl.range(0.15, 0.5);
    plastids.push({
      u: Math.cos(ang) * rad * a, v: Math.sin(ang) * rad * b,
      r: Math.max(S.plastidMinR, (nPl === 1 ? S.cupR : S.plastidR) * rpx * own.range(0.85, 1.15)),
      ph: linPl.next() * TAU, alt: hash01(seed + k * 977) < pMix ? ALT : 0,
    });
  }

  // Tripos horns as tapered curves (body-frame control points, in units of rpx)
  const horns = detail && dino === 'tripos' ? D.tripos.horns : [];
  const hornExt = horns.length ? rpx * D.tripos.reach : 0;
  const listExt = detail && dino === 'dinophysis' && rpx >= D.dinophysis.listsFromR ? da * D.dinophysis.collarReach : 0;

  const ornament = glass > S.ornamentFrom && rpx >= S.ornamentMinR;
  const striae = Math.max(6, Math.floor(TAU * rpx / S.striaeSpacing));
  const bodyExt = Math.max(a, b, glass > 0 && sides ? polyR : 0, theca > 0 ? Math.max(da, db) * 1.1 : 0) * (1 + S.breathe);
  const half = Math.ceil(Math.max(bodyExt + setaeLen, hornExt, listExt + 1)) + 2, size = half * 2 + 1;
  const lo = Math.max(0, half - Math.ceil(bodyExt) - 1), hi = Math.min(size - 1, half + Math.ceil(bodyExt) + 1);
  const toSprite = (u, v) => [Math.round(u * ca - v * sa) + half, Math.round(u * sa + v * ca) + half];
  const frames = [];
  for (let f = 0; f < S.frames; f++) {
    const ph = TAU * f / S.frames, sw = 1 + S.breathe * Math.sin(ph) * (1 - glass) * (1 - theca);   // armour doesn't breathe
    const tones = new Int8Array(size * size).fill(-1);
    const inside = new Uint8Array(size * size);
    const uAt = new Float32Array(size * size), vAt = new Float32Array(size * size);
    for (let py = lo; py <= hi; py++) {
      for (let px = lo; px <= hi; px++) {
        const dx = px - half, dy = py - half;
        const u = dx * ca + dy * sa, v = -dx * sa + dy * ca, k = py * size + px;
        if (shape(u, v, sw) <= 1) { inside[k] = 1; uAt[k] = u; vAt[k] = v; }
      }
    }
    const pl = plastids.map((P) => {
      const u = P.u + Math.sin(ph + P.ph) * S.stream * z, v = P.v + Math.cos(ph + P.ph) * S.stream * z;
      return { x: u * ca - v * sa, y: u * sa + v * ca, r: P.r, alt: P.alt };
    });
    const isIn = (px, py) => px >= 0 && py >= 0 && px < size && py < size && inside[py * size + px] === 1;
    const cw = Math.max(D.grooveMin, D.groove * rpx);

    for (let py = lo; py <= hi; py++) {
      for (let px = lo; px <= hi; px++) {
        const k = py * size + px;
        if (!inside[k]) continue;
        const dx = px - half, dy = py - half, b4 = bayer(px, py), dth = (b4 - 0.5) * S.dither;
        const u = uAt[k], v = vAt[k];
        // Translucent cytoplasm, darker toward the lower right
        let tone = (-dx - dy) / (bodyExt * 1.4142) + dth < S.cytoShade ? OUTLINE : SHADOW;
        if (g.timbre > S.girdleFrom && glass < 0.5 && theca < 0.5 && Math.abs(u) < 0.5) tone = BASE;   // girdle seam
        if (ornament) {
          if (pennate) {
            const fu = Math.abs(u) / a, edge = Math.abs(v) / (b * (1 - fu * fu));
            if (Math.abs(v) < 0.5 && fu < 0.85) tone = fu < 0.12 ? BRIGHT : HIGHLIGHT;    // raphe and central nodule
            else if (edge > 0.35 && (Math.round(u) & 1) === 0) tone = BASE;              // transverse striae
          } else {
            const rn = Math.sqrt(u * u + v * v) / rpx;
            if (rn < 0.18) tone = HIGHLIGHT;                                               // central annulus
            else if (areolae) { if (rn > 0.3 && (px & 1) === 0 && ((py + (px & 2)) & 1) === 0) tone = BASE; }
            else if (rn > 0.35 && (Math.floor(mod(Math.atan2(v, u), TAU) / TAU * striae) & 1) === 0) tone = BASE;
          }
        }
        for (let j = pl.length - 1; j >= 0; j--) {   // front-most chloroplast wins
          const P = pl[j], ex = dx - P.x, ey = dy - P.y, d = Math.sqrt(ex * ex + ey * ey) / P.r;
          if (d > 1) continue;
          const s = (-ex - ey) / (P.r * 1.4142) * S.plastidLit + (1 - d) * (1 - S.plastidLit) + dth;
          tone = P.alt + (s > S.toneBright ? BRIGHT : s > S.toneHigh ? HIGHLIGHT : BASE);
          break;
        }
        if (theca > 0.5) {
          // Cingulum: the transverse groove that holds the beating transverse flagellum, slightly spiralled
          const gu = u - cingU - D.spiral * v;
          if (Math.abs(gu) < cw) tone = (Math.round(v) + f) % 3 === 0 ? HIGHLIGHT : OUTLINE;
          else if (gu < 0 && gu > -cw - 1) tone = HIGHLIGHT;                               // lit lip of the groove
          else if (dino !== 'dinophysis' && dino !== 'prorocentrum' && Math.abs(v) < 0.5 && u > cingU && u < cingU + D.sulcus * da) tone = OUTLINE;   // sulcus
          else if (dino === 'prorocentrum' && Math.abs(v) < 0.5) tone = BASE;              // suture between the two valves
          else if (dino === 'alexandrium' && rpx >= D.alexandrium.platesFromR && Math.abs(mod(Math.atan2(v, u) + (u < cingU ? 0.3 : 0), TAU / 6) - TAU / 12) < 0.06) tone = SHADOW;   // thecal plate seams
        }
        // Rim: lit on the upper left (iridescent on glass), selective dark outline on the lower right
        const lowerRight = !isIn(px + 1, py) || !isIn(px, py + 1);
        const upperLeft = !isIn(px - 1, py) || !isIn(px, py - 1);
        if (upperLeft) tone = glass > S.iridFrom && b4 < glass ? IRIDESCENT : HIGHLIGHT;
        else if (lowerRight) tone = glass > S.iridFrom && b4 < glass * S.rimIrid ? IRIDESCENT : g.timbre > S.glassFrom || theca > 0.5 ? BASE : OUTLINE;
        tones[k] = tone;
      }
    }

    // Dinophysis: the flared cingular collar at the apex and the sail-like sulcal list, as thin translucent membranes
    if (listExt) {
      const L = D.dinophysis;
      for (let py = 0; py < size; py++) {
        for (let px = 0; px < size; px++) {
          const k = py * size + px;
          if (inside[k]) continue;
          const dx = px - half, dy = py - half, u = dx * ca + dy * sa, v = -dx * sa + dy * ca;
          const t = (-u - L.collarFrom * da) / ((L.collarReach - L.collarFrom) * da);              // 0 at its base, 1 at its rim
          const collar = t >= 0 && t <= 1 && Math.abs(v) < db * (L.collarBase + t * L.collarFlare);
          const s = (u + L.sailFrom * da) / ((L.sailFrom + L.sailTo) * da);
          const sail = s >= 0 && s <= 1 && v > db * 0.6 && v < db * 0.6 + rpx * L.sailDepth * Math.sin(Math.PI * s);
          if (!collar && !sail) continue;
          // An open funnel: lit flaring sides and a sparse lip; the sail has a lit outer edge
          const b4 = bayer(px, py);
          const rimEdge = collar
            ? Math.abs(v) > db * (L.collarBase + t * L.collarFlare) - 1 || (t > 0.9 && b4 < 0.5)
            : v > db * 0.6 + rpx * L.sailDepth * Math.sin(Math.PI * s) - 1;
          if (rimEdge) tones[k] = HIGHLIGHT;
          else if (b4 < 0.3) tones[k] = SHADOW;
        }
      }
    }
    // Tripos horns: tapered, lit on one side
    for (const hn of horns) {
      for (let t = 0; t <= 1; t += 0.5 / (rpx * D.tripos.reach)) {
        const mt = 1 - t;
        const hu = (mt * mt * hn[0] + 2 * mt * t * hn[2] + t * t * hn[4]) * rpx;
        const hv = (mt * mt * hn[1] + 2 * mt * t * hn[3] + t * t * hn[5]) * rpx + Math.sin(ph) * t * D.tripos.sway;
        const wdt = D.tripos.width * (1 - t * 0.7);
        for (let o = -wdt; o <= wdt; o += 0.5) {
          const [px, py] = toSprite(hu, hv + o);
          if (px < 0 || py < 0 || px >= size || py >= size || inside[py * size + px]) continue;
          tones[py * size + px] = o < -wdt + 0.6 ? HIGHLIGHT : t > 0.8 ? SHADOW : BASE;
        }
      }
    }
    // Prorocentrum: a small apical tooth
    if (detail && dino === 'prorocentrum') {
      for (let t = 0; t <= D.prorocentrum.tooth * rpx; t += 0.5) {
        const [px, py] = toSprite(-da - t, 0);
        if (px >= 0 && py >= 0 && px < size && py < size && !inside[py * size + px]) tones[py * size + px] = HIGHLIGHT;
      }
    }
    for (const s of setae) {
      const flex = s.bend + Math.sin(ph + s.start) * S.setaeBend * 0.3;
      for (let t = 0; t <= setaeLen; t += 0.5) {
        const along = s.start + t, side = flex * t * t / setaeLen;
        const u = s.du * along - s.dv * side, v = s.dv * along + s.du * side;
        const [px, py] = toSprite(u, v);
        if (px < 0 || py < 0 || px >= size || py >= size || inside[py * size + px]) continue;
        // Long, faint silica spines: solid at the base, dissolving toward the tip
        const tipFrac = t / setaeLen;
        if (tipFrac > S.setaeFadeFrom && bayer(px, py) < (tipFrac - S.setaeFadeFrom) / (1 - S.setaeFadeFrom)) continue;
        tones[py * size + px] = t < S.setaeSolid ? BASE : SHADOW;
      }
    }
    frames.push(tones);
  }
  return { key, half, size, frames, a: theca > 0.5 ? da : a };
}

// Rebuilds are rationed per frame; past the budget a cell keeps its previous sprite for a moment.
function spriteFor(c, rpx, step) {
  const key = ((c.gen * 9 + Math.round(c.elder * 8)) * ZOOMS.length + cam.level) * PARAMS.sprite.tumbleSteps + step;   // elders grow: rebuild
  const s = c.spr;
  if (s && (s.key === key || performance.now() > buildDeadline)) return s;
  return (c.spr = buildSprite(c, rpx, step * TAU / PARAMS.sprite.tumbleSteps, cam.zoom, key));
}

// Slow tumbling: each cell turns at its own pace with a gentle sway
// Swimming, visual only. Every cell runs its own clock at its own tempo, so cells at 1x, 3x, 6x and 8x share the water.
// Activity shows how a cell is doing: flagellates follow their recorded growth conditions (vigor) and sleep at night;
// dinoflagellates swim at night while they have energy and rest by day. Diatoms have no flagella and only rock.
let swimTick = -1;
function updateSwim(w, ta) {
  const Sw = PARAMS.swim, Dn = PARAMS.dino, dark = 1 - smoothstep(PARAMS.drift.darkLo, PARAMS.drift.darkHi, w.surfaceLight);
  const dS = swimTick < 0 ? 0 : clamp((w.tick - swimTick) * TICK_DT, 0, 1);   // simulated seconds since the last frame
  swimTick = w.tick;
  const [sLo, sHi] = GENES.size, [oLo, oHi] = GENES.omega;
  for (const c of w.cells) {
    if (c.dying) continue;
    const h1 = hash01(c.id * 17 + 1), h2 = hash01(c.id * 17 + 2), h3 = hash01(c.id * 17 + 3), h4 = hash01(c.id * 17 + 4), tb = c.g.timbre;
    const motile = 1 - smoothstep(Dn.fade, Dn.gone, tb);
    const nocturnal = smoothstep(Dn.from, Dn.full, tb);
    const dayAct = (1 - dark) * (Sw.awake + (1 - Sw.awake) * clamp(c.vigor / Sw.vigorFull, 0, 1));
    const nightAct = dark * clamp(c.energy * 2, 0, 1) + (1 - dark) * 0.1;
    const act = dayAct + (nightAct - dayAct) * nocturnal;
    // Species temper: small, quick-pulsing cells are the fastest swimmers
    const temper = Sw.temperMin + (1 - Sw.temperMin) * (0.5 * (sHi - c.g.size) / (sHi - sLo) + 0.5 * (c.g.omega - oLo) / (oHi - oLo));
    const target = 1 + (Sw.tempoMax - 1) * act * temper * motile;
    c.tempo += (target - c.tempo) * Math.min(1, dS / Sw.tempoEase);
    c.vt += dS * c.tempo;
    // Wandering leash: smooth, Brownian-looking darting around the true position
    const L = Sw.leash * motile * (Sw.sleepLeash + (1 - Sw.sleepLeash) * act), p = c.vt * Sw.wanderRate;
    const wx = L * (0.6 * Math.sin(p * (0.7 + 0.6 * h1) + h2 * TAU) + 0.4 * Math.sin(p * (1.6 + 0.8 * h3) + h4 * TAU));
