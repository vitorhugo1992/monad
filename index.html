  for (let k = 0; k < n; k++) {
    const dir = back + (n === 2 ? (k ? F.spread : -F.spread) : 0), dx = Math.cos(dir), dy = Math.sin(dir);
    for (let s = 0; s <= len; s += 0.5) {
      const f = s / len, side = amp * f * Math.sin(f * TAU * F.waves - phase);
      const x = Math.round(ox + dx * s - dy * side), y = Math.round(oy + dy * s + dx * side);
      if (x < 0 || y < 0 || x >= W || y >= H) continue;
      if (f > 0.6 && wb(x, y) < (f - 0.6) * 2.5) continue;
      view.ibuf[y * W + x] = base + (f < 0.4 ? BASE : SHADOW);
    }
  }
}

// Fixed templates for cells too small on screen to show a form
const SPECK = { key: -1, half: 0, size: 2, a: 1, frames: [0, 0, 0].map(() => Int8Array.of(HIGHLIGHT, BASE, BASE, SHADOW)) };
const DOT = { key: -1, half: 0, size: 1, a: 1, frames: [0, 0, 0].map(() => Int8Array.of(HIGHLIGHT)) };
// Iridescent pixels cycle through the bright ends of every pigment ramp
const IRID_SET = HUE_WHEEL.map((r) => rampBase(r) + BRIGHT).concat([COL.FOAM]);

function drawCell(c, tick, t) {
  if (c.eaten) return;                                   // swallowed: gone at once
  const S = PARAMS.sprite, z = cam.zoom, rpx = c.rv * z;
  const cx = toSX(c.x + c.ox), cy = toSY(c.y + c.oy), reach = rpx * (2 + S.setaeLen) + 4;
  if (cx < -reach || cy < -reach || cx > W + reach || cy > H + reach) return;
  const steps = S.tumbleSteps, angle = c.la || c.lb ? chainAngle(c, t) : tumbleAngle(c, c.vt);   // tumbles on its own clock unless chained
  const step = mod(Math.round(angle / TAU * steps), steps);
  const spr = rpx < S.dotR ? DOT : rpx < S.speckR ? SPECK : spriteFor(c, rpx, step);
  const irPhase = step + c.id + Math.floor(t * S.iridSpeed);
  const base = rampBase(hueRamp(c.g)), base2 = rampBase(hueNeighbour(c.g));
  if (!c.dying && spr.key >= 0) drawFlagella(c, cx, cy, step * TAU / steps, rpx, spr, base);

  const frame = (Math.floor(tick * S.wobbleFps / PARAMS.time.tickRate) + c.id) % S.frames;
  const tones = spr.frames[frame], size = spr.size, x0 = cx - spr.half, y0 = cy - spr.half;
  const lum = glowing(c), pulse = flashLevel(c, tick) * (lum ? glowNight : PARAMS.flash.cellLift);
  const fade = c.dying ? c.dying / PARAMS.death.fadeTicks : 0;
  const depth = c.y / H, dark = depth > R.deepFrom ? (depth - R.deepFrom) / (1 - R.deepFrom) * R.deepDarken : 0;
  const ib = view.ibuf, bx0 = view.bx0, by0 = view.by0, cw = 2 * R.causticWidth / z;
  for (let py = 0; py < size; py++) {
    const sy = y0 + py;
    if (sy < 0 || sy >= H) continue;
    const by = by0 + sy, wy = (by + 0.5) / z;
    const sl = shaftFade(wy) * R.cellLight;
    const cl = wy < CAUSTIC_H ? Math.pow(1 - wy / CAUSTIC_H, R.causticFade) * R.cellCaustic * dayLight : 0;
    for (let px = 0; px < size; px++) {
      const t0 = tones[py * size + px];
      if (t0 === -1) continue;
      const sx = x0 + px;
      if (sx < 0 || sx >= W) continue;
      const bx = bx0 + sx, b = BAYER[((by & 3) << 2) | (bx & 3)];
      if (fade > 0 && b < fade) continue;                                       // death: dissolve
      const muted = dark > 0 && BAYER[(((by + 2) & 3) << 2) | ((bx + 1) & 3)] < dark;   // deep water mutes colour
      let idx;
      if (t0 === IRIDESCENT) {
        idx = muted ? base + BASE : IRID_SET[mod(irPhase + ((bx + 2 * by) >> 1), IRID_SET.length)];
      } else {
        const alt = t0 >= ALT;
        let tt = alt ? t0 - ALT : t0;
        if (muted && tt > 0) tt--;
        idx = (alt ? base2 : base) + tt;
      }
      if (pulse > 0) {
        const pb = BAYER[(((by + 1) & 3) << 2) | ((bx + 3) & 3)];
        if (lum) { if (pb < pulse) idx = GLOW + (pb < pulse * 0.5 ? BRIGHT : HIGHLIGHT); }   // blue-green bioluminescence
        else if (pb < pulse) idx = LIGHT_UP[idx];                                              // soft swell
      }
      if (sl > 0 || cl > 0) {                                                    // light shafts and caustics play over the cell
        const wx = (bx + 0.5) / z + rowShift[sy];
        let lit = sl > 0 ? shaftAt(wx, wy) * sl * murkCol[sx] : 0;
        if (cl > 0 && causticAt(wx, wy) < cw) lit += cl;
        if (BAYER[(((by + 3) & 3) << 2) | ((bx + 1) & 3)] < lit) idx = LIGHT_UP[idx];
      }
      ib[sy * W + sx] = idx;
    }
  }
}

const drawOrder = [];
function drawCells(w, t) {
  drawOrder.length = 0;
  for (let i = 0; i < w.cells.length; i++) drawOrder.push(w.cells[i]);
  drawOrder.sort((p, q) => q.rv - p.rv || p.id - q.id);
  for (let i = 0; i < drawOrder.length; i++) drawCell(drawOrder[i], w.tick, t);
}

// ---- Bioluminescence ----
// Glowing Alexandrium (an inherited trait, see PARAMS.luminous); a daughter whose form drifted out of the
// dinoflagellate range keeps the flag but no longer shows it
const isLuminous = (c) => c.lum && dinoWeight(c.g.timbre) > 0.5;

// At night disturbed water sets them flashing: visitors brushing past, breaking chop near the surface
let glowNight = 0, glowSeen = -1;
function updateGlow(w) {
  const G = PARAMS.glow, V = PARAMS.visitors;
  glowNight = 1 - smoothstep(PARAMS.drift.darkLo, PARAMS.drift.darkHi, w.surfaceLight);
  const dS = glowSeen < 0 ? 0 : (w.tick - glowSeen) * TICK_DT;
  if (w.tick === glowSeen) return;
  glowSeen = w.tick;
  if (glowNight <= 0) return;
  const chop = clamp((w.wind - G.chopFrom) * G.chopRate * dS, 0, 1);
  for (const c of w.cells) {
    if (c.dying || !isLuminous(c) || w.tick - c.glowTick < G.refractory) continue;
    let hit = c.y < G.chopDepth && hash01(c.id * 7919 + w.tick) < chop;
    for (let i = 0; i < w.visitors.length && !hit; i++) {
      const v = w.visitors[i];
      if (v.kind === 'sardines') {
        const S = V.sardines, dx = (c.x - v.x - v.dir * 4) / (S.rx + G.touch), dy = (c.y - v.y) / (S.ry + G.touch);
        hit = dx * dx + dy * dy < 1;
      } else if (v.kind === 'salps') {
        const r = V.salps.reach + G.touch * 2;
        for (let b = 0; b < v.alive.length && !hit; b++) {
          if (!v.alive[b]) continue;
          const p = salpBarrel(v, b), dx = c.x - p.x, dy = c.y - p.y;
          hit = dx * dx + dy * dy < r * r;
        }
      } else {
        const r = V.sunfish.r + G.touch, dx = c.x - v.x, dy = c.y - v.y;
        hit = dx * dx + dy * dy < r * r;
      }
    }
    if (hit) c.glowTick = w.tick;
  }
}

const glowing = (c) => glowNight > 0 && isLuminous(c);
const GLOW = rampBase(LIGHTBLUE);

// A flash swells and fades softly: 0..1 over its lifetime (its own flash, or a disturbance flash)
function flashLevel(c, tick) {
  const F = PARAMS.flash, a = tick - (c.glowTick > c.flashTick ? c.glowTick : c.flashTick);
  if (c.dying || a < 0 || a >= F.rise + F.fall) return 0;
  return a < F.rise ? smoothstep(0, F.rise, a) : 1 - smoothstep(F.rise, F.rise + F.fall, a);
}

// Bioluminescence: the flash spills faint light into the water and onto neighbours, plus broken arcs on large cells
function drawFlashes(w) {
  const F = PARAMS.flash, z = cam.zoom;
  for (const c of w.cells) {
    const level = flashLevel(c, w.tick);
    if (level <= 0) continue;
    const age = w.tick - c.flashTick;
    const cx = toSX(c.x + c.ox), cy = toSY(c.y + c.oy), rpx = c.rv * z, G = PARAMS.glow, lum = glowing(c);
    const rh = lum ? clamp(rpx * G.haloRadius, F.haloMinPx + 2, G.haloMaxPx) : clamp(rpx * F.haloRadius, F.haloMinPx, F.haloMaxPx);
    const strength = (lum ? G.halo * glowNight : F.haloStrength) * level;
    const y0 = Math.max(0, Math.floor(cy - rh)), y1 = Math.min(H - 1, Math.ceil(cy + rh));
    const x0 = Math.max(0, Math.floor(cx - rh)), x1 = Math.min(W - 1, Math.ceil(cx + rh));
    for (let y = y0; y <= y1; y++) {
      for (let x = x0; x <= x1; x++) {
        const b = wb(x, y);
        if (b >= strength) continue;                      // can't pass anywhere in the halo
        const dx = x - cx, dy = y - cy, d = Math.sqrt(dx * dx + dy * dy);
        const v = strength * (1 - d / rh);
        if (d > rh || b >= v) continue;
        const k = y * W + x;
        view.ibuf[k] = lum && b < v * 0.35 ? GLOW + BASE : LIGHT_UP[view.ibuf[k]];   // a blue-green core for the glowers
      }
    }
    if (lum || rpx < F.ringMinR || age >= F.ringTicks) continue;
    const k = age / F.ringTicks, rad = rpx + F.ringStart + age * F.ringGrow * z;
    if (cx < -rad || cy < -rad || cx > W + rad || cy > H + rad) continue;
    const idx = rampBase(hueRamp(c.g)) + (k < 0.5 ? HIGHLIGHT : BASE);
    const steps = Math.ceil(TAU * rad * 1.5), seed = c.id * 1.7;
    for (let s = 0; s < steps; s++) {
      const ang = s / steps * TAU;
      if (Math.sin(ang * F.arcs + seed) < F.arcGap) continue;
      const x = Math.round(cx + Math.cos(ang) * rad), y = Math.round(cy + Math.sin(ang) * rad);
      if (wb(x, y) >= k) put(x, y, idx);
    }
  }
}

// Dotted thread from a young daughter to her living sister-mother, thinning with age.
// Linked cells show their bond instead: interlocking setae bridging the gap (drawn under the cells).
const byId = new Map();
function drawThreads(w) {
  const T = PARAMS.thread, minR = PARAMS.sprite.speckR, z = cam.zoom;
  byId.clear();
  for (const c of w.cells) if (!c.dying) byId.set(c.id, c);
  for (const c of w.cells) {
    const o = c.lb;
    if (!o || c.habit === 2 || o.habit === 2 || c.rv * z < minR || o.rv * z < minR) continue;   // stars join by invisible mucilage pads
    const ax = toSX(c.x + c.ox), ay = toSY(c.y + c.oy), dx = toSX(o.x + o.ox) - ax, dy = toSY(o.y + o.oy) - ay;
    const len = Math.sqrt(dx * dx + dy * dy), b1 = rampBase(hueRamp(c.g)), b2 = rampBase(hueRamp(o.g));
    for (let s = 0; s <= len; s += 0.5) {
      const f = s / len, x = Math.round(ax + dx * f), y = Math.round(ay + dy * f);
      put(x, y, (f < 0.5 ? b1 : b2) + (Math.abs(f - 0.5) < 0.15 ? BASE : SHADOW));   // the spines cross mid-gap
    }
  }
  for (const c of w.cells) {
    if (c.dying || c.parentId === null || c.age > T.maxAge || c.rv * z < minR) continue;
    const p = byId.get(c.parentId);
    if (!p || p === c.la || p === c.lb || p.rv * z < minR) continue;
    const ax = toSX(c.x + c.ox), ay = toSY(c.y + c.oy), dx = toSX(p.x + p.ox) - ax, dy = toSY(p.y + p.oy) - ay;
    const len = Math.sqrt(dx * dx + dy * dy);
    if (len < 1) continue;
    const fade = c.age / T.maxAge, idx = rampBase(hueRamp(c.g)) + BASE;
    for (let s = 0; s <= len; s += T.dotSpacing) {
      const x = Math.round(ax + dx * s / len), y = Math.round(ay + dy * s / len);
      if (wb(x, y) >= fade) put(x, y, idx);
    }
  }
}

// Resting cysts on the sediment: a lit dot when small, a spiny dinocyst when zoomed in
function drawCysts(w) {
  const C = PARAMS.cystLook, rpx = C.r * cam.zoom, ri = Math.ceil(rpx) + 1;
  for (const q of w.cysts) {
    const cx = toSX(q.x), cy = toSY(q.y), base = rampBase(hueRamp(q.g));
    if (rpx < 1.5) {
      put(cx, cy - 1, base + HIGHLIGHT); put(cx - 1, cy, base + BASE); put(cx, cy, base + SHADOW);
      put(cx + 1, cy, base + OUTLINE); put(cx, cy + 1, base + OUTLINE);
      continue;
    }
    for (let dy = -ri; dy <= ri; dy++) {
      for (let dx = -ri; dx <= ri; dx++) {
        const d = Math.sqrt(dx * dx + dy * dy) / rpx;
        if (d <= 1) {
          const lit = (-dx - dy) / (rpx * 1.4142);
          put(cx + dx, cy + dy, base + (lit > 0.35 ? HIGHLIGHT : lit > -0.3 ? BASE : d > 0.7 ? OUTLINE : SHADOW));
        } else if (rpx >= C.spikesFromPx && d <= 1 + 1.2 / rpx && mod(Math.round(Math.atan2(dy, dx) / TAU * 12), 2) === 0) {
          put(cx + dx, cy + dy, base + SHADOW);
        }
      }
    }
  }
}

// ---- Visitors ----
// Filled ellipse in world units, each pixel coloured by a callback (u, v in -1..1 across the ellipse), rotated by angle.
function fillShape(cx, cy, rx, ry, angle, colour) {
  const z = cam.zoom, sx = toSX(cx), sy = toSY(cy), ca = Math.cos(angle), sa = Math.sin(angle);
  // Tight box around the rotated ellipse
  const ex = Math.sqrt(rx * rx * ca * ca + ry * ry * sa * sa) * z + 1, ey = Math.sqrt(rx * rx * sa * sa + ry * ry * ca * ca) * z + 1;
  if (sx + ex < 0 || sx - ex >= W || sy + ey < 0 || sy - ey >= H) return;
  for (let y = Math.max(0, Math.floor(sy - ey)); y <= Math.min(H - 1, sy + ey); y++) {
    for (let x = Math.max(0, Math.floor(sx - ex)); x <= Math.min(W - 1, sx + ex); x++) {
      const dx = (x - sx) / z, dy = (y - sy) / z;
      const u = (dx * ca + dy * sa) / rx, v = (-dx * sa + dy * ca) / ry;
      const idx = colour(u, v, x, y);
      if (idx >= 0) put(x, y, idx);
    }
  }
}

function drawVisitors(w, ta) {
  for (const v of w.visitors) {
    if (v.kind === 'salps') drawSalps(v, ta);
  }
  for (const v of w.visitors) {
    if (v.kind === 'sardines') drawSardines(v, ta);
    else if (v.kind === 'sunfish') drawSunfish(v, ta);
  }
}

// A school of sardines. Each fish: blue-green back with a small dorsal fin, a row of dark spots, a silver flank
// whose scales catch the light and twinkle, a white belly, gill cover, eye, pectoral fin and a forked tail that
// beats (foreshortened, as seen from the side). Fish hold loose slots in a polarised school and drift, surge and pitch.
// When the school wheels round for another pass, the whole school flashes silver.
const SARDINE_BACK = [rampBase(EMERALD) + OUTLINE, rampBase(BLUE) + SHADOW, rampBase(BLUE) + BASE];
function drawSardines(v, ta) {
  const L = PARAMS.look.sardine, S = PARAMS.visitors.sardines, ice = rampBase(LIGHTBLUE), blue = rampBase(BLUE);
  const flash = v.turnedAt !== undefined ? clamp(1 - (v.age - v.turnedAt) / L.turnFlash, 0, 1) : 0;
  const order = [];
  for (let i = 0; i < v.fish; i++) order.push(i);
  order.sort((p, q) => hash01(v.id * 131 + p * 7 + 5) - hash01(v.id * 131 + q * 7 + 5));   // fixed depth order
  for (const i of order) {
    const h = v.id * 131 + i * 7;
    // Slot spread evenly over the school's ellipse
    const ang = hash01(h + 1) * TAU, rad = Math.sqrt(hash01(h + 2)) * L.spread;
    const ph = hash01(h + 4) * TAU, f1 = 0.5 + 0.4 * hash01(h + 6);
    const fx = v.x + Math.cos(ang) * rad * S.rx + Math.sin(ta * f1 + ph) * L.drift * 1.4;   // surging along the line of travel
    const fy = v.y + Math.sin(ang) * rad * S.ry + Math.sin(ta * f1 * 0.8 + ph * 1.3) * L.drift;
    const pitch = Math.cos(ta * f1 * 0.8 + ph * 1.3) * 0.12 + clamp(v.vy / Math.abs(v.vx || 1), -0.4, 0.4);
    const size = 0.85 + 0.3 * hash01(h + 3), len = L.len * size, ht = L.height * size;
    const beat = Math.sin(ta * L.tailBeat * (0.85 + 0.3 * hash01(h + 8)) + ph), dir = v.dir;
    fillShape(fx, fy, len / 2 + 1, ht + 2.2, pitch * dir, (u, q, x, y) => {
      // u: -1 tail .. +1 snout (fish-relative); q: -1 top .. +1 bottom, in units of the body half-height
      u = u * dir * (len / 2 + 1) / (len / 2);
      q = q * (ht + 2.2) / ht;
      const b = wb(x, y);
      const bend = u < -0.2 ? beat * 0.12 * (u + 0.2) * (u + 0.2) * 4 : 0;   // the tail end sways
      const qq = q - bend;
      if (u < -0.74) {                                     // forked tail, foreshortened by the beat
        const t = (-0.74 - u) / 0.26, open = 0.55 + 0.45 * Math.abs(Math.cos(ta * L.tailBeat + ph));
        if (t > 1) return -1;
        const outer = (0.3 + t * 1.7) * open, notch = t > 0.45 ? (t - 0.45) * 1.6 * open : -1;
        if (Math.abs(qq) > outer || Math.abs(qq) < notch) return -1;
        return t > 0.7 && b < 0.5 ? -1 : qq < 0 ? SARDINE_BACK[1] : blue + BASE;
      }
      const hb = u >= 0 ? Math.sqrt(Math.max(0, 1 - u * u)) : 0.28 + 0.72 * Math.sqrt(Math.max(0, 1 - (u / 0.74) * (u / 0.74)));
      // dorsal fin: a small triangle on the back just behind mid-body
      if (qq < -hb && u > -0.25 && u < 0.08) {
        const fin = (u + 0.25) / 0.33;
        return qq > -hb - 0.55 * (1 - fin) - 0.05 ? SARDINE_BACK[0] : -1;
      }
      if (Math.abs(qq) > hb) return -1;
      const rq = qq / hb;                                 // -1 back .. 1 belly at this station
      // head details
      if (u > 0.66 && u < 0.84 && rq > -0.55 && rq < 0.05) {
        const eu = (u - 0.75) / 0.09, eq = (rq + 0.25) / 0.3, e = eu * eu + eq * eq;
        if (e < 1) return e < 0.35 ? (eu < -0.1 && eq < -0.1 ? COL.GLOW : COL.WATER) : COL.FOAM;
      }
      if (u > 0.93 && rq > -0.1 && rq < 0.15) return SARDINE_BACK[0];          // mouth line
      if (Math.abs(u - 0.56 + rq * rq * 0.08) < 0.03 && rq > -0.6) return ice + HIGHLIGHT;   // gill cover edge
      if (u > 0.28 && u < 0.5 && rq > 0.15 && rq < 0.5 && rq - 0.15 < (0.5 - u) * 1.6) return ice + BRIGHT;   // pectoral fin
      // body colour by height on the flank
      if (rq < -0.5) return SARDINE_BACK[rq < -0.78 ? 0 : 1];                  // dark blue-green back
      if (rq < -0.28) return b < 0.5 ? SARDINE_BACK[2] : blue + HIGHLIGHT;     // steel-blue shoulder
      if (rq > -0.24 && rq < -0.06 && u < 0.5 && u > -0.6 && mod(Math.round(u * len * 0.6), 4) === 0) return SARDINE_BACK[1];   // spot row
      if (rq < 0.55) {                                     // silver flank: scales catch the light and twinkle
        const sc = Math.floor((u + 1) * len * 0.6) * 31 + Math.floor((rq + 1) * 3) + h * 7;
        if (flash > 0 && b < flash) return COL.GLOW;
        if (hash01(sc * 13 + Math.floor(ta * L.shineRate + hash01(sc) * 4)) < L.shine * (0.4 + 0.6 * dayLight)) return COL.GLOW;
        return rq < 0.05 ? (b < 0.35 ? ice + BRIGHT : ice + HIGHLIGHT) : rq < 0.3 ? ice + BRIGHT : (b < 0.5 ? COL.FOAM : ice + BRIGHT);
      }
      return rq > 0.85 && b < 0.4 ? ice + HIGHLIGHT : COL.FOAM;   // white belly
    });
  }
}

// Salp chain: translucent barrels with muscle bands and a coloured gut nucleus; pellets sink from them
function drawSalps(v, ta) {
  const L = PARAMS.look.salp, gold = rampBase(GOLD);
  for (let b = 0; b < v.alive.length; b++) {
    if (!v.alive[b]) continue;
    const p = salpBarrel(v, b), ang = PARAMS.visitors.salps.tilt * v.dir + Math.sin(ta * 0.7 + b) * 0.08;
    const pulse = 1 + 0.08 * Math.sin(ta * 2.2 + b * 0.9);   // jet-propelled pumping
    fillShape(p.x, p.y, L.rx * pulse, L.ry / pulse, ang, (u, q, x, y) => {
      const d = u * u + q * q;
      if (d > 1) return -1;
      const k = y * W + x, under = view.ibuf[k];
      if (d > 0.72) return wb(x, y) < 0.7 ? COL.FOAM : LIGHT_UP[under];        // glassy rim
      if (Math.abs(Math.abs(u) - 0.45) < 0.08) return LIGHT_UP[LIGHT_UP[under]];   // muscle bands
      const gu = u * v.dir + 0.55, gq = q - 0.1;
      if (gu * gu * 3 + gq * gq * 4 < 0.12) return gold + (gu + gq < 0 ? BRIGHT : HIGHLIGHT);   // gut nucleus
      return wb(x, y) < 0.5 ? LIGHT_UP[under] : under;                            // see-through body
    });
    if (b > 0 && v.alive[b - 1]) {   // stolon linking the barrels
      const q = salpBarrel(v, b - 1);
      worldLine(q.x, q.y, p.x, p.y, COL.SHAFT);
    }
    for (let i = 0; i < L.pellets; i++) {   // fast-sinking fecal pellets
      const h = v.id * 977 + b * 31 + i, fall = mod(ta * L.pelletFall + hash01(h) * L.pelletSpan, L.pelletSpan);
      if (fall < 3) continue;
      const sx = toSX(p.x + (hash01(h + 1) - 0.5) * 3), sy = toSY(p.y + fall);
      if (wb(sx, sy) < 1 - fall / L.pelletSpan) put(sx, sy, gold + OUTLINE);
    }
  }
}

// Filled triangle in world units; colour(t, x, y) gets t = 0 at the base .. 1 at the tip
function fillTri(bx0, by0, bx1, by1, tx, ty, colour) {
  const P = [[toSX(bx0), toSY(by0)], [toSX(bx1), toSY(by1)], [toSX(tx), toSY(ty)]];
  const minX = Math.max(0, Math.floor(Math.min(P[0][0], P[1][0], P[2][0]))), maxX = Math.min(W - 1, Math.ceil(Math.max(P[0][0], P[1][0], P[2][0])));
  const minY = Math.max(0, Math.floor(Math.min(P[0][1], P[1][1], P[2][1]))), maxY = Math.min(H - 1, Math.ceil(Math.max(P[0][1], P[1][1], P[2][1])));
  const area = (P[1][0] - P[0][0]) * (P[2][1] - P[0][1]) - (P[2][0] - P[0][0]) * (P[1][1] - P[0][1]);
  if (Math.abs(area) < 1e-6) return;
  for (let y = minY; y <= maxY; y++) {
    for (let x = minX; x <= maxX; x++) {
      const w0 = ((P[1][0] - x) * (P[2][1] - y) - (P[2][0] - x) * (P[1][1] - y)) / area;
      const w1 = ((P[2][0] - x) * (P[0][1] - y) - (P[0][0] - x) * (P[2][1] - y)) / area;
      const w2 = 1 - w0 - w1;
      if (w0 < 0 || w1 < 0 || w2 < 0) continue;
      const idx = colour(w2, x, y);
      if (idx >= 0) put(x, y, idx);
    }
  }
}

// Ocean sunfish skin, dark brown-grey back to white belly (a continuous tone dithered across these steps)
const MOLA = [rampBase(GOLD) + OUTLINE, rampBase(GOLD) + SHADOW, COL.WATER + 2, COL.SLATE, COL.WATER + 6, COL.SHAFT, COL.FOAM];
const molaTone = (v, x, y) => { const k = clamp(v, 0, MOLA.length - 1.001), i = k | 0; return MOLA[wb(x, y) < k - i ? i + 1 : i]; };

// One of the two tall fins (side -1 dorsal, +1 anal): a curved blade swept back, foreshortened as it swings
function drawMolaFin(cx, cy, dir, side, stroke, L) {
  const z = cam.zoom, app = L.fin * (0.72 + 0.28 * Math.abs(Math.cos(stroke * L.finTurn)));
  const baseX = cx - dir * L.rx * 0.27, baseY = cy + side * L.ry * 0.88, sweep = L.sweep * (1 + 0.35 * Math.sin(stroke));
  const rows = Math.ceil(app * z) + 1;
  for (let k = 0; k <= rows; k++) {
    const t = k / rows, wy = baseY + side * app * t;
    const mid = baseX - dir * sweep * Math.pow(t, 1.6) + dir * 0.15 * L.finBase * Math.sin(Math.PI * t);
    const hw = L.finBase * Math.pow(1 - t, 0.7) * (1 - 0.2 * t) + 0.35;
    const sy = toSY(wy);
    if (sy < 0 || sy >= H) continue;
    const xa = toSX(mid - hw), xb = toSX(mid + hw);
    for (let x = Math.max(0, xa); x <= Math.min(W - 1, xb); x++) {
      const f = xb > xa ? (x - xa) / (xb - xa) : 0.5, lead = dir > 0 ? f : 1 - f;   // 1 at the leading edge
      let v = 2.4 + lead * 2.2 - t * 1.6;                   // light leading edge, darker trailing edge and tip
      if (t > 0.82) v -= 1.2;
      put(x, sy, molaTone(v, x, sy));
    }
  }
}

// Ocean sunfish (Mola): a tall disc with brown-grey back, mottled silver flanks and a white belly; tall curved
// dorsal and anal fins flapping together; a scalloped clavus for a tail; beak mouth, gill opening, small pectoral fin.
function drawSunfish(v, ta) {
  const L = PARAMS.look.sunfish, dir = v.dir, beat = ta * L.finBeat * (v.leaving ? 0.6 : 1) + v.id, stroke = Math.sin(beat);
  const cx = v.x, cy = v.y + Math.cos(beat) * L.bob;
  const gulp = Math.max(0, Math.sin(ta * L.gulp + v.id * 1.7)), open = gulp * gulp * (v.leaving ? 0.35 : 1);
  drawMolaFin(cx, cy, dir, -1, stroke, L);
  drawMolaFin(cx, cy, dir, 1, stroke, L);
  const X = 1.25;   // shape box wider than the body, for clavus and beak
  fillShape(cx, cy, L.rx * X, L.ry, 0, (u0, q, x, y) => {
    const u = u0 * X * dir;                                // body units, +1 at the snout
    // small round protruding mouth: lips around an opening that widens and closes to a slit, sucking in prey
    const lu = (u - 0.97) / 0.11, lq = (q + 0.04) / (0.075 + 0.05 * open);
    if (lu * lu + lq * lq < 1) {
      const ou = (u - 1.0) / (0.05 + 0.06 * open), oq = (q + 0.04) / (0.012 + 0.05 * open);
      if (ou * ou + oq * oq < 1) return COL.WATER;                                  // the opening
      return molaTone(lq < -0.3 ? 4.2 : lq > 0.4 ? 2.8 : 3.5, x, y);               // lips, lit from above
    }
    let d = u * u + q * q;
    if (u < -0.78) {                                       // clavus: a row of rounded lobes
      if (Math.abs(q) > 0.62) return -1;
      const lobe = (q + 0.62) / 0.124, li = Math.floor(lobe), lf = lobe - li - 0.5;
      const reach = -0.78 - 0.2 * Math.sqrt(Math.max(0, 1 - 4 * lf * lf));
      if (u < reach) return -1;
      return molaTone(Math.abs(lf) > 0.4 ? 2.2 : 3.6 - (u + 0.78) * -6, x, y);
    }
    if (d > 1) return -1;
    // eye: ring, iris, highlight
    const eu = (u - 0.6) / 0.085, eq = (q + 0.28) / 0.075, e = eu * eu + eq * eq;
    if (e < 1) return e < 0.45 ? (eu < -0.2 && eq < -0.2 ? COL.GLOW : COL.WATER) : COL.FOAM;
    // gill opening
    const gu = (u - 0.36) / 0.035, gq = (q - 0.02) / 0.1;
    if (gu * gu + gq * gq < 1) return MOLA[0];
    // skin: tone by height and light from the upper left, blotchy mottling, rough speckles, darker rim
    const blot = Math.sin(u * 7 + 1.3) * Math.sin(q * 6 - 0.7) + 0.5 * Math.sin(u * 13 + q * 9 + 2);
    const speck = hash01((x + view.bx0) * 73 + (y + view.by0) * 131) < 0.07 ? 0.6 : 0;
    let tone = 3.5 + q * 1.9 - u * 0.4 + (blot > 0.8 ? 0.8 : blot < -0.9 ? -0.5 : 0) - speck;
    if (d > 0.9) tone -= (q > 0 ? 0.5 : 0.9);
    return molaTone(tone, x, y);
  });
  // small pectoral fin behind the gill, flapping
  const app = 0.6 + 0.4 * Math.abs(Math.sin(beat * 1.3));
  fillShape(cx + dir * (L.rx * 0.3 - L.pectoral * app), cy + L.ry * 0.05, L.pectoral * app, L.pectoral * 0.55, dir * 0.25, (u, q, x, y) =>
    u * u + q * q > 1 ? -1 : molaTone(4.2 + u * dir * 0.8 - q * 0.6, x, y));
}

// Krill: the grazer field made visible. Translucent pink-orange shrimps with a smooth carapace, a segmented
// abdomen and tail fan, big black eyes, long waving feelers, a green gut (they eat diatoms), a basket of feeding
// legs, swimmerets beating in a travelling wave, and blue-white photophores that glow in the dark.
// They glide in loose swarms and flick the tail when they dart.
function krillAt(L, h, ta) {
  const p = ta * L.glide * (0.7 + 0.6 * hash01(h + 1));
  let x = L.wander * (0.6 * Math.sin(p * (0.8 + 0.4 * hash01(h + 5)) + hash01(h + 6) * TAU) + 0.4 * Math.sin(p * 1.7 + hash01(h + 7) * TAU));
  let y = L.wander * (0.6 * Math.sin(p * (0.7 + 0.4 * hash01(h + 8)) + hash01(h + 9) * TAU) + 0.4 * Math.sin(p * 1.4 + hash01(h + 10) * TAU)) * 0.6;
  const every = L.dartEvery * (0.7 + 0.6 * hash01(h + 11)), ph = ta / every + hash01(h + 2), n = Math.floor(ph);
  const e = smoothstep(0, 1, (ph - n) * every / L.dartTime);
  const ax = hash01(h * 3 + n) - 0.5, ay = hash01(h * 3 + n + 7) - 0.5, bx = hash01(h * 3 + n + 1) - 0.5, by = hash01(h * 3 + n + 8) - 0.5;
  x += (ax + (bx - ax) * e) * 2 * L.dartDist;
  y += (ay + (by - ay) * e) * L.dartDist;
  return { x, y, dart: e > 0 && e < 1 ? Math.sin(Math.PI * e) : 0 };
}

let krillFacing = new Map();   // id -> last facing, so a krill doesn't flip on every tiny reversal
function drawKrill(w, ta) {
  const L = PARAMS.look.krill, { cols, rows } = PARAMS.grid, Z = w.fields.graz, z = cam.zoom;
  const rose = rampBase(ROSE), green = rampBase(GREEN), ice = rampBase(LIGHTBLUE);
  const dark = 1 - smoothstep(PARAMS.drift.darkLo, PARAMS.drift.darkHi, w.surfaceLight);
  const x0 = cam.x - 20, y0 = cam.y - 20, x1 = cam.x + W / z + 20, y1 = cam.y + H / z + 20;
  for (let j = 0; j < rows; j++) {
    for (let i = 0; i < cols; i++) {
      const node = j * cols + i, pres = clamp((Z[node] - L.zFrom) / L.zSpan, 0, 1) * L.coverage;
      if (hash01(node * 91 + 7) >= pres) continue;
      const h = node * 17, p = krillAt(L, h, ta), q = krillAt(L, h, ta - 0.15);
      const cx = (i + 0.5) * GRID_W + p.x, cy = (j + 0.5) * GRID_H + p.y;
      if (cx < x0 || cx > x1 || cy < y0 || cy > y1) continue;
      const vx = p.x - q.x, vy = p.y - q.y;
      let dir = krillFacing.get(node) || (hash01(h) < 0.5 ? -1 : 1);
      if (Math.abs(vx) > 0.15) dir = vx > 0 ? 1 : -1;
      krillFacing.set(node, dir);
      const tilt = clamp(vy / (Math.abs(vx) + 0.6), -0.25, 0.25);
      const len = L.len * (0.85 + 0.3 * hash01(h + 20)), ca = Math.cos(tilt), sa = Math.sin(tilt);
      // body frame: s = 0 at the eye .. 1 at the tail fan; the abdomen curls down, more when the tail flicks
      const curl = L.curl + L.flick * p.dart;
      const spine = (sp) => {
        const a = -sp * len, b = curl * len * sp * sp;          // a along the heading, b downward
        return [cx + dir * (a * ca) - b * sa * dir * 0, cy + a * sa * dir + b * ca];
      };
      const thick = (sp) => len * (sp < 0.42 ? L.thick * (0.75 + 0.25 * Math.sin(Math.PI * Math.min(1, sp / 0.42 + 0.15))) : L.thick * (1 - (sp - 0.42) * 1.25));
      // feeding-basket legs, hanging below the carapace
      for (let k = 0; k < 6; k++) {
        const sp = 0.1 + k * 0.05, [bx, by] = spine(sp), th = thick(sp);
        const sw = Math.sin(ta * L.legBeat + k * 0.7) * 0.25;
        worldLine(bx, by + th * 0.6, bx + dir * len * (0.06 + sw * 0.15), by + th * 0.6 + len * 0.22, k % 2 ? rose + BRIGHT : rose + HIGHLIGHT);
      }
      // swimmerets under the abdomen, beating in a travelling wave
      for (let k = 0; k < 5; k++) {
        const sp = 0.46 + k * 0.085, [bx, by] = spine(sp), th = thick(sp);
        const sw = Math.sin(ta * L.swimBeat - k * 0.9);
        worldLine(bx, by + th * 0.7, bx + dir * len * 0.06 * sw, by + th * 0.7 + len * 0.1, rose + HIGHLIGHT);
      }
      // body: overlapping discs from tail to head, lit from above, segment seams on the abdomen
      const steps = Math.max(10, Math.ceil(len * z * 1.2));
      for (let k = steps; k >= 0; k--) {
        const sp = k / steps, [bx, by] = spine(sp), th = thick(sp);
        const seam = sp > 0.42 && mod(sp - 0.42, 0.095) < 0.012;
        fillShape(bx, by, th, th, 0, (u, v, x, y) => {
          const d = u * u + v * v;
          if (d > 1) return -1;
          if (seam && v < 0.6) return rose + BASE;
          if (sp > 0.06 && sp < 0.36 && v > -0.55 && v < 0.35 && Math.abs(u) < 0.6) {   // green gut inside the carapace
            return wb(x, y) < 0.55 ? green + BASE : green + HIGHLIGHT;
          }
          if (v < -0.55) return d > 0.7 ? rose + BRIGHT : COL.FOAM;              // lit back
          if (v > 0.6) return rose + BASE;                                       // shadowed belly
          if (hash01(((x + view.bx0) * 7 + (y + view.by0) * 13) * 3 + h) < 0.12) return rose + SHADOW;   // chromatophores
          return wb(x, y) < 0.5 ? rose + HIGHLIGHT : rose + BRIGHT;
        });
      }
      // tail fan
      const [tx, ty] = spine(1);
      for (const sp of [-0.55, 0, 0.55]) {
        const ang = Math.PI + sp + tilt;
        worldLine(tx, ty, tx + dir * Math.cos(ang) * len * 0.16, ty + Math.sin(ang + Math.PI) * len * 0.1 * sp + len * 0.03, rose + BRIGHT);
      }
      // eye on a short stalk, with a highlight
      const [ex, ey] = spine(0.02), er = Math.max(0.6, len * 0.075);
      fillShape(ex + dir * len * 0.02, ey - thick(0.05) * 0.3, er, er, 0, (u, v) => u * u + v * v > 1 ? -1 : u * dir > 0.1 && v < -0.2 ? COL.GLOW : COL.WATER);
      // long feelers, waving
      for (let f = 0; f < 2; f++) {
        let fx = ex + dir * len * 0.05, fy = ey - len * 0.02;
        const seg = len * L.feelers / 4;
        for (let k = 0; k < 4; k++) {
          const a = -0.35 - f * 0.25 + Math.sin(ta * 1.3 + k * 0.8 + f * 2 + h) * 0.12 + k * 0.12;
          const nx = fx + dir * Math.cos(a) * seg, ny = fy + Math.sin(a) * seg;
          worldLine(fx, fy, nx, ny, f ? rose + HIGHLIGHT : COL.SHAFT);
          fx = nx; fy = ny;
        }
      }
      // photophores: small blue light organs under the body, a touch brighter at night (no halo)
      if (z >= 2) for (const sp of [0.24, 0.5, 0.7]) {
        const [bx, by] = spine(sp), th = thick(sp);
        put(toSX(bx), toSY(by + th * 0.85), dark > 0.5 ? ice + HIGHLIGHT : ice + BASE);
      }
    }
  }
}

// ---- Seafloor scavengers ----
// Decoration only: they never touch the simulation. They come where detritus has recently fallen
// (w.fallen), linger to pick at it, then walk on and out of the column.
const crawlers = [];
const smell = new Float64Array(PARAMS.grid.cols), fallenSeen = new Float64Array(PARAMS.grid.cols);
const CRAWLER_TYPES = ['amphipod', 'ostracod', 'isopod'];
const SLATE_RAMP = [COL.WATER + 1, COL.WATER + 3, COL.SLATE, COL.WATER + 6, COL.WATER + 7];
let crawlTick = -1;

function crawlerColour(type, tone) {
  if (type === 'amphipod') return rampBase(2) + tone;   // translucent pink
  if (type === 'ostracod') return rampBase(1) + tone;   // amber shell
  return SLATE_RAMP[tone];                               // grey isopod
}

function updateCrawlers(w) {
  const C = PARAMS.crawlers, cols = PARAMS.grid.cols;
  if (crawlTick < 0) { fallenSeen.set(w.fallen); crawlTick = w.tick; return; }
  const ticks = w.tick - crawlTick;
  if (ticks <= 0) return;
  crawlTick = w.tick;
  const dt = ticks * TICK_DT, decay = Math.exp(-dt / C.smellTau);
  let total = 0, best = 0;
  for (let i = 0; i < cols; i++) {
    smell[i] = smell[i] * decay + (w.fallen[i] - fallenSeen[i]);
    fallenSeen[i] = w.fallen[i];
    total += smell[i];
    if (smell[i] > smell[best]) best = i;
  }
  // More scent, more likely an arrival; a stateless hash of the tick keeps it reproducible
  const chance = 1 - Math.exp(-C.rate * Math.min(1, total / C.smellFull) * dt);
  if (crawlers.length < C.max && total > 0 && hash01(w.tick * 7919 + w.seed) < chance) {
    const h = w.tick * 31 + w.seed, type = CRAWLER_TYPES[Math.floor(hash01(h + 1) * CRAWLER_TYPES.length)], T = C[type];
    const fromLeft = hash01(h + 2) < 0.5;
    crawlers.push({
      type, id: h & 0xffff, x: fromLeft ? -C.margin : W + C.margin, dir: fromLeft ? 1 : -1,
      target: (best + 0.5) * GRID_W, col: best, state: 'in', walk: hash01(h + 5) * TAU,
      speed: T.speedMin + hash01(h + 3) * (T.speedMax - T.speedMin),
      feed: C.feedMin + hash01(h + 4) * (C.feedMax - C.feedMin),
    });
  }
  for (let i = crawlers.length - 1; i >= 0; i--) {
    const cr = crawlers[i];
    if (cr.state === 'feed') {
      cr.feed -= dt;
      smell[cr.col] *= decay;                       // picking the detritus over
      if (cr.feed <= 0) cr.state = 'out';
      continue;
    }
    cr.x += cr.dir * cr.speed * dt;
    cr.walk += cr.speed * dt * C.step;
    if (cr.state === 'in' && (cr.target - cr.x) * cr.dir <= 0) cr.state = 'feed';
    else if (cr.state === 'out' && (cr.x < -C.margin - 1 || cr.x > W + C.margin + 1)) crawlers.splice(i, 1);
  }
}

function worldLine(x0, y0, x1, y1, idx) {
  const z = cam.zoom, ax = x0 * z - view.bx0, ay = y0 * z - view.by0, bx = x1 * z - view.bx0, by = y1 * z - view.by0;
  const n = Math.ceil(Math.max(Math.abs(bx - ax), Math.abs(by - ay))) + 1;
  for (let i = 0; i <= n; i++) put(Math.floor(ax + (bx - ax) * i / n), Math.floor(ay + (by - ay) * i / n), idx);
}

// A shaded body part (world units). Close up it shows more: a seam along its rear rim (segments overlap
// head to tail), a lit band along the back, and for ostracods a bean-shaped, pitted carapace.
function drawShell(bl, type, dir, detail) {
  const z = cam.zoom, cx = bl.x * z - view.bx0, cy = bl.y * z - view.by0;
  const rx = Math.max(0.7, bl.rx * z), ry = Math.max(0.7, bl.ry * z);
  for (let y = Math.floor(cy - ry); y <= Math.ceil(cy + ry); y++) {
    for (let x = Math.floor(cx - rx); x <= Math.ceil(cx + rx); x++) {
      const dx = (x + 0.5 - cx) / rx;
      let dy = (y + 0.5 - cy) / ry;
      if (detail && bl.bean) dy *= (dy > 0 ? 1.25 : 1) * (1 + 0.2 * Math.max(0, dx * dir));   // flat belly, narrower front
      const q = (detail && bl.plate ? Math.pow(Math.abs(dx), PARAMS.crawlers.detail.plate) : dx * dx) + dy * dy;
      if (q > 1) continue;
      const b = wb(x, y), lit = -dx * 0.6 - dy * 0.8 + (b - 0.5) * 0.3;
      let tone = q > 0.7 && dx + dy > 0.4 ? OUTLINE : lit > 0.5 ? HIGHLIGHT : lit > -0.1 ? BASE : SHADOW;
      if (detail) {
        if (bl.seam && dx * dir < -0.7 && q > 0.5 && dy > -0.8) tone = SHADOW;           // rear rim over the next segment
        else if (dy < -0.55 && q > 0.3 && q < 0.8 && lit > 0.3) tone = BRIGHT;            // lit band along the back
        else if (bl.pits && q < 0.7 && tone > SHADOW) {                                    // pitted shell
          const bx = x + view.bx0, by = y + view.by0;
          if ((bx & 3) === 0 && ((by + (bx >> 1)) & 3) === 0) tone--;
        }
        if (bl.gut && Math.abs(dy - 0.1) < 0.18 && Math.abs(dx) < 0.9 && b < 0.6) { put(x, y, rampBase(1) + SHADOW); continue; }   // amber gut showing through
      }
      put(x, y, crawlerColour(type, tone));
    }
  }
}

// A jointed leg: up and out to the knee, down to the foot; bend +1 points the knee forward, -1 back
function drawLeg(hx, hy, fx, fy, bend, dir, idx) {
  const D = PARAMS.crawlers.detail, kx = hx + dir * bend * D.spread, ky = hy + (fy - hy) * D.knee, px = 1 / cam.zoom;
  worldLine(hx, hy, kx, ky, idx);
  worldLine(hx, hy + px, kx, ky + px, idx);   // the thigh is stouter than the shin
  worldLine(kx, ky, fx, fy, idx);
}

// A gently curved antenna; close up it is beaded (segmented)
function drawAntenna(x0, y0, x1, y1, curve, type, beaded) {
  const z = cam.zoom, mx = (x0 + x1) / 2 - (y1 - y0) * curve * 0.2, my = (y0 + y1) / 2 + (x1 - x0) * curve * 0.2;
  const len = Math.sqrt((x1 - x0) * (x1 - x0) + (y1 - y0) * (y1 - y0)) * z, n = Math.ceil(len * 1.5) + 1;
  for (let i = 0; i <= n; i++) {
    const s = i / n, a = (1 - s) * (1 - s), b = 2 * (1 - s) * s, c = s * s;
    const x = (a * x0 + b * mx + c * x1) * z - view.bx0, y = (a * y0 + b * my + c * y1) * z - view.by0;
    const tone = beaded && Math.floor(s * len / PARAMS.crawlers.detail.bead) & 1 ? HIGHLIGHT : BASE;
    put(Math.floor(x), Math.floor(y), crawlerColour(type, s > 0.85 ? SHADOW : tone));
  }
}

function drawEye(x, y, r, type) {
  const z = cam.zoom, cx = x * z - view.bx0, cy = y * z - view.by0, rx = Math.max(0.7, r * 0.75 * z), ry = Math.max(0.7, r * z);
  for (let py = Math.floor(cy - ry); py <= Math.ceil(cy + ry); py++) {
    for (let px = Math.floor(cx - rx); px <= Math.ceil(cx + rx); px++) {
      const dx = (px + 0.5 - cx) / rx, dy = (py + 0.5 - cy) / ry;
      if (dx * dx + dy * dy <= 1) put(px, py, dx < -0.2 && dy < -0.2 && dx > -0.8 && dy > -0.8 ? crawlerColour(type, HIGHLIGHT) : COL.WATER);
    }
  }
}

function drawCrawlers(t) {
  const C = PARAMS.crawlers, D = C.detail, detail = cam.zoom >= D.zoom;
  for (const cr of crawlers) {
    const ground = floorY(cr.x), moving = cr.state !== 'feed', bob = moving ? Math.sin(cr.walk * 2) * 0.12 : 0, dir = cr.dir;
    const pick = !moving && detail ? Math.max(0, Math.sin(t * D.pickRate + cr.id)) * D.pick : 0;   // head dips to pick at detritus
    const body = [];   // tail first, so the head is drawn in front
    if (cr.type === 'ostracod') {
      const T = C.ostracod;
      body.push({ x: cr.x, y: ground - C.legH * 0.6 - T.ry + bob, rx: T.rx, ry: T.ry, bean: true, pits: true });
    } else {
      const T = C[cr.type], n = T.segs, half = (n - 1) * T.segLen / 2, amph = cr.type === 'amphipod';
      for (let k = n - 1; k >= 0; k--) {
        const f = k / (n - 1), r = T.rFront + (T.rTail - T.rFront) * f;
        body.push({
          x: cr.x + dir * (half - k * T.segLen), y: ground - C.legH - r - T.arch * Math.sin(Math.PI * f) + bob + pick * (1 - f),
          // close up an amphipod shows tall, laterally compressed plates rather than beads
          rx: detail && amph ? T.segLen * 0.72 : r, ry: cr.type === 'isopod' ? r * 0.7 : detail && amph ? r * 1.12 : r,
          seam: k < n - 1, gut: amph && k > 0 && k < n - 1, plate: amph && k > 0,   // body plates are squarer than the head
        });
      }
    }
    const head = body[body.length - 1], tail = body[0], legIdx = crawlerColour(cr.type, SHADOW);

    // Legs, stepping while walking
    if (!detail) {
      const legXs = cr.type === 'ostracod' ? [head.x - dir * 0.6, head.x + dir * 0.6] : body.map((s) => s.x);
      legXs.forEach((lx, k) => {
        const swing = moving ? Math.sin(cr.walk + k * 1.3) * 0.5 : 0;
        worldLine(lx, ground - C.legH - 0.3, lx + dir * swing, ground, legIdx);
      });
    } else if (cr.type === 'ostracod') {   // short legs poking out of the shell's gape
      for (let k = 0; k < 3; k++) {
        const hx = head.x + dir * (k - 1) * head.rx * 0.45, swing = moving ? Math.sin(cr.walk + k * 2.1) * 0.4 : 0;
        drawLeg(hx, head.y + head.ry * 0.7, hx + dir * ((k - 1) * 0.8 + swing), ground, k - 1 || 0.5, dir, legIdx);
      }
    } else {
      // Amphipods ("both kinds of feet"): front legs bend forward, back legs bend back; isopods all alike
      const n = body.length;
      for (let k = 1; k < n - 1; k++) {
        const s = body[k], fwd = cr.type === 'amphipod' ? (k >= n - 4 ? 1 : -1) : (k >= n / 2 ? 1 : -1);
        const swing = moving ? Math.sin(cr.walk + k * 1.3) * 0.5 : 0;
        drawLeg(s.x, s.y + s.ry * 0.6, s.x + dir * (fwd * D.spread * D.reach + swing), ground, fwd, dir, legIdx);
      }
      if (cr.type === 'amphipod') {
        // Pleopods beating under the abdomen; gnathopod claw held under the head
        for (let k = 1; k <= 2; k++) {
          const s = body[k], beat = Math.sin(t * D.pleoBeat + k) * 0.4;
          worldLine(s.x, s.y + s.ry * 0.7, s.x - dir * (0.3 + beat), s.y + s.ry * 0.7 + D.pleopod, legIdx);
        }
        const gx = head.x + dir * head.rx * 0.6, gy = head.y + head.ry * 0.9;
        worldLine(head.x, head.y + head.ry * 0.5, gx, gy, legIdx);
        worldLine(gx, gy, gx + dir * 0.6, gy - 0.5, crawlerColour(cr.type, BASE));
      }
    }

    for (const s of body) drawShell(s, cr.type, dir, detail);

    if (detail) {
      // Tail: amphipods carry three pairs of uropods, isopods a forked pair beside the tail shield
      const tx = tail.x - dir * tail.rx * 0.8, ty = tail.y + tail.ry * 0.2;
      const forks = cr.type === 'amphipod' ? [0.5, 0, -0.45] : cr.type === 'isopod' ? [0.25, -0.15] : [];
      for (const a of forks) worldLine(tx, ty, tx - dir * D.uropod * Math.cos(a), ty + D.uropod * Math.sin(a) + 0.3, crawlerColour(cr.type, BASE));
      // Eye: kidney eye of amphipods, compound eye of isopods, single naupliar eye spot of ostracods
      const os = cr.type === 'ostracod';
      drawEye(head.x + dir * head.rx * (os ? 0.55 : 0.35), head.y - head.ry * (os ? 0.35 : 0.2), D.eyeR * (os ? 0.8 : 1), cr.type);
    }

    // Antennae, always feeling about (close up: beaded, the second pair shorter; ostracods row with bristle fans)
    const hx = head.x + dir * head.rx * 0.8, hy = head.y - head.ry * 0.4 + pick;
    for (let k = 0; k < 2; k++) {
      const e = 0.35 + 0.4 * k + Math.sin(t * 3 + k * 2 + cr.id) * 0.15 - pick;
      const L = C.antenna * (detail && k === 0 && cr.type !== 'ostracod' ? D.antenna2 : 1);
      const ex = hx + dir * Math.cos(e) * L, ey = hy - Math.sin(e) * L;
      if (!detail) { worldLine(hx, hy, ex, ey, crawlerColour(cr.type, BASE)); continue; }
      drawAntenna(hx, hy, ex, ey, D.curve * dir * (k ? 1 : -0.5), cr.type, cr.type !== 'ostracod');
      if (cr.type === 'ostracod') {
        for (let j = 0; j < D.bristles; j++) {
          const a = e + (j - (D.bristles - 1) / 2) * 0.35 + Math.sin(t * 4 + j + cr.id) * 0.1;
          worldLine(ex, ey, ex + dir * Math.cos(a) * D.bristleLen, ey - Math.sin(a) * D.bristleLen, crawlerColour(cr.type, SHADOW));
        }
      }
    }
  }
}

// ---- 3x5 pixel font (rows as 3-bit masks, left = 4) ----
const FONT = {
  '0': [7, 5, 5, 5, 7], '1': [2, 6, 2, 2, 7], '2': [7, 1, 7, 4, 7], '3': [7, 1, 3, 1, 7], '4': [5, 5, 7, 1, 1],
  '5': [7, 4, 7, 1, 7], '6': [7, 4, 7, 5, 7], '7': [7, 1, 1, 2, 2], '8': [7, 5, 7, 5, 7], '9': [7, 5, 7, 1, 7],
  A: [2, 5, 7, 5, 5], B: [6, 5, 6, 5, 6], C: [3, 4, 4, 4, 3], D: [6, 5, 5, 5, 6], E: [7, 4, 6, 4, 7],
  F: [7, 4, 6, 4, 4], G: [3, 4, 5, 5, 3], H: [5, 5, 7, 5, 5], I: [7, 2, 2, 2, 7], J: [1, 1, 1, 5, 2],
  K: [5, 5, 6, 5, 5], L: [4, 4, 4, 4, 7], M: [5, 7, 7, 5, 5], N: [6, 5, 5, 5, 5], O: [2, 5, 5, 5, 2],
  P: [6, 5, 6, 4, 4], Q: [2, 5, 5, 7, 3], R: [6, 5, 6, 5, 5], S: [3, 4, 2, 1, 6], T: [7, 2, 2, 2, 2],
  U: [5, 5, 5, 5, 7], V: [5, 5, 5, 5, 2], W: [5, 5, 7, 7, 5], X: [5, 5, 2, 5, 5], Y: [5, 5, 2, 2, 2],
  Z: [7, 1, 2, 4, 7], ':': [0, 2, 0, 2, 0], '.': [0, 0, 0, 0, 2], '-': [0, 0, 7, 0, 0], '/': [1, 1, 2, 4, 4],
  ' ': [0, 0, 0, 0, 0],
};

function drawGlyphs(x, y, text, idx, vis, dx) {
  for (let n = 0; n < text.length; n++) {
    const glyph = FONT[text[n]] || FONT[' '];
    for (let row = 0; row < 5; row++) {
      for (let col = 0; col < 3; col++) {
        if (!(glyph[row] & (4 >> col))) continue;
        const px = x + n * 4 + col, py = y + row;
        if (vis < 1 && bayer(px, py) >= vis) continue;
        put(px + dx, py + dx, idx);
      }
    }
  }
}

function drawText(x, y, text, idx, vis) {
  drawGlyphs(x, y, text, COL.WATER, vis, 1);   // 1-px drop shadow
  drawGlyphs(x, y, text, idx, vis, 0);
}

const pad = (n, len) => String(n).padStart(len, '0');
function clock(seconds) {
  const s = Math.floor(seconds), h = Math.floor(s / 3600), m = Math.floor(s / 60) % 60;
  return (h ? h + ':' : '') + pad(m, 2) + ':' + pad(s % 60, 2);
}

// Microscope readout, bottom left; dissolves after inactivity
function drawHud(w, now) {
  const Hd = PARAMS.hud;
  const vis = debug.on ? 1 : clamp(1 - (now - input.lastActivity - Hd.visibleMs) / Hd.fadeMs, 0, 1);
  if (vis <= 0) return;
  drawText(Hd.x, Hd.y, 'SEED ' + seedLabel, COL.FOAM, vis);
  drawText(Hd.x, Hd.y + Hd.line, 'T ' + clock(w.tick * TICK_DT), COL.FOAM, vis);
  drawText(Hd.x, Hd.y + Hd.line * 2, 'POP ' + pad(aliveCount(w), 3), rampBase(1) + HIGHLIGHT, vis);
  const speed = PARAMS.time.speeds[speedLevel];
  drawText(Hd.x, Hd.y + Hd.line * 3, 'MAG ' + cam.zoom + 'X' + (speed > 1 ? '  TIME ' + speed + 'X' : ''), COL.FOAM, vis);
}

// All pixel work for one frame. Returns the time spent on the debug overlay, so frame timing can leave it out.
function composeFrame(w, now) {
  const t = w.tick * TICK_DT, ta = ambientT >= 0 ? ambientT : t, P = PARAMS.particles;
  view.bx0 = clamp(Math.round(cam.x * cam.zoom), 0, Math.round(W * cam.zoom) - W);
  view.by0 = clamp(Math.round(cam.y * cam.zoom), 0, Math.round(H * cam.zoom) - H);
  buildDeadline = performance.now() + PARAMS.sprite.buildBudgetMs;
  const moon = PARAMS.timeOfDay.moonLight;
  dayLight = moon + (1 - moon) * w.surfaceLight;
  updateSun(dayPhase(w));
  updateBloom(w);
  updateSea(w, ta);
  updateRays(waterT);
  updateShimmer(waterT);
  updateCaustics(waterT, w.tick);
  updateSwim(w, ta);
  updateGlow(w);
  drawBackground(waterT);
  drawParticles(P.far, 1000, ta, false);
  drawParticles(P.mid, 2000, ta, false);
  drawPlumes(w);
  drawPebbles();
  drawCysts(w);
  updateCrawlers(w);
  drawCrawlers(t);
  drawKrill(w, ta);
  drawThreads(w);
  drawCells(w, t);
  drawFlashes(w);
  drawVisitors(w, ta);
  drawParticles(P.near, 3000, ta, true);
  drawHud(w, now);
  let overlayMs = 0;
  if (debug.on) { const t0 = performance.now(); drawDebug(w); overlayMs = performance.now() - t0; }
  blitTimeOfDay(w);
  return overlayMs;
}

function render(w, now) {
  const overlayMs = composeFrame(w, now);
  view.offCtx.putImageData(view.img, 0, 0);
  view.ctx.drawImage(view.off, view.ox, view.oy, W * view.scale, H * view.scale);
  return overlayMs;
}

// ===== Input =====
// One finger or mouse drag pans, two fingers pinch-zoom, the mouse wheel zooms at the cursor.
const input = { lastActivity: 0, pointers: new Map(), pinch: null };

function toInternal(e) {
  const dpr = window.devicePixelRatio || 1;
  return { x: (e.clientX * dpr - view.ox) / view.scale, y: (e.clientY * dpr - view.oy) / view.scale };
}

function startPinch() {
  const [a, b] = [...input.pointers.values()];
  const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
  input.pinch = {
    d0: Math.max(1, Math.hypot(a.x - b.x, a.y - b.y)), zoom0: cam.zoom,
    wx: cam.x + mx / cam.zoom, wy: cam.y + my / cam.zoom,   // world point held under the fingers
  };
}

function setupInput() {
  const el = view.canvas;
  input.lastActivity = performance.now();
  const wake = () => { input.lastActivity = performance.now(); needsRender = true; };

  el.addEventListener('pointerdown', (e) => {
    wake();
    el.setPointerCapture(e.pointerId);
    input.pointers.set(e.pointerId, toInternal(e));
    if (input.pointers.size === 2) startPinch();
  });
  el.addEventListener('pointermove', (e) => {
    wake();
    const prev = input.pointers.get(e.pointerId);
    if (!prev) return;
    const p = toInternal(e);
    input.pointers.set(e.pointerId, p);
    if (input.pinch && input.pointers.size >= 2) {
      const [a, b] = [...input.pointers.values()];
      const d = Math.max(1, Math.hypot(a.x - b.x, a.y - b.y));
      const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
      cam.level = nearestLevel(input.pinch.zoom0 * d / input.pinch.d0);
      cam.zoom = ZOOMS[cam.level];
      cam.x = input.pinch.wx - mx / cam.zoom;
      cam.y = input.pinch.wy - my / cam.zoom;
      clampCamera();
    } else if (input.pointers.size === 1) {
      panBy(p.x - prev.x, p.y - prev.y);
    }
  });
  const release = (e) => {
    input.pointers.delete(e.pointerId);
    if (input.pointers.size < 2) input.pinch = null;
  };
  el.addEventListener('pointerup', release);
  el.addEventListener('pointercancel', release);

  el.addEventListener('wheel', (e) => {
    e.preventDefault();
    wake();
    const p = toInternal(e);
    zoomAt(cam.level + (e.deltaY < 0 ? 1 : -1) * PARAMS.camera.wheelStep, p.x, p.y);
  }, { passive: false });

  window.addEventListener('keydown', (e) => {
    wake();
    if (e.key === 'd' || e.key === 'D') debug.on = !debug.on;
    else if (e.key === '+' || e.key === '=') zoomAt(cam.level + 1, W / 2, H / 2);
    else if (e.key === '-' || e.key === '_') zoomAt(cam.level - 1, W / 2, H / 2);
    else if (e.key === ']') setSpeed(speedLevel + 1);
    else if (e.key === '[') setSpeed(speedLevel - 1);
  });
  window.addEventListener('resize', () => { resize(); needsRender = true; });
  document.addEventListener('visibilitychange', () => { lastTime = 0; });
}

// ===== Debug =====
const debug = {
  on: false, history: [], nextSample: 0,
  frameMs: new Float64Array(PARAMS.debug.frameSamples), frameIdx: 0, frameCount: 0,
  droppedTicks: 0, checksum: null, sync: null, syncTick: 0,
};

function meanNutrient(w) {
  const nut = w.fields.nut;
  let s = 0;
  for (let i = 0; i < nut.length; i++) s += nut[i];
  return s / nut.length;
}

// Called after every tick so samples and checksums land on exact ticks.
function debugSample(w) {
  const D = PARAMS.debug, minute = 60 * PARAMS.time.tickRate;
  if (w.tick >= debug.nextSample) {
    let depth = 0, n = 0;
    for (const c of w.cells) if (!c.dying) { depth += c.y; n++; }
    debug.history.push({ pop: n, nut: meanNutrient(w), depth: n ? depth / n / H : -1, light: w.surfaceLight, wind: w.wind });
    if (debug.history.length > D.historyLength) debug.history.shift();
    debug.nextSample += D.sampleEvery;
  }
  if (w.tick % minute === 0) debug.checksum = { minute: w.tick / minute, hash: worldChecksum(w) };
}

function recordFrame(ms) {
  debug.frameMs[debug.frameIdx] = ms;
  debug.frameIdx = (debug.frameIdx + 1) % debug.frameMs.length;
  debug.frameCount++;
}

// Mini-maps in the top-right corner: nutrients (green) with cells as dots, light (gold) beside it,
// and the camera's view as a dotted frame.
function drawFieldMaps(w) {
  const D = PARAMS.debug, { cols, rows } = PARAMS.grid, m = D.mapCell, green = rampBase(0), gold = rampBase(1);
  const node = (field, ramp, i, j, ox) => {
    const v = clamp(field[j * cols + i], 0, 1) * 4;
    for (let y = 0; y < m; y++) {
      for (let x = 0; x < m; x++) {
        const px = ox + i * m + x, py = D.mapY + j * m + y;
        let k = v | 0;
        if (bayer(px, py) < v - k) k++;
        put(px, py, ramp + (k > BRIGHT ? BRIGHT : k));
      }
    }
  };
  // Grazers (rose) below the nutrient map, scaled so the floor is dark and 2 is bright
  const rose = rampBase(ROSE), zy = rows * m + 2;
  for (let j = 0; j < rows; j++) {
    for (let i = 0; i < cols; i++) {
      node(w.fields.nut, green, i, j, D.mapX);
      const v = clamp(w.fields.graz[j * cols + i] / 2, 0, 1) * 4;
      for (let y = 0; y < m; y++) {
        for (let x = 0; x < m; x++) {
          const px = D.mapX + i * m + x, py = D.mapY + zy + j * m + y;
          let k = v | 0;
          if (bayer(px, py) < v - k) k++;
          put(px, py, rose + (k > BRIGHT ? BRIGHT : k));
        }
      }
    }
    node(w.fields.light, gold, 0, j, D.mapX + cols * m + 1);
  }
  for (const p of w.pulses) put(D.mapX + Math.floor(p.x / GRID_W * m), D.mapY + Math.floor(p.y / GRID_H * m), COL.GLOW);
  for (const c of w.cells) {
    if (!c.dying) put(D.mapX + Math.floor(c.x / GRID_W * m), D.mapY + Math.floor(c.y / GRID_H * m), COL.FOAM);
  }
  if (cam.zoom > 1) {
    const x0 = D.mapX + Math.floor(cam.x / GRID_W * m), y0 = D.mapY + Math.floor(cam.y / GRID_H * m);
    const x1 = x0 + Math.round(W / cam.zoom / GRID_W * m), y1 = y0 + Math.round(H / cam.zoom / GRID_H * m);
    for (let x = x0; x <= x1; x += 2) { put(x, y0, COL.GLOW); put(x, y1, COL.GLOW); }
    for (let y = y0; y <= y1; y += 2) { put(x0, y, COL.GLOW); put(x1, y, COL.GLOW); }
  }
}

function drawDebug(w) {
  const D = PARAMS.debug, pop = aliveCount(w);
  if (!debug.sync || w.tick - debug.syncTick >= D.syncEvery) { debug.sync = syncStats(w); debug.syncTick = w.tick; }
  const sy = debug.sync;
  const n = Math.min(debug.frameCount, debug.frameMs.length);
  const ms = Array.from(debug.frameMs.subarray(0, n)).sort((p, q) => p - q);
  const avg = n ? ms.reduce((s, v) => s + v, 0) / n : 0, p95 = n ? ms[Math.floor(n * 0.95)] : 0;
  const ck = debug.checksum ? pad(debug.checksum.minute, 2) + ' ' + debug.checksum.hash.toString(16).toUpperCase().padStart(8, '0') : '-';
  const lines = [
    'POP ' + pop + '  CYST ' + w.cysts.length + '  NUT ' + meanNutrient(w).toFixed(2),
    'SYNC ' + sy.local.toFixed(2) + ' LK ' + sy.locked.toFixed(2) + ' G ' + sy.global.toFixed(2),
    'CHAIN ' + sy.chains + ' MAX ' + sy.longest + ' IN ' + Math.round(sy.chained * 100) + '%',
    'VOX -  ONS -',
    'MS ' + avg.toFixed(1) + '  P95 ' + p95.toFixed(1),
    'DROP ' + debug.droppedTicks,
    'CK ' + ck,
    'DAY ' + dayPhase(w).toFixed(2) + ' SUN ' + w.surfaceLight.toFixed(2) + ' WIND ' + w.wind.toFixed(2) + ' PL ' + w.pulses.length,
    'DIED S ' + w.deaths.starved + ' O ' + w.deaths.old + ' G ' + w.deaths.grazed + ' F ' + w.deaths.sardines + ' SP ' + w.deaths.salps,
    'VISIT ' + (w.visitors.map((v) => v.kind.slice(0, 3).toUpperCase()).join(' ') || '-'),
  ];
  for (let i = 0; i < lines.length; i++) drawText(3, 6 + i * 7, lines[i], COL.FOAM, 1);
  drawFieldMaps(w);

  // Population (foam), mean nutrient (gold), mean cell depth (rose, down = deeper), sunlight (slate), wind (emerald)
  // over the last ~10 minutes; dotted slate line = cap
  const gy = D.graphY, gh = D.graphH, ib = view.ibuf;
  for (let y = gy; y < gy + gh; y++) for (let x = 0; x < W; x++) ib[y * W + x] = COL.WATER;
  for (let x = 0; x < W; x += 2) put(x, gy, COL.SLATE);
  const hist = debug.history, x0 = W - hist.length;
  for (let i = 0; i < hist.length; i++) {
    put(x0 + i, gy + gh - 1 - Math.round(hist[i].light * (gh - 1)), COL.SLATE);
    put(x0 + i, gy + gh - 1 - Math.round(hist[i].wind * (gh - 1)), rampBase(EMERALD) + BASE);
    if (hist[i].depth >= 0) put(x0 + i, gy + Math.round(hist[i].depth * (gh - 1)), rampBase(ROSE) + HIGHLIGHT);
    put(x0 + i, gy + gh - 1 - Math.round(hist[i].pop / PARAMS.division.maxCells * (gh - 1)), COL.FOAM);
    put(x0 + i, gy + gh - 1 - Math.round(clamp(hist[i].nut, 0, 1) * (gh - 1)), rampBase(1) + HIGHLIGHT);
  }
}

// ===== Loop =====
let world = null, seedLabel = '', lastTime = 0, acc = 0, needsRender = true, speedLevel = 0;

// Time-lapse runs more of the same fixed ticks per second; the world stays deterministic.
function setSpeed(level) {
  speedLevel = clamp(level, 0, PARAMS.time.speeds.length - 1);
  needsRender = true;
}

function frame(now) {
  requestAnimationFrame(frame);
  if (!lastTime) lastTime = now;
  const speed = PARAMS.time.speeds[speedLevel];
  const real = Math.min((now - lastTime) / 1000, 1);
  acc += real * speed;
  lastTime = now;
  if (ambientT < 0) ambientT = world.tick * TICK_DT;
  ambientT += real * Math.max(PARAMS.ambient.rate, speed);
  const t0 = performance.now();
  let ticks = 0;
  while (acc >= TICK_DT && ticks < PARAMS.time.maxTicksPerFrame * speed) {
    stepWorld(world);
    debugSample(world);
    acc -= TICK_DT;
    ticks++;
  }
  if (acc >= TICK_DT) { debug.droppedTicks += Math.floor(acc / TICK_DT); acc = 0; }
  // Everything visible is tied to simulation ticks or the camera, so other frames would be identical.
  if (ticks > 0 || needsRender) {
    const overlayMs = render(world, now);
    needsRender = false;
    recordFrame(performance.now() - t0 - overlayMs);
  }
}

// ===== Init =====
function hashString(s) {
  let h = 0x811c9dc5;
  for (let i = 0; i < s.length; i++) h = Math.imul(h ^ s.charCodeAt(i), 16777619);
  return h >>> 0;
}

// ?seed= (number or word), ?debug, ?stress (start at the cell cap), ?ff=seconds (fast-forward),
// ?zoom=1..4 with ?at=x,y (world point to centre on), ?speed=1|2|4|8 (time-lapse), ?day=5|10|30 (minutes)
function readOptions() {
  const q = new URLSearchParams(location.search);
  let label = (q.get('seed') || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 12), seed;
  if (!label) {
    seed = crypto.getRandomValues(new Uint32Array(1))[0] % 1000000;   // the one non-seeded draw: picking the seed
    label = String(seed);
    try { q.set('seed', label); history.replaceState(null, '', location.pathname + '?' + q.toString()); } catch (e) { /* file:// may refuse */ }
  } else {
    seed = /^\d+$/.test(label) ? Number(label) >>> 0 : hashString(label);
  }
  const at = (q.get('at') || '').split(',').map(Number);
  return {
    seed, label, debug: q.has('debug'), stress: q.has('stress'), ff: Math.max(0, Number(q.get('ff')) || 0),
    zoom: Number(q.get('zoom')) || 1, atX: at.length === 2 ? at[0] : W / 2, atY: at.length === 2 ? at[1] : H / 2,
    speed: Number(q.get('speed')) || 1,
    dayLength: PARAMS.diel.dayMinutes.includes(Number(q.get('day'))) ? Number(q.get('day')) * 60 : PARAMS.diel.dayLength,
  };
}

function init() {
  const opts = readOptions();
  seedLabel = opts.label;
  world = createWorld(opts.seed, opts.stress ? PARAMS.division.maxCells : 0, opts.dayLength);
  debug.on = opts.debug;
  const ffTicks = Math.floor(opts.ff * PARAMS.time.tickRate);
  for (let i = 0; i < ffTicks; i++) { stepWorld(world); debugSample(world); }
  initRender(document.getElementById('screen'));
  cam.level = nearestLevel(opts.zoom);
  cam.zoom = ZOOMS[cam.level];
  cam.x = opts.atX - W / (2 * cam.zoom);
  cam.y = opts.atY - H / (2 * cam.zoom);
  clampCamera();
  setSpeed(Math.max(0, PARAMS.time.speeds.indexOf(opts.speed)));
  setupInput();
  requestAnimationFrame(frame);
}

init();
</script>
</body>
</html>
