  on: false, history: [], nextSample: 0,
  frameMs: new Float64Array(PARAMS.debug.frameSamples), frameIdx: 0, frameCount: 0,
  droppedTicks: 0, checksum: null,
};

function meanNutrient(w) {
  const nut = w.fields.nut;
  let s = 0;
  for (let i = 0; i < nut.length; i++) s += nut[i];
  return s / nut.length;
}

// Called after every tick so samples and checksums land on exact ticks.
function debugSample(w) {
  const D = PARAMS.debug, minute = 60 * PARAMS.time.tickRate;
  if (w.tick >= debug.nextSample) {
    let depth = 0, n = 0;
    for (const c of w.cells) if (!c.dying) { depth += c.y; n++; }
    debug.history.push({ pop: n, nut: meanNutrient(w), depth: n ? depth / n / H : -1, light: w.surfaceLight });
    if (debug.history.length > D.historyLength) debug.history.shift();
    debug.nextSample += D.sampleEvery;
  }
  if (w.tick % minute === 0) debug.checksum = { minute: w.tick / minute, hash: worldChecksum(w) };
}

function recordFrame(ms) {
  debug.frameMs[debug.frameIdx] = ms;
  debug.frameIdx = (debug.frameIdx + 1) % debug.frameMs.length;
  debug.frameCount++;
}

// Mini-maps in the top-right corner: nutrients (green) with cells as dots, light (gold) beside it,
// and the camera's view as a dotted frame.
function drawFieldMaps(w) {
  const D = PARAMS.debug, { cols, rows } = PARAMS.grid, m = D.mapCell, green = rampBase(0), gold = rampBase(1);
  const node = (field, ramp, i, j, ox) => {
    const v = clamp(field[j * cols + i], 0, 1) * 4;
    for (let y = 0; y < m; y++) {
      for (let x = 0; x < m; x++) {
        const px = ox + i * m + x, py = D.mapY + j * m + y;
        let k = v | 0;
        if (bayer(px, py) < v - k) k++;
        put(px, py, ramp + (k > BRIGHT ? BRIGHT : k));
      }
    }
  };
  // Grazers (rose) below the nutrient map, scaled so the floor is dark and 2 is bright
  const rose = rampBase(ROSE), zy = rows * m + 2;
  for (let j = 0; j < rows; j++) {
    for (let i = 0; i < cols; i++) {
      node(w.fields.nut, green, i, j, D.mapX);
      const v = clamp(w.fields.graz[j * cols + i] / 2, 0, 1) * 4;
      for (let y = 0; y < m; y++) {
        for (let x = 0; x < m; x++) {
          const px = D.mapX + i * m + x, py = D.mapY + zy + j * m + y;
          let k = v | 0;
          if (bayer(px, py) < v - k) k++;
          put(px, py, rose + (k > BRIGHT ? BRIGHT : k));
        }
      }
    }
    node(w.fields.light, gold, 0, j, D.mapX + cols * m + 1);
  }
  for (const p of w.pulses) put(D.mapX + Math.floor(p.x / GRID_W * m), D.mapY + Math.floor(p.y / GRID_H * m), COL.GLOW);
  for (const c of w.cells) {
    if (!c.dying) put(D.mapX + Math.floor(c.x / GRID_W * m), D.mapY + Math.floor(c.y / GRID_H * m), COL.FOAM);
  }
  if (cam.zoom > 1) {
    const x0 = D.mapX + Math.floor(cam.x / GRID_W * m), y0 = D.mapY + Math.floor(cam.y / GRID_H * m);
    const x1 = x0 + Math.round(W / cam.zoom / GRID_W * m), y1 = y0 + Math.round(H / cam.zoom / GRID_H * m);
    for (let x = x0; x <= x1; x += 2) { put(x, y0, COL.GLOW); put(x, y1, COL.GLOW); }
    for (let y = y0; y <= y1; y += 2) { put(x0, y, COL.GLOW); put(x1, y, COL.GLOW); }
  }
}

function drawDebug(w) {
  const D = PARAMS.debug, pop = aliveCount(w);
  let sx = 0, sy = 0;
  for (const c of w.cells) if (!c.dying) { sx += Math.cos(c.theta); sy += Math.sin(c.theta); }
  const sync = pop ? Math.sqrt(sx * sx + sy * sy) / pop : 0;
  const n = Math.min(debug.frameCount, debug.frameMs.length);
  const ms = Array.from(debug.frameMs.subarray(0, n)).sort((p, q) => p - q);
  const avg = n ? ms.reduce((s, v) => s + v, 0) / n : 0, p95 = n ? ms[Math.floor(n * 0.95)] : 0;
  const ck = debug.checksum ? pad(debug.checksum.minute, 2) + ' ' + debug.checksum.hash.toString(16).toUpperCase().padStart(8, '0') : '-';
  const lines = [
    'POP ' + pop + '  CYST ' + w.cysts.length,
    'SYNC ' + sync.toFixed(2) + '  NUT ' + meanNutrient(w).toFixed(2),
    'VOX -  ONS -',
    'MS ' + avg.toFixed(1) + '  P95 ' + p95.toFixed(1),
    'DROP ' + debug.droppedTicks,
    'CK ' + ck,
    'DAY ' + dayPhase(w).toFixed(2) + '  SUN ' + w.surfaceLight.toFixed(2) + '  PLUME ' + w.pulses.length,
    'DIED S ' + w.deaths.starved + ' O ' + w.deaths.old + ' G ' + w.deaths.grazed,
  ];
  for (let i = 0; i < lines.length; i++) drawText(3, 6 + i * 7, lines[i], COL.FOAM, 1);
  drawFieldMaps(w);

  // Population (foam), mean nutrient (gold), mean cell depth (rose, down = deeper) and sunlight (slate)
  // over the last ~10 minutes; dotted slate line = cap
  const gy = D.graphY, gh = D.graphH, ib = view.ibuf;
  for (let y = gy; y < gy + gh; y++) for (let x = 0; x < W; x++) ib[y * W + x] = COL.WATER;
  for (let x = 0; x < W; x += 2) put(x, gy, COL.SLATE);
  const hist = debug.history, x0 = W - hist.length;
  for (let i = 0; i < hist.length; i++) {
    put(x0 + i, gy + gh - 1 - Math.round(hist[i].light * (gh - 1)), COL.SLATE);
    if (hist[i].depth >= 0) put(x0 + i, gy + Math.round(hist[i].depth * (gh - 1)), rampBase(ROSE) + HIGHLIGHT);
    put(x0 + i, gy + gh - 1 - Math.round(hist[i].pop / PARAMS.division.maxCells * (gh - 1)), COL.FOAM);
    put(x0 + i, gy + gh - 1 - Math.round(clamp(hist[i].nut, 0, 1) * (gh - 1)), rampBase(1) + HIGHLIGHT);
  }
}

// ===== Loop =====
let world = null, seedLabel = '', lastTime = 0, acc = 0, needsRender = true, speedLevel = 0;

// Time-lapse runs more of the same fixed ticks per second; the world stays deterministic.
function setSpeed(level) {
  speedLevel = clamp(level, 0, PARAMS.time.speeds.length - 1);
  needsRender = true;
}

function frame(now) {
  requestAnimationFrame(frame);
  if (!lastTime) lastTime = now;
  const speed = PARAMS.time.speeds[speedLevel];
  const real = Math.min((now - lastTime) / 1000, 1);
  acc += real * speed;
  lastTime = now;
  if (ambientT < 0) ambientT = world.tick * TICK_DT;
  ambientT += real * Math.max(PARAMS.ambient.rate, speed);
  const t0 = performance.now();
  let ticks = 0;
  while (acc >= TICK_DT && ticks < PARAMS.time.maxTicksPerFrame * speed) {
    stepWorld(world);
    debugSample(world);
    acc -= TICK_DT;
    ticks++;
  }
  if (acc >= TICK_DT) { debug.droppedTicks += Math.floor(acc / TICK_DT); acc = 0; }
  // Everything visible is tied to simulation ticks or the camera, so other frames would be identical.
  if (ticks > 0 || needsRender) {
    const overlayMs = render(world, now);
    needsRender = false;
    recordFrame(performance.now() - t0 - overlayMs);
  }
}

// ===== Init =====
function hashString(s) {
  let h = 0x811c9dc5;
  for (let i = 0; i < s.length; i++) h = Math.imul(h ^ s.charCodeAt(i), 16777619);
  return h >>> 0;
}

// ?seed= (number or word), ?debug, ?stress (start at the cell cap), ?ff=seconds (fast-forward),
// ?zoom=1..4 with ?at=x,y (world point to centre on), ?speed=1|2|4|8 (time-lapse), ?day=5|10|30 (minutes)
function readOptions() {
  const q = new URLSearchParams(location.search);
  let label = (q.get('seed') || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 12), seed;
  if (!label) {
    seed = crypto.getRandomValues(new Uint32Array(1))[0] % 1000000;   // the one non-seeded draw: picking the seed
    label = String(seed);
    try { q.set('seed', label); history.replaceState(null, '', location.pathname + '?' + q.toString()); } catch (e) { /* file:// may refuse */ }
  } else {
    seed = /^\d+$/.test(label) ? Number(label) >>> 0 : hashString(label);
  }
  const at = (q.get('at') || '').split(',').map(Number);
  return {
    seed, label, debug: q.has('debug'), stress: q.has('stress'), ff: Math.max(0, Number(q.get('ff')) || 0),
    zoom: Number(q.get('zoom')) || 1, atX: at.length === 2 ? at[0] : W / 2, atY: at.length === 2 ? at[1] : H / 2,
    speed: Number(q.get('speed')) || 1,
    dayLength: PARAMS.diel.dayMinutes.includes(Number(q.get('day'))) ? Number(q.get('day')) * 60 : PARAMS.diel.dayLength,
  };
}

function init() {
  const opts = readOptions();
  seedLabel = opts.label;
  world = createWorld(opts.seed, opts.stress ? PARAMS.division.maxCells : 0, opts.dayLength);
  debug.on = opts.debug;
  const ffTicks = Math.floor(opts.ff * PARAMS.time.tickRate);
  for (let i = 0; i < ffTicks; i++) { stepWorld(world); debugSample(world); }
  initRender(document.getElementById('screen'));
  cam.level = nearestLevel(opts.zoom);
  cam.zoom = ZOOMS[cam.level];
  cam.x = opts.atX - W / (2 * cam.zoom);
  cam.y = opts.atY - H / (2 * cam.zoom);
  clampCamera();
  setSpeed(Math.max(0, PARAMS.time.speeds.indexOf(opts.speed)));
  setupInput();
  requestAnimationFrame(frame);
}

init();
</script>
