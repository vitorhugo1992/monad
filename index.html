    const m = w.music, semis = m.scale[ambRng.int(m.scale.length)], up = ambRng.next() < 0.3 ? 12 : 0;
    const x = seen > 0 ? seenX / seen / W * 2 - 1 : 0;
    grain(C, scaleNote(m, C.octave, semis + up), Math.max(visitorNext[key], t) + PARAMS.audio.lookahead, x + (ambRng.next() - 0.5) * 0.6);
    visitorNext[key] = Math.max(visitorNext[key], t) + (-Math.log(1 - ambRng.next() * 0.999)) / rate;
  }
}

function grain(C, midi, t0, panX) {
  const ctx = audio.ctx, end = t0 + C.attack + C.release;
  const o = ctx.createOscillator(), env = ctx.createGain(), dry = ctx.createGain(), wet = ctx.createGain();
  const pan = ctx.createStereoPanner ? ctx.createStereoPanner() : null;
  o.frequency.value = 440 * Math.pow(2, (midi - 69) / 12);
  env.gain.setValueAtTime(0.0001, t0);
  env.gain.linearRampToValueAtTime(C.gain, t0 + C.attack);
  env.gain.exponentialRampToValueAtTime(0.0001, end);
  dry.gain.value = 1 - C.wet; wet.gain.value = C.wet;
  o.connect(env);
  let out = env;
  if (pan) { pan.pan.value = clamp(panX, -1, 1) * C.pan; env.connect(pan); out = pan; }
  out.connect(dry); out.connect(wet);
  dry.connect(audio.bus); wet.connect(audio.wet);
  o.start(t0); o.stop(end + 0.02);
  o.onended = () => { for (const node of [o, env, pan, dry, wet]) if (node) node.disconnect(); };
}

// Visitors' voices: the school's chord while it is on screen, the sunfish's call now and then
function audioVisitors(w) {
  if (!audio.started) return;
  const V = PARAMS.audio.visitorVoices, t = audio.ctx.currentTime, onScreen = (v, r) => v.x > -r && v.x < W + r;
  const school = w.visitors.find((v) => v.kind === 'sardines' && onScreen(v, 20));
  if (school && t >= visitorNext.school) {
    const S = V.school, m = w.music;
    schoolChord([scaleNote(m, S.octave, 0), scaleNote(m, S.octave, 7), scaleNote(m, S.octave, 14)], school.x / W * 2 - 1);
    voiceRing(LIGHTBLUE, school.x, school.y, PARAMS.visitors.sardines.ry);
    visitorNext.school = t + S.every;
  }
  const salp = w.visitors.find((v) => v.kind === 'salps' && onScreen(v, 30));
  if (salp) {   // one barrel's note per step, along the chain, then a rest; a bitten-off barrel is a hole in the tune
    const Sp = V.salp, n = salp.alive.length;
    if (salp.id !== visitorNext.salpId) { visitorNext.salpId = salp.id; visitorNext.salpStep = 0; visitorNext.salp = t; }
    while (visitorNext.salp <= t + 0.05) {
      const k = visitorNext.salpStep % (n + Sp.rest), at = Math.max(visitorNext.salp, t) + PARAMS.audio.lookahead;
      if (k < n && salp.alive[k]) { const q = salpBarrel(salp, k); salpNote(salpMelody(w.music, salp.id, k), at, q.x / W * 2 - 1); voiceRing(EMERALD, q.x, q.y, 3); }
      visitorNext.salpStep++;
      visitorNext.salp = Math.max(visitorNext.salp, t) + Sp.step;
    }
  }
  for (const v of w.visitors) {   // a jelly's bell pulse strums the harp (one strum at a time per kind)
    if ((v.kind !== 'jellies' && v.kind !== 'combs') || !onScreen(v, 30)) continue;
    const Jv = V[v.kind];
    v.members.forEach((m, i) => {
      if (!m.alive) return;
      const n = Math.floor(v.age / m.period + m.ph), key = v.id * 64 + i, last = jellyBeats.get(key);
      jellyBeats.set(key, n);
      if (last === undefined || n <= last || t < visitorNext[v.kind] || ambRng.next() > Jv.chance) return;   // only now and then (author: not on every pulse)
      const p = jellyAt(v, m), at = t + PARAMS.audio.lookahead, steps = v.kind === 'jellies' ? Jv.steps : Jv.steps.slice(0, 2 + (i % 2));
      const r = ambRng.next(), oct = Jv.octave - (r < Jv.drop[0] ? 0 : r < Jv.drop[0] + Jv.drop[1] ? 1 : 2);   // sometimes an octave or two lower
      steps.forEach((semis, k) => harpNote(scaleNote(w.music, oct, semis), at + k * Jv.spacing * (0.85 + 0.3 * ambRng.next()), Jv, p.x / W * 2 - 1, k === steps.length - 1));
      voiceRing(v.kind === 'jellies' ? (m.tint ? VIOLET : ROSE) : -1, p.x, p.y, PARAMS.visitors[v.kind].r * m.size);
      visitorNext[v.kind] = t + Jv.gap + (Jv.gapMax - Jv.gap) * ambRng.next();   // a random rest before the next
    });
  }
  if (jellyBeats.size > 512) jellyBeats.clear();
  const fish = w.visitors.find((v) => v.kind === 'sunfish' && onScreen(v, 10));
  if (fish && t >= visitorNext.sunfish) {
    const F = V.sunfish, m = w.music;
    if (visitorNext.sunfish > 0) {
      sunfishCall(scaleNote(m, F.octave + (fish.leaving ? 1 : 0), 0), scaleNote(m, F.octave + (fish.leaving ? 1 : 0), 7), fish.leaving ? F.baskGain : 1, fish.x / W * 2 - 1);
      voiceRing(GOLD, fish.x, fish.y, PARAMS.visitors.sunfish.r);
    }
    visitorNext.sunfish = t + F.everyMin + (F.everyMax - F.everyMin) * ambRng.next();
  } else if (!fish) visitorNext.sunfish = 0;   // a sunfish arriving calls soon after it appears, not at once
}

// One long swell of the school's chord: soft pad pairs, slightly detuned, under a gentle lowpass
function schoolChord(midis, panX) {
  const S = PARAMS.audio.visitorVoices.school, ctx = audio.ctx, t0 = ctx.currentTime + PARAMS.audio.lookahead, end = t0 + S.dur;
  const env = ctx.createGain(), filt = ctx.createBiquadFilter(), dry = ctx.createGain(), wet = ctx.createGain();
  const pan = ctx.createStereoPanner ? ctx.createStereoPanner() : null;
  filt.type = 'lowpass'; filt.frequency.value = S.cut; filt.Q.value = 0.4;
  env.gain.setValueAtTime(0.0001, t0);
  env.gain.linearRampToValueAtTime(S.gain, t0 + S.attack);
  env.gain.setValueAtTime(S.gain, t0 + S.dur * 0.45);
  env.gain.exponentialRampToValueAtTime(0.0001, end);
  dry.gain.value = 1 - S.wet; wet.gain.value = S.wet;
  const oscs = [];
  for (const midi of midis) {
    for (const cents of [-S.detune, S.detune]) {
      const o = ctx.createOscillator();
      o.setPeriodicWave(audio.waves[0]);
      o.frequency.value = 440 * Math.pow(2, (midi - 69) / 12);
      o.detune.value = cents;
      o.connect(filt);
      oscs.push(o);
    }
  }
  filt.connect(env);
  let out = env;
  if (pan) { pan.pan.value = clamp(panX, -1, 1) * S.pan; env.connect(pan); out = pan; }
  out.connect(dry); out.connect(wet);
  dry.connect(audio.bus); wet.connect(audio.wet);
  // the crowd: the same swell a moment later from other fish, softer, from either side
  const crowd = [], C = S.crowd;
  C.taps.forEach((tap, k) => {
    const d = ctx.createDelay(1), g = ctx.createGain(), p = ctx.createStereoPanner ? ctx.createStereoPanner() : null;
    d.delayTime.value = tap + C.jitter * ambRng.next();
    g.gain.value = Math.pow(C.fade, k + 1);
    env.connect(d); d.connect(g);
    let o = g;
    if (p) { p.pan.value = clamp(panX * S.pan + (k % 2 ? 1 : -1) * C.spread * (0.5 + 0.5 * ambRng.next()), -1, 1); g.connect(p); o = p; }
    o.connect(dry); o.connect(wet);
    crowd.push(d, g, p);
  });
  for (const o of oscs) { o.start(t0); o.stop(end + 0.05); }
  oscs[0].onended = () => setTimeout(() => { for (const node of [...oscs, filt, env, pan, dry, wet, ...crowd]) if (node) node.disconnect(); }, 400);   // after the echoes ring out
}

// The salp's tune: a walk of scale steps along its barrels, fixed by the chain (a stateless hash, so the music never
// touches the world)
function salpMelody(m, id, k) {
  const Sp = PARAMS.audio.visitorVoices.salp, len = m.scale.length;
  let deg = 0;
  for (let b = 1; b <= k; b++) deg = clamp(deg + Sp.steps[Math.floor(hash01(id * 977 + b) * Sp.steps.length)], Sp.low, Sp.high);
  const oct = Math.floor(deg / len), d = deg - oct * len;
  return scaleNote(m, Sp.octave + oct, m.scale[d]);
}

// One soft, rounded note of the salp's tune: a sine with a faint octave twin under a gentle lowpass, long and legato
function salpNote(midi, t0, panX) {
  const Sp = PARAMS.audio.visitorVoices.salp, ctx = audio.ctx, end = t0 + Sp.attack + Sp.release, hz = 440 * Math.pow(2, (midi - 69) / 12);
  const o = ctx.createOscillator(), o2 = ctx.createOscillator(), g2 = ctx.createGain(), filt = ctx.createBiquadFilter();
  const env = ctx.createGain(), dry = ctx.createGain(), wet = ctx.createGain(), pan = ctx.createStereoPanner ? ctx.createStereoPanner() : null;
  o.frequency.value = hz;
  o2.frequency.value = hz * Sp.twin;
  g2.gain.value = Sp.twinGain;
  filt.type = 'lowpass'; filt.frequency.value = Sp.cut; filt.Q.value = 0.5;
  env.gain.setValueAtTime(0.0001, t0);
  env.gain.linearRampToValueAtTime(Sp.gain, t0 + Sp.attack);
  env.gain.exponentialRampToValueAtTime(0.0001, end);
  dry.gain.value = 1 - Sp.wet; wet.gain.value = Sp.wet;
  o.connect(filt); o2.connect(g2); g2.connect(filt); filt.connect(env);
  let out = env;
  if (pan) { pan.pan.value = clamp(panX, -1, 1) * Sp.pan; env.connect(pan); out = pan; }
  out.connect(dry); out.connect(wet);
  dry.connect(audio.bus); wet.connect(audio.wet);
  for (const x of [o, o2]) { x.start(t0); x.stop(end + 0.05); }
  o.onended = () => { for (const node of [o, o2, g2, filt, env, pan, dry, wet]) if (node) node.disconnect(); };
}

// One harp string: a plucked triangle under a lowpass closing as it rings; the top string of a strum adds a shimmer an
// octave up that swells slowly into the reverb only (the angelic tail). Kept light: a strum is several strings at once
function harpNote(midi, t0, J, panX, shimmer) {
  const ctx = audio.ctx, hz = 440 * Math.pow(2, (midi - 69) / 12), end = t0 + J.decay, tail = t0 + J.shimmerDecay;
  const o = ctx.createOscillator(), filt = ctx.createBiquadFilter();
  const env = ctx.createGain(), dry = ctx.createGain(), wet = ctx.createGain(), pan = ctx.createStereoPanner ? ctx.createStereoPanner() : null;
  o.type = 'triangle'; o.frequency.value = hz;
  filt.type = 'lowpass'; filt.Q.value = 0.6;
  filt.frequency.setValueAtTime(J.cut, t0);
  filt.frequency.exponentialRampToValueAtTime(J.cut * 0.3, end);
  env.gain.setValueAtTime(0.0001, t0);
  env.gain.linearRampToValueAtTime(J.gain, t0 + 0.008);   // a soft pluck, no click
  env.gain.exponentialRampToValueAtTime(0.0001, end);
  dry.gain.value = 1 - J.wet; wet.gain.value = J.wet;
  o.connect(filt); filt.connect(env);
  let out = env;
  if (pan) { pan.pan.value = clamp(panX, -1, 1) * J.pan; env.connect(pan); out = pan; }
  out.connect(dry); out.connect(wet);
  dry.connect(audio.bus); wet.connect(audio.wet);
  o.start(t0); o.stop(end + 0.05);
  o.onended = () => { for (const node of [o, filt, env, pan, dry, wet]) if (node) node.disconnect(); };
  if (!shimmer) return;
  const sh = ctx.createOscillator(), shEnv = ctx.createGain();   // the shimmer lives in the reverb
  sh.frequency.value = hz * 2;
  shEnv.gain.setValueAtTime(0.0001, t0);
  shEnv.gain.linearRampToValueAtTime(J.gain * J.shimmer, t0 + J.shimmerDecay * 0.25);
  shEnv.gain.exponentialRampToValueAtTime(0.0001, tail);
  sh.connect(shEnv); shEnv.connect(audio.wet);
  sh.start(t0); sh.stop(tail + 0.05);
  sh.onended = () => { sh.disconnect(); shEnv.disconnect(); };
}

// The sunfish's call: a warm low tone (a filtered saw over a sine) that glides up a fifth
function sunfishCall(fromMidi, toMidi, level, panX) {
  const F = PARAMS.audio.visitorVoices.sunfish, ctx = audio.ctx, t0 = ctx.currentTime + PARAMS.audio.lookahead, end = t0 + F.dur;
  const f1 = 440 * Math.pow(2, (fromMidi - 69) / 12), f2 = 440 * Math.pow(2, (toMidi - 69) / 12);
  const body = ctx.createOscillator(), sub = ctx.createOscillator(), subG = ctx.createGain();
  body.type = 'sawtooth'; body.frequency.value = f1;
  sub.frequency.value = f1;
  for (const o of [body, sub]) {
    o.frequency.setValueAtTime(f1, t0 + F.glideAt);
    o.frequency.exponentialRampToValueAtTime(f2, t0 + F.glideAt + F.glide);
  }
  subG.gain.value = F.sub;
  const filt = ctx.createBiquadFilter(), env = ctx.createGain(), dry = ctx.createGain(), wet = ctx.createGain();
  const pan = ctx.createStereoPanner ? ctx.createStereoPanner() : null;
  filt.type = 'lowpass'; filt.frequency.value = F.cut; filt.Q.value = 0.9;
  env.gain.setValueAtTime(0.0001, t0);
  env.gain.linearRampToValueAtTime(F.gain * level, t0 + F.attack);
  env.gain.setValueAtTime(F.gain * level, t0 + F.glideAt + F.glide);
  env.gain.exponentialRampToValueAtTime(0.0001, end);
  dry.gain.value = 1 - F.wet; wet.gain.value = F.wet;
  body.connect(filt); sub.connect(subG); subG.connect(filt); filt.connect(env);
  let out = env;
  if (pan) { pan.pan.value = clamp(panX, -1, 1) * F.pan; env.connect(pan); out = pan; }
  out.connect(dry); out.connect(wet);
  dry.connect(audio.bus); wet.connect(audio.wet);
  for (const o of [body, sub]) { o.start(t0); o.stop(end + 0.05); }
  body.onended = () => { for (const node of [body, sub, subG, filt, env, pan, dry, wet]) if (node) node.disconnect(); };
}

// The hand bends the master filter: b < 0 closes the lowpass, b > 0 lifts the high shelf; secs to get there
function setBend(b, secs) {
  if (!audio.started) return;
  const Bd = PARAMS.audio.bend, t = audio.ctx.currentTime;
  const to = (param, v) => { param.setValueAtTime(param.value, t); param.linearRampToValueAtTime(v, t + secs); };
  to(audio.bendLP.frequency, Bd.open * Math.pow(2, Math.min(0, b) * Bd.closeOctaves));
  to(audio.bendShelf.gain, Math.max(0, b) * Bd.openDb);
}

// Sideways: the filter rings at a peak (reso 0..1) that follows the finger across the water (x 0..1: left low, right high)
function setPeak(reso, x, secs) {
  if (!audio.started) return;
  const Bd = PARAMS.audio.bend, t = audio.ctx.currentTime;
  const to = (param, v) => { param.setValueAtTime(param.value, t); param.linearRampToValueAtTime(v, t + secs); };
  to(audio.bendPeak.frequency, Bd.peakLo * Math.pow(Bd.peakHi / Bd.peakLo, clamp(x, 0, 1)));
  to(audio.bendPeak.gain, reso * Bd.peakDb);
}

// A cell plucked by the finger sounds its own note at once, outside the budget (the caller caps the rate)
let pluckId = 1;
function pluck(w, c) {
  const m = w.music, sh = voiceShape(c, false, true), midi = notePitch(m, c, 0);
  const n = { id: 0x40000000 + pluckId++, phrase: 0, c, midi, pc: midi % 12, x: c.x, y: c.y, timbre: c.g.timbre,
              attack: sh.attack, release: sh.release, soft: sh.soft, dino: sh.dino, glass: sh.glass, big: sh.big, string: sh.string, form: sh.form,
              last: false, startled: false, muffle: 0 };
  c.songAt = performance.now() + PARAMS.audio.lookahead * 1000; c.songAtk = n.attack; c.songRel = n.release; c.songLast = false; c.songDrone = false;
  c.glowTick = w.tick;
  if (audio.started && !audio.muted && audio.ctx.state === 'running') playNote(n);
}

// The music button: the cells' notes, drones and plucks fade out or in; ambience and bubbles go on
function setMuted(muted) {
  audio.muted = muted;
  needsRender = true;
  if (!audio.ctx) return;
  const t = audio.ctx.currentTime;
  for (const g of [audio.bus.gain, audio.wet.gain]) {
    g.setValueAtTime(g.value, t);
    g.linearRampToValueAtTime(muted ? 0.0001 : 1, t + PARAMS.audio.muteRamp);
  }
}

// ===== Render =====
// Every layer writes palette indices into one buffer; it is converted to colour once per frame.
// Light (shafts, caustics, flashes) is applied with LIGHT_UP, so every pixel stays on the palette.
const R = PARAMS.render;
const ZOOMS = PARAMS.camera.levels;
const RAY_DEPTH = H * R.rayDepth, SHIMMER_DEPTH = H * R.shimmerDepth, CAUSTIC_H = Math.ceil(H * R.causticDepth);
const FLOOR_TOP = H - PARAMS.world.floor;
const FLOOR_MIN = FLOOR_TOP - PARAMS.floor.rippleA - PARAMS.floor.rippleB;
const SURFACE_MAX = PARAMS.surface.base + (PARAMS.surface.ampA + PARAMS.surface.ampB) * PARAMS.sea.waveRough + 1;

const view = {
  canvas: null, ctx: null, off: null, offCtx: null, img: null,
  buf: null, ibuf: new Uint8Array(W * H),
  scale: 1, ox: 0, oy: 0,
  bx0: 0, by0: 0,     // camera offset in whole screen pixels, so dithering stays anchored to the world
};
const cam = { level: 0, zoom: 1, x: 0, y: 0 };   // x, y: world point at the screen's top-left

// Ray intensity along the surface, u from -W to 2W (rays from off-screen can lean in)
const rayTable = new Float64Array(3 * W * R.rayRes + 8);
const rowShift = new Float64Array(H);   // refraction offset per screen row, world units
const sun = { x: W / 2, slope: 0 };     // virtual sun (or moon) position above the water
const CAUSTIC_COLS = W + 2, CAUSTIC_ROWS = CAUSTIC_H + 2;
const causticF = new Float32Array(CAUSTIC_COLS * CAUSTIC_ROWS);   // gap between nearest and second-nearest point
let causticPts = null, causticReady = false;
const chl = new Float64Array(PARAMS.grid.cols * PARAMS.grid.rows);   // smoothed cell biomass per grid node
const chlNow = new Float64Array(chl.length);
const milk = new Float64Array(chl.length), milkNow = new Float64Array(chl.length);   // coccolithophore biomass, smoothed slowly
let chlTick = -1;
const TINT_W = W >> 2, TINT_H = H >> 2;
const bloomTint = new Float64Array(TINT_W * TINT_H);              // per 4x4 screen block
const milkyTint = new Float64Array(TINT_W * TINT_H);              // coccolithophore water, per 4x4 screen block
const synTint = new Float64Array(TINT_W * TINT_H), proTint = new Float64Array(TINT_W * TINT_H);   // cyanobacteria, per block
let cyanoSeen = 0, cyanoSeenX = 0;                                  // how much is on screen, and where (for the shimmer)
const mudTint = new Float64Array(TINT_W * TINT_H), deadTint = new Float64Array(TINT_W * TINT_H);   // runoff silt; dead water
let triSeen = 0, triSeenX = 0;                                      // Trichodesmium on screen (for its grains)
const pebbles = [];
let buildDeadline = 0, builds = 0;

// Allocations that need no DOM (also used by the headless benchmark)
function initRenderBuffers() {
  if (!view.buf) view.buf = new Uint32Array(W * H);
  const cs = R.causticCell;
  causticPts = new Float64Array(2 * (Math.ceil(W / cs) + 3) * (Math.ceil(CAUSTIC_H / cs) + 3));
  const F = PARAMS.floor;
  pebbles.length = 0;
  for (let i = 0; i < F.pebbles; i++) {
    const x = hash01(i * 7 + 101) * W, r = F.pebbleMin + hash01(i * 7 + 102) * (F.pebbleMax - F.pebbleMin);
    pebbles.push({ x, y: floorY(x) + r * 0.35, r, rx: r * (1 + hash01(i * 7 + 103) * 0.6) });
  }
}

function initRender(canvas) {
  view.canvas = canvas;
  view.ctx = canvas.getContext('2d', { alpha: false });
  view.off = document.createElement('canvas');
  view.off.width = W;
  view.off.height = H;
  view.offCtx = view.off.getContext('2d');
  view.img = view.offCtx.createImageData(W, H);
  view.buf = new Uint32Array(view.img.data.buffer);
  initRenderBuffers();
  resize();
}

function resize() {
  const dpr = window.devicePixelRatio || 1;
  const cw = Math.round(window.innerWidth * dpr), ch = Math.round(window.innerHeight * dpr);
  view.canvas.width = cw;
  view.canvas.height = ch;
  // The water fits inside the safe area (clear of a notch or rounded corners when the app runs full screen)
  const st = getComputedStyle(document.getElementById('safe')), inset = (k) => Math.round((parseFloat(st['padding' + k]) || 0) * dpr);
  const l = inset('Left'), r = inset('Right'), t = inset('Top'), b = inset('Bottom'), sw = cw - l - r, sh = ch - t - b;
  // Fractional device pixel ratios can leave the canvas a pixel short of a whole multiple;
  // allow that much overhang rather than dropping a whole scale step.
  view.scale = Math.max(1, Math.floor(Math.min((sw + 2) / W, (sh + 2) / H)));
  view.ox = l + Math.floor((sw - W * view.scale) / 2);
  view.oy = t + Math.floor((sh - H * view.scale) / 2);
  view.ctx.imageSmoothingEnabled = false;
  view.ctx.fillStyle = PALETTE_HEX[COL.WATER];
  view.ctx.fillRect(0, 0, cw, ch);
}

// ---- Camera ----
function clampCamera() {
  cam.x = clamp(cam.x, 0, W - W / cam.zoom);
  cam.y = clamp(cam.y, 0, H - H / cam.zoom);
}

// Change zoom level keeping the world point under screen pixel (sx, sy) in place.
function zoomAt(level, sx, sy) {
  const wx = cam.x + sx / cam.zoom, wy = cam.y + sy / cam.zoom;
  cam.level = clamp(level, 0, ZOOMS.length - 1);
  cam.zoom = ZOOMS[cam.level];
  cam.x = wx - sx / cam.zoom;
  cam.y = wy - sy / cam.zoom;
  clampCamera();
}

function panBy(dx, dy) {
  cam.x -= dx / cam.zoom;
  cam.y -= dy / cam.zoom;
  clampCamera();
}

function nearestLevel(zoom) {
  let best = 0;
  for (let k = 1; k < ZOOMS.length; k++) {
    if (Math.abs(Math.log(ZOOMS[k] / zoom)) < Math.abs(Math.log(ZOOMS[best] / zoom))) best = k;
  }
  return best;
}

const toSX = (wx) => Math.round(wx * cam.zoom) - view.bx0;
const toSY = (wy) => Math.round(wy * cam.zoom) - view.by0;
const worldY = (py) => (view.by0 + py + 0.5) / cam.zoom;
const wb = (x, y) => BAYER[(((y + view.by0) & 3) << 2) | ((x + view.bx0) & 3)];   // world-anchored dither
const mod = (v, m) => ((v % m) + m) % m;

function put(x, y, idx) {
  if (x >= 0 && x < W && y >= 0 && y < H) view.ibuf[y * W + x] = idx;
}

function lift(x, y) {
  if (x >= 0 && x < W && y >= 0 && y < H) { const k = y * W + x; view.ibuf[k] = LIGHT_UP[view.ibuf[k]]; }
}

// ---- Water ----
function waterBand(wy) {
  const f = clamp(wy / H, 0, 1);
  return R.waterBottom + (R.waterTop - R.waterBottom) * Math.pow(1 - f, R.waterCurve);
}

// Clock for the water's own motion (seconds); -1 until the loop starts, then composeFrame falls back to sim time
let ambientT = -1;
// The water's own pace follows the wind, so it is integrated: calm water slows, storms hurry it
let waterT = 0, lastTa = -1;
const seaNow = { wave: 1, shimmer: 1, sway: 1, focus: 1, broken: 0 };
const murkCol = new Float64Array(W);   // ray clarity per screen column

function updateSea(w, ta) {
  const Se = PARAMS.sea, wind = w.wind;
  const dA = lastTa < 0 ? 0 : clamp(ta - lastTa, 0, 2);
  lastTa = ta;
  if (waterT === 0) waterT = ta;
  waterT += dA * (Se.paceCalm + (Se.paceRough - Se.paceCalm) * wind);
  seaNow.wave = Se.waveCalm + (Se.waveRough - Se.waveCalm) * wind;
  seaNow.shimmer = Se.shimmerCalm + (Se.shimmerRough - Se.shimmerCalm) * wind;
  seaNow.sway = Se.swayCalm + (Se.swayRough - Se.swayCalm) * wind;
  seaNow.focus = smoothstep(Se.focusFrom, Se.focusFull, wind);
  seaNow.broken = smoothstep(Se.breakFrom, Se.breakFull, wind) * Se.broken;
  // Murk: bloom biomass summed down the upper half of each grid column
  const { cols, rows } = PARAMS.grid, M = PARAMS.murk, B = PARAMS.bloom, colMurk = updateSea.col || (updateSea.col = new Float64Array(cols));
  for (let i = 0; i < cols; i++) {
    let sum = 0;
    for (let j = 0; j < rows >> 1; j++) sum += chl[j * cols + i];
    colMurk[i] = 1 - smoothstep(M.from, M.full, sum / B.full);
  }
  const invz = 1 / cam.zoom;
  for (let px = 0; px < W; px++) {
    const wx = (view.bx0 + px + 0.5) * invz;
    murkCol[px] = colMurk[clamp(Math.floor(wx / GRID_W), 0, cols - 1)];
  }
  return dA;
}

// Brightness of rays and caustics: sunlight by day, a little moonlight at night
let dayLight = 1;

function shaftFade(wy) {
  const sd = wy < RAY_DEPTH ? 1 - wy / RAY_DEPTH : 0;
  return R.rayStrength * dayLight * Math.pow(sd, R.rayFadePow);
}

// The sun crosses the sky during the day, the moon at night; tilt runs -1..1 and back, so it never jumps.
function updateSun(phase) {
  const D = PARAMS.diel;
  const tilt = phase < D.dayFrac ? 2 * phase / D.dayFrac - 1 : 1 - 2 * (phase - D.dayFrac) / (1 - D.dayFrac);
  sun.x = W / 2 + tilt * R.rayTilt * R.rayFocal;
  sun.slope = tilt * PARAMS.surface.sunSlope;
}

// Rays are where the moving surface focuses light: sharp peaks of a few travelling waves, in waxing groups.
function updateRays(t) {
  const waves = R.rayWaves, thr = R.rayThreshold;
  let norm = 0;
  for (const wv of waves) norm += wv[0];
  for (let k = 0; k < rayTable.length; k++) {
    const u = k / R.rayRes - W;
    let s = 0;
    for (const wv of waves) s += wv[0] * Math.sin(u * wv[1] + t * wv[2] + wv[3]);
    s /= norm;
    if (s <= thr) { rayTable[k] = 0; continue; }
    const r = (s - thr) / (1 - thr), env = 0.55 + 0.45 * Math.sin(u * R.rayGroups + t * R.rayGroupSpeed);
    let v = r * r * env * 4 * seaNow.focus;
    if (seaNow.broken > 0) {   // choppy water shatters rays into flickering fragments
      const f = Math.sin(u * 1.7 + t * 3.1) * Math.sin(u * 0.63 - t * 2.3);
      v *= 1 - seaNow.broken * (f < 0.1 ? 1 : 0.3);
    }
    rayTable[k] = v;
  }
}

// Refraction shimmer per screen row, strongest just under the surface
function updateShimmer(t) {
  const invz = 1 / cam.zoom;
  for (let py = 0; py < H; py++) {
    const wy = (view.by0 + py + 0.5) * invz;
    if (wy >= SHIMMER_DEPTH) { rowShift[py] = 0; continue; }
    const f = 1 - wy / SHIMMER_DEPTH;
    rowShift[py] = R.shimmerAmp * seaNow.shimmer * f * f * (Math.sin(wy * R.shimmerK1 + t * R.shimmerW1) + 0.6 * Math.sin(wy * R.shimmerK2 - t * R.shimmerW2)) / 1.6;
  }
}

// Trace a point back along its ray to the surface, toward the virtual sun
function rayAt(wx, wy) {
  const u = sun.x + (wx - sun.x) * R.rayFocal / (R.rayFocal + wy);
  const k = ((u + W) * R.rayRes) | 0;
  return k >= 0 && k < rayTable.length ? rayTable[k] : 0;
}
const shaftAt = rayAt;

// Cellular caustics in world space; a third of the rows are refreshed each tick.
function updateCaustics(t, tick) {
  const cs = R.causticCell, gw = Math.ceil(W / cs) + 3, gh = Math.ceil(CAUSTIC_H / cs) + 3;
  for (let gj = 0; gj < gh; gj++) {
    for (let gi = 0; gi < gw; gi++) {
      const id = gj * 131 + gi, k = 2 * (gj * gw + gi);
      const sp = R.causticSpeed * (0.6 + hash01(id * 5 + 3));
      causticPts[k] = (gi - 1 + 0.5 + 0.38 * Math.sin(t * sp + hash01(id * 5 + 1) * TAU)) * cs;
      causticPts[k + 1] = (gj - 1 + 0.5 + 0.38 * Math.cos(t * sp * 0.8 + hash01(id * 5 + 2) * TAU)) * cs;
    }
  }
  const phase = tick % R.causticEvery;
  for (let j = 0; j < CAUSTIC_ROWS; j++) {
    if (causticReady && j % R.causticEvery !== phase) continue;
    const gj = Math.floor(j / cs) + 1;
    for (let i = 0; i < CAUSTIC_COLS; i++) {
      const gi = Math.floor(i / cs) + 1;
      let f1 = 1e9, f2 = 1e9;
      for (let dj = -1; dj <= 1; dj++) {
        for (let di = -1; di <= 1; di++) {
          const k = 2 * ((gj + dj) * gw + gi + di);
          const dx = causticPts[k] - i, dy = causticPts[k + 1] - j, d = dx * dx + dy * dy;
          if (d < f1) { f2 = f1; f1 = d; } else if (d < f2) f2 = d;
        }
      }
      causticF[j * CAUSTIC_COLS + i] = Math.sqrt(f2) - Math.sqrt(f1);
    }
  }
  causticReady = true;
}

function causticAt(wx, wy) {
  const i = wx | 0, j = wy | 0;
  if (i >= CAUSTIC_COLS - 1 || j >= CAUSTIC_ROWS - 1) return 1e9;
  const fx = wx - i, fy = wy - j, k = j * CAUSTIC_COLS + i;
  return (causticF[k] * (1 - fx) + causticF[k + 1] * fx) * (1 - fy)
       + (causticF[k + CAUSTIC_COLS] * (1 - fx) + causticF[k + CAUSTIC_COLS + 1] * fx) * fy;
}

// ---- Surface, seen from below ----
function surfaceY(wx, t) {
  const S = PARAMS.surface;
  return S.base + seaNow.wave * (S.ampA * Math.sin(wx * S.freqA + t * S.speedA) + S.ampB * Math.sin(wx * S.freqB - t * S.speedB));
}

function surfacePixel(wx, wy, t, b) {
  const S = PARAMS.surface;
  const slope = seaNow.wave * (S.ampA * S.freqA * Math.cos(wx * S.freqA + t * S.speedA) + S.ampB * S.freqB * Math.cos(wx * S.freqB - t * S.speedB));
  if (Math.abs(slope - sun.slope) < S.glintWidth
      && hash01(Math.floor(wx * 2) * 131 + Math.floor(t * S.twinkle) * 7919) < S.glintChance) return dayLight > 0.6 ? COL.GLOW : COL.FOAM;
  if (rayAt(wx, wy) * dayLight * murkCol[clamp(toSX(wx), 0, W - 1)] > S.rootLit) return COL.FOAM;
  return b < 0.5 ? COL.SHAFT : COL.SHAFT - 1;
}

// ---- Seafloor ----
function floorY(wx) {
  const F = PARAMS.floor;
  return FLOOR_TOP + F.rippleA * Math.sin(wx * F.rippleFreqA) + F.rippleB * Math.sin(wx * F.rippleFreqB + 1.7);
}

function sedimentPixel(wx, wy, d, b) {
  const F = PARAMS.floor, green = rampBase(0), gold = rampBase(1);
  if (b < d / F.fade) return COL.WATER;                                    // sinks into darkness below
  if (d < F.mat && hash01(Math.floor(wx * 1.5) + 7777) > F.matPatch) return b < 0.5 ? green + OUTLINE : green + SHADOW;
  if (d < 0.8) return gold + SHADOW;                                       // lit crest of the sediment
  const grain = hash01(Math.imul(Math.floor(wx * 2), 7919) + Math.floor(wy * 2) * 131 + 17);
  return grain < F.grain ? gold + SHADOW : gold + OUTLINE;
}

function drawPebbles() {
  const z = cam.zoom;
  for (const p of pebbles) {
    const cx = toSX(p.x), cy = toSY(p.y), rx = p.rx * z, ry = p.r * z * 0.7;
    for (let y = Math.floor(cy - ry - 1); y <= cy + ry + 1; y++) {
      for (let x = Math.floor(cx - rx - 1); x <= cx + rx + 1; x++) {
        const dx = (x - cx) / rx, dy = (y - cy) / ry, d = dx * dx + dy * dy;
        if (d > 1) continue;
        const lit = -dx * 0.6 - dy * 0.8 + (wb(x, y) - 0.5) * 0.3;
        put(x, y, d > 0.75 && dx + dy > 0.3 ? COL.WATER + 1 : lit > 0.45 ? COL.WATER + 6 : lit > -0.1 ? COL.SLATE : COL.WATER + 3);
      }
    }
  }
}

// ---- Bloom tint: water greens where cell biomass is dense ----
function updateBloom(w) {
  const B = PARAMS.bloom;
  if (w.tick !== chlTick) {
    const steps = chlTick < 0 ? 1e6 : w.tick - chlTick;
    chlTick = w.tick;
    chlNow.fill(0);
    milkNow.fill(0);
    for (const c of w.cells) {
      if (c.dying) continue;
      addField(chlNow, c.x, c.y, c.biomass);
      if (c.kind === 7) addField(milkNow, c.x, c.y, c.biomass);
    }
    const k = 1 - Math.exp(-steps * TICK_DT / B.tau), km = 1 - Math.exp(-steps * TICK_DT / B.milkyTau);
    for (let i = 0; i < chl.length; i++) { chl[i] += (chlNow[i] - chl[i]) * k; milk[i] += (milkNow[i] - milk[i]) * km; }
  }
  const z = cam.zoom;
  cyanoSeen = 0; cyanoSeenX = 0; triSeen = 0; triSeenX = 0;
  const Lk = PARAMS.look, O = PARAMS.oxygen, f = w.fields;
  for (let j = 0; j < TINT_H; j++) {
    for (let i = 0; i < TINT_W; i++) {
      const v = sampleField(chl, (view.bx0 + i * 4 + 2) / z, (view.by0 + j * 4 + 2) / z);
      bloomTint[j * TINT_W + i] = clamp(v / B.full, 0, 1) * B.max;
      milkyTint[j * TINT_W + i] = clamp(sampleField(milk, (view.bx0 + i * 4 + 2) / z, (view.by0 + j * 4 + 2) / z) / B.milkyFull, 0, 1) * B.milkyMax;
      const wx = (view.bx0 + i * 4 + 2) / z, wy = (view.by0 + j * 4 + 2) / z, sy = sampleField(w.fields.syn, wx, wy), pr = sampleField(w.fields.pro, wx, wy);
      synTint[j * TINT_W + i] = sy; proTint[j * TINT_W + i] = pr;
      cyanoSeen += sy + pr; cyanoSeenX += (sy + pr) * (i * 4 + 2);
      const tr = sampleField(f.tri, wx, wy);
      triSeen += tr; triSeenX += tr * (i * 4 + 2);
      mudTint[j * TINT_W + i] = clamp(sampleField(f.silt, wx, wy) / Lk.mud.full, 0, 1) * Lk.mud.max;
      deadTint[j * TINT_W + i] = smoothstep(O.hypoxic, O.anoxic, sampleField(f.o2, wx, wy)) * Lk.dead.max;
    }
  }
}

const surfaceLine = new Float64Array(W), floorLine = new Float64Array(W);   // per screen column, per frame
// Muddy runoff water and dead water, by the water band they replace (0..SHAFT, darkest first)
const MUD = [rampBase(BROWN) + OUTLINE, rampBase(BROWN) + OUTLINE, rampBase(AMBER) + OUTLINE, rampBase(AMBER) + OUTLINE, rampBase(OLIVE) + SHADOW,
             rampBase(OLIVE) + SHADOW, rampBase(AMBER) + SHADOW, rampBase(AMBER) + SHADOW, rampBase(OLIVE) + BASE];
const DEAD = [rampBase(OLIVE) + OUTLINE, rampBase(OLIVE) + OUTLINE, rampBase(OLIVE) + OUTLINE, rampBase(OLIVE) + OUTLINE, rampBase(BROWN) + OUTLINE,
              rampBase(OLIVE) + SHADOW, rampBase(OLIVE) + SHADOW, rampBase(OLIVE) + SHADOW, rampBase(OLIVE) + SHADOW];

function drawBackground(t) {
  const ib = view.ibuf, z = cam.zoom, invz = 1 / z, bx0 = view.bx0, by0 = view.by0;
  const seamStart = 1 - R.seam, cw = R.causticWidth * invz;
  const wx0 = (bx0 + 0.5) * invz;
  if ((by0 + 0.5) * invz < SURFACE_MAX) for (let px = 0; px < W; px++) surfaceLine[px] = surfaceY(wx0 + px * invz, t);
  if ((by0 + H) * invz > FLOOR_MIN) for (let px = 0; px < W; px++) floorLine[px] = floorY(wx0 + px * invz);
  for (let py = 0; py < H; py++) {
    const by = by0 + py, wy = (by + 0.5) * invz, row = py * W, brow = (by & 3) << 2, brow2 = ((by + 1) & 3) << 2;
    // Ray coordinate is linear in x along a row: trace back toward the virtual sun, bent by refraction
    const base = waterBand(wy), sf = shaftFade(wy), shift = rowShift[py], g = R.rayFocal / (R.rayFocal + wy);
    const u0 = (sun.x + (wx0 + shift - sun.x) * g + W) * R.rayRes, du = invz * g * R.rayRes;
    const cf = wy < CAUSTIC_H ? Math.pow(1 - wy / CAUSTIC_H, R.causticFade) * dayLight : 0;
    const nearSurface = wy < SURFACE_MAX, nearFloor = wy > FLOOR_MIN, tintRow = (py >> 2) * TINT_W;
    for (let px = 0; px < W; px++) {
      const bx = bx0 + px, b = BAYER[brow | (bx & 3)];
      if (nearSurface) {
        const s = surfaceLine[px];
        if (wy < s) { ib[row + px] = surfacePixel(wx0 + px * invz, wy, t, b); continue; }
        if (wy < s + invz) { ib[row + px] = COL.FOAM; continue; }
      }
      if (nearFloor) {
        const fy = floorLine[px];
        if (wy >= fy) { ib[row + px] = sedimentPixel(wx0 + px * invz, wy, wy - fy, b); continue; }
      }
      let v = base;
      if (sf > 0) { const k = (u0 + px * du) | 0; if (k >= 0 && k < rayTable.length) v += rayTable[k] * sf * murkCol[px]; }
      let i = v | 0;
      const frac = v - i;
      if (frac > seamStart && b < (frac - seamStart) / R.seam) i++;      // flat bands, dithered seams
      if (cf > 0 && b < cf && causticAt(wx0 + px * invz + shift, wy) < cw) i++;
      if (i > COL.SHAFT) i = COL.SHAFT;
      const mud = mudTint[tintRow + (px >> 2)], dead = deadTint[tintRow + (px >> 2)];
      if (mud > 0 && BAYER[brow2 | ((bx + 3) & 3)] < mud) { ib[row + px] = MUD[i]; continue; }       // runoff: tea-brown water
      if (dead > 0 && BAYER[brow | ((bx + 2) & 3)] < dead) { ib[row + px] = DEAD[i]; continue; }     // dead water: murky olive-black
      if (i >= COL.BLOOM_FROM && i <= COL.BLOOM_TO) {
        const tint = bloomTint[tintRow + (px >> 2)];
        if (tint > 0 && BAYER[brow2 | ((bx + 2) & 3)] < tint) i = COL.BLOOM + i - COL.BLOOM_FROM;
      }
      if (i >= COL.MILKY_FROM && i <= COL.MILKY_TO) {   // chalky turquoise where coccolithophores bloom
        const milky = milkyTint[tintRow + (px >> 2)];
        if (milky > 0 && BAYER[brow | ((bx + 1) & 3)] < milky) i = COL.MILKY + i - COL.MILKY_FROM;
      }
      ib[row + px] = i;
    }
  }
}

// ---- Cyanobacteria: single-pixel specks where they are dense, twinkling slowly; the plumes drift with the fields ----
// Smooth value noise on a lattice (render only): the plumes' texture
function valueNoise(x, y) {
  const i = Math.floor(x), j = Math.floor(y), fx = x - i, fy = y - j, sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
  const h = (a, b) => hash01((a * 374761393) ^ (b * 668265263));
  return (h(i, j) * (1 - sx) + h(i + 1, j) * sx) * (1 - sy) + (h(i, j + 1) * (1 - sx) + h(i + 1, j + 1) * sx) * sy;
}
const cyDrift = { x: 0, y: 0, t: -1 }, CUR_R = { u: 0, v: 0 };

function drawCyano(w, t) {
  const L = PARAMS.look.cyano, ib = view.ibuf, z = cam.zoom, syn = rampBase(ROSE), pro = rampBase(EMERALD), slot = Math.floor(t * L.twinkle);
  currentAt(w, W / 2, H / 3, CUR_R);   // the texture drifts with the current
  if (cyDrift.t >= 0) { const d = Math.min(1, t - cyDrift.t); cyDrift.x += CUR_R.u * d; cyDrift.y += CUR_R.v * d; }
  cyDrift.t = t;
  for (let py = 0; py < H; py++) {
    const by = view.by0 + py, tintRow = (py >> 2) * TINT_W, row = py * W;
    for (let px = 0; px < W; px++) {
      const i = ib[row + px];
      if (i > COL.SHAFT && !(i >= COL.BLOOM && i < COL.BLOOM + 6) && !(i >= COL.MILKY && i < COL.MILKY + 4)) continue;   // water only
      const k = tintRow + (px >> 2), a = synTint[k], b = proTint[k];
      if (a + b < L.from) continue;
      const bx = view.bx0 + px, h = hash01((bx * 73856093) ^ (by * 19349663) ^ (slot + (bx & 7)) * 83492791);
      const wx = (bx + 0.5) / z - cyDrift.x, wy = (by + 0.5) / z - cyDrift.y;
      const n = (1 - L.fine) * valueNoise(wx / L.grainX, wy / L.grainY) + L.fine * valueNoise(wx / (L.grainX * 0.4), wy / (L.grainY * 0.5));
      const patch = smoothstep(L.patchFrom, L.patchTo, n);
      if (patch <= 0) continue;
      const ka = clamp((a - L.from) / L.full, 0, 1), kb = clamp((b - L.from) / L.full, 0, 1);
      const pa = ka * ka * patch * L.density / z, pb = kb * kb * patch * L.density / z;   // dense water shows far more than thin
      if (h < pa) ib[row + px] = syn + (h < pa * 0.4 ? BRIGHT : HIGHLIGHT);
      else if (h < pa + pb) ib[row + px] = pro + (h < pa + pb * 0.4 ? BRIGHT : HIGHLIGHT);
    }
  }
}

// ---- Nutrient pulses: resuspended specks rising in the plume, thinning as it climbs ----
function drawPlumes(w) {
  const P = PARAMS.plume, Pu = PARAMS.pulses;
  for (const p of w.pulses) {
    const span = p.y0 - p.y;
    for (let i = 0; i < P.specks; i++) {
      const h = Math.floor(p.x * 997) + i * 11;
      const off = (hash01(h + 1) + hash01(h + 2) - 1) * Pu.width;
      const y = p.y0 - mod(p.age * Pu.rise * (0.5 + 0.5 * hash01(h + 3)) + hash01(h + 4) * span, span);
      if (hash01(h + 5) > 0.3 + 0.7 * (y - p.y) / span) continue;   // fewer specks near the head
      const x = p.x + off + Math.sin(p.age * 0.7 + i) * 0.8;
      const sx = toSX(x), sy = toSY(y);
      if (sx < 0 || sy < 0 || sx >= W || sy >= H) continue;
      if (hash01(h + 6) < P.sediment) put(sx, sy, rampBase(GOLD) + SHADOW);
      else lift(sx, sy);
    }
  }
}

// ---- Trichodesmium: golden-brown colonies where the field is dense, and a scum under the surface in calm water ----
// Colonies sit on a lattice that drifts sideways with the current; tufts are filaments side by side, puffs radiate
const TRI_COLS = Math.round(W / PARAMS.look.tricho.spacing), TRI_ROWS = Math.round(H / PARAMS.look.tricho.spacing);
const TRI_TONES = [rampBase(GOLD) + SHADOW, rampBase(GOLD) + BASE, rampBase(AMBER) + HIGHLIGHT, rampBase(GOLD) + HIGHLIGHT];   // straw to golden-brown
function drawTricho(w, t) {
  const L = PARAMS.look.tricho, f = w.fields, z = cam.zoom, sx = W / TRI_COLS, sy = H / TRI_ROWS;
  for (let j = 0; j < TRI_ROWS; j++) {
    for (let i = 0; i < TRI_COLS; i++) {
      const id = j * TRI_COLS + i + 0x7c1, h = (k) => hash01(id * 7 + k);
      // each colony sways and bobs on its own as the water moves it, and slowly turns
      const x = mod(i * sx + h(1) * sx + cyDrift.x + L.sway * Math.sin(t * 0.23 + id * 1.3), W);
      const y = j * sy + h(2) * sy + L.bob * Math.sin(t * 0.4 + id);
      const v = sampleField(f.tri, x, y);
      if (v < L.from || h(3) >= clamp((v - L.from) / (L.full - L.from), 0, 1) * L.share) continue;
      const cx = (x * z) - view.bx0, cy = (y * z) - view.by0, len = L.len * (0.7 + 0.6 * h(4)) * z;
      if (cx < -len || cy < -len || cx >= W + len || cy >= H + len || y < SURFACE_MAX) continue;
      if (len < 3) { const px = Math.round(cx), py = Math.round(cy); if (px >= 0 && py >= 0 && px < W && py < H) put(px, py, TRI_TONES[h(5) < 0.5 ? 2 : 1]); continue; }
      const puff = h(6) < L.puff, n = clamp(Math.round(len / 3), 2, L.filaments), a0 = h(7) * Math.PI + L.turn * Math.sin(t * 0.12 + id);
      const gap = Math.max(1.6, z * 0.45), seg = Math.max(2, z * 0.6);   // px between a tuft's filaments; px per trichome piece
      for (let m = 0; m < n; m++) {
        // a puff's filaments radiate from its centre; a tuft's lie loosely side by side, splaying toward the ends,
        // each its own length and a little offset along the bundle, waving in the water and broken into short pieces
        const side = (m - (n - 1) / 2) / Math.max(1, (n - 1) / 2);
        const a = puff ? a0 + (m + 0.3 * h(20 + m)) / n * TAU : a0 + side * L.splay, ca = Math.cos(a), sa = Math.sin(a);
        const off = puff ? 0 : side * (n - 1) / 2 * gap, ox = cx - sa * off, oy = cy + ca * off;
        const half = len / 2 * (0.75 + 0.25 * h(10 + m)), shift = (h(30 + m) - 0.5) * len * 0.3;
        const from = puff ? 0.2 * len : -half + shift, to = puff ? len * (0.4 + 0.2 * h(10 + m)) : half + shift;
        for (let s = from; s <= to; s += 0.7) {
          if (z >= 3 && ((s - from) / seg | 0) % 4 === 3) continue;   // gaps between the pieces of a trichome
          const wave = L.wave * len * Math.sin((s - from) / len * 4.5 + t * 0.9 + m * 2.1 + id);
          const px = Math.round(ox + ca * s - sa * wave), py = Math.round(oy + sa * s + ca * wave);
          if (px < 0 || py < 0 || px >= W || py >= H) continue;
          put(px, py, TRI_TONES[side < -0.3 ? 3 : side > 0.3 ? 1 : 2]);   // lit on one side
        }
      }
    }
  }
}

// The scum: a golden-brown mat just under the surface, thicker and patchier where the surface row is dense
function drawScum(w, t) {
  const L = PARAMS.look.tricho, z = cam.zoom, invz = 1 / z;
  if ((view.by0 + 0.5) * invz > SURFACE_MAX + L.thick) return;
  for (let px = 0; px < W; px++) {
    const wx = (view.bx0 + px + 0.5) * invz, v = sampleField(w.fields.tri, wx, GRID_H * 0.5);
    const k = clamp((v - L.scumFrom) / (L.scumFull - L.scumFrom), 0, 1);
    if (k <= 0) continue;
    const s = surfaceY(wx, t) + invz, thick = L.thick * k * (0.6 + 0.4 * valueNoise(wx / 5 - cyDrift.x / 5, 3));
    const y0 = Math.max(0, Math.ceil(s * z - view.by0)), y1 = Math.min(H - 1, Math.floor((s + thick) * z - view.by0));
    for (let py = y0; py <= y1; py++) {
      const wy = (view.by0 + py + 0.5) * invz, d = (wy - s) / thick;
      if (valueNoise((wx - cyDrift.x) / 2.2 + t * 0.05, wy / 1.6) < 0.4 + 0.45 * d * (1 - k * 0.5)) continue;   // patchy, thinning downward
      if (hash01(Math.imul(Math.floor(wx * 3), 7919) + Math.floor(wy * 3) * 131 + Math.floor(t * 0.5)) < 0.3) continue;   // loose: water between the filaments
      put(px, py, TRI_TONES[d < 0.25 ? 3 : d < 0.6 ? 2 : (hash01(px * 31 + py) < 0.5 ? 1 : 0)]);
    }
  }
}

// ---- Marine snow: flocs falling where the detritus field is, loose aggregates close up ----
const SNOW_COLS = Math.round(W / PARAMS.look.snow.spacing), SNOW_ROWS = Math.round(H / PARAMS.look.snow.spacing);
const SNOW_TONES = [rampBase(OLIVE) + SHADOW, rampBase(BROWN) + SHADOW, COL.SLATE, rampBase(OLIVE) + BASE];
function drawSnow(w, t) {
  const L = PARAMS.look.snow, f = w.fields, z = cam.zoom, sx = W / SNOW_COLS, sy = H / SNOW_ROWS, sink = PARAMS.snow.sink;
  for (let j = 0; j < SNOW_ROWS; j++) {
    for (let i = 0; i < SNOW_COLS; i++) {
      const id = j * SNOW_COLS + i + 0x51e, h = (k) => hash01(id * 5 + k);
      const x = i * sx + h(1) * sx + 0.8 * Math.sin(t * 0.25 + id), y = mod(j * sy + h(2) * sy + t * sink * (0.7 + 0.6 * h(3)), H);
      if (y < SURFACE_MAX || y > FLOOR_MIN) continue;
      const v = sampleField(f.det, x, y);
      if (v < L.from || h(4) >= clamp((v - L.from) / (L.full - L.from), 0, 1) * L.share) continue;
      const px = Math.round(x * z) - view.bx0, py = Math.round(y * z) - view.by0;
      if (px < -3 || py < -3 || px >= W + 3 || py >= H + 3) continue;
      const tone = SNOW_TONES[(h(5) * 3) | 0];
      if (z < L.clumpZoom) { if (px >= 0 && py >= 0 && px < W && py < H) put(px, py, tone); continue; }
      const r = Math.min(3, Math.round(z * (0.3 + 0.3 * h(6))));   // an irregular clump, a lit speck now and then
      for (let dy = -r; dy <= r; dy++) {
        for (let dx = -r; dx <= r; dx++) {
          const qx = px + dx, qy = py + dy;
          if (qx < 0 || qy < 0 || qx >= W || qy >= H || dx * dx + dy * dy > r * r + 1 || hash01(id * 13 + (dx + 4) * 9 + dy + 4) < 0.4) continue;
          put(qx, qy, dx + dy < -r * 0.6 && h(7) < 0.5 ? SNOW_TONES[3] : tone);
        }
      }
    }
  }
}

// ---- The floor deposit: fluff where snow has settled, picked over by the crawlers; white bacterial mats in anoxic water ----
const depositEaten = new Float64Array(PARAMS.grid.cols);   // render only: what the crawlers have picked over, settling back
const DEPOSIT_TONES = [rampBase(OLIVE) + OUTLINE, rampBase(BROWN) + SHADOW, rampBase(OLIVE) + SHADOW, rampBase(OLIVE) + BASE];
function drawDeposit(w) {
  const L = PARAMS.look.deposit, f = w.fields, z = cam.zoom, invz = 1 / z, cols = PARAMS.grid.cols, O = PARAMS.oxygen;
  if ((view.by0 + H) * invz < FLOOR_MIN - L.max) return;
  for (let px = 0; px < W; px++) {
    const wx = (view.bx0 + px + 0.5) * invz, g = clamp(wx / GRID_W - 0.5, 0, cols - 1), i0 = Math.floor(g), i1 = Math.min(cols - 1, i0 + 1), fr = g - i0;
    const sed = f.sed[i0] * (1 - depositEaten[i0]) * (1 - fr) + f.sed[i1] * (1 - depositEaten[i1]) * fr;
    const thick = Math.min(L.max, sed * L.perUnit) * (0.75 + 0.5 * valueNoise(wx / 3, 7.5));
    if (thick < 0.3 * invz) continue;
    const fy = floorY(wx), anoxic = sampleField(f.o2, wx, fy - 2) < O.anoxic * L.mat;
    const y0 = Math.max(0, Math.ceil((fy - thick) * z - view.by0)), y1 = Math.min(H - 1, Math.floor(fy * z - view.by0));
    for (let py = y0; py <= y1; py++) {
      const wy = (view.by0 + py + 0.5) * invz, d = (wy - (fy - thick)) / thick, hh = hash01(Math.imul(Math.floor(wx * 2), 7919) + Math.floor(wy * 2) * 131 + 5);
      if (d < 0.3 && hh < 0.35) continue;   // a fluffy, ragged top
      if (anoxic && d < 0.35 && valueNoise(wx / 2.5, 11) > 0.45) { put(px, py, hh < 0.5 ? COL.FOAM : COL.SHAFT); continue; }   // Beggiatoa-like mat
      put(px, py, DEPOSIT_TONES[d < 0.2 ? 3 : d < 0.55 ? (hh < 0.5 ? 2 : 1) : 0]);
    }
  }
}

// ---- Rain while runoff spreads: rings on the surface seen from below; some drops leave a bubble ----
const drops = [];
let dropT = -1;
function updateRain(w, ta) {
  const Rn = PARAMS.look.rain, dt = dropT < 0 ? 0 : clamp(ta - dropT, 0, 0.5);
  dropT = ta;
  if (w.runoffs.length) {
    const n = Math.floor(Rn.drops * dt) + (bubbleRng.next() < (Rn.drops * dt) % 1 ? 1 : 0);
    for (let k = 0; k < n; k++) {
      const x = bubbleRng.next() * W;
      drops.push({ x, t0: ta });
      if (bubbleRng.next() < Rn.bubble) spawnBubble(x, surfaceY(x, waterT) + 1.5, 2, false);
    }
  }
  let k = 0;
  for (const d of drops) if (ta - d.t0 < Rn.ring) drops[k++] = d;
  drops.length = k;
}

function drawRain(ta) {
  const Rn = PARAMS.look.rain, z = cam.zoom;
  for (const d of drops) {
    const a = (ta - d.t0) / Rn.ring, r = a * Rn.ringR, y = surfaceY(d.x, waterT) + 0.6;
    for (const x of a < 0.15 ? [d.x] : [d.x - r, d.x + r]) {
      const px = Math.round(x * z) - view.bx0, py = Math.round(y * z) - view.by0;
      if (px >= 0 && py >= 0 && px < W && py < H) put(px, py, a < 0.5 ? COL.GLOW : COL.FOAM);
    }
  }
}

// Palette for this moment of the day: two keyframes and a world-anchored dither between them
function blitTimeOfDay(w) {
  const keys = PARAMS.timeOfDay.keys, ph = dayPhase(w);
  let k = 0;
  while (k < keys.length - 2 && ph >= keys[k + 1][0]) k++;
  const a = TIME_PAL32[keys[k][1]], b = TIME_PAL32[keys[k + 1][1]];
  const mix = a === b ? 0 : (ph - keys[k][0]) / (keys[k + 1][0] - keys[k][0]);
  const ib = view.ibuf, buf = view.buf, bx0 = view.bx0, by0 = view.by0;
  if (mix <= 0) { for (let i = 0; i < ib.length; i++) buf[i] = a[ib[i]]; return; }
  for (let py = 0; py < H; py++) {
    const row = py * W, brow = ((by0 + py) & 3) << 2;
    for (let px = 0; px < W; px++) {
      const i = row + px;
      buf[i] = BAYER[brow | ((bx0 + px) & 3)] < mix ? b[ib[i]] : a[ib[i]];
    }
  }
}

// ---- Particles in three depth layers (far specks, marine snow, near out-of-focus flocs) ----
function drawParticles(L, seed, t, near) {
  const zp = Math.pow(cam.zoom, L.zoomExp);
  const ccx = cam.x + W / (2 * cam.zoom), ccy = cam.y + H / (2 * cam.zoom);
  const size = near ? Math.max(2, Math.round(L.size * Math.sqrt(zp))) : 1;
  for (let i = 0; i < L.count; i++) {
    const h = seed + i * 5;
    const speed = L.speedMin + hash01(h + 3) * (L.speedMax - L.speedMin);
    const lx = hash01(h + 1) * W + Math.sin(waterT * 0.2 + i) * L.sway * seaNow.sway, ly = hash01(h + 2) * H + t * speed;
    const sx = Math.floor(mod((lx - ccx * L.parallax) * zp + W / 2, W * zp));
    const sy = Math.floor(mod((ly - ccy * L.parallax) * zp + H / 2, H * zp));
    if (sx >= W || sy >= H) continue;
    if (near) {
      for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) if (wb(sx + x, sy + y) < 0.5) lift(sx + x, sy + y);
    } else {
      const wy = worldY(sy);
      if (wy < SURFACE_MAX || wy > FLOOR_MIN) continue;
      put(sx, sy, Math.min(COL.SHAFT, Math.floor(waterBand(wy)) + L.lift));
    }
  }
}

// ---- The finger's wake: dotted foam along its path, thinning as it fades ----
function drawTrail(now) {
  const T = PARAMS.touch;
  let k = 0;
  for (const q of trail) {
    const a = (now - q.t) / 1000 / T.trail;
    if (a >= 1) continue;
    trail[k++] = q;
    const x = toSX(q.x), y = toSY(q.y);
    if (x >= 0 && y >= 0 && x < W && y < H && wb(x, y) < (1 - a) * 0.9) put(x, y, a < 0.3 ? COL.FOAM : COL.SHAFT);
  }
  trail.length = k;
}

// ---- A tap's ripple: rings of light spreading out to the reach of the scatter, thinning as they go (render only) ----
const ripples = [];
function drawRipples(now) {
  const T = PARAMS.touch, R = PARAMS.hand.radius, life = T.ripple + T.rippleGap * (T.rippleRings - 1);
  let k = 0;
  for (const q of ripples) {
    const age = (now - q.t) / 1000;
    if (age >= life) continue;
    ripples[k++] = q;
    const cx = toSX(q.x), cy = toSY(q.y);
    for (let i = 0; i < T.rippleRings; i++) {
      const a = (age - i * T.rippleGap) / T.ripple;
      if (a <= 0 || a >= 1) continue;
      const r = R * (1 - (1 - a) * (1 - a)) * (1 - 0.15 * i) * cam.zoom, fade = (1 - a) * (1 - 0.25 * i);
      const steps = Math.max(12, Math.ceil(TAU * r * 1.5));
      let px = -1e9, py = -1e9;
      for (let n = 0; n < steps; n++) {
        const th = n / steps * TAU, x = Math.round(cx + r * Math.cos(th)), y = Math.round(cy + r * Math.sin(th));
        if ((x === px && y === py) || wb(x, y) >= fade) continue;
        px = x; py = y;
        lift(x, y);
        if (i === 0 && a < 0.5) lift(x, y);   // the leading ring starts bright
      }
    }
  }
  ripples.length = k;
}

// ---- Bubbles ----
const bubbles = [], bubbleRng = makeRng(0xb0bb1e);
let bubbleT = -1;
function spawnBubble(x, y, plunge, seep) {
  const B = PARAMS.bubbles, size = bubbleRng.next();
  if (bubbles.length >= B.max) return;
  bubbles.push({ x, y, vy: plunge, r: B.rMin + (B.rMax - B.rMin) * size, rise: B.riseMin + (B.riseMax - B.riseMin) * size, ph: bubbleRng.next() * TAU });
  bubbleSound(x, size, seep);
}

function updateBubbles(w, ta) {
  const B = PARAMS.bubbles, dt = bubbleT < 0 ? 0 : clamp(ta - bubbleT, 0, 0.5), r = () => bubbleRng.next();
  bubbleT = ta;
  const chop = smoothstep(B.chopFrom, B.chopFull, w.wind);
  if (r() < chop * B.clusters * dt) {
    const x = r() * W, n = B.clusterMin + Math.floor(r() * (B.clusterMax - B.clusterMin + 1));
    for (let i = 0; i < n; i++) {
      const bx = x + (r() - 0.5) * 6;
      spawnBubble(bx, surfaceY(bx, waterT) + B.depthMin + r() * (B.depthMax - B.depthMin), B.plunge * r(), false);
    }
  }
  const anoxic = smoothstep(PARAMS.oxygen.hypoxic, PARAMS.oxygen.anoxic, bottomOxygen(w).min);   // a rotting floor seeps more gas
  if (r() < B.seepRate * (1 + B.anoxicSeep * anoxic) * dt) {
    const x = 8 + r() * (W - 16), n = B.seepMin + Math.floor(r() * (B.seepMax - B.seepMin + 1));
    for (let i = 0; i < n; i++) spawnBubble(x + (r() - 0.5) * 2, H - PARAMS.world.floor - i * 2.5, 0, i === 0);
  }
  let k = 0;
  for (const b of bubbles) {
    b.vy += (-b.rise - b.vy) * Math.min(1, B.drag * dt);
    b.y += b.vy * dt;
    b.ph += B.wobbleRate * dt;
    b.x += Math.sin(b.ph) * B.wobble * dt * b.rise * 0.3;
    if (b.y > surfaceY(b.x, waterT) + 0.5) bubbles[k++] = b;   // reached the surface: it pops
  }
  bubbles.length = k;
}

// A bubble is a lit speck far away, a small bright ring with a glint close up
function drawBubbles() {
  const z = cam.zoom;
  for (const b of bubbles) {
    const cx = toSX(b.x), cy = toSY(b.y), rp = b.r * z;
    if (cx < -4 || cy < -4 || cx >= W + 4 || cy >= H + 4) continue;
    if (rp < 1.2) { if (cx >= 0 && cy >= 0 && cx < W && cy < H) put(cx, cy, rp < 0.6 ? COL.SHAFT : COL.FOAM); continue; }
    const steps = Math.ceil(TAU * rp * 1.5);
    for (let s = 0; s < steps; s++) {
      const a = s / steps * TAU, x = Math.round(cx + Math.cos(a) * rp), y = Math.round(cy + Math.sin(a) * rp);
      if (x >= 0 && y >= 0 && x < W && y < H) put(x, y, a > Math.PI ? COL.FOAM : COL.SHAFT);   // brighter on top
    }
    const gx = Math.round(cx - rp * 0.4), gy = Math.round(cy - rp * 0.4);
    if (gx >= 0 && gy >= 0 && gx < W && gy < H) put(gx, gy, COL.GLOW);
  }
}

// ---- Cells ----
// Morphology follows the genome continuously: size -> cell size and chloroplast count,
// timbre -> round coccoid .. glassy box-like frustule, coupling -> setae reaching for neighbours.
// The lineage seed fixes elongation and chloroplast layout, so relatives look alike.
// Sprites are rebuilt per zoom level and per 1/32 turn of tumbling.
// Tone code for glassy frustule highlights: coloured at draw time, shimmering as the cell turns
// (diatom frustules are photonic crystals with real structural colour).
const IRIDESCENT = -2;
// Coccolith tones: fixed colours, not the pigment's (lit rim, rim, spokes, centre, overlap edge)
const PLATE_LIT = -3, PLATE = -4, SPOKE = -5, PLATE_CENTRE = -6, PLATE_EDGE = -7;
const ALT = 8;   // tone offset: drawn from the neighbouring colour's ramp (mixed chloroplasts)

function buildSprite(c, rpx, angle, z, key) {
  const S = PARAMS.sprite, D = PARAMS.dino, g = c.g, seed = c.spriteSeed;
  // Separate streams per feature, so zooming (which adds or drops details) never reshuffles the rest
  const lin = makeRng(seed), linSetae = makeRng(seed ^ 0x9e3779b9), linPl = makeRng(seed ^ 0x51ed270b);
  const own = makeRng(hash32(c.id * 31 + c.gen));

  // Three overlapping regions of timbre: soft cell -> armoured dinoflagellate theca -> diatom glass
  const aspect = lin.range(S.aspectMin, S.aspectMax);
  const pennate = aspect >= S.polarAspect;
  const sides = pennate ? 0 : S.valveSides[lin.int(S.valveSides.length)];   // 0 = round disc
  const areolae = lin.next() < 0.5;
  const dino = D.forms[lin.int(D.forms.length)];
  const theca = smoothstep(D.from, D.full, g.timbre) * (1 - smoothstep(D.fade, D.gone, g.timbre));
  const glass = smoothstep(S.diatomFrom, S.diatomFull, g.timbre);
  const cocco = c.kind === 7, crypto = c.kind === 8;
  const asp = cocco ? 1 : crypto ? S.cryptoAspect : pennate ? aspect : 1 + (aspect - 1) * (1 - glass) * (1 - theca);
  const a = rpx * Math.sqrt(asp), b = rpx / Math.sqrt(asp);
  const ca = Math.cos(angle), sa = Math.sin(angle);
  const p = 2 + g.timbre * S.squareness;
  const polyR = rpx * S.polygonScale, apothem = sides ? Math.cos(Math.PI / sides) : 1;
  const detail = theca > 0.5 && rpx >= D.detailR;

  // Dinoflagellate bodies, in the body frame: u runs apex (u < 0) to antapex, v across
  const da = rpx * D[dino].a, db = rpx * D[dino].b, cingU = D[dino].cingulum * da;
  const softQ = (u, v, sw) => {
    if (crypto) {   // a slipper: the belly flatter, narrowing toward the back
      const bb = b * (v > 0 ? 1 : S.cryptoBelly) * (1 - S.cryptoTaper * u / a);
      return Math.sqrt((u / (a * sw)) * (u / (a * sw)) + (v / (bb * sw)) * (v / (bb * sw)));
    }
    return Math.pow(Math.pow(Math.abs(u / (a * sw)), p) + Math.pow(Math.abs(v / (b * sw)), p), 1 / p);
  };
  const dinoQ = (u, v, sw) => {
    if (dino === 'prorocentrum') {                    // egg narrowing toward the apex
      const bb = db * (1 + D.prorocentrum.taper * u / da);
      return Math.sqrt((u / da) * (u / da) + (v / bb) * (v / bb)) / sw;
    }
    const e = Math.sqrt((u / da) * (u / da) + (v / db) * (v / db)) / sw;
    return dino === 'alexandrium' ? e * (1 + D.alexandrium.plates * Math.cos(6 * Math.atan2(v, u))) : e;
  };
  const glassQ = (u, v, sw) => {
    if (pennate) {                                    // boat: pointed at both ends
      const fu = Math.abs(u) / (a * sw);
      if (fu >= 1) return 1 + fu;
      return Math.max(fu, Math.abs(v) / (b * sw * (1 - fu * fu)));
    }
    const r = Math.sqrt(u * u + v * v);
    if (!sides) return r / (rpx * sw);
    const seg = TAU / sides, m = mod(Math.atan2(v, u), seg) - seg / 2;
    return r * Math.cos(m) / (polyR * sw * apothem);
  };
  const shape = (u, v, sw) => {
    let q = softQ(u, v, sw);
    if (theca > 0) q = q * (1 - theca) + dinoQ(u, v, sw) * theca;
    if (glass > 0) q = q * (1 - glass) + glassQ(u, v, sw) * glass;
    return q;
  };

  // Setae (only once big enough on screen, and not on armoured dinoflagellates): horns at polygon corners,
  // polar spines on elongated cells, corner spines on squat box-like cells, radial spines on round ones
  const sk = clamp((g.coupling - S.setaeFrom) / (1 - S.setaeFrom), 0, 1);
  const setaeLen = rpx >= S.setaeMinR && theca < 0.5 && !cocco && !crypto ? sk * S.setaeLen * rpx : 0;   // no spines on chalk plates or cryptophytes
  const setae = [];
  if (setaeLen >= S.setaeMin) {
    const bend = () => linSetae.range(-1, 1) * S.setaeBend;
    if (glass > 0.5 && sides) {
      for (let k = 0; k < sides; k++) setae.push({ du: Math.cos(k * TAU / sides), dv: Math.sin(k * TAU / sides), bend: bend() });
    } else if (aspect >= S.polarAspect) {
      for (const su of [1, -1]) setae.push({ du: su, dv: 0, bend: bend() });
    } else if (p >= S.cornerSetaeP && glass < 0.5) {
      for (const [su, sv] of [[1, 1], [1, -1], [-1, 1], [-1, -1]]) setae.push({ du: su * a, dv: sv * b, bend: bend() });
    } else {
      const n = 2 + linSetae.int(4), off = linSetae.next() * TAU;
      for (let k = 0; k < n; k++) setae.push({ du: Math.cos(off + k * TAU / n), dv: Math.sin(off + k * TAU / n), bend: bend() });
    }
    for (const s of setae) {
      const len = Math.sqrt(s.du * s.du + s.dv * s.dv);
      s.du /= len; s.dv /= len;
      s.start = 1 / shape(s.du, s.dv, 1);
    }
  }

  // Chloroplasts: one cup in small cells, several discs in large ones.
  // A cell whose hue sits near the next colour carries some chloroplasts of that colour.
  const nPl = 1 + Math.floor((g.size - GENES.size[0]) * S.plastidsPerSize);
  const pMix = clamp((hueMix(c) - S.mixFrom) / (1 - S.mixFrom), 0, 1) * S.mixMax;
  const plastids = [];
  for (let k = 0; k < nPl; k++) {
    const ang = linPl.next() * TAU, rad = nPl === 1 ? S.cupOffset : linPl.range(0.15, 0.5);
    plastids.push({
      u: Math.cos(ang) * rad * a, v: Math.sin(ang) * rad * b,
      r: Math.max(S.plastidMinR, (nPl === 1 ? S.cupR : S.plastidR) * rpx * own.range(0.85, 1.15)),
      ph: linPl.next() * TAU,
      alt: c.hunter && c.plastids && c.plastids.length && k < Math.ceil(c.klepto * nPl) ? ALT * (2 + k % c.plastids.length)   // stolen
        : hash01(seed + k * 977) < pMix ? ALT : 0,
    });
  }

  if (crypto && plastids.length) {   // one big chloroplast along the back
    plastids.length = 1;
    Object.assign(plastids[0], { u: 0.05 * a, v: 0.3 * b, r: Math.max(S.plastidMinR, 0.55 * rpx) });
  }
  // Coccoliths: points spread over a sphere (a golden spiral), turned with the cell
  const plates = [];
  if (cocco && rpx >= S.plateMinR) {
    const n = clamp(Math.round(rpx * S.platesPerR), S.platesMin, S.platesMax), off = lin.next() * TAU;
    for (let i = 0; i < n; i++) {
      const pz = 1 - 2 * (i + 0.5) / n, r = Math.sqrt(1 - pz * pz), an = i * 2.39996 + off;
      const qx = Math.cos(an) * r, qy = Math.sin(an) * r;
      plates.push({ x: qx * ca - qy * sa, y: qx * sa + qy * ca, z: pz });
    }
    plates.sort((p, q) => p.z - q.z);
  }

  // Tripos horns as tapered curves (body-frame control points, in units of rpx)
  const horns = detail && dino === 'tripos' ? D.tripos.horns : [];
  const hornExt = horns.length ? rpx * D.tripos.reach : 0;
  const listExt = detail && dino === 'dinophysis' && rpx >= D.dinophysis.listsFromR ? da * D.dinophysis.collarReach : 0;

  const ornament = glass > S.ornamentFrom && rpx >= S.ornamentMinR;
  const striae = Math.max(6, Math.floor(TAU * rpx / S.striaeSpacing));
  const bodyExt = Math.max(a, b, glass > 0 && sides ? polyR : 0, theca > 0 ? Math.max(da, db) * 1.1 : 0, plates.length ? rpx * (S.plateR + S.plateA) : 0) * (1 + S.breathe);
  const half = Math.ceil(Math.max(bodyExt + setaeLen, hornExt, listExt + 1)) + 2, size = half * 2 + 1;
  const lo = Math.max(0, half - Math.ceil(bodyExt) - 1), hi = Math.min(size - 1, half + Math.ceil(bodyExt) + 1);
  const toSprite = (u, v) => [Math.round(u * ca - v * sa) + half, Math.round(u * sa + v * ca) + half];
  const frames = [];
  for (let f = 0; f < S.frames; f++) {
    const ph = TAU * f / S.frames, sw = 1 + S.breathe * Math.sin(ph) * (1 - glass) * (1 - theca);   // armour doesn't breathe
    const tones = new Int8Array(size * size).fill(-1);
    const inside = new Uint8Array(size * size);
    const uAt = new Float32Array(size * size), vAt = new Float32Array(size * size);
    for (let py = lo; py <= hi; py++) {
      for (let px = lo; px <= hi; px++) {
        const dx = px - half, dy = py - half;
        const u = dx * ca + dy * sa, v = -dx * sa + dy * ca, k = py * size + px;
        if (shape(u, v, sw) <= 1) { inside[k] = 1; uAt[k] = u; vAt[k] = v; }
      }
    }
    const pl = plastids.map((P) => {
      const u = P.u + Math.sin(ph + P.ph) * S.stream * z, v = P.v + Math.cos(ph + P.ph) * S.stream * z;
      return { x: u * ca - v * sa, y: u * sa + v * ca, r: P.r, alt: P.alt };
    });
    const isIn = (px, py) => px >= 0 && py >= 0 && px < size && py < size && inside[py * size + px] === 1;
    const cw = Math.max(D.grooveMin, D.groove * rpx);

    for (let py = lo; py <= hi; py++) {
      for (let px = lo; px <= hi; px++) {
        const k = py * size + px;
        if (!inside[k]) continue;
        const dx = px - half, dy = py - half, b4 = bayer(px, py), dth = (b4 - 0.5) * S.dither;
        const u = uAt[k], v = vAt[k];
        // Translucent cytoplasm, darker toward the lower right
        let tone = (-dx - dy) / (bodyExt * 1.4142) + dth < S.cytoShade ? OUTLINE : SHADOW;
        if (g.timbre > S.girdleFrom && glass < 0.5 && theca < 0.5 && Math.abs(u) < 0.5) tone = BASE;   // girdle seam
        if (crypto && u < -0.15 * a && u > -0.85 * a && Math.abs(v + 0.35 * b) < 0.6) tone = OUTLINE;   // the cryptophyte's furrow
        if (ornament) {
          if (pennate) {
            const fu = Math.abs(u) / a, edge = Math.abs(v) / (b * (1 - fu * fu));
            if (Math.abs(v) < 0.5 && fu < 0.85) tone = fu < 0.12 ? BRIGHT : HIGHLIGHT;    // raphe and central nodule
            else if (edge > 0.35 && (Math.round(u) & 1) === 0) tone = BASE;              // transverse striae
          } else {
            const rn = Math.sqrt(u * u + v * v) / rpx;
            if (rn < 0.18) tone = HIGHLIGHT;                                               // central annulus
            else if (areolae) { if (rn > 0.3 && (px & 1) === 0 && ((py + (px & 2)) & 1) === 0) tone = BASE; }
            else if (rn > 0.35 && (Math.floor(mod(Math.atan2(v, u), TAU) / TAU * striae) & 1) === 0) tone = BASE;
          }
        }
        for (let j = pl.length - 1; j >= 0; j--) {   // front-most chloroplast wins
          const P = pl[j], ex = dx - P.x, ey = dy - P.y, d = Math.sqrt(ex * ex + ey * ey) / P.r;
          if (d > 1) continue;
          const s = (-ex - ey) / (P.r * 1.4142) * S.plastidLit + (1 - d) * (1 - S.plastidLit) + dth;
          tone = P.alt + (s > S.toneBright ? BRIGHT : s > S.toneHigh ? HIGHLIGHT : BASE);
          break;
        }
        if (theca > 0.5) {
          // Cingulum: the transverse groove that holds the beating transverse flagellum, slightly spiralled
          const gu = u - cingU - D.spiral * v;
          if (Math.abs(gu) < cw) tone = (Math.round(v) + f) % 3 === 0 ? HIGHLIGHT : OUTLINE;
          else if (gu < 0 && gu > -cw - 1) tone = HIGHLIGHT;                               // lit lip of the groove
          else if (dino !== 'dinophysis' && dino !== 'prorocentrum' && Math.abs(v) < 0.5 && u > cingU && u < cingU + D.sulcus * da) tone = OUTLINE;   // sulcus
          else if (dino === 'prorocentrum' && Math.abs(v) < 0.5) tone = BASE;              // suture between the two valves
          else if (dino === 'alexandrium' && rpx >= D.alexandrium.platesFromR && Math.abs(mod(Math.atan2(v, u) + (u < cingU ? 0.3 : 0), TAU / 6) - TAU / 12) < 0.06) tone = SHADOW;   // thecal plate seams
        }
        // Rim: lit on the upper left (iridescent on glass), selective dark outline on the lower right
        const lowerRight = !isIn(px + 1, py) || !isIn(px, py + 1);
        const upperLeft = !isIn(px - 1, py) || !isIn(px, py - 1);
        if (upperLeft) tone = glass > S.iridFrom && b4 < glass ? IRIDESCENT : HIGHLIGHT;
        else if (lowerRight) tone = glass > S.iridFrom && b4 < glass * S.rimIrid ? IRIDESCENT : g.timbre > S.glassFrom || theca > 0.5 ? BASE : OUTLINE;
        if (cocco && !plates.length && b4 < 0.3 && (dx + dy) < 0) tone = PLATE;   // too small for plates: chalk flecks
        tones[k] = tone;
      }
    }
    // Coccoliths: oval shields over the cell, far side first, each with a raised rim, radial spokes and a pale centre
    for (const P of plates) {
      if (P.z < -0.15) continue;
      const Rs = rpx * S.plateR, A = Rs * S.plateA, B = A * Math.max(0.35, P.z), len = Math.hypot(P.x, P.y) || 1;
      const ux = -P.y / len, uy = P.x / len, cx0 = half + P.x * Rs, cy0 = half + P.y * Rs, lit = -(P.x + P.y) * 0.7 + P.z * 0.5;
      for (let py = Math.floor(cy0 - A - 1); py <= cy0 + A + 1; py++) {
        for (let px = Math.floor(cx0 - A - 1); px <= cx0 + A + 1; px++) {
          if (px < 0 || py < 0 || px >= size || py >= size) continue;
          const ex = px - cx0, ey = py - cy0, pu = (ex * ux + ey * uy) / A, pv = (ex * P.x / len + ey * P.y / len) / B, e = Math.hypot(pu, pv);
          if (e > 1) continue;
          tones[py * size + px] = e > 0.95 ? PLATE_EDGE : e > 0.8 ? (lit > 0.2 ? PLATE_LIT : PLATE) : e < 0.28 ? PLATE_CENTRE
            : (Math.floor((Math.atan2(pv, pu) / TAU + 1) * 14) & 1) ? PLATE : SPOKE;
        }
      }
    }

    // Dinophysis: the flared cingular collar at the apex and the sail-like sulcal list, as thin translucent membranes
    if (listExt) {
      const L = D.dinophysis;
      for (let py = 0; py < size; py++) {
        for (let px = 0; px < size; px++) {
          const k = py * size + px;
          if (inside[k]) continue;
          const dx = px - half, dy = py - half, u = dx * ca + dy * sa, v = -dx * sa + dy * ca;
          const t = (-u - L.collarFrom * da) / ((L.collarReach - L.collarFrom) * da);              // 0 at its base, 1 at its rim
          const collar = t >= 0 && t <= 1 && Math.abs(v) < db * (L.collarBase + t * L.collarFlare);
          const s = (u + L.sailFrom * da) / ((L.sailFrom + L.sailTo) * da);
          const sail = s >= 0 && s <= 1 && v > db * 0.6 && v < db * 0.6 + rpx * L.sailDepth * Math.sin(Math.PI * s);
          if (!collar && !sail) continue;
          // An open funnel: lit flaring sides and a sparse lip; the sail has a lit outer edge
          const b4 = bayer(px, py);
          const rimEdge = collar
            ? Math.abs(v) > db * (L.collarBase + t * L.collarFlare) - 1 || (t > 0.9 && b4 < 0.5)
            : v > db * 0.6 + rpx * L.sailDepth * Math.sin(Math.PI * s) - 1;
          if (rimEdge) tones[k] = HIGHLIGHT;
          else if (b4 < 0.3) tones[k] = SHADOW;
        }
      }
    }
    // Tripos horns: tapered, lit on one side
    for (const hn of horns) {
      for (let t = 0; t <= 1; t += 0.5 / (rpx * D.tripos.reach)) {
        const mt = 1 - t;
        const hu = (mt * mt * hn[0] + 2 * mt * t * hn[2] + t * t * hn[4]) * rpx;
        const hv = (mt * mt * hn[1] + 2 * mt * t * hn[3] + t * t * hn[5]) * rpx + Math.sin(ph) * t * D.tripos.sway;
        const wdt = D.tripos.width * (1 - t * 0.7);
        for (let o = -wdt; o <= wdt; o += 0.5) {
          const [px, py] = toSprite(hu, hv + o);
          if (px < 0 || py < 0 || px >= size || py >= size || inside[py * size + px]) continue;
          tones[py * size + px] = o < -wdt + 0.6 ? HIGHLIGHT : t > 0.8 ? SHADOW : BASE;
        }
      }
    }
    // Prorocentrum: a small apical tooth
    if (detail && dino === 'prorocentrum') {
      for (let t = 0; t <= D.prorocentrum.tooth * rpx; t += 0.5) {
        const [px, py] = toSprite(-da - t, 0);
        if (px >= 0 && py >= 0 && px < size && py < size && !inside[py * size + px]) tones[py * size + px] = HIGHLIGHT;
      }
    }
    for (const s of setae) {
      const flex = s.bend + Math.sin(ph + s.start) * S.setaeBend * 0.3;
      for (let t = 0; t <= setaeLen; t += 0.5) {
        const along = s.start + t, side = flex * t * t / setaeLen;
        const u = s.du * along - s.dv * side, v = s.dv * along + s.du * side;
        const [px, py] = toSprite(u, v);
        if (px < 0 || py < 0 || px >= size || py >= size || inside[py * size + px]) continue;
        // Long, faint silica spines: solid at the base, dissolving toward the tip
        const tipFrac = t / setaeLen;
        if (tipFrac > S.setaeFadeFrom && bayer(px, py) < (tipFrac - S.setaeFadeFrom) / (1 - S.setaeFadeFrom)) continue;
        tones[py * size + px] = t < S.setaeSolid ? BASE : SHADOW;
      }
    }
    frames.push(tones);
  }
  return { key, half, size, frames, a: theca > 0.5 ? da : a };
}

// Rebuilds are rationed per frame; past the budget a cell keeps its previous sprite for a moment, but never one built
// for another zoom (it would be drawn at that zoom's size): until it is rebuilt, it is a speck.
function spriteFor(c, rpx, step) {
  const key = (((c.pv * 5 + Math.ceil(c.klepto * 4)) * 4096 + c.gen * 9 + Math.round(c.elder * 8)) * ZOOMS.length + cam.level) * PARAMS.sprite.tumbleSteps + step;   // elders grow, plastids are stolen and fade: rebuild
  const s = c.spr;
  if (s && s.key === key) return s;
  if (s && builds >= PARAMS.sprite.minBuilds && performance.now() > buildDeadline) return s.level === cam.level ? s : SPECK;
  builds++;
  c.spr = buildSprite(c, rpx, step * TAU / PARAMS.sprite.tumbleSteps, cam.zoom, key);
  c.spr.level = cam.level;
  return c.spr;
}

// Slow tumbling: each cell turns at its own pace with a gentle sway
// Swimming, visual only. Every cell runs its own clock at its own tempo, so cells at 1x, 3x, 6x and 8x share the water.
// Activity shows how a cell is doing: flagellates follow their recorded growth conditions (vigor) and sleep at night;
// dinoflagellates swim at night while they have energy and rest by day. Diatoms have no flagella and only rock.
let swimTick = -1;
function updateSwim(w, ta) {
  const Sw = PARAMS.swim, Dn = PARAMS.dino, dark = 1 - smoothstep(PARAMS.drift.darkLo, PARAMS.drift.darkHi, w.surfaceLight);
  const dS = swimTick < 0 ? 0 : clamp((w.tick - swimTick) * TICK_DT, 0, 1);   // simulated seconds since the last frame
  swimTick = w.tick;
  const [sLo, sHi] = GENES.size, [oLo, oHi] = GENES.omega;
  for (const c of w.cells) {
    if (c.dying) continue;
    const h1 = hash01(c.id * 17 + 1), h2 = hash01(c.id * 17 + 2), h3 = hash01(c.id * 17 + 3), h4 = hash01(c.id * 17 + 4), tb = c.g.timbre;
    const motile = 1 - smoothstep(Dn.fade, Dn.gone, tb);
    const nocturnal = smoothstep(Dn.from, Dn.full, tb);
    const dayAct = (1 - dark) * (Sw.awake + (1 - Sw.awake) * clamp(c.vigor / Sw.vigorFull, 0, 1));
    const nightAct = dark * clamp(c.energy * 2, 0, 1) + (1 - dark) * 0.1;
    const act = dayAct + (nightAct - dayAct) * nocturnal;
    // Species temper: small, quick-pulsing cells are the fastest swimmers
    const temper = Sw.temperMin + (1 - Sw.temperMin) * (0.5 * (sHi - c.g.size) / (sHi - sLo) + 0.5 * (c.g.omega - oLo) / (oHi - oLo));
    const target = 1 + (Sw.tempoMax - 1) * act * temper * motile;
    c.tempo += (target - c.tempo) * Math.min(1, dS / Sw.tempoEase);
    c.vt += dS * c.tempo;
    // Wandering leash: smooth, Brownian-looking darting around the true position
    const L = Sw.leash * motile * (Sw.sleepLeash + (1 - Sw.sleepLeash) * act), p = c.vt * Sw.wanderRate;
    const wx = L * (0.6 * Math.sin(p * (0.7 + 0.6 * h1) + h2 * TAU) + 0.4 * Math.sin(p * (1.6 + 0.8 * h3) + h4 * TAU));
    const wy = L * (0.6 * Math.sin(p * (0.7 + 0.6 * h3) + h1 * TAU) + 0.4 * Math.sin(p * (1.6 + 0.8 * h2) + h3 * TAU)) * 0.8;
    // Helix on top: the flagellar corkscrew
    const period = Sw.periodMin + h2 * (Sw.periodMax - Sw.periodMin);
    c.swimPh += dS * c.tempo * TAU / period;
    const amp = Sw.amp * motile * (0.3 + 0.7 * act), a = c.swimPh + h1 * TAU;
    const rock = Sw.rock * (1 - motile) * Math.sin(ta * TAU / Sw.rockPeriod + h1 * TAU);
    c.ox = wx + amp * Math.cos(a) + rock;
    c.oy = wy + amp * Sw.flatten * Math.sin(a) + rock * 0.5;
  }
  // Chains swim as one body: every cell takes the head's motion, on a shorter leash the longer the chain
  const CL = PARAMS.chainLook;
  for (const c of w.cells) {
    if (c.la || !c.lb) continue;
    const k = 1 / (1 + CL.leashPerCell * (chainLength(c) - 1)), ox = c.ox * k, oy = c.oy * k;
    for (let q = c; q; q = q.lb) { q.ox = ox; q.oy = oy; }
  }
}

// Chained cells line up along the chain: dinoflagellates apex to antapex and pennate boats end to end,
// round and box-like cells stacked valve to valve like coins. The whole chain sways gently.
function chainAngle(c, t) {
  const a = c.la || c, b = c.lb || c, CL = PARAMS.chainLook, head = chainHead(c);
  if (c.along === null) c.along = c.habit !== 2 && (lineagePennate(c.spriteSeed) || dinoWeight(c.g.timbre) > 0.5);   // stars radiate
  return Math.atan2(b.y - a.y, b.x - a.x) + (c.along ? 0 : Math.PI / 2) + CL.sway * Math.sin(t * CL.swaySpeed + head.id);
}

// Spin is a lineage trait (relatives turn alike) shaped by form: dinoflagellates whirl, diatoms barely turn
function tumbleAngle(c, t) {
  const S = PARAMS.sprite, Dn = PARAMS.dino, h1 = hash01(c.id * 13 + 5), h2 = hash01(c.id * 13 + 6);
  const lineage = S.spinMin + (S.spinMax - S.spinMin) * hash01(c.spriteSeed * 7 + 3);
  const form = 1 + (S.dinoSpin - 1) * dinoWeight(c.g.timbre) - (1 - S.diatomSpin) * smoothstep(Dn.fade, Dn.gone, c.g.timbre);
  const spin = (h2 < 0.5 ? -1 : 1) * S.maxSpin * lineage * form * (0.75 + 0.5 * h2);
  return h1 * TAU + spin * t + S.sway * Math.sin(t * S.swaySpeed + h1 * TAU);
}

// Soft (non-frustule) cells carry flagella that beat with the cell's own phase theta
function drawFlagella(c, cx, cy, angle, rpx, spr, base) {
  const F = PARAMS.flagella;
  if (c.g.timbre > F.maxTimbre || rpx < F.minR || c.kind === 7) return;   // coccolithophores: no flagella drawn
  const crypto = c.kind === 8, n = crypto || c.g.size > F.pairSize ? 2 : 1, len = rpx * F.length, amp = rpx * F.amp, phase = c.theta * F.beat;
  const back = angle + Math.PI, ox = cx + Math.cos(back) * spr.a * 0.9, oy = cy + Math.sin(back) * spr.a * 0.9;
  for (let k = 0; k < n; k++) {
    const dir = back + (n === 2 ? (k ? F.spread : -F.spread) : 0), dx = Math.cos(dir), dy = Math.sin(dir);
    const lk = crypto && k ? len * 0.75 : len;   // a cryptophyte's two flagella are unequal
    for (let s = 0; s <= lk; s += 0.5) {
      const f = s / len, side = amp * f * Math.sin(f * TAU * F.waves - phase);
      const x = Math.round(ox + dx * s - dy * side), y = Math.round(oy + dy * s + dx * side);
      if (x < 0 || y < 0 || x >= W || y >= H) continue;
      if (f > 0.6 && wb(x, y) < (f - 0.6) * 2.5) continue;
      view.ibuf[y * W + x] = base + (f < 0.4 ? BASE : SHADOW);
    }
  }
}

// Fixed templates for cells too small on screen to show a form
const SPECK = { key: -1, half: 0, size: 2, a: 1, frames: [0, 0, 0].map(() => Int8Array.of(HIGHLIGHT, BASE, BASE, SHADOW)) };
const DOT = { key: -1, half: 0, size: 1, a: 1, frames: [0, 0, 0].map(() => Int8Array.of(HIGHLIGHT)) };
// Coccolith colours, by tone (lit rim, rim, spokes, centre, overlap edge), and a step darker for deep water
const PLATE_IDX = [COL.GLOW, COL.FOAM, rampBase(LIGHTBLUE) + BRIGHT, rampBase(LIGHTBLUE) + HIGHLIGHT, rampBase(LIGHTBLUE) + SHADOW];
const LIGHT_DOWN = new Uint8Array(PALETTE_HEX.length).map((_, i) => i);
LIGHT_DOWN[COL.GLOW] = COL.FOAM; LIGHT_DOWN[COL.FOAM] = COL.SHAFT;
for (let t = 1; t < COL.TONES; t++) LIGHT_DOWN[rampBase(LIGHTBLUE) + t] = rampBase(LIGHTBLUE) + t - 1;
// Iridescent pixels cycle through the bright ends of every pigment ramp
const IRID_SET = HUE_WHEEL.map((r) => rampBase(r) + BRIGHT).concat([COL.FOAM]);

function drawCell(c, tick, t) {
  if (c.eaten) return;                                   // swallowed: gone at once
  const S = PARAMS.sprite, z = cam.zoom, rpx = c.rv * z;
  const cx = toSX(c.x + c.ox), cy = toSY(c.y + c.oy), reach = rpx * (2 + S.setaeLen) + 4;
  if (cx < -reach || cy < -reach || cx > W + reach || cy > H + reach) return;
  const steps = S.tumbleSteps, angle = c.la || c.lb ? chainAngle(c, t) : tumbleAngle(c, c.vt);   // tumbles on its own clock unless chained
  const step = mod(Math.round(angle / TAU * steps), steps);
  const sung = songLevel(c);
  const spr = rpx < S.dotR && sung < PARAMS.song.swell ? DOT : rpx < S.speckR ? SPECK : spriteFor(c, rpx, step);   // a singing dot swells
  const irPhase = step + c.id + Math.floor(t * S.iridSpeed);
  const base = rampBase(hueRamp(c)), base2 = rampBase(hueNeighbour(c)), stolen = c.plastids;
  if (!c.dying && spr.key >= 0) drawFlagella(c, cx, cy, step * TAU / steps, rpx, spr, base);

  const frame = (Math.floor(tick * S.wobbleFps / PARAMS.time.tickRate) + c.id) % S.frames;
  const tones = spr.frames[frame], size = spr.size, x0 = cx - spr.half, y0 = cy - spr.half;
  const lum = glowing(c), pulse = Math.max(flashLevel(c, tick) * (lum ? glowNight : PARAMS.flash.cellLift), sung * PARAMS.song.lift);
  const fade = c.dying ? c.dying / PARAMS.death.fadeTicks : 0, old = c.elder * PARAMS.elderLook.darken;
  const depth = c.y / H, dark = depth > R.deepFrom ? (depth - R.deepFrom) / (1 - R.deepFrom) * R.deepDarken : 0;
  const ib = view.ibuf, bx0 = view.bx0, by0 = view.by0, cw = 2 * R.causticWidth / z;
  for (let py = 0; py < size; py++) {
    const sy = y0 + py;
    if (sy < 0 || sy >= H) continue;
    const by = by0 + sy, wy = (by + 0.5) / z;
    const sl = shaftFade(wy) * R.cellLight;
    const cl = wy < CAUSTIC_H ? Math.pow(1 - wy / CAUSTIC_H, R.causticFade) * R.cellCaustic * dayLight : 0;
    for (let px = 0; px < size; px++) {
      const t0 = tones[py * size + px];
      if (t0 === -1) continue;
      const sx = x0 + px;
      if (sx < 0 || sx >= W) continue;
      const bx = bx0 + sx, b = BAYER[((by & 3) << 2) | (bx & 3)];
      if (fade > 0 && b < fade) continue;                                       // death: dissolve
      const muted = dark > 0 && BAYER[(((by + 2) & 3) << 2) | ((bx + 1) & 3)] < dark;   // deep water mutes colour
      let idx;
      if (t0 === IRIDESCENT) {
        idx = muted ? base + BASE : IRID_SET[mod(irPhase + ((bx + 2 * by) >> 1), IRID_SET.length)];
      } else if (t0 <= PLATE_LIT) {
        idx = PLATE_IDX[PLATE_LIT - t0];
        if (muted) idx = LIGHT_DOWN[idx];
      } else {
        const slot = t0 >= ALT ? Math.floor(t0 / ALT) : 0;   // 0 own, 1 the neighbouring colour, 2.. stolen plastids
        let tt = t0 - slot * ALT;
        if (muted && tt > 0) tt--;
        if (old > 0 && tt > 0 && BAYER[(((by + 1) & 3) << 2) | ((bx + 2) & 3)] < old) tt--;   // elders darken
        idx = (slot === 0 ? base : slot === 1 ? base2 : stolen && stolen[slot - 2] !== undefined ? rampBase(stolen[slot - 2]) : base) + tt;
      }
      if (pulse > 0) {
        const pb = BAYER[(((by + 1) & 3) << 2) | ((bx + 3) & 3)];
        if (lum) { if (pb < pulse) idx = GLOW + (pb < pulse * 0.5 ? BRIGHT : HIGHLIGHT); }   // blue-green bioluminescence
        else if (pb < pulse) idx = LIGHT_UP[idx];                                              // soft swell
      }
      if (sl > 0 || cl > 0) {                                                    // light shafts and caustics play over the cell
        const wx = (bx + 0.5) / z + rowShift[sy];
        let lit = sl > 0 ? shaftAt(wx, wy) * sl * murkCol[sx] : 0;
        if (cl > 0 && causticAt(wx, wy) < cw) lit += cl;
        if (BAYER[(((by + 3) & 3) << 2) | ((bx + 1) & 3)] < lit) idx = LIGHT_UP[idx];
      }
      ib[sy * W + sx] = idx;
    }
  }
}

const drawOrder = [];
function drawCells(w, t) {
  drawOrder.length = 0;
  for (let i = 0; i < w.cells.length; i++) drawOrder.push(w.cells[i]);
  drawOrder.sort((p, q) => q.rv - p.rv || p.id - q.id);
  for (let i = 0; i < drawOrder.length; i++) drawCell(drawOrder[i], w.tick, t);
}

// ---- Bioluminescence ----
// At night disturbed water sets them flashing: visitors brushing past, breaking chop near the surface
let glowNight = 0, glowSeen = -1;
function updateGlow(w) {
  const G = PARAMS.glow, V = PARAMS.visitors;
