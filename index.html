<script>
'use strict';

// ===== PARAMS =====
// Units: world units (the whole column is 180x320; at zoom 1 one unit is one screen pixel) and seconds.
// Energy is per unit biomass: a cell divides at 1 and each daughter starts at 0.5.
const PARAMS = {
  world: { w: 180, h: 320, floor: 18 }, // floor: sediment thickness at the bottom
  time: { tickRate: 30, maxTicksPerFrame: 8, speeds: [1, 2, 4, 8],   // time-lapse: ?speed= or the [ and ] keys
          slowEvery: 3 },   // the water's slow fields (light, mixing, heat, salt, oxygen, snow, cyanobacteria, grazers) step every slowEvery ticks, staggered, with that much longer a step: they change over seconds to minutes, and stepping them 30 times a second cost most of the time
  grid: { cols: 24, rows: 40 },
  hash: { cell: 12 },                   // must be >= the largest interaction distance
  cell: { rMin: 1.25, rMax: 4, drawScale: 0.5 },   // body radius at size 0.6 .. 1.6; cells are drawn at half of it

  light: { surface: 1.0, atten: 4.0, shade: 0.06 },  // e-folding depth = a quarter of the column
  // shade (approved local rule, self-shading): light below also fades by e^(-shade x living biomass above it in the
  // column), cells and cyanobacteria, so a dense surface bloom dims the water beneath it and limits its own depth
  // Diel cycle. Phase 0 is sunrise; the sun is up for dayFrac of the cycle, light = sqrt(sin) (sharp twilights).
  // ?day=5|10|30 picks the day length in minutes.
  // At night cells rest (circadian clock): upkeep and ageing slow to `rest` as the sun goes down.
  diel: { dayLength: 300, dayMinutes: [5, 10, 30], start: 0.08, dayFrac: 0.65, moon: 1e-6, rest: 0.12 },   // moon: half-moon light, a millionth of noon (Gaston et al. 2013): too faint to grow on
  // Wind: a slow seeded weather process. Its target changes at random intervals (calm spells common,
  // storms rarer) and the wind eases toward it. It roughens the water and drives upwelling.
  wind: { tau: 40, gapMin: 60, gapMax: 180, start: 0.2 },
  // Nutrient pulses: wind-driven upwelling. During strong wind a plume of deep water rises from the floor.
  pulses: { storm: 0.6, rate: 0.05, refractory: 150, amount: 60, width: 16, rise: 2.5, top: 0.3 },
  nutrients: {
    deep: 1.0,                          // concentration of upwelled deep water (held below the bottom row)
    surface: 0.2,                       // initial surface concentration
    clineTop: 0.1, clineBottom: 0.7,    // initial nutricline, as fractions of depth
    diffusion: 0.3,                     // grid nodes^2 per second
    upwelling: 1.0,                     // coupling of the bottom row to deep water
  },
  // Silicate (approved local rule): diatoms need silica for their glass. Only glass cells take it, in proportion to how
  // much glass they have; their growth slows as it runs low (half: half-saturation). It stays in the frustule until the
  // cell dies, then mostly sinks (dissolve: share that dissolves where it dies; the rest falls to the floor), so it
  // returns far more slowly than nutrients. A diatom bloom strips the surface of silica and opens the water to
  // flagellates and dinoflagellates: the seasonal succession. ratio: silica taken per unit of nutrient.
  // Deep water, the nutricline, diffusion and upwelling plumes carry it like nutrients.
  silica: { deep: 1.0, surface: 0.2, half: 0.12, ratio: 0.6, dissolve: 0.3, upwelling: 1.0 },
  // Dinophysis steals its chloroplasts (approved local rule, kleptoplasty): a Dinophysis-form cell strikes a cell it
  // meets (rate per s while one is within its reach, in units beyond both radii), keeps assimilate of its nutrients
  // (the rest is excreted in place) and energy of its energy, and keeps one of its chloroplasts (the last plastids
  // prey colours are remembered). Stolen plastids fade (fade: s to 1/e; refill: what one meal restores); without them
  // it photosynthesises at dark of its rate, so it must keep hunting. It meets the commonest prey most: it eats the winner.
  // Viruses (approved local rule): host-specific, so each kind of cell (its form, as the notebook counts them) has its
  // own. A cell's risk of lysis rises steeply with the biomass of its own kind around it (per grid node; half: where
  // the risk is half its top rate), so whatever crowds the water is hit hardest: kill the winner. A lysed cell bursts
  // quietly; recycled of its nutrients go straight back where it burst (the viral shunt), the rest sinks.
  virus: { rate: 0.007, half: 0.8, recycled: 0.9, cocco: 2.5 },   // cocco: their own virus is fiercer (EhV ends Emiliania blooms)
  // Cyanobacteria (approved local rule, author): far too small and many to be cells, so they live as two fields of
  // biomass per grid node (units like a cell's biomass; nutrient content q per unit). Synechococcus-type (syn: pink-orange
  // phycoerythrin, bright surface water) and Prochlorococcus-type (pro: blue-green, a dim-light specialist: light felt as
  // L(1 + dim)/(L + dim)). Each grows at growth x light x N/(N + half) (the best uptake of all: they win in poor, calm
  // water), toward max per node; respires (back to the water); is eaten by the grazers (who grow on it too); and is
  // lysed by its own phages, hardest where dense (phage x C^2/(C^2 + phageHalf^2)). Never quite gone: a trace drifts in
  // from the open ocean (floor, counted as imported). Slow swirling currents (speed units/s, stronger in wind; wave:
  // their size in units; turn: how fast the pattern changes) carry the fields every advectEvery ticks, so blooms drift
  // as plumes; diffusion spreads them.
  cyano: {
    growth: 0.025, half: 0.04, max: 1.5, respire: 0.004, q: 0.65, phage: 0.04, phageHalf: 0.8, floor: 0.002, diffusion: 0.15,
    syn: { dim: 0 }, pro: { dim: 1.5 },
    speed: 1.2, windSpeed: 2.5, wave: 70, turn: 0.004, advectEvery: 15,
    grazedRecycled: 0.7, lysedRecycled: 0.9,
  },
  // Trichodesmium (approved local rule, author): the bloom-forming cyanobacterium, colonies of filaments ("sea
  // sawdust"), a third field of biomass per node. It fixes its own nitrogen (fix: share of its nutrient drawn from the
  // air, counted as imported, so it fertilises poor water when it dies), grows slowly and only in warm water
  // (warmFrom..warmFull degrees), is hardly grazed (grazed: share of the grazers' pressure; it is toxic) and is lysed by
  // its own phages where dense. Gas vesicles: it rises at rise units/s, and ballast built in bright light turns it
  // down (v = rise x (ballast x L - 1)), so in calm water it gathers at the surface as a scum; wind mixing stirs it down.
  // It shades the water below (shade per unit) and a scum burns in full sun (burn per s in the surface row at full
  // light). Of what dies, recycled is returned in place; the rest sinks as marine snow (scums collapse and sink).
  tricho: { growth: 0.024, half: 0.03, fix: 0.7, warmFrom: 19, warmFull: 23, max: 4, respire: 0.002, q: 0.65,
            grazed: 0.15, phage: 0.045, phageHalf: 1.2, floor: 0.001, rise: 1.2, ballast: 1.4, shade: 0.12, burn: 0.004,
            diffusion: 0.1, recycled: 0.5, trace: 0.01 },   // trace: below it, in water too cold to grow, nothing happens but drift
  // Temperature (approved local rule): sunlight warms the water where it is absorbed (heat degrees/s at full light),
  // the surface row loses heat toward the air (cool per s, faster in wind: windCool), deep water is cold (deep; the
  // bottom layer is renewed by cold shelf water: vent per s at the floor, fading upward like the tide's stirring; the
  // seabed itself takes no heat). Heat diffuses slowly (diffusion, nodes^2/s): left alone the water stratifies.
  // Growth speeds up when warm: x q10^((T - ref)/10) for cells (q10) and cyanobacteria (cyanoQ10).
  temperature: { deep: 10, surface: 19, air: 15, heat: 0.026, cool: 0.001, windCool: 0.015, ref: 18, q10: 1.6, cyanoQ10: 2.2, diffusion: 0.008, vent: 0.002 },
  // Vertical mixing (approved local rules), nodes^2/s: base everywhere; the wind's stirring (at full wind, squared)
  // fading with depth over depth of the column; and the tide's over the seabed (author: tidal stirring makes a bottom
  // mixed layer, as on shelves), fading upward over tideDepth of the column. Stratification resists mixing (approved,
  // after Pacanowski & Philander 1981): both are divided by (1 + stratified x the step in degrees, warm over cold, to the
  // rows around)^2, so the wind mixes a uniform surface layer and stops at a sharp thermocline, deepening it in storms.
  // Where cold water lies over warm (the surface cooling at night) the water overturns: convect, as convective
  // adjustment does in ocean models, so the mixed layer also deepens by night.
  // It mixes heat, oxygen and Trichodesmium, and a share (nutrients) of it the nutrients and silica.
  // Stratification is judged by density: degrees of warmth, and salt (see salinity) counted in degrees.
  mixing: { base: 0.005, wind: 5, depth: 0.6, tide: 1.2, tideDepth: 0.1, stratified: 5, convect: 3, nutrients: 0.5 },
  // Tides (approved local rule): the tidal current floods and ebbs twice a lunar day (period, in days: 12.42 h of 24),
  // and its strength swings over the spring-neap cycle, springs at new and full moon (month: the synodic month, in
  // days; the current is 1 + range at springs, 1 - range at neaps, times its mean). The tide's stirring follows the
  // current squared (on average mixing.tide) and reaches higher off the seabed at springs (tideDepth x the spring-neap
  // strength). Where the current's stirring passes lift (x its mean), it lifts the floor deposit back into the water
  // as marine snow (resuspend per s of the excess, through the stirred layer) and the resting cysts (cysts per s of the
  // excess), which stay up for aloftMin..aloftMax s. The moon lights the night by its phase (diel.moon on average).
  tide: { period: 0.5175, month: 29.53, range: 0.4, lift: 1.5, resuspend: 0.004, cysts: 0.004, aloftMin: 30, aloftMax: 120 },
  // Salinity (approved local rule): the shelf's water is salt (shelf, psu). Runoff brings fresh water (the lens
  // freshens the water it spreads through by fresh, in psu over the nodes it reaches, like its nutrients); salt mixes and
  // diffuses as heat does, shelf water renews the bottom layer (at temperature.vent), and the shelf's salt water slowly
  // replaces the column from the sides (exchange per s: the plume spreads away). Density follows a linear equation of
  // state: one psu weighs as much as haline degrees of cooling (beta / alpha = 7.6e-4 / 2e-4), so fresh over salt
  // stratifies the column as warm over cold does, and the two resist mixing together.
  salinity: { shelf: 35, fresh: 200, exchange: 0.0008, haline: 3.8 },
  // Storm runoff (approved local rule): rain on the land washes nutrients and silt into the sea. During a storm (wind
  // above storm), now and then (rate per s at full storm, at least refractory s apart) a lens of muddy fresh water
  // spreads from the coast across the surface (speed units/s, depth units thick), releasing amount nutrients (and
  // silica x that) along its way, counted as imported, with silt: silt shades the water below (siltShade per unit),
  // sinks (siltSink units/s) and settles out (siltTau s). It rains while the lens spreads.
  runoff: { storm: 0.55, rate: 0.02, refractory: 400, amount: 30, silica: 0.8, speed: 2.5, depth: 30, silt: 25, siltShade: 0.5, siltSink: 0.6, siltTau: 150 },
  // Oxygen (approved local rule): made where nutrients are taken up (photosynthesis, per unit of nutrient: Redfield's
  // 138 O2 per 16 N, with nutrient 1 read as about 8 uM nitrate and 1 oxygen as saturation, 254 umol/kg) and used
  // where they are returned (respiration and decomposition, the same per unit), so it piles up in the lit layer and runs
  // short where dead matter rots. The surface row breathes with the air toward saturation (aerate per s, faster in wind:
  // windAerate); warm water holds less (saturation 1 - satT x (T - air temperature)). It diffuses slowly (diffusion); shelf
  // water renews the bottom layer (vent per s at the floor, toward deep), as it does the heat. At Redfield's ratio rotting
  // uses little oxygen, so the shelf water that renews the bottom layer arrives already low (deep 0.4, 2.3 mL/L, as on
  // hypoxia-prone shelves) and slowly: tuned for dead zones a few % of the time (2026-10-22).
  // Below hypoxic cells suffocate (kill per s at anoxic and below), grazers die back (grazerDie per s) and sardines
  // steer away. With 1 = saturation (about 5.8 mL/L, 8 mg/L, in seawater at 15 degrees), hypoxic 0.35 is the usual
  // definition of hypoxia, 2 mL/L or 2.8 mg/L (Diaz & Rosenberg 2008); anoxic 0.08 is severe hypoxia, about 0.6 mg/L.
  oxygen: { per: 0.27, diffusion: 0.008, deep: 0.4, vent: 0.0008, aerate: 0.02, windAerate: 0.1, satT: 0.02, hypoxic: 0.35, anoxic: 0.08, kill: 0.04, grazerDie: 0.01 },
  // Marine snow (approved local rule): what sinks out of the water (dead cells, pellets, the lost share of the eaten
  // and the lysed) falls as a detritus field (sink units/s) that rots on the way (rot per s) and settles on the floor as
  // a deposit (one pool per column) that rots slowly (bed per s), feeding the bottom water and using its oxygen. Without
  // oxygen only the anaerobic share of the rotting goes on (half: oxygen for half the aerobic rate); warm water rots
  // faster (q10, from temperature.ref).
  snow: { sink: 2.5, rot: 0.004, bed: 0.003, half: 0.15, anaerobic: 0.25, q10: 2 },
  // The soft cells' lineage forms (approved, author): share of soft lineages that are coccolithophores and
  // cryptophytes (the rest green algae). cocco: top growth x slow (calcifiers grow slowly, so they win only where water
  // is poor), half-saturation x affinity (efficient uptake in stripped water), upkeep
  // x cost (building plates), grazing risk x shield, sink (units/s^2 of ballast); crypto: growth x fast, grazing risk
  // x exposed, dim: light caught as L (1 + dim) / (L + dim) (phycobilins: better in dim water). Dinophysis prefers them.
  forms: { cocco: { share: 0.3, slow: 0.8, affinity: 0.5, cost: 1.05, shield: 0.6, sink: 0.12 }, crypto: { share: 0.3, fast: 1, exposed: 1.3, dim: 2.5 } },
  hunt: { rate: 0.15, reach: 2, assimilate: 0.7, energy: 0.5, refill: 0.5, fade: 240, dark: 0.15, plastids: 4 },

  founders: { count: 6, lineages: 2, spread: 12, energyMin: 0.4, energyMax: 0.7, maxAge: 30, depthMax: 0.65 },   // the water starts nearly empty, inoculated in the lit layer
  // Immigration (approved local rule): everything is everywhere, the environment selects. Now and then (chance per s)
  // a single cell of a new lineage drifts in from the open ocean at one side of the column, with random genes and
  // form, at the depth it prefers. Most vanish; when the water turns their way, their kind is already there.
  immigration: { rate: 1 / 75, energyMin: 0.3, energyMax: 0.6, depthMax: 0.8 },

  // Rule 1: drift
  drift: {
    brownian: 2.5,                      // px/s per sqrt(s), applied to velocity
    phototaxis: 1.5,                    // px/s^2 at full light mismatch
    drag: 1.0,                          // 1/s; velocity e-folds in one second
    separation: 18,                     // px/s^2 at full overlap
    separationRange: 1.1,               // x (ri + rj)
    wallBounce: 0.3,
    surfaceGap: 7,                      // cells stay below the surface
    floorGap: 2,                        // and above the sediment ripples
    deadSink: 3,                        // px/s^2 while fading
    // Night descent: in darkness cells follow the nutrient gradient down instead of seeking light.
    darkLo: 0.05, darkHi: 0.3,          // surface light where descent is full .. gone
    nutritaxis: 2.0,                    // px/s^2 at full gradient
    gradientGain: 8,                    // bounded gradient ratio is scaled by this, then clamped to 1
  },
  // Rule 2: metabolism, per unit biomass:
  //   de/dt = efficiency * L * N/(N + halfSat*size) - maintenance / size^(1/2)
  // Small cells win in bright, nutrient-poor water (affinity); large cells in dim water (low upkeep).
  metabolism: {
    efficiency: 0.2,
    halfSat: 0.3,                       // nutrient half-saturation at size 1, proportional to size
    maintenance: 0.002,                 // slowed by the night rest (diel.rest)
    uptake: 1.3,                        // nutrient units per unit energy per unit biomass
    vigorTau: 8,                        // s; smoothing of each cell's recorded growth conditions (observed only)
  },
  // Margalef's mandala (local rule): small-scale turbulence inhibits dinoflagellate growth; diatoms don't mind it.
  // Turbulence is the stirring the cell feels where it is: the wind's from the surface and the tide's from the seabed,
  // after stratification has damped them (see mixing; the overturning of water cooling at night is left out), as a
  // share of a full storm's at the surface. So dinoflagellates bloom in calm, stratified water and shelter below the
  // thermocline when it blows; a storm stops their growth in the mixed layer.
  //   gain x max(0, 1 - inhibit * dinoWeight * stirring)
  turbulence: { inhibit: 1.5 },
  // Rule 3: division
  division: { threshold: 1.0, maxCells: 400, spread: 0.6 },
  lifespan: { base: 240, jitterMin: 0.8, jitterMax: 1.4 },   // x sqrt(size), seconds since last division
  // Rule 4: death
  death: { fadeTicks: 60, recycled: 0.6 },                   // the rest sinks out to the bottom row
  // Resting cysts (approved local rule: encystment): the forms that make resting stages (kinds: green algae's resting
  // zygotes, Alexandrium dinocysts, centric diatoms' resting spores; not marine Tripos, which hardly encysts) turn into a cyst while alive when
  // nutrients (or, for diatoms, silica) have run short for a while: their sufficiency N/(N + halfSat) (x the silica
  // limitation of growth for glass), smoothed over hungerTau s, below hungry, at up to rate per s when it is down to
  // starving. The cyst keeps all the cell's nutrients and silica and sinks (sink units/s) to the floor. After dormancy it germinates only in oxygenated water (anoxia keeps cysts dormant,
  // so cyst beds outlast dead zones) with nutrients: slowly on the floor (germFloor per s), faster when a strong tide
  // has lifted it into the water (germRate). It dies after viability s.
  cyst: {
    kinds: [0, 1, 5], rate: 0.001, hungry: 0.75, starving: 0.55, hungerTau: 60,
    sink: 6,
    dormancyMin: 1800, dormancyMax: 3600,
    germRate: 1 / 60, germFloor: 1 / 3600, germNutrient: 0.35, germEnergy: 0.4,
    viability: 7200, max: 200,
  },
  // Rule 5: grazing by an invisible grazer field Z on the nutrient grid. Grazers eat local biomass B
  // with a type III response f = B^2/(B^2+K^2) (sparse cells find refuge), grow on it and starve slowly:
  //   per-cell mortality = rate * Z * K*B/(B^2+K^2)      dZ/dt = Z*(growth*f - decay) + diffusion
  // The lag between food and grazers ends blooms and lets the water recover.
  grazing: {
    rate: 0.035, halfB: 0.5, growth: 0.03, decay: 0.0025,   // 1/s; halfB in biomass per grid node (rate eased from 0.05 with viruses and hunting, author)
    floor: 0.05, diffusion: 0.05, max: 6,
    recycled: 0.7,                      // excreted in place; the rest sinks as fecal pellets
  },
  // Visitors (local rule): filter feeders find plankton-rich water. Their arrival chance rises with bloom
  // density (living biomass between attractLo and attractHi), so blooms draw them in; never on a timer.
  // What they eat is partly excreted in place, partly sinks as pellets, and partly leaves the column with them.
  visitors: {
    attractLo: 30, attractHi: 120,   // retuned to the populations the later phases grow (biomass peaks ~170): ~8 schools/h
    sardines: { rate: 1 / 120, speedMin: 10, speedMax: 15, rx: 38, ry: 20, eat: 0.6, steer: 8, drag: 1.5, wave: 6,
                fishMin: 28, fishMax: 42, excreted: 0.3, pellets: 0.2,     // the rest is carried away
                turnIfAte: 25, passes: 3 },                                 // a rich pass makes the school turn back for more
    salps: { rate: 1 / 160, speedMin: 1.5, speedMax: 2.6, barrelsMin: 4, barrelsMax: 8, spacing: 6.5, tilt: 0.3,
             reach: 4.5, eat: 0.25, sway: 2, excreted: 0.3, pellets: 0.5 },  // salp pellets sink fast
    sunfish: { rate: 1 / 90, speed: 4.5, turn: 1.2, r: 18, bite: 7, stay: 150, baskY: 30, baskSpeed: 0.35 },   // comes for salps and jellies, never eats cells; basks at the surface after
    // Jellyfish (moon jellies) and comb jellies (approved local rule, author): they eat zooplankton, so they come where
    // the grazer field is rich (its mean over the upper half of the column between zFrom and zFull), in warm water
    // (surface warmFrom..warmFull degrees) that is calm (fading as the wind passes calm), as jelly blooms do; never on a
    // timer. A group of countMin..countMax drifts slowly across (speed units/s, spread units around its centre); each
    // eats the grazers within reach (eat per s of the field there, fading with distance, never below its floor), which
    // frees the phytoplankton beneath them: a trophic cascade. Moon jellies (r units across the bell) pulse every
    // pulseMin..pulseMax s, rising lift units and sinking back between pulses; comb jellies glide on their comb rows.
    // The sunfish comes for both, as it does for salps.
    jellies: { rate: 1 / 200, zFrom: 0.35, zFull: 1, warmFrom: 18.5, warmFull: 21, calm: 0.45, countMin: 3, countMax: 6,
               speedMin: 0.6, speedMax: 1.1, r: 9, spread: 26, reach: 12, eat: 0.05, pulseMin: 1.6, pulseMax: 2.6, lift: 1.5 },
    combs: { rate: 1 / 240, zFrom: 0.35, zFull: 1, warmFrom: 18, warmFull: 21, calm: 0.45, countMin: 4, countMax: 8,
             speedMin: 1, speedMax: 1.8, r: 4.5, spread: 22, reach: 7, eat: 0.04, pulseMin: 3, pulseMax: 5, lift: 0.6 },
  },
  // Rule 6: phase coupling (Kuramoto). dtheta/dt = 2pi*omega + coupling*K*mean(sin(theta_j - theta_i))
  // over living neighbours within radius. K in rad/s: kin (one mutation apart in omega) lock, strangers drift.
  phase: { K: 0.9, radius: 10 },        // radius must be <= hash.cell
  // Chain adhesion (local rule): on division daughters may stay linked, setae interlocking as in Chaetoceros.
  // The form sets how long a chain can grow (diatoms long, dinoflagellates 2-4, soft flagellates never);
  // coupling sets the chance of staying linked. Chains are a size refuge from the small grazers (rule 5).
  chain: {
    chance: 0.85, from: 0.35, full: 0.9, diatomMax: 8, dinoMax: 4,
    rest: 0.85,                         // link length, x (ri + rj)
    spring: 6, straighten: 3,           // 1/s^2: pull toward the link length; pull toward the habit's joint angle
    breakRate: 1 / 300,                 // per link per second
    refuge: 1.5,                        // grazing risk x 1/(1 + refuge*(length - 1))
    // Diatom lineages carry a colony habit: each joint turns by a fixed angle, so the same springs build
    // straight chains (Chaetoceros), coils that close into rings (C. curvisetus) or snowflake stars of
    // radiating pennates joined at their feet (Asterionellopsis). Cells per full turn; star links are short.
    habit: { glass: 0.6, coilChance: 0.5, starChance: 0.7, coilCells: 8, starCells: 8, starRest: 0.45 },   // glass: how far into diatom glass the form must be
  },
  mutation: { step: 0.08, jumpChance: 0.05, jump: 0.3 },
  // Elders (local rule, dark acclimation): a cell that spends its days in deep, dim water (light profile below
  // light) slowly becomes an elder (0..1): its uptake, upkeep, ageing, pulse and swimming slow (it settles where it is), it stores energy before dividing
  // and grows (an elder barely divides). Judged by day only (at night every cell is in the dark); fades slowly in brighter water. Dividing
  // halves it. Elders sing long, low drones; the oldest full elder holds the harmonic root.
  elder: { light: 0.12, grow: 1 / 200, fade: 1 / 300, slowUpkeep: 0.8, slowAge: 0.95, slowPulse: 0.75, settle: 0.9, store: 2, size: 0.5, singFrom: 0.6 },   // light 0.12: deeper than ~half the column
  // Bioluminescence: an inherited trait of Alexandrium-form dinoflagellates only. At division a daughter may
  // gain it or lose it, so glowing clades arise now and then, spread among kin and fade (about 1 in 6 at balance).
  // Seen only at night; it changes nothing else.
  luminous: { gain: 0.03, loss: 0.15 },
  // The hand in the water (phase 6): a tap makes cells within radius swim away (escape response, px/s^2 at the
  // centre, fading over time s) and startle; a swipe drags the water along the finger (wake: share of the finger's
  // speed given to cells within wakeR, at most wakeMax px/s). Inputs enter the simulation at tick boundaries.
  hand: { radius: 28, flee: 16, time: 3, startle: 3, wakeR: 8, wake: 0.15, wakeMax: 12 },

  // Harmonic field: one root and one pentatonic-family scale for the whole water, chosen by the seed.
  // Rule 7: each cell holds a scale degree (inherited; a daughter may start one step away). When it flashes it
  // moves at most one step toward the degree most consonant with what its neighbours sang recently.
  // Register = depth: the surface sings high, the floor low; larger cells sing up to an octave lower.
  harmony: {

// ===== RNG =====
// mulberry32 with its state in the open (s), so a saved world resumes the same stream
class Rng {
  constructor(seed) { this.s = seed >>> 0; }
  next() {
    const a = this.s = (this.s + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  range(lo, hi) { return lo + (hi - lo) * this.next(); }
  int(n) { return Math.floor(this.next() * n); }
  chance(p) { return this.next() < p; }
}

const makeRng = (seed) => new Rng(seed);

// Stateless hash for visuals, so rendering never draws from the simulation stream.
function hash32(n) {
  n = Math.imul((n >>> 0) ^ (n >>> 16), 0x7feb352d);
  n = Math.imul(n ^ (n >>> 15), 0x846ca68b);
  return (n ^ (n >>> 16)) >>> 0;
}
const hash01 = (n) => hash32(n) / 4294967296;

// ===== Utils =====
const TAU = Math.PI * 2;
const W = PARAMS.world.w, H = PARAMS.world.h;
const TICK_DT = 1 / PARAMS.time.tickRate;
const SQRT3 = Math.sqrt(3);

const clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);

function smoothstep(e0, e1, x) {
  const t = clamp((x - e0) / (e1 - e0), 0, 1);
  return t * t * (3 - 2 * t);
}

// The simulation uses only + - * / and sqrt, which every JS engine computes bit-identically.
// Math.exp/log/sin/pow may differ between engines, so the same seed would grow different worlds.
function dexp(x) {
  let k = 0;
  while (x > 0.5 || x < -0.5) { x *= 0.5; k++; }
  let term = 1, sum = 1;
  for (let i = 1; i <= 12; i++) {
    term = term * x / i;
    sum += term;
    if (term < 1e-17 && term > -1e-17) break;   // the rest no longer changes the sum (the same on every engine)
  }
  while (k-- > 0) sum *= sum;
  return sum;
}

// Natural log from dexp alone (Halley's iteration), for the few constants built from PARAMS
function dlog(x) {
  let y = 0;
  for (let i = 0; i < 40; i++) { const e = dexp(y); y += 2 * (x - e) / (x + e); }
  return y;
}

// Sine from arithmetic only (Taylor series on [-pi/2, pi/2]); error below 1e-7.
function dsin(x) {
  x -= TAU * Math.floor(x / TAU + 0.5);
  if (x > Math.PI / 2) x = Math.PI - x;
  else if (x < -Math.PI / 2) x = -Math.PI - x;
  const x2 = x * x;
  return x * (1 - x2 / 6 * (1 - x2 / 20 * (1 - x2 / 42 * (1 - x2 / 72 * (1 - x2 / 110)))));
}

// Standard normal approximation from four uniforms (Irwin-Hall): arithmetic only.
function gauss(rng) {
  return (rng.next() + rng.next() + rng.next() + rng.next() - 2) * SQRT3;
}

// 4x4 Bayer thresholds in [0, 1)
const BAYER = new Float64Array([0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map((v) => (v + 0.5) / 16));
const bayer = (x, y) => BAYER[((y & 3) << 2) | (x & 3)];

for (let i = 0; i < LIGHT_UP.length; i++) LIGHT_UP[i] = i;
for (let i = COL.WATER; i < COL.SHAFT; i++) LIGHT_UP[i] = i + 1;
LIGHT_UP[COL.SHAFT] = COL.FOAM;
LIGHT_UP[COL.FOAM] = COL.GLOW;
LIGHT_UP[COL.SLATE] = COL.SHAFT - 1;
for (let r = 0; r < COL.RAMPS; r++) {
  for (let t = 0; t < COL.TONES; t++) LIGHT_UP[rampBase(r) + t] = t < BRIGHT ? rampBase(r) + t + 1 : COL.GLOW;
}
for (let i = 0; i <= COL.BLOOM_TO - COL.BLOOM_FROM; i++) LIGHT_UP[COL.BLOOM + i] = i < COL.BLOOM_TO - COL.BLOOM_FROM ? COL.BLOOM + i + 1 : COL.SHAFT;
for (let i = 0; i <= COL.MILKY_TO - COL.MILKY_FROM; i++) LIGHT_UP[COL.MILKY + i] = i < COL.MILKY_TO - COL.MILKY_FROM ? COL.MILKY + i + 1 : COL.FOAM;

for (const name of Object.keys(TIME_PALETTES)) {
  const P = TIME_PALETTES[name], pal = new Uint32Array(PAL32);
  ENV_SLOTS.forEach((slot, k) => { pal[slot] = toPal32(P.env[k]); });
  for (let r = 0; r < COL.RAMPS; r++) {
    for (let t = 0; t < COL.TONES; t++) pal[rampBase(r) + t] = PAL32[rampBase(r) + P.tones[t]];
  }
  TIME_PAL32[name] = pal;
}

// ===== Fields =====
const KINDS = 9;   // green algae, the four dinoflagellate forms, centric and pennate diatoms, coccolithophores, cryptophytes
const GRID_W = W / PARAMS.grid.cols, GRID_H = H / PARAMS.grid.rows;

function createFields() {
  const { cols, rows } = PARAMS.grid, N = PARAMS.nutrients, n = cols * rows;
  const f = {
    light: new Float64Array(n), profile: new Float64Array(rows), nut: new Float64Array(n), scratch: new Float64Array(n),
    bio: new Float64Array(n), graz: new Float64Array(n), grazScratch: new Float64Array(n),
    si: new Float64Array(n), siScratch: new Float64Array(n),
    kinds: Array.from({ length: KINDS }, () => new Float64Array(n)),   // biomass per kind, for the viruses
    syn: new Float64Array(n).fill(PARAMS.cyano.floor), pro: new Float64Array(n).fill(PARAMS.cyano.floor),   // cyanobacteria
    cyScratch: new Float64Array(n),
    tri: new Float64Array(n).fill(PARAMS.tricho.floor),   // Trichodesmium
    temp: new Float64Array(n), o2: new Float64Array(n),   // degrees; oxygen (1 = saturated at 15 degrees)
    sal: new Float64Array(n).fill(PARAMS.salinity.shelf),   // psu
    det: new Float64Array(n), sed: new Float64Array(cols), silt: new Float64Array(n),   // marine snow; the floor deposit per column; runoff silt
    warm: new Float64Array(n), warmCy: new Float64Array(n), warmSnow: new Float64Array(n),   // warmth factors for cells, cyanobacteria, rotting
  };
  const Si = PARAMS.silica, T = PARAMS.temperature, O = PARAMS.oxygen;
  for (let j = 0; j < rows; j++) {
    const depth = (j + 0.5) / rows, cline = smoothstep(N.clineTop, N.clineBottom, depth);
    f.profile[j] = PARAMS.light.surface * dexp(-PARAMS.light.atten * depth);
    const nut = N.surface + (N.deep - N.surface) * cline;
    const si = Si.surface + (Si.deep - Si.surface) * cline;
    for (let i = 0; i < cols; i++) {
      const k = j * cols + i;
      f.nut[k] = nut; f.si[k] = si;
      f.temp[k] = T.surface + (T.deep - T.surface) * cline;
      f.o2[k] = 1 + (O.deep - 1) * cline;
    }
  }
  f.graz.fill(PARAMS.grazing.floor);
  updateWarmth(f);
  return f;
}

// Warmth factors per node, from the temperature (it changes slowly, so they are refreshed every few ticks)
function updateWarmth(f) {
  const t = f.temp;
  for (let k = 0; k < t.length; k++) {
    f.warm[k] = warmth(WARM_CELL, t[k]);
    f.warmCy[k] = warmth(WARM_CYANO, t[k]);
    f.warmSnow[k] = warmth(WARM_SNOW, t[k]);
  }
}

// Surface light over the diel cycle (phase 0 = sunrise): sqrt of a half sine, then moonlight by the moon's lit share
// (half lit gives diel.moon, a full moon 1.8 times that, a new moon a fifth)
function surfaceLightAt(phase, lit = 0.5) {
  const D = PARAMS.diel, moon = D.moon * (0.2 + 1.6 * lit);
  if (phase >= D.dayFrac) return moon;
  return moon + (1 - moon) * Math.sqrt(dsin(Math.PI * phase / D.dayFrac));
}

function dayPhase(w) {
  const p = w.tick * TICK_DT / w.dayLength + PARAMS.diel.start;
  return p - Math.floor(p);
}

// e^-x for x >= 0 from a table (dexp at every 1/64, read linearly; under 0.003% off): the light field needs one per node
const EXPN_STEP = 64, EXPN_MAX = 40, EXPN = new Float64Array(EXPN_MAX * EXPN_STEP + 2).map((_, i) => dexp(-i / EXPN_STEP));
function expNeg(x) {
  if (x >= EXPN_MAX) return 0;
  const g = x * EXPN_STEP, i = Math.floor(g);
  return EXPN[i] + (EXPN[i + 1] - EXPN[i]) * (g - i);
}

function updateLight(w) {
  const { cols, rows } = PARAMS.grid, f = w.fields, ks = PARAMS.light.shade, kt = PARAMS.tricho.shade, kz = PARAMS.runoff.siltShade;
  for (let i = 0; i < cols; i++) {   // self-shading: the biomass above (last tick's), a scum and runoff silt dim the water below
    let above = 0;
    for (let j = 0; j < rows; j++) {
      const k = j * cols + i, b = ks * f.bio[k] + kt * f.tri[k] + kz * f.silt[k];
      f.light[k] = f.profile[j] * w.surfaceLight * expNeg(above + 0.5 * b);
      above += b;
    }
  }
}

// Growth speeds up in warm water: q10^((T - ref)/10), as dexp(ln q10 x (T - ref)/10), tabulated once per hundredth of a
// degree over 0..40 and read linearly
const WARM_STEP = 0.01, WARM_N = 4001;
function warmTable(q10) {
  const lnq = dlog(q10) / 10, t = new Float64Array(WARM_N);
  for (let i = 0; i < WARM_N; i++) t[i] = dexp(lnq * (i * WARM_STEP - PARAMS.temperature.ref));
  return t;
}
const WARM_CELL = warmTable(PARAMS.temperature.q10), WARM_CYANO = warmTable(PARAMS.temperature.cyanoQ10), WARM_SNOW = warmTable(PARAMS.snow.q10);
function warmth(table, T) {
  const g = clamp(T / WARM_STEP, 0, WARM_N - 1.000001), i = Math.floor(g);
  return table[i] + (table[i + 1] - table[i]) * (g - i);
}

// Vertical stirring, one coefficient per interface between row j and j + 1 of each column (stored at j's node): the
// wind's from the surface and the tide's from the seabed, each fading with distance from where it is made, both damped
// where the water is stratified (light over dense), plus a weak background everywhere. The wind's shape with depth is
// fixed; the tide's follows the spring-neap cycle (see updateMixing). TURB keeps the stirring alone, for the mandala.
const FLOOR_ROW = Math.floor((H - PARAMS.world.floor) / GRID_H);   // the row the sediment surface lies in
const MIX_K = new Float64Array(PARAMS.grid.cols * PARAMS.grid.rows), TURB = new Float64Array(PARAMS.grid.cols * PARAMS.grid.rows), MIX_COL = new Float64Array(PARAMS.grid.rows);
const WIND_REACH = new Float64Array(PARAMS.grid.rows), BOTTOM = new Float64Array(PARAMS.grid.rows);
for (let j = 0; j < PARAMS.grid.rows; j++) {
  const M = PARAMS.mixing, rows = PARAMS.grid.rows;
  WIND_REACH[j] = dexp(-(j + 1) / rows / M.depth);
  BOTTOM[j] = j >= FLOOR_ROW ? 1 : dexp(-(FLOOR_ROW - j) / rows / M.tideDepth);   // the bottom layer, where shelf water flows in
}

// Shelf water renews the bottom layer: a field there eases toward the shelf water's value (rate per s at the floor)
function renewBottom(a, value, rate) {
  const { cols, rows } = PARAMS.grid;
  for (let j = 0; j < rows; j++) {
    const k = rate * BOTTOM[j];
    if (k < 1e-9) continue;
    for (let i = 0; i < cols; i++) a[j * cols + i] += (value - a[j * cols + i]) * k;
  }
}
// The moon's phase (0 new, 0.5 full) from the world's age; the seed sets the phase the world was born under
function moonPhase(w) {
  const p0 = w.seed * 0.6180339887, p = w.tick * TICK_DT / (w.dayLength * PARAMS.tide.month) + p0 - Math.floor(p0);
  return p - Math.floor(p);
}
const moonLit = (phase) => 0.5 - 0.5 * dsin(TAU * phase + Math.PI / 2);   // the lit share of its face

// The tide now: the spring-neap strength (1 +- range, springs at new and full moon), the current (signed: flood and
// ebb) and its stirring as a multiple of its mean (the current squared)
function updateTide(w) {
  const Td = PARAMS.tide, moon = moonPhase(w), t = w.tick * TICK_DT / (w.dayLength * Td.period);
  w.spring = 1 + Td.range * dsin(2 * TAU * moon + Math.PI / 2);
  w.tideU = w.spring * dsin(TAU * (t - Math.floor(t)));
  w.tideStir = w.tideU * w.tideU / (0.5 * (1 + Td.range * Td.range / 2));
}

function updateMixing(w, dt) {
  const M = PARAMS.mixing, { cols, rows } = PARAMS.grid, t = w.fields.temp, s = w.fields.sal, hal = PARAMS.salinity.haline;
  const wind = M.wind * w.wind * w.wind, reach = rows * M.tideDepth * w.spring;   // springs stir higher off the seabed
  for (let j = 0; j < rows - 1; j++) {
    const above = FLOOR_ROW - (j + 1), tide = above >= 0 ? M.tide * w.tideStir * dexp(-above / reach) : 0;   // none inside the sediment
    const stir = wind * WIND_REACH[j] + tide;
    const up = j > 0 ? j - 1 : j, down = j < rows - 2 ? j + 2 : j + 1;   // judged over the rows around the interface:
    for (let i = 0; i < cols; i++) {                                      // over one step alone, mixing breaks the water into stairs
      const k = j * cols + i, ku = up * cols + i, kd = down * cols + i;
      const dT = (t[ku] - t[kd] + hal * (s[kd] - s[ku])) / (down - up), damp = dT > 0 ? 1 + M.stratified * dT : 1;   // light over dense
      TURB[k] = stir / (damp * damp) / M.wind;   // the stirring cells feel (Margalef's mandala)
      MIX_K[k] = (M.base + stir / (damp * damp) + (dT < 0 ? M.convect : 0)) * dt;   // dense over light overturns at once
    }
  }
}

// One vertical mixing step (share of the coefficient): implicit (backward Euler, solved down each column with the
// Thomas algorithm), so it stays stable however strong the stirring or long the step; conservative, closed at the top
// and the bottom
const MIX_C = new Float64Array(PARAMS.grid.rows), MIX_D = new Float64Array(PARAMS.grid.rows);
function mixColumn(a, share) {
  const { cols, rows } = PARAMS.grid, c = MIX_C, d = MIX_D;
  for (let i = 0; i < cols; i++) {
    // row j: -k(j-1) x(j-1) + (1 + k(j-1) + k(j)) x(j) - k(j) x(j+1) = old(j), k(j) the coefficient below row j
    let kUp = 0;
    for (let j = 0; j < rows; j++) {
      const kDown = j < rows - 1 ? MIX_K[j * cols + i] * share : 0;
      const den = 1 + kUp + kDown - (j > 0 ? kUp * c[j - 1] : 0);
      c[j] = kDown / den;
      d[j] = (a[j * cols + i] + (j > 0 ? kUp * d[j - 1] : 0)) / den;
      kUp = kDown;
    }
    let x = d[rows - 1];
    a[(rows - 1) * cols + i] = x;
    for (let j = rows - 2; j >= 0; j--) { x = d[j] + c[j] * x; a[j * cols + i] = x; }
  }
}

// Bilinear footprint of a point, reused to avoid allocation.
const LOC = { k00: 0, k10: 0, k01: 0, k11: 0, w00: 0, w10: 0, w01: 0, w11: 0 };
function locate(x, y) {
  const { cols, rows } = PARAMS.grid;
  const gx = clamp(x / GRID_W - 0.5, 0, cols - 1), gy = clamp(y / GRID_H - 0.5, 0, rows - 1);
  const i0 = Math.floor(gx), j0 = Math.floor(gy);
  const i1 = i0 + 1 < cols ? i0 + 1 : i0, j1 = j0 + 1 < rows ? j0 + 1 : j0;
  const fx = gx - i0, fy = gy - j0;
  LOC.k00 = j0 * cols + i0; LOC.k10 = j0 * cols + i1; LOC.k01 = j1 * cols + i0; LOC.k11 = j1 * cols + i1;
  LOC.w00 = (1 - fx) * (1 - fy); LOC.w10 = fx * (1 - fy); LOC.w01 = (1 - fx) * fy; LOC.w11 = fx * fy;
}

function sampleField(a, x, y) {
  locate(x, y);
  return a[LOC.k00] * LOC.w00 + a[LOC.k10] * LOC.w10 + a[LOC.k01] * LOC.w01 + a[LOC.k11] * LOC.w11;
}

function addField(a, x, y, amount) {
  locate(x, y);
  a[LOC.k00] += amount * LOC.w00; a[LOC.k10] += amount * LOC.w10;
  a[LOC.k01] += amount * LOC.w01; a[LOC.k11] += amount * LOC.w11;
}

function takeNode(a, k, want) {
  const got = want < a[k] ? want : a[k];
  a[k] -= got;
  return got;
}

// Removes up to `amount`, never driving a node negative. Returns what was actually taken.
function takeField(a, x, y, amount) {
  locate(x, y);
  const k00 = LOC.k00, k10 = LOC.k10, k01 = LOC.k01, k11 = LOC.k11;
  const w00 = LOC.w00, w10 = LOC.w10, w01 = LOC.w01, w11 = LOC.w11;
  return takeNode(a, k00, amount * w00) + takeNode(a, k10, amount * w10)
       + takeNode(a, k01, amount * w01) + takeNode(a, k11, amount * w11);
}

// Explicit diffusion; closed sides and top, bottom row exchanges with deep water (upwelling).
// Returns the net amount that entered from below this tick.
function diffuseNutrients(f, dt) {
  const N = PARAMS.nutrients, k = N.diffusion * dt;
  const inflow = diffuseGrid(f.nut, f.scratch, k, k * N.upwelling, N.deep);
  const a = f.nut;
  f.nut = f.scratch; f.scratch = a;
  return inflow;
}

// Silicate diffuses and wells up the same way, toward its own deep concentration
function diffuseSilica(f, dt) {
  const Si = PARAMS.silica, k = PARAMS.nutrients.diffusion * dt;
  const inflow = diffuseGrid(f.si, f.siScratch, k, k * Si.upwelling, Si.deep);
  const a = f.si;
  f.si = f.siScratch; f.siScratch = a;
  return inflow;
}

// One explicit diffusion step from a into b; the bottom row exchanges with deep water of concentration deep
function diffuseGrid(a, b, k, kb, deep) {
  const { cols, rows } = PARAMS.grid;
  let inflow = 0;
  for (let j = 0; j < rows; j++) {
    for (let i = 0; i < cols; i++) {
      const idx = j * cols + i, c = a[idx];
      const l = i > 0 ? a[idx - 1] : c, r = i < cols - 1 ? a[idx + 1] : c;
      const u = j > 0 ? a[idx - cols] : c, d = j < rows - 1 ? a[idx + cols] : c;
      let v = c + k * (l + r + u + d - 4 * c);
      if (j === rows - 1) { const q = kb * (deep - c); v += q; inflow += q; }
      b[idx] = v;
    }
  }
  return inflow;
}

// Grazers: grow where food is dense, starve slowly elsewhere, spread by closed diffusion, never below a floor.
function updateGrazers(f, dt) {
  const { cols, rows } = PARAMS.grid, G = PARAMS.grazing, O = PARAMS.oxygen;
  const k = G.diffusion * dt, K2 = G.halfB * G.halfB;
  const a = f.graz, b = f.grazScratch;
  for (let j = 0; j < rows; j++) {
    for (let i = 0; i < cols; i++) {
      const idx = j * cols + i, c = a[idx], B = f.bio[idx];
      const l = i > 0 ? a[idx - 1] : c, r = i < cols - 1 ? a[idx + 1] : c;
      const u = j > 0 ? a[idx - cols] : c, d = j < rows - 1 ? a[idx + cols] : c;
      const food = B * B / (B * B + K2), ox = f.o2[idx], die = ox < O.hypoxic ? O.grazerDie * smoothstep(O.hypoxic, O.anoxic, ox) : 0;   // they die back in hypoxic water
      const v = c + k * (l + r + u + d - 4 * c) + c * (G.growth * food - G.decay - die) * dt;
      b[idx] = clamp(v, G.floor, G.max);
    }
  }
  f.graz = b; f.grazScratch = a;
}

// ===== Genome =====
// Only perceivable genes. hue is continuous; its floor picks the pigment ramp.
const GENES = {
  hue: [0, 7],
  size: [0.6, 1.6],
  depthPref: [0, 1],
  omega: [0.15, 0.6],
  coupling: [0, 1],
  timbre: [0, 1],
};
const GENE_KEYS = Object.keys(GENES);
const HUE_MAX = GENES.hue[1] - 1e-9;

function clampGene(key, v) {
  const [lo, hi] = GENES[key];
  return clamp(v, lo, key === 'hue' ? HUE_MAX : hi);
}

function randomGenome(rng) {
  const g = {};
  for (const k of GENE_KEYS) g[k] = clampGene(k, rng.range(GENES[k][0], GENES[k][1]));
  return g;
}

function mutateGenome(parent, rng) {
  const M = PARAMS.mutation, g = {};
  for (const k of GENE_KEYS) {
    const span = GENES[k][1] - GENES[k][0];
    g[k] = clampGene(k, parent[k] + (rng.next() * 2 - 1) * M.step * span);
  }
  if (rng.chance(M.jumpChance)) {
    const k = GENE_KEYS[rng.int(GENE_KEYS.length)], span = GENES[k][1] - GENES[k][0];
    g[k] = clampGene(k, g[k] + (rng.next() * 2 - 1) * M.jump * span);
  }
  return g;
}

// A cell's pigment ramp: its form's family, the shade picked by the hue gene; hueMix is how far toward the next shade
// it sits (cells near the next shade carry some chloroplasts of it). Works for cysts too (they keep genes and lineage).
function pigmentSlot(c) {
  const fam = FAMILIES[c.kind !== undefined ? c.kind : kindOf(c)], x = c.g.hue / GENES.hue[1] * fam.length, i = Math.min(fam.length - 1, Math.floor(x));
  return { fam, i, frac: x - i };
}
const hueRamp = (c) => { const p = pigmentSlot(c); return p.fam[p.i]; };
const hueMix = (c) => pigmentSlot(c).frac;
// A cell sitting between two colours carries some chloroplasts of the next colour on the wheel
const hueNeighbour = (c) => { const p = pigmentSlot(c); return p.fam[Math.min(p.fam.length - 1, p.i + 1)]; };

// ===== Cells =====
function cellRadius(g) {
  const C = PARAMS.cell, [lo, hi] = GENES.size;
  return C.rMin + (g.size - lo) / (hi - lo) * (C.rMax - C.rMin);
}

// Traits that follow from the genome; recomputed whenever the genome changes.
function deriveTraits(c) {
  const rs = Math.sqrt(c.g.size), M = PARAMS.metabolism;
  c.r = cellRadius(c.g);
  c.biomass = c.g.size;
  c.gainK = M.efficiency;                    // per-biomass max gain, independent of size
  c.halfSat = M.halfSat * c.g.size;          // big cells need richer water
  c.maintK = M.maintenance / rs;             // per-biomass upkeep ~ size^-1/2: big cells endure the dark
  c.targetLight = PARAMS.light.surface * dexp(-PARAMS.light.atten * c.g.depthPref);
  c.dinoW = dinoWeight(c.g.timbre);
  c.glassW = smoothstep(PARAMS.dino.fade, PARAMS.dino.gone, c.g.timbre);   // how much of a diatom it is: its need for silica
  c.hunter = c.dinoW > 0.5 && lineageDinoForm(c.spriteSeed) === 'dinophysis';   // steals chloroplasts
  c.kind = kindOf(c);
  // The forms' niches: coccolithophores take nutrients up very efficiently, their plates shield them from grazers
  // but cost energy to build and weigh them down; cryptophytes catch dim light well and grow fast, unarmoured
  const Fm = PARAMS.forms;
  c.grazeK = 1; c.sinkV = 0; c.dimLight = 0;
  if (c.kind === 7) { c.gainK *= Fm.cocco.slow; c.halfSat *= Fm.cocco.affinity; c.maintK *= Fm.cocco.cost; c.grazeK = Fm.cocco.shield; c.sinkV = Fm.cocco.sink; }
  else if (c.kind === 8) { c.gainK *= Fm.crypto.fast; c.grazeK = Fm.crypto.exposed; c.dimLight = Fm.crypto.dim; }
  c.rvBase = c.r * PARAMS.cell.drawScale * (1 + (PARAMS.dino.scale - 1) * c.dinoW);   // drawn radius (and register)
  c.rv = c.rvBase * (1 + PARAMS.elder.size * c.elder);                                  // elders grow
  if (!c.la && !c.lb) chainHabit(c);   // a colony keeps the habit it was founded with
}

// The lineage's dinoflagellate form, drawn in the same order as buildSprite
function lineageDinoForm(seed) {
  const S = PARAMS.sprite, D = PARAMS.dino, lin = makeRng(seed);
  if (lin.range(S.aspectMin, S.aspectMax) < S.polarAspect) lin.int(S.valveSides.length);
  lin.next();
  return D.forms[lin.int(D.forms.length)];
}

// Bioluminescence passes to a daughter, or is gained or lost; only Alexandrium can carry it
function inheritGlow(c, rng) {
  const L = PARAMS.luminous, r = rng.next();
  if (dinoWeight(c.g.timbre) <= 0.5 || lineageDinoForm(c.spriteSeed) !== 'alexandrium') return false;
  return c.lum ? r >= L.loss : r < L.gain;
}

function copyHabit(to, from) {
  to.habit = from.habit; to.turn = from.turn; to.tanHalf = from.tanHalf; to.restK = from.restK; to.along = null;
}

// The lineage's first draw is its elongation (as in buildSprite): pennate boats are the long ones
function lineagePennate(seed) {
  const S = PARAMS.sprite;
  return makeRng(seed).range(S.aspectMin, S.aspectMax) >= S.polarAspect;
}

// Colony habit of diatom lineages: straight, coiled into a ring, or a star of radiating pennates
function chainHabit(c) {
  const Hb = PARAMS.chain.habit, S = PARAMS.sprite, h = hash01(c.spriteSeed * 11 + 7), hand = hash01(c.spriteSeed * 11 + 8) < 0.5 ? -1 : 1;
  c.habit = 0;
  if (smoothstep(S.diatomFrom, S.diatomFull, c.g.timbre) >= Hb.glass) {   // only true glass frustules build shaped colonies
    if (lineagePennate(c.spriteSeed)) { if (h < Hb.starChance) c.habit = 2; }
    else if (h < Hb.coilChance) c.habit = 1;
  }
  c.turn = c.habit ? hand * TAU / (c.habit === 1 ? Hb.coilCells : Hb.starCells) : 0;
  c.tanHalf = dsin(c.turn / 2) / dsin(c.turn / 2 + Math.PI / 2);
  c.restK = c.habit === 2 ? Hb.starRest : PARAMS.chain.rest;
  c.along = null;                                       // render cache of the chain orientation
}

// The form a cell is (as the sprite draws it): 0 green algae, 1-4 the dinoflagellates, 5 centric, 6 pennate diatom,
// 7 coccolithophore, 8 cryptophyte
function kindOf(c) {
  const Dn = PARAMS.dino, tb = c.g.timbre;
  if (dinoWeight(tb) > 0.5) return 1 + Dn.forms.indexOf(lineageDinoForm(c.spriteSeed));
  if (tb < Dn.full) return SOFT_KINDS[lineageSoftForm(c.spriteSeed)];
  return lineagePennate(c.spriteSeed) ? 6 : 5;
}

// Soft cells: the lineage is a green alga, a coccolithophore (chalk plates) or a cryptophyte (phycobilins)
const SOFT_KINDS = { green: 0, cocco: 7, crypto: 8 };
function lineageSoftForm(seed) {
  const F = PARAMS.forms, h = hash01(seed * 7 + 3);
  return h < F.cocco.share ? 'cocco' : h < F.cocco.share + F.crypto.share ? 'crypto' : 'green';
}

// How much of a dinoflagellate a cell is (the middle of the timbre range): 0..1
function dinoWeight(tb) {
  const Dn = PARAMS.dino;
  return smoothstep(Dn.from, Dn.full, tb) * (1 - smoothstep(Dn.fade, Dn.gone, tb));
}

// How long a chain this form can build: diatoms long, chain-forming dinoflagellates (Alexandrium, Tripos) short,
// Dinophysis, Prorocentrum and soft flagellates none (< 2)
function chainMax(c) {
  const Ch = PARAMS.chain, Dn = PARAMS.dino, g = c.g;
  const dw = dinoWeight(g.timbre), dino = dw > 0 && Dn.chainForms.includes(lineageDinoForm(c.spriteSeed)) ? dw : 0;
  return Math.floor(Ch.diatomMax * smoothstep(Dn.fade, Dn.gone, g.timbre) + Ch.dinoMax * dino);
}

function chainHead(c) {
  while (c.la) c = c.la;
  return c;
}

function chainLength(c) {
  let n = 0;
  for (let k = chainHead(c); k; k = k.lb) n++;
  return n;
}

// A dying cell breaks out of its chain; the chain splits there
function unlink(c) {
  if (c.la) c.la.lb = null;
  if (c.lb) c.lb.la = null;
  c.la = c.lb = null;
}

function lifespanFor(c, rng) {
  const L = PARAMS.lifespan;
  return L.base * Math.sqrt(c.g.size) * rng.range(L.jitterMin, L.jitterMax);
}

// Returns a new cell; the caller adds it to the world.
function createCell(w, x, y, g, energy, parentId, spriteSeed) {
  const c = cellObject(w.nextId++, parentId, x, y, g, energy, w.rng.next() * TAU, spriteSeed);
  deriveTraits(c);
  c.lifespan = lifespanFor(c, w.rng);
  c.held = PARAMS.metabolism.uptake * c.biomass * energy;
  if (c.hunter) { c.klepto = 1; c.plastids = [hueRamp(c)]; }   // a founder or a germinating cyst starts with a full set
  return c;
}

// Every cell is built from this one literal (a restored cell too), so the engine sees one shape for them all
function cellObject(id, parentId, x, y, g, energy, theta, spriteSeed) {
  return {
    id, parentId, x, y, vx: 0, vy: 0,
    energy, held: 0, si: 0, age: 0, lifespan: 0, vigor: 0,   // si: silica in the frustule; vigor: smoothed growth conditions, observed only
    fed: 1,                                            // smoothed nutrient sufficiency (encystment)
    theta, flashTick: -1000, dying: 0, grazed: false, eaten: null,
    pull: 0, nbrs: 0, locked: 0,                       // Kuramoto: sum of sin(theta_j - theta_i), neighbours, those in phase
    deg: 0, noteTick: -1000, startleTick: -1000, motif: null, bout: 0,
    elder: 0, elderAge: 0, droneNext: 0, droneEnd: 0, rvBase: 0, arpTick: -1e9,   // elder (0..1), time as a full elder; drones     // scale degree (rule 7); last phrase began; lineage tune; flashes left to sing
    lum: false,                                        // bioluminescent (Alexandrium only; inherited)
    hunter: false, klepto: 0, plastids: null, pv: 0, kind: 0, grazeK: 1, sinkV: 0, dimLight: 0,   // form and its niche   // Dinophysis: stolen chloroplasts (0..1), their prey colours, a version for the sprite
    la: null, lb: null, chainLen: 1, chainId: 0,       // chain links toward the head (la) and the tail (lb)
    head: null, kickScale: 1, kx: 0, ky: 0,            // the colony's head and its shared Brownian kick
    habit: 0, turn: 0, tanHalf: 0, restK: 0, along: null,   // colony habit (0 straight, 1 coil, 2 star): from the lineage and form
    g, spriteSeed, gen: 0,
    r: 0, rv: 0, dinoW: 0, glassW: 0, biomass: 0, gainK: 0, halfSat: 0, maintK: 0, targetLight: 0,
    spr: null, ox: 0, oy: 0, swimPh: 0, vt: 0, tempo: 1,   // sprite cache and swimming (own clock, tempo): render only
    glowTick: -1000,                                       // render only: last disturbance flash
    songAt: -1e9, songAtk: 0, songRel: 0, songLast: false, songDrone: false,  // render only: the note it is sounding (real-time ms, s)
  };
}

// Neighbour grid, rebuilt every tick and read only after that: bucket k holds items[start[k] .. start[k + 1]),
// in the order of w.cells (a counting sort). Never saved.
function createHash() {
  const s = PARAMS.hash.cell, cols = Math.ceil(W / s), rows = Math.ceil(H / s);
  return { s, cols, rows, start: new Int32Array(cols * rows + 1), fill: new Int32Array(cols * rows), items: [], keys: new Int32Array(64) };
}

function buildHash(w) {
  const hs = w.hash, cells = w.cells, n = cells.length, start = hs.start, nb = hs.cols * hs.rows;
  if (hs.keys.length < n) hs.keys = new Int32Array(n * 2);
  const keys = hs.keys;
  start.fill(0);
  for (let m = 0; m < n; m++) {
    const c = cells[m];
    const i = clamp(Math.floor(c.x / hs.s), 0, hs.cols - 1), j = clamp(Math.floor(c.y / hs.s), 0, hs.rows - 1);
    keys[m] = j * hs.cols + i;
    start[keys[m] + 1]++;
  }
  for (let k = 0; k < nb; k++) start[k + 1] += start[k];
  hs.fill.set(start.subarray(0, nb));
  hs.items.length = n;
  for (let m = 0; m < n; m++) hs.items[hs.fill[keys[m]]++] = cells[m];
}

function createWorld(seed, founderCount, dayLength) {
  const F = PARAMS.founders, rng = makeRng(seed);
  const w = {
    seed, rng, tick: 0, nextId: 1, fields: createFields(), cells: [], cysts: [], hash: createHash(), upwelled: 0, initialInventory: 0,
    dayLength: dayLength || PARAMS.diel.dayLength, surfaceLight: 1,
    pulses: [], lastPulse: -1e9,
    wind: PARAMS.wind.start, windTarget: PARAMS.wind.start, nextWind: 0,
    fallen: new Float64Array(PARAMS.grid.cols),   // detritus exported per column, ever (observed only, never read by the rules)
    deaths: { starved: 0, old: 0, grazed: 0, sardines: 0, salps: 0, hunted: 0, lysed: 0, hypoxia: 0 },   // observed only
    runoffs: [], lastRunoff: -1e9,                  // storm runoff: spreading lenses of muddy fresh water
    spring: 1, tideU: 0, tideStir: 1,               // the tide now (see updateTide): spring-neap strength, current, stirring
    fixed: 0, washed: 0, siWashed: 0,               // nutrients fixed from the air by Trichodesmium, washed in by runoff (in imported too); silica washed in (observed only)
    inputs: [], disturb: [],                        // the hand: queued gestures, active disturbances
    visitors: [], nextVisitorId: 1, carried: 0,     // carried: nutrients that left the column inside visitors
    siUpwelled: 0, initialSilica: 0,                // silica in from the deep; at the start (observed only)
    immigrants: 0, imported: 0,                     // newcomers from the open ocean, and the nutrients they brought (observed only)
    extinctTick: -1,                                // when the last cell and the last cyst were gone (newcomers stop)
    encysted: 0, germinated: 0,                     // observed only: cysts made and germinated
    music: createMusic(seed),                       // harmonic field and voice budget; never feeds back into the biology
  };
  w.nextWind = Math.floor(rng.range(PARAMS.wind.gapMin, PARAMS.wind.gapMax) * PARAMS.time.tickRate);
  w.surfaceLight = surfaceLightAt(dayPhase(w), moonLit(moonPhase(w)));
  updateLight(w);
  const count = founderCount || F.count;
  for (let l = 0; l < F.lineages; l++) {
    const base = randomGenome(rng), spriteSeed = rng.int(0x7fffffff), cx = rng.range(F.spread, W - F.spread);
    base.depthPref *= F.depthMax;
    const n = Math.floor(count / F.lineages) + (l < count % F.lineages ? 1 : 0);
    const deg = w.music.rng.int(w.music.scale.length), motif = randomMotif(w.music.rng);
    for (let k = 0; k < n; k++) {
      const g = mutateGenome(base, rng);
      const x = clamp(cx + gauss(rng) * F.spread, 8, W - 8);
      const y = clamp(g.depthPref * H + gauss(rng) * F.spread, 8, H - 8);
      const c = createCell(w, x, y, g, rng.range(F.energyMin, F.energyMax), null, spriteSeed);
      c.age = rng.range(0, F.maxAge);
      c.deg = driftDegree(w, deg);
      c.motif = inheritMotif(w, motif);
      w.cells.push(c);
    }
  }
  w.initialInventory = nutrientInventory(w);
  w.initialSilica = silicaInventory(w);
  return w;
}

function aliveCount(w) {
  let n = 0;
  for (let i = 0; i < w.cells.length; i++) if (!w.cells[i].dying) n++;
  return n;
}

// Field + nutrients bound in cells, cysts, cyanobacteria, marine snow and the floor deposit. Changes only by upwelling,
// newcomers, nitrogen fixation and runoff (in) and visitors (carried out).
function nutrientInventory(w) {
  let s = 0;
  const f = w.fields, nut = f.nut;
  for (let i = 0; i < nut.length; i++) s += nut[i] + f.det[i];
  for (let i = 0; i < f.sed.length; i++) s += f.sed[i];
  for (let i = 0; i < w.cells.length; i++) s += w.cells[i].held;
  for (let i = 0; i < w.cysts.length; i++) s += w.cysts[i].reserve;
  const syn = f.syn, pro = f.pro, tri = f.tri;
  for (let i = 0; i < syn.length; i++) s += (syn[i] + pro[i]) * PARAMS.cyano.q + tri[i] * PARAMS.tricho.q;   // bound in cyanobacteria
  return s;
}

// Cyanobacteria in the whole column (biomass, about a cell's worth per unit)
function cyanoTotal(w) {
  const syn = w.fields.syn, pro = w.fields.pro, tri = w.fields.tri;
  let a = 0, b = 0, c = 0;
  for (let i = 0; i < syn.length; i++) { a += syn[i]; b += pro[i]; c += tri[i]; }
  return { syn: a, pro: b, tri: c };
}

// Oxygen in the bottom water (the lowest rows above the sediment), and the lowest node there: where dead zones form
const BOTTOM_ROWS = [30, 31, 32, 33, 34, 35, 36, 37];
function bottomOxygen(w) {
  const o2 = w.fields.o2, cols = PARAMS.grid.cols;
  let s = 0, lo = Infinity;
  for (const j of BOTTOM_ROWS) for (let i = 0; i < cols; i++) { const v = o2[j * cols + i]; s += v; if (v < lo) lo = v; }
  return { mean: s / (BOTTOM_ROWS.length * cols), min: lo };
}

// Mean temperature of the surface row
function surfaceTemp(w) {
  const t = w.fields.temp, cols = PARAMS.grid.cols;
  let s = 0;
  for (let i = 0; i < cols; i++) s += t[i];
  return s / cols;
}

function meanNutrient(w) {
  const nut = w.fields.nut;
  let s = 0;
  for (let i = 0; i < nut.length; i++) s += nut[i];
  return s / nut.length;
}

// Glowing Alexandrium (an inherited trait, see PARAMS.luminous); a daughter whose form drifted out of the
// dinoflagellate range keeps the flag but no longer shows it
const isLuminous = (c) => c.lum && dinoWeight(c.g.timbre) > 0.5;

// Silica in the water and in the frustules. Changes only by upwelling and runoff (in).
function silicaInventory(w) {
  let s = 0;
  const si = w.fields.si;
  for (let i = 0; i < si.length; i++) s += si[i];
  for (let i = 0; i < w.cells.length; i++) s += w.cells[i].si;
  for (let i = 0; i < w.cysts.length; i++) s += w.cysts[i].si || 0;   // resting spores keep their frustules
  return s;
}

function meanSilica(w) {
  const si = w.fields.si;
  let s = 0;
  for (let i = 0; i < si.length; i++) s += si[i];
  return s / si.length;
}

const CK_VIEW = new DataView(new ArrayBuffer(8));
function worldChecksum(w) {
  let h = 0x811c9dc5;
  const mix = (v) => {
    CK_VIEW.setFloat64(0, v);
    h = Math.imul(h ^ CK_VIEW.getUint32(0), 16777619);
    h = Math.imul(h ^ CK_VIEW.getUint32(4), 16777619);
  };
  mix(w.tick); mix(w.cells.length); mix(w.cysts.length); mix(w.wind); mix(w.visitors.length); mix(w.carried);
  for (const c of w.cells) { mix(c.id); mix(c.x); mix(c.y); mix(c.energy); mix(c.theta); mix(c.lb ? c.lb.id : 0); }
  for (let i = 0; i < w.fields.nut.length; i += 7) { mix(w.fields.nut[i]); mix(w.fields.graz[i]); }
  return h >>> 0;
}

// ===== Rules =====
const DRAG_K = dexp(-PARAMS.drift.drag * TICK_DT);
const BROWNIAN_K = PARAMS.drift.brownian * Math.sqrt(TICK_DT);

function stepWorld(w) {
  const dt = TICK_DT, cells = w.cells;
  w.tick++;
  // The slow water steps every slowEvery ticks with a step that much longer, its parts staggered over the ticks
  const SE = PARAMS.time.slowEvery, phase = w.tick % SE, sdt = dt * SE;
  w.surfaceLight = surfaceLightAt(dayPhase(w), moonLit(moonPhase(w)));
  if (phase === 0) {
    updateLight(w);
    w.upwelled += diffuseNutrients(w.fields, sdt);
    w.siUpwelled += diffuseSilica(w.fields, sdt);
  }
  updateWind(w, dt);
  updateTide(w);
  updateMixing(w, sdt);   // every tick: the coefficients are shared scratch, never left over from another tick or world
  if (phase === 0) {
    mixColumn(w.fields.nut, PARAMS.mixing.nutrients);
    mixColumn(w.fields.si, PARAMS.mixing.nutrients);
  }
  updatePulses(w, dt);
  updateRunoff(w, dt);
  if (phase === 0) {
    updateTemperature(w, sdt);
    updateSalinity(w, sdt);
  }
  applyHand(w);
  buildHash(w);
  for (let i = 0; i < cells.length; i++) {   // Brownian kicks, drawn in the same order as always
    const c = cells[i];
    if (!c.dying) { c.kx = gauss(w.rng) * BROWNIAN_K; c.ky = gauss(w.rng) * BROWNIAN_K; }
  }
  for (let i = 0; i < cells.length; i++) if (!cells[i].dying) steer(w, cells[i], dt);
  for (let i = 0; i < cells.length; i++) move(cells[i], dt);
  const Dr = PARAMS.drift, rest = PARAMS.diel.rest;
  const pace = rest + (1 - rest) * smoothstep(Dr.darkLo, Dr.darkHi, w.surfaceLight);   // night rest
  for (let i = 0; i < cells.length; i++) {
    const c = cells[i];
    if (c.dying) continue;
    metabolise(w, c, dt, pace);
    advancePhase(w, c, dt);
    ageElder(w, c, dt);
    c.age += dt * pace * (1 - PARAMS.elder.slowAge * c.elder);
  }
  singAndListen(w);
  updateChains(w, dt);
  graze(w, dt, phase === 2 ? sdt : 0);
  if (phase === 1) {
    cyanobacteria(w, sdt);
    tricho(w, sdt);
  }
  lyse(w, dt);
  hunt(w, dt);
  suffocate(w, dt);
  encyst(w, dt);
  updateVisitors(w, dt);
  lifeAndDeath(w);
  updateCysts(w, dt);
  immigrate(w, dt);
  if (phase === 2) {
    marineSnow(w, sdt);
    updateOxygen(w, sdt);
  }
  // Extinction is an ending, not a reset: the water goes on, empty and silent
  if (w.extinctTick < 0 && !w.cysts.length && aliveCount(w) === 0) w.extinctTick = w.tick;
}

// The hand in the water: taps become disturbances cells flee from; swipes drag the water along the finger.
// Queued by the input handler, applied here at a tick boundary.
function applyHand(w) {
  const Hd = PARAMS.hand, rate = PARAMS.time.tickRate;
  for (const q of w.inputs) {
    if (q.kind === 'tap') { w.disturb.push({ x: q.x, y: q.y, t0: w.tick }); continue; }
    const r2 = Hd.wakeR * Hd.wakeR;
    let vx = q.vx * Hd.wake, vy = q.vy * Hd.wake;
    const sp = Math.sqrt(vx * vx + vy * vy);
    if (sp > Hd.wakeMax) { vx *= Hd.wakeMax / sp; vy *= Hd.wakeMax / sp; }
    for (const c of w.cells) {
      if (c.dying) continue;
      const dx = c.x - q.x, dy = c.y - q.y, d2 = dx * dx + dy * dy;
      if (d2 >= r2) continue;
      const k = 1 - Math.sqrt(d2) / Hd.wakeR;
      c.vx += vx * k; c.vy += vy * k;
    }
  }
  w.inputs.length = 0;
  let k = 0;
  for (const d of w.disturb) if (w.tick - d.t0 < Hd.time * rate) w.disturb[k++] = d;
  w.disturb.length = k;
}

// Escape response: swim away from a recent disturbance, strongest close in and at first
function flee(w, c, dt) {
  const Hd = PARAMS.hand, rate = PARAMS.time.tickRate;
  for (const d of w.disturb) {
    const dx = c.x - d.x, dy = c.y - d.y, dist = Math.sqrt(dx * dx + dy * dy);
    if (dist >= Hd.radius || dist === 0) continue;
    const a = Hd.flee * (1 - dist / Hd.radius) * (1 - (w.tick - d.t0) / (Hd.time * rate)) * dt / dist;
    c.vx += dx * a; c.vy += dy * a;
  }
}

// Rule 1: Brownian motion, phototaxis toward the preferred light level, soft separation.
// The preferred level is relative to the surface, so a cell holds its depth all day.
// Night descent: in darkness cells follow the nutrient gradient down instead; phototaxis brings them back at dawn.
// The same neighbour pass gathers the Kuramoto pull (rule 6) from the phases before any of them move this tick,
// and linked cells (chain adhesion) are held by springs instead of pushed apart.
const PHASE_R2 = PARAMS.phase.radius * PARAMS.phase.radius;
const HALF_PI = Math.PI / 2;
function steer(w, c, dt) {
  const D = PARAMS.drift, hs = w.hash, lockCos = PARAMS.voices.lockCos;
  c.pull = 0;
  c.nbrs = 0;
  c.locked = 0;
  if (w.disturb.length) flee(w, c, dt);
  // A colony diffuses as one body: its cells share the head's kick, smaller for a bigger colony
  const kick = c.chainId ? c.head : c, ks = c.chainId ? c.kickScale : 1;
  c.vx += kick.kx * ks;
  c.vy += kick.ky * ks;

  // Brighter than preferred -> swim down (+y); dimmer -> swim up. Bounded ratio, no log.
  // Night descent is swimming: diatoms (glass) don't swim, they only regulate their buoyancy, so they hold their depth
  const night = (1 - smoothstep(D.darkLo, D.darkHi, w.surfaceLight)) * (1 - c.glassW), settle = 1 - PARAMS.elder.settle * c.elder;   // elders barely swim
  if (night < 1) {
    const L = sampleField(w.fields.light, c.x, c.y), T = c.targetLight * w.surfaceLight;
    c.vy += (1 - night) * D.phototaxis * (L - T) / (L + T + 1e-9) * settle * dt;
  }
  if (night > 0) {
    const nd = sampleField(w.fields.nut, c.x, c.y + GRID_H), nu = sampleField(w.fields.nut, c.x, c.y - GRID_H);
    c.vy += night * D.nutritaxis * clamp(D.gradientGain * (nd - nu) / (nd + nu + 1e-6), -1, 1) * settle * dt;
  }

  const ci = clamp(Math.floor(c.x / hs.s), 0, hs.cols - 1), cj = clamp(Math.floor(c.y / hs.s), 0, hs.rows - 1);
  for (let j = cj - 1; j <= cj + 1; j++) {
    if (j < 0 || j >= hs.rows) continue;
    for (let i = ci - 1; i <= ci + 1; i++) {
      if (i < 0 || i >= hs.cols) continue;
      const b = j * hs.cols + i;
      for (let n = hs.start[b], end = hs.start[b + 1]; n < end; n++) {
        const o = hs.items[n];
        if (o === c) continue;
        const dx = c.x - o.x, dy = c.y - o.y, d2 = dx * dx + dy * dy;
        if (d2 < PHASE_R2 && !o.dying) {
          const s = o.theta - c.theta;
          c.pull += dsin(s); c.nbrs++;
          if (dsin(s + HALF_PI) > lockCos) c.locked++;   // in phase: the voice budget hears colonies first
        }
        if (o === c.la || o === c.lb || (c.habit === 2 && c.chainId && o.chainId === c.chainId)) continue;   // a star's cells meet at its hub
        const reach = (c.r + o.r) * D.separationRange;
        if (d2 >= reach * reach || d2 === 0) continue;
        const d = Math.sqrt(d2), push = D.separation * (1 - d / reach) * dt / d;
        c.vx += dx * push;
        c.vy += dy * push;
      }
    }
  }

  if (c.la || c.lb) {
    const Ch = PARAMS.chain;
    if (c.la) linkSpring(c, c.la, dt);
    if (c.lb) linkSpring(c, c.lb, dt);
    if (c.la && c.lb) {
      // An intercalary cell is pulled to the point where the chain turns by its habit's angle:
      // midway between its neighbours for a straight chain, off to one side for coils and stars
      const a = c.la, b = c.lb, ex = b.x - a.x, ey = b.y - a.y;
      c.vx += ((a.x + b.x) * 0.5 + ey * 0.5 * c.tanHalf - c.x) * Ch.straighten * dt;
      c.vy += ((a.y + b.y) * 0.5 - ex * 0.5 * c.tanHalf - c.y) * Ch.straighten * dt;
    }
  }
}

function linkSpring(c, o, dt) {
  const Ch = PARAMS.chain, dx = o.x - c.x, dy = o.y - c.y, d = Math.sqrt(dx * dx + dy * dy) + 1e-9;
  const k = Ch.spring * (d - (c.restK + o.restK) * 0.5 * (c.r + o.r)) * dt / d;
  c.vx += dx * k;
  c.vy += dy * k;
}

function move(c, dt) {
  const D = PARAMS.drift, r = c.r;
  if (c.dying) c.vy += D.deadSink * dt;
  else if (c.sinkV) c.vy += c.sinkV * dt;   // chalk plates are ballast
  c.vx *= DRAG_K;
  c.vy *= DRAG_K;
  c.x += c.vx * dt;
  c.y += c.vy * dt;
  if (c.x < r) { c.x = r; c.vx = Math.abs(c.vx) * D.wallBounce; }
  else if (c.x > W - r) { c.x = W - r; c.vx = -Math.abs(c.vx) * D.wallBounce; }
  const bottom = H - PARAMS.world.floor - D.floorGap - r;
  if (c.y < r + D.surfaceGap) { c.y = r + D.surfaceGap; c.vy = Math.abs(c.vy) * D.wallBounce; }
  else if (c.y > bottom) { c.y = bottom; c.vy = -Math.abs(c.vy) * D.wallBounce; }
}

// Elders: dark acclimation. Days spent in deep, dim water slowly make a cell an elder; brighter water undoes it.
function ageElder(w, c, dt) {
  const E = PARAMS.elder;
  if (w.surfaceLight >= PARAMS.drift.darkHi) {   // judged by day: at night every cell is in the dark
    const was = c.elder;
    c.elder = clamp(c.elder + (dexp(-PARAMS.light.atten * c.y / H) < E.light ? E.grow : -E.fade) * dt, 0, 1);
    if (c.elder !== was) c.rv = c.rvBase * (1 + E.size * c.elder);
  }
  c.elderAge = c.elder >= 1 ? c.elderAge + dt : 0;
}

// Rule 2: energy += light x nutrients x efficiency - maintenance. Uptake removes nutrients locally.
// Upkeep slows with the night rest (pace).
const KLEPTO_K = dexp(-TICK_DT / PARAMS.hunt.fade);   // stolen plastids fade, per tick

function metabolise(w, c, dt, pace) {
  const f = w.fields;
  const L0 = sampleField(f.light, c.x, c.y), N = sampleField(f.nut, c.x, c.y), T = PARAMS.turbulence;
  const L = c.dimLight ? L0 * (1 + c.dimLight) / (L0 + c.dimLight) : L0;   // cryptophytes: phycobilins catch dim light
  const calm = c.dinoW > 0 ? Math.max(0, 1 - T.inhibit * c.dinoW * sampleField(TURB, c.x, c.y)) : 1;   // Margalef
  const Si = PARAMS.silica, glass = c.glassW, S = glass > 0 ? sampleField(f.si, c.x, c.y) : 0;
  const siLim = (1 - glass + glass * S / (S + Si.half))   // diatoms slow as silica runs low
    * (c.hunter ? PARAMS.hunt.dark + (1 - PARAMS.hunt.dark) * c.klepto : 1);   // Dinophysis photosynthesises with stolen plastids
  if (c.hunter) c.klepto *= KLEPTO_K;
  const gain = c.gainK * L * N / (N + c.halfSat) * calm * siLim * (1 - PARAMS.elder.slowUpkeep * c.elder)   // elders: slow metabolism
    * sampleField(f.warm, c.x, c.y) * dt;                                                                     // faster in warm water
  const want = gain * PARAMS.metabolism.uptake * c.biomass;
  const got = want > 0 ? takeField(f.nut, c.x, c.y, want) : 0;
  if (got > 0) addField(f.o2, c.x, c.y, got * PARAMS.oxygen.per);   // photosynthesis gives oxygen off
  let share = want > 0 ? got / want : 0;
  if (glass > 0 && got > 0) {   // the glass is built from silica, in step with the growth
    const siWant = got * Si.ratio * glass, siGot = takeField(f.si, c.x, c.y, siWant);
    c.si += siGot;
    if (siGot < siWant) share *= siGot / siWant;
  }
  c.energy += gain * share - c.maintK * pace * (1 - PARAMS.elder.slowUpkeep * c.elder) * dt;
  c.vigor += (L * N / (N + c.halfSat) - c.vigor) * dt / PARAMS.metabolism.vigorTau;   // recorded, never read by the rules (swimming, singing)
  c.fed += (N / (N + c.halfSat) * (1 - glass + glass * S / (S + Si.half)) - c.fed) * dt / PARAMS.cyst.hungerTau;   // nutrients and silica: read by encystment
  c.held += got;
}

// Rule 6: the phase runs at the natural rate, pulled toward the neighbours' phases (Kuramoto).
// Wrapping past 2pi is a flash. Synchronised colonies come out of this; nothing else groups them.
function advancePhase(w, c, dt) {
  const pull = c.nbrs ? c.g.coupling * PARAMS.phase.K * c.pull / c.nbrs : 0;
  c.theta += (TAU * c.g.omega * (1 - PARAMS.elder.slowPulse * c.elder) + pull) * dt;
  if (c.theta >= TAU) { c.theta -= TAU; c.flashTick = w.tick; }
  else if (c.theta < 0) c.theta += TAU;
}

// Chain links break slowly at random; then every cell learns the length of its chain
function updateChains(w, dt) {
  const cells = w.cells, p = PARAMS.chain.breakRate * dt;
  for (let i = 0; i < cells.length; i++) {
    const c = cells[i];
    if (c.lb && w.rng.chance(p)) { c.lb.la = null; c.lb = null; }
  }
  for (let i = 0; i < cells.length; i++) {
    const c = cells[i];
    if (c.la) continue;
    let n = 0;
    for (let k = c; k; k = k.lb) n++;
    const ks = 1 / Math.sqrt(n);
    for (let k = c; k; k = k.lb) { k.chainLen = n; k.chainId = n > 1 ? c.id : 0; k.head = c; k.kickScale = ks; }
  }
}

// Observed only (debug and sim-check), never read by the rules. Local sync: for each cell with neighbours
// within the coupling radius, |mean e^(i theta)| over it and them; `locked` = share of those above 0.9.
// Global sync is the classic order parameter over the whole column.
function syncStats(w) {
  const R2 = PHASE_R2, cells = w.cells, cosT = (x) => dsin(x + Math.PI / 2);
  let gx = 0, gy = 0, n = 0, local = 0, counted = 0, locked = 0, chains = 0, chained = 0, longest = 1, coils = 0, stars = 0;
  for (const c of cells) {
    if (c.dying) continue;
    n++;
    gx += cosT(c.theta); gy += dsin(c.theta);
    if (!c.la && c.lb) {
      chains++; longest = Math.max(longest, c.chainLen);
      if (c.chainLen >= 4 && c.lb.habit === 1) coils++;   // shaped colonies of four or more
      if (c.chainLen >= 4 && c.lb.habit === 2) stars++;
    }
    if (c.chainLen > 1) chained++;
    let sx = cosT(c.theta), sy = dsin(c.theta), m = 1;
    for (const o of cells) {
      if (o === c || o.dying) continue;
      const dx = o.x - c.x, dy = o.y - c.y;
      if (dx * dx + dy * dy < R2) { sx += cosT(o.theta); sy += dsin(o.theta); m++; }
    }
    if (m < 2) continue;
    const r = Math.sqrt(sx * sx + sy * sy) / m;
    local += r; counted++;
    if (r > 0.9) locked++;
  }
  return {
    global: n ? Math.sqrt(gx * gx + gy * gy) / n : 0, local: counted ? local / counted : 0,
    locked: counted ? locked / counted : 0, crowded: n ? counted / n : 0,
    chains, chained: n ? chained / n : 0, longest, coils, stars,
  };
}

// Weather: the wind eases toward a target that changes at random intervals.
// Targets are r^1.5 of a uniform draw, so calm spells are common and storms rarer.
function updateWind(w, dt) {
  const Wd = PARAMS.wind, rng = w.rng;
  if (w.tick >= w.nextWind) {
    const r = rng.next();
    w.windTarget = r * Math.sqrt(r);
    w.nextWind = w.tick + Math.floor(rng.range(Wd.gapMin, Wd.gapMax) * PARAMS.time.tickRate);
  }
  w.wind += (w.windTarget - w.wind) * dt / Wd.tau;
}

// Nutrient pulses: wind-driven upwelling. During strong wind a plume of deep water rises from the floor,
// releasing its nutrients evenly along its path with a Gaussian horizontal profile.
function updatePulses(w, dt) {
  const P = PARAMS.pulses, cols = PARAMS.grid.cols, rng = w.rng;
  if (w.wind > P.storm && w.tick - w.lastPulse > P.refractory * PARAMS.time.tickRate
      && rng.chance(P.rate * (w.wind - P.storm) / (1 - P.storm) * dt)) {
    w.lastPulse = w.tick;
    const x = rng.range(P.width, W - P.width), y = H - PARAMS.world.floor, top = H * P.top * rng.range(0.7, 1.3);
    const weights = new Float64Array(cols);
    let sum = 0;
    for (let i = 0; i < cols; i++) {
      const d = ((i + 0.5) * GRID_W - x) / P.width;
      weights[i] = dexp(-d * d);
      sum += weights[i];
    }
    for (let i = 0; i < cols; i++) weights[i] /= sum;
    w.pulses.push({ x, y, y0: y, top, age: 0, perTick: P.amount * P.rise * dt / (y - top), weights });
  }
  let k = 0;
  for (let n = 0; n < w.pulses.length; n++) {
    const p = w.pulses[n];
    p.age += dt;
    p.y -= P.rise * dt;
    if (p.y <= p.top) continue;
    const siShare = PARAMS.silica.deep / PARAMS.nutrients.deep;   // deep water brings silica too
    for (let i = 0; i < cols; i++) {
      addField(w.fields.nut, (i + 0.5) * GRID_W, p.y, p.perTick * p.weights[i]);
      addField(w.fields.si, (i + 0.5) * GRID_W, p.y, p.perTick * siShare * p.weights[i]);
    }
    w.upwelled += p.perTick;
    w.siUpwelled += p.perTick * siShare;
    w.pulses[k++] = p;
  }
  w.pulses.length = k;
}

// Rule 5: grazing. Density-dependent and lagged: grazers build up where cells are dense.
function graze(w, dt, slowDt) {
  const G = PARAMS.grazing, f = w.fields, cells = w.cells, K = G.halfB;
  f.bio.fill(0);
  for (let i = 0; i < cells.length; i++) if (!cells[i].dying) addField(f.bio, cells[i].x, cells[i].y, cells[i].biomass);
  for (let k = 0; k < f.bio.length; k++) f.bio[k] += f.syn[k] + f.pro[k];   // grazers eat cyanobacteria too
  if (slowDt) updateGrazers(f, slowDt);   // the grazers themselves change slowly: with the slow water
  for (let i = 0; i < cells.length; i++) {
    const c = cells[i];
    if (c.dying) continue;
    const B = sampleField(f.bio, c.x, c.y), Z = sampleField(f.graz, c.x, c.y);
    const m = G.rate * Z * K * B / (B * B + K * K) / (1 + PARAMS.chain.refuge * (c.chainLen - 1)) * c.grazeK;   // chains: a size refuge; plates shield
    if (w.rng.chance(m * dt)) eaten(w, c);
  }
}

// Cyanobacteria: two living fields, node by node; then the currents carry them
function cyanobacteria(w, dt) {
  const Cy = PARAMS.cyano, G = PARAMS.grazing, f = w.fields, K = G.halfB, h2 = Cy.phageHalf * Cy.phageHalf;
  for (const type of ['syn', 'pro']) {
    const C = f[type], dim = Cy[type].dim;
    for (let k = 0; k < C.length; k++) {
      let c = C[k];
      if (c < Cy.floor) { w.imported += (Cy.floor - c) * Cy.q; c = Cy.floor; }   // a trace drifts in from the open ocean
      const L0 = f.light[k], L = dim ? L0 * (1 + dim) / (L0 + dim) : L0, N = f.nut[k];
      const want = Cy.growth * L * N / (N + Cy.half) * f.warmCy[k] * c * (1 - c / Cy.max) * dt;
      const grow = want > 0 ? takeNode(f.nut, k, want * Cy.q) / Cy.q : 0;
      const B = f.bio[k], Z = f.graz[k];
      const resp = Cy.respire * c * dt;
      const eaten = G.rate * Z * K * B / (B * B + K * K) * c * dt;
      const lysed = Cy.phage * c * c / (c * c + h2) * c * dt;
      const back = (resp + eaten * Cy.grazedRecycled + lysed * Cy.lysedRecycled) * Cy.q;
      f.nut[k] += back;
      f.o2[k] += (grow * Cy.q - back) * PARAMS.oxygen.per;   // made as they grow, used as they are respired and rot
      f.det[k] += (eaten * (1 - Cy.grazedRecycled) + lysed * (1 - Cy.lysedRecycled)) * Cy.q;
      C[k] = Math.max(0, c + grow - resp - eaten - lysed);
    }
    const k2 = Cy.diffusion * dt;
    diffuseGrid(C, f.cyScratch, k2, 0, 0);
    C.set(f.cyScratch);
  }
  if (Math.floor(w.tick / PARAMS.time.slowEvery) % (Cy.advectEvery / PARAMS.time.slowEvery) === 0) { advect(w, f.syn); advect(w, f.pro); }
}

// The currents: a slowly turning pattern of eddies (a stream function), faster in wind
function currentAt(w, x, y, out) {
  const Cy = PARAMS.cyano, k = TAU / Cy.wave, t = w.tick * TICK_DT * Cy.turn * TAU, sp = (Cy.speed + Cy.windSpeed * w.wind) / k;
  const a1 = k * x + t, b1 = k * 0.8 * y - t * 0.7, a2 = k * 0.6 * x - t * 1.3, b2 = k * 1.3 * y + t * 0.5;
  // psi = sp (sin a1 sin b1 + 0.6 sin a2 sin b2); u = dpsi/dy, v = -dpsi/dx
  out.u = sp * (dsin(a1) * dsin(b1 + HALF_PI) * k * 0.8 + 0.6 * dsin(a2) * dsin(b2 + HALF_PI) * k * 1.3);
  out.v = -sp * (dsin(a1 + HALF_PI) * dsin(b1) * k + 0.6 * dsin(a2 + HALF_PI) * dsin(b2) * k * 0.6);
}

// Semi-Lagrangian: each node takes what the current brought from upstream; rescaled so nothing is made or lost.
// Where each node's water came from is worked out once per tick and shared by every field the current carries.
const CUR = { u: 0, v: 0 }, DEP_X = new Float64Array(PARAMS.grid.cols * PARAMS.grid.rows), DEP_Y = new Float64Array(DEP_X.length);
let depTick = -1, depWorld = null;
function advect(w, C) {
  const Cy = PARAMS.cyano, { cols, rows } = PARAMS.grid, b = w.fields.cyScratch, step = Cy.advectEvery * TICK_DT;
  let before = 0, after = 0;
  for (let k = 0; k < C.length; k++) before += C[k];
  if (depTick !== w.tick || depWorld !== w) {   // per world and tick: another world's currents never carry this one
    depTick = w.tick; depWorld = w;
    for (let j = 0; j < rows; j++) {
      for (let i = 0; i < cols; i++) {
        const x = (i + 0.5) * GRID_W, y = (j + 0.5) * GRID_H;
        currentAt(w, x, y, CUR);
        DEP_X[j * cols + i] = x - CUR.u * step; DEP_Y[j * cols + i] = y - CUR.v * step;
      }
    }
  }
  for (let k = 0; k < C.length; k++) b[k] = sampleField(C, DEP_X[k], DEP_Y[k]);
  for (let k = 0; k < C.length; k++) after += b[k];
  const keep = after > 0 ? before / after : 1;
  for (let k = 0; k < C.length; k++) C[k] = b[k] * keep;
}

// Trichodesmium: grows where the water is warm, fixing most of its nitrogen from the air; floats up on its gas
