// vesicles and sinks under the ballast it builds in bright light, so calm water gathers it into a surface scum
const TRI_V = new Float64Array(PARAMS.grid.cols * PARAMS.grid.rows);   // sinking speed per node (negative: rising)
function tricho(w, dt) {
  const Tr = PARAMS.tricho, G = PARAMS.grazing, Ox = PARAMS.oxygen, f = w.fields, { cols, rows } = PARAMS.grid;
  const C = f.tri, K = G.halfB, h2 = Tr.phageHalf * Tr.phageHalf;
  for (let k = 0; k < C.length; k++) {
    let c = C[k];
    if (c < Tr.floor) { w.imported += (Tr.floor - c) * Tr.q; c = Tr.floor; }   // a trace drifts in from the open ocean
    const L = f.light[k], N = f.nut[k];
    TRI_V[k] = Tr.rise * (Tr.ballast * L - 1);
    if (c < Tr.trace && f.temp[k] <= Tr.warmFrom) { C[k] = c; continue; }   // only a trace, in water too cold to grow: it just drifts
    const want = Tr.growth * L * N / (N + Tr.half) * smoothstep(Tr.warmFrom, Tr.warmFull, f.temp[k]) * f.warmCy[k] * c * (1 - c / Tr.max) * dt;
    let grow = 0;
    if (want > 0) {   // the fixed share comes from the air (new nutrients); the rest from the water, as far as it holds
      const need = want * Tr.q * (1 - Tr.fix), got = takeNode(f.nut, k, need);
      grow = need > 0 ? want * got / need : want;
      const fixed = grow * Tr.q * Tr.fix;
      w.fixed += fixed; w.imported += fixed;
    }
    const B = f.bio[k], Z = f.graz[k];
    const resp = Tr.respire * c * dt;
    const eaten = G.rate * Z * K * B / (B * B + K * K) * Tr.grazed * c * dt;
    const lysed = (Tr.phage * c * c / (c * c + h2) + (k < cols ? Tr.burn * L : 0)) * c * dt;   // phages; a scum burns in full sun
    const back = (resp + eaten * G.recycled + lysed * Tr.recycled) * Tr.q;
    f.nut[k] += back;
    f.o2[k] += (grow * Tr.q - back) * Ox.per;
    f.det[k] += (eaten * (1 - G.recycled) + lysed * (1 - Tr.recycled)) * Tr.q;
    C[k] = Math.max(0, c + grow - resp - eaten - lysed);
  }
  // Buoyancy: each interface passes what rises from below and what sinks from above (closed at the surface: the scum)
  const b = f.cyScratch, s = dt / GRID_H;
  b.set(C);
  for (let j = 0; j < rows - 1; j++) {
    for (let i = 0; i < cols; i++) {
      const k = j * cols + i, kd = k + cols;
      const q = (TRI_V[kd] < 0 ? -TRI_V[kd] * b[kd] : 0) - (TRI_V[k] > 0 ? TRI_V[k] * b[k] : 0);
      C[k] += q * s;
      C[kd] -= q * s;
    }
  }
  mixColumn(C, 1);
  diffuseGrid(C, b, Tr.diffusion * dt, 0, 0);
  C.set(b);
  if (Math.floor(w.tick / PARAMS.time.slowEvery) % (PARAMS.cyano.advectEvery / PARAMS.time.slowEvery) === 0) advect(w, C);
}

// Temperature: sunlight warms the water where it is absorbed, the surface gives heat back to the air (faster in wind),
// heat diffuses, deep water is cold, and wind mixing carries the warm layer down
function updateTemperature(w, dt) {
  const T = PARAMS.temperature, f = w.fields, cols = PARAMS.grid.cols, t = f.temp, k = T.diffusion * dt;
  for (let i = 0; i < t.length; i++) t[i] += T.heat * f.light[i] * f.profile[(i / cols) | 0] * dt;   // most of the heat stays in the top few metres
  const loss = (T.cool + T.windCool * w.wind) * dt;
  for (let i = 0; i < cols; i++) t[i] += (T.air - t[i]) * loss;
  diffuseGrid(t, f.cyScratch, k, 0, 0); t.set(f.cyScratch);
  renewBottom(t, T.deep, T.vent * dt);
  mixColumn(t, 1);
  if (w.tick % PARAMS.cyano.advectEvery === 0) updateWarmth(f);   // (the slow water steps on ticks that include these)
}

// Salinity: the shelf's salt water replaces the column slowly from the sides and renews the bottom layer; salt
// diffuses and is mixed as heat is (runoff freshens the surface, see updateRunoff)
function updateSalinity(w, dt) {
  const Sa = PARAMS.salinity, f = w.fields, s = f.sal, k = PARAMS.temperature.diffusion * dt, ex = Sa.exchange * dt;
  for (let i = 0; i < s.length; i++) s[i] += (Sa.shelf - s[i]) * ex;
  diffuseGrid(s, f.cyScratch, k, 0, 0); s.set(f.cyScratch);
  renewBottom(s, Sa.shelf, PARAMS.temperature.vent * dt);
  mixColumn(s, 1);
}

// Oxygen: the surface breathes with the air toward saturation (less in warm water, faster in wind); oxygen diffuses
// and is mixed; deep water seeps in slowly at the bottom. Never below none.
function updateOxygen(w, dt) {
  const O = PARAMS.oxygen, f = w.fields, cols = PARAMS.grid.cols, o2 = f.o2, b = f.cyScratch, k = O.diffusion * dt;
  const air = (O.aerate + O.windAerate * w.wind) * dt;
  for (let i = 0; i < cols; i++) o2[i] += (1 - O.satT * (f.temp[i] - PARAMS.temperature.air) - o2[i]) * air;
  diffuseGrid(o2, b, k, 0, 0);
  for (let i = 0; i < o2.length; i++) o2[i] = b[i] > 0 ? b[i] : 0;
  renewBottom(o2, O.deep, O.vent * dt);
  mixColumn(o2, 1);
}

// Marine snow: detritus sinks, rotting on the way (the rot uses oxygen; without it only the anaerobic share goes on),
// and settles on the floor, where the deposit rots slowly into the bottom water
function marineSnow(w, dt) {
  const S = PARAMS.snow, O = PARAMS.oxygen, f = w.fields, { cols, rows } = PARAMS.grid, d = f.det, o2 = f.o2, nut = f.nut;
  const fall = S.sink * dt / GRID_H;
  const rot = (k, m, rate) => {   // returns what rotted
    const ox = o2[k], aer = (1 - S.anaerobic) * ox / (ox + S.half), q = rate * f.warmSnow[k] * dt;
    const r = m * q * (S.anaerobic + aer);
    nut[k] += r;
    o2[k] = Math.max(0, ox - m * q * aer * O.per);
    return r;
  };
  for (let j = rows - 1; j >= 0; j--) {   // from the bottom up, so each flake falls one step per tick
    for (let i = 0; i < cols; i++) {
      const k = j * cols + i;
      if (d[k] <= 0) continue;
      const left = d[k] - rot(k, d[k], S.rot), move = left * fall;
      d[k] = left - move;
      if (j >= FLOOR_ROW) { f.sed[i] += move; w.fallen[i] += move; }
      else d[k + cols] += move;
    }
  }
  for (let i = 0; i < cols; i++) if (f.sed[i] > 0) f.sed[i] -= rot(FLOOR_ROW * cols + i, f.sed[i], S.bed);
  const Td = PARAMS.tide, up = Td.resuspend * Math.max(0, w.tideStir - Td.lift) * dt;   // a strong tide lifts the deposit
  if (up > 0) {
    const n = Math.max(1, Math.round(PARAMS.mixing.tideDepth * w.spring * rows));
    for (let i = 0; i < cols; i++) {
      const m = f.sed[i] * up;
      f.sed[i] -= m;
      for (let j = 1; j <= n; j++) d[(FLOOR_ROW - j) * cols + i] += m / n;
    }
  }
}

// Storm runoff: during a storm, now and then a lens of muddy fresh water spreads from the coast across the surface,
// bringing nutrients, silica and silt; the silt sinks and settles out
function updateRunoff(w, dt) {
  const Ro = PARAMS.runoff, rng = w.rng, f = w.fields;
  if (w.wind > Ro.storm && w.tick - w.lastRunoff > Ro.refractory * PARAMS.time.tickRate
      && rng.chance(Ro.rate * (w.wind - Ro.storm) / (1 - Ro.storm) * dt)) {
    w.lastRunoff = w.tick;
    const fromLeft = (w.seed & 1) === 0;   // the coast lies on one side, fixed by the seed
    w.runoffs.push({ x: fromLeft ? 0 : W, dir: fromLeft ? 1 : -1, age: 0 });
  }
  const per = Ro.amount * Ro.speed * dt / W, siPer = per * Ro.silica, siltPer = Ro.silt * Ro.speed * dt / W, layers = 4;
  const freshPer = PARAMS.salinity.fresh * Ro.speed * dt / W;
  let n = 0;
  for (const r of w.runoffs) {
    r.age += dt;
    r.x += r.dir * Ro.speed * dt;
    if (r.x < 0 || r.x > W) continue;
    for (let l = 0; l < layers; l++) {
      const y = (l + 0.5) * Ro.depth / layers;
      addField(f.nut, r.x, y, per / layers);
      addField(f.si, r.x, y, siPer / layers);
      addField(f.silt, r.x, y, siltPer / layers);
      addField(f.sal, r.x, y, -freshPer / layers);   // fresh water
    }
    w.imported += per; w.washed += per; w.siWashed += siPer;
    w.runoffs[n++] = r;
  }
  w.runoffs.length = n;
  // The silt sinks a row at a time and settles out
  const { cols, rows } = PARAMS.grid, z = f.silt, fall = Ro.siltSink * dt / GRID_H, keep = 1 - dt / Ro.siltTau;
  for (let j = rows - 1; j >= 0; j--) {
    for (let i = 0; i < cols; i++) {
      const k = j * cols + i;
      if (z[k] <= 0) continue;
      const m = z[k] * keep, move = j < rows - 1 ? m * fall : 0;
      z[k] = m - move;
      if (move) z[k + cols] += move;
    }
  }
}

// Viruses: each kind has its own, and a cell's risk rises with the biomass of its own kind around it
function lyse(w, dt) {
  const V = PARAMS.virus, cells = w.cells, kinds = w.fields.kinds, h2 = V.half * V.half;
  for (let k = 0; k < KINDS; k++) kinds[k].fill(0);
  for (let i = 0; i < cells.length; i++) if (!cells[i].dying) addField(kinds[cells[i].kind], cells[i].x, cells[i].y, cells[i].biomass);
  for (let i = 0; i < cells.length; i++) {
    const c = cells[i];
    if (c.dying) continue;
    const B = sampleField(kinds[c.kind], c.x, c.y);
    if (w.rng.chance(V.rate * (c.kind === 7 ? V.cocco : 1) * B * B / (B * B + h2) * dt)) burst(w, c);
  }
}

function burst(w, c) {
  c.dying = 1;
  unlink(c);
  c.lysed = true;
  w.deaths.lysed++;
  const here = c.held * PARAMS.virus.recycled;
  remin(w, c.x, c.y, here);
  exportDetritus(w, c.x, c.y, c.held - here);
  c.held = 0;
  releaseSilica(w, c);
}

// Dinophysis hunts: each strikes now and then if a cell is within reach (the first it finds), so it meets the
// commonest prey most. The prey vanishes quietly, like a grazed cell.
function hunt(w, dt) {
  const Hn = PARAMS.hunt, hs = w.hash, cells = w.cells, p = Hn.rate * dt;
  for (let i = 0; i < cells.length; i++) {
    const c = cells[i];
    if (!c.hunter || c.dying || !w.rng.chance(p)) continue;
    const ci = clamp(Math.floor(c.x / hs.s), 0, hs.cols - 1), cj = clamp(Math.floor(c.y / hs.s), 0, hs.rows - 1);
    let prey = null, crypto = null;   // a cryptophyte within reach is taken first
    for (let j = cj - 1; j <= cj + 1 && !crypto; j++) {
      if (j < 0 || j >= hs.rows) continue;
      for (let i2 = ci - 1; i2 <= ci + 1 && !crypto; i2++) {
        if (i2 < 0 || i2 >= hs.cols) continue;
        const b = j * hs.cols + i2;
        for (let n = hs.start[b], end = hs.start[b + 1]; n < end; n++) {
          const o = hs.items[n];
          if (o === c || o.dying || o.hunter) continue;
          const dx = o.x - c.x, dy = o.y - c.y, reach = c.r + o.r + Hn.reach;
          if (dx * dx + dy * dy >= reach * reach) continue;
          if (o.kind === 8) { crypto = o; break; }
          if (!prey) prey = o;
        }
      }
    }
    if (crypto || prey) devour(w, c, crypto || prey);
  }
}

function devour(w, c, o) {
  const Hn = PARAMS.hunt, kept = o.held * Hn.assimilate;
  o.dying = 1;
  unlink(o);
  o.grazed = true;
  w.deaths.hunted++;
  c.held += kept;
  remin(w, o.x, o.y, o.held - kept);
  o.held = 0;
  c.energy += Math.max(0, o.energy) * Hn.energy;
  releaseSilica(w, o);
  c.klepto = Math.min(1, c.klepto + Hn.refill);
  (c.plastids || (c.plastids = [])).push(hueRamp(o));
  if (c.plastids.length > Hn.plastids) c.plastids.shift();
  c.pv++;
}

// A grazed cell vanishes quietly: no cyst; most of its nutrients are excreted in place, the rest sink as pellets.
function eaten(w, c) {
  c.dying = 1;
  unlink(c);
  c.grazed = true;
  w.deaths.grazed++;
  const recycled = c.held * PARAMS.grazing.recycled;
  remin(w, c.x, c.y, recycled);
  exportDetritus(w, c.x, c.y, c.held - recycled);
  c.held = 0;
  releaseSilica(w, c);
}

// ---- Visitors: sardine schools and salp chains come to blooms; an ocean sunfish comes for the salps ----
function updateVisitors(w, dt) {
  const V = PARAMS.visitors, rng = w.rng, cells = w.cells;
  let biomass = 0, my = 0;
  for (let i = 0; i < cells.length; i++) if (!cells[i].dying) { biomass += cells[i].biomass; my += cells[i].y * cells[i].biomass; }
  const attract = smoothstep(V.attractLo, V.attractHi, biomass);
  let school = null, salp = null, fish = null, jelly = null, comb = null;
  for (const v of w.visitors) {
    if (v.kind === 'sardines') school = v; else if (v.kind === 'salps') salp = v; else if (v.kind === 'sunfish') fish = v;
    else if (v.kind === 'jellies') jelly = v; else if (v.kind === 'combs') comb = v;
  }

  if (!school && attract > 0 && rng.chance(V.sardines.rate * attract * dt)) {
    const S = V.sardines, dir = rng.chance(0.5) ? 1 : -1;
    w.visitors.push({
      kind: 'sardines', id: w.nextVisitorId++, dir, x: dir > 0 ? -S.rx - 10 : W + S.rx + 10,
      y: clamp(my / biomass + gauss(rng) * 15, 30, H - 60), vx: dir * rng.range(S.speedMin, S.speedMax), vy: 0, age: 0,
      fish: S.fishMin + rng.int(S.fishMax - S.fishMin + 1), pass: 1, ate: 0,
    });
  }
  if (!salp && attract > 0 && rng.chance(V.salps.rate * attract * dt)) {
    const S = V.salps, dir = rng.chance(0.5) ? 1 : -1, n = S.barrelsMin + rng.int(S.barrelsMax - S.barrelsMin + 1);
    w.visitors.push({
      kind: 'salps', id: w.nextVisitorId++, dir, x: dir > 0 ? -8 : W + 8, y: rng.range(40, H * 0.5),
      vx: dir * rng.range(S.speedMin, S.speedMax), vy: rng.range(-0.3, 0.3), age: 0, alive: new Array(n).fill(true),
    });
  }
  for (const [kind, here] of [['jellies', jelly], ['combs', comb]]) {   // jelly blooms: grazers to eat, warm and calm water
    const J = V[kind];
    if (here || !rng.chance(J.rate * jellyDraw(w, J) * dt)) continue;
    const dir = rng.chance(0.5) ? 1 : -1, n = J.countMin + rng.int(J.countMax - J.countMin + 1), members = [];
    for (let i = 0; i < n; i++) {
      members.push({ dx: rng.range(-1, 1) * J.spread, dy: rng.range(-0.6, 0.6) * J.spread, size: rng.range(0.75, 1.2),
                     period: rng.range(J.pulseMin, J.pulseMax), ph: rng.next(), tint: rng.int(2), alive: true });
    }
    w.visitors.push({ kind, id: w.nextVisitorId++, dir, x: dir > 0 ? -J.spread - 15 : W + J.spread + 15, y: rng.range(50, H * 0.55),
                      vx: dir * rng.range(J.speedMin, J.speedMax), vy: 0, age: 0, members });
  }
  const prey = salp || jelly || comb;
  if (prey && !fish && rng.chance(V.sunfish.rate * dt)) {
    const side = prey.x < W / 2 ? 1 : -1;   // comes in from the far side, toward its prey
    w.visitors.push({ kind: 'sunfish', id: w.nextVisitorId++, dir: -side, x: side > 0 ? W + V.sunfish.r + 12 : -V.sunfish.r - 12,
                      y: clamp(prey.y + 25, 40, H - 70), vx: 0, vy: 0, age: 0, leaving: false });
  }

  let k = 0;
  for (const v of w.visitors) {
    v.age += dt;
    let gone;
    if (v.kind === 'sardines') gone = moveSchool(w, v, dt);
    else if (v.kind === 'salps') gone = moveSalps(w, v, dt);
    else if (v.kind === 'sunfish') gone = moveSunfish(w, v, dt);
    else gone = moveJellies(w, v, dt);
    if (!gone) w.visitors[k++] = v;
  }
  w.visitors.length = k;
}

// The school sweeps across, leaning toward richer water ahead, swallowing cells in its path
function moveSchool(w, v, dt) {
  const S = PARAMS.visitors.sardines, f = w.fields;
  const O = PARAMS.oxygen, ax = v.x + v.dir * S.rx;
  const breathable = (y) => smoothstep(O.anoxic, O.hypoxic, sampleField(f.o2, ax, y));   // they steer away from hypoxic water
  const up = sampleField(f.bio, ax, v.y - S.ry) * breathable(v.y - S.ry), down = sampleField(f.bio, ax, v.y + S.ry) * breathable(v.y + S.ry);
  v.vy += (S.steer * (down - up) / (down + up + 1e-6) + S.wave * 0.3 * dsin(v.age * 0.9 + v.id) - S.drag * v.vy) * dt;
  v.x += v.vx * dt;
  v.y = clamp(v.y + v.vy * dt, 20, H - PARAMS.world.floor - 20);
  const cx = v.x + v.dir * 4;
  for (const c of w.cells) {
    if (c.dying) continue;
    const dx = (c.x - cx) / S.rx, dy = (c.y - v.y) / S.ry;
    if (dx * dx + dy * dy < 1 && w.rng.chance(S.eat * dt)) { swallow(w, c, 'sardines', S); v.ate++; }
  }
  const out = v.dir > 0 ? v.x > W + S.rx + 20 : v.x < -S.rx - 20;
  if (out && v.ate >= S.turnIfAte && v.pass < S.passes) {   // worth another pass: wheel round
    v.dir = -v.dir; v.vx = -v.vx; v.pass++; v.ate = 0; v.turnedAt = v.age;
    return false;
  }
  return out;
}

// Barrel k of a salp chain: trailing behind the head on a gentle diagonal, undulating
function salpBarrel(v, k) {
  const S = PARAMS.visitors.salps, ct = 1 - S.tilt * S.tilt / 2;
  return {
    x: v.x - v.dir * k * S.spacing * ct,
    y: v.y + k * S.spacing * S.tilt + S.sway * dsin(v.age * 0.5 + k * 0.8),
  };
}

function moveSalps(w, v, dt) {
  const S = PARAMS.visitors.salps, r2 = S.reach * S.reach;
  v.x += v.vx * dt;
  v.y = clamp(v.y + v.vy * dt, 20, H * 0.7);
  for (let b = 0; b < v.alive.length; b++) {
    if (!v.alive[b]) continue;
    const p = salpBarrel(v, b);
    for (const c of w.cells) {
      if (c.dying) continue;
      const dx = c.x - p.x, dy = c.y - p.y;
      if (dx * dx + dy * dy < r2 && w.rng.chance(S.eat * dt)) swallow(w, c, 'salps', S);
    }
  }
  const tail = v.x - v.dir * v.alive.length * S.spacing;
  return !v.alive.some((a) => a) || (v.dir > 0 ? tail > W + 10 : tail < -10);
}

// How strongly jellies are drawn in now: grazers to eat in the upper water, warm and calm water (0..1)
function jellyDraw(w, J) {
  const { cols, rows } = PARAMS.grid, Z = w.fields.graz, half = rows >> 1;
  let z = 0;
  for (let k = 0; k < half * cols; k++) z += Z[k];
  return smoothstep(J.zFrom, J.zFull, z / (half * cols)) * smoothstep(J.warmFrom, J.warmFull, surfaceTemp(w)) * (1 - smoothstep(J.calm, J.calm + 0.2, w.wind));
}

// Where a jelly is: its place in the group, a slow sway, and the pulse (a quick rise, then sinking back)
function jellyPulse(v, m) {
  const p = v.age / m.period + m.ph;
  return p - Math.floor(p);   // 0 at the start of a contraction
}
function jellyAt(v, m) {
  const J = PARAMS.visitors[v.kind], p = jellyPulse(v, m), bob = J.lift * (smoothstep(0, 0.3, p) - p);
  return { x: v.x + m.dx + 2 * dsin(v.age * 0.13 + m.ph * TAU), y: v.y + m.dy - bob };
}

// A group of jellies drifts across, each eating the grazers around it
function moveJellies(w, v, dt) {
  const J = PARAMS.visitors[v.kind], G = PARAMS.grazing, Z = w.fields.graz, { cols, rows } = PARAMS.grid;
  v.x += v.vx * dt;
  v.y = clamp(v.y + 0.5 * dsin(v.age * 0.05 + v.id) * dt, 40, H * 0.65);
  for (const m of v.members) {
    if (!m.alive) continue;
    const p = jellyAt(v, m), reach = J.reach * m.size;
    const i0 = Math.max(0, Math.floor((p.x - reach) / GRID_W)), i1 = Math.min(cols - 1, Math.floor((p.x + reach) / GRID_W));
    const j0 = Math.max(0, Math.floor((p.y - reach) / GRID_H)), j1 = Math.min(rows - 1, Math.floor((p.y + reach) / GRID_H));
    for (let j = j0; j <= j1; j++) {
      for (let i = i0; i <= i1; i++) {
        const dx = (i + 0.5) * GRID_W - p.x, dy = (j + 0.5) * GRID_H - p.y, d = Math.sqrt(dx * dx + dy * dy);
        if (d >= reach) continue;
        const k = j * cols + i;
        Z[k] = Math.max(G.floor, Z[k] * (1 - J.eat * (1 - d / reach) * dt));
      }
    }
  }
  const edge = J.spread + J.r * 2 + 10;
  return !v.members.some((m) => m.alive) || (v.dir > 0 ? v.x > W + edge : v.x < -edge);
}

// What the sunfish eats: salp barrels and jellies, each a point that a bite removes
function sunfishPrey(w) {
  const out = [];
  for (const p of w.visitors) {
    if (p.kind === 'salps') {
      for (let b = 0; b < p.alive.length; b++) if (p.alive[b]) { const q = salpBarrel(p, b); out.push({ x: q.x, y: q.y, v: p, i: b }); }
    } else if (p.kind === 'jellies' || p.kind === 'combs') {
      p.members.forEach((m, i) => { if (m.alive) { const q = jellyAt(p, m); out.push({ x: q.x, y: q.y, v: p, i }); } });
    }
  }
  return out;
}

// The sunfish sculls toward the nearest salp barrel or jelly and bites it off; then it drifts away
function moveSunfish(w, v, dt) {
  const F = PARAMS.visitors.sunfish, prey = sunfishPrey(w);
  // Leaving: rise to bask just under the surface, drifting slowly toward the edge
  let tx = v.dir > 0 ? W + F.r + 40 : -F.r - 40, ty = F.baskY;
  if (!v.leaving && prey.length && v.age < F.stay) {
    let best = 1e9;
    for (const p of prey) {
      const d = Math.abs(p.x - v.x) + Math.abs(p.y - v.y);
      if (d < best) { best = d; tx = p.x - v.dir * F.r * 0.9; ty = p.y; }
    }
  } else v.leaving = true;
  const dx = tx - v.x, dy = ty - v.y, d = Math.sqrt(dx * dx + dy * dy) + 1e-6, sp = v.leaving ? F.speed * F.baskSpeed : F.speed;
  v.vx += (dx / d * sp - v.vx) * F.turn * dt;
  v.vy += (dy / d * F.speed - v.vy) * F.turn * dt;
  if (v.vx > 0.4) v.dir = 1; else if (v.vx < -0.4) v.dir = -1;
  v.x += v.vx * dt;
  v.y = clamp(v.y + v.vy * dt, F.baskY, H - PARAMS.world.floor - 30);
  if (!v.leaving) {
    const mx = v.x + v.dir * F.r * 0.9;
    for (const p of prey) {
      if (Math.abs(p.x - mx) >= F.bite || Math.abs(p.y - v.y) >= F.bite) continue;
      if (p.v.kind === 'salps') p.v.alive[p.i] = false; else p.v.members[p.i].alive = false;
    }
  }
  return v.leaving && (v.x > W + F.r + 25 || v.x < -F.r - 25);
}

// Swallowed: the cell vanishes at once. Part of its nutrients is excreted, part sinks as pellets, the rest is carried away.
function swallow(w, c, kind, S) {
  c.dying = 1;
  unlink(c);
  c.eaten = kind;
  w.deaths[kind]++;
  const ex = c.held * S.excreted, pel = c.held * S.pellets;
  remin(w, c.x, c.y, ex);
  exportDetritus(w, c.x, c.y, pel);
  w.carried += c.held - ex - pel;
  c.held = 0;
  releaseSilica(w, c);
}

// A dead cell's frustule: a little dissolves where it dies, the rest sinks to the floor (and comes back only slowly)
function releaseSilica(w, c) {
  if (!c.si) return;
  const here = c.si * PARAMS.silica.dissolve;
  addField(w.fields.si, c.x, c.y, here);
  addField(w.fields.si, c.x, H - 1, c.si - here);
  c.si = 0;
}

// What sinks out becomes marine snow where it was made; it reaches the floor later (see marineSnow)
function exportDetritus(w, x, y, amount) {
  addField(w.fields.det, x, y, amount);
}

// Organic matter returned to the water as nutrients: respiration and decomposition use oxygen
function remin(w, x, y, amount) {
  addField(w.fields.nut, x, y, amount);
  addField(w.fields.o2, x, y, -amount * PARAMS.oxygen.per);
}

// Rules 3 and 4
function lifeAndDeath(w) {
  const Dv = PARAMS.division, fade = PARAMS.death.fadeTicks, cells = w.cells;
  let alive = aliveCount(w), removed = 0;
  const n = cells.length;
  for (let i = 0; i < n; i++) {
    const c = cells[i];
    if (c.dying) { if (++c.dying > fade) removed++; continue; }
    const starved = c.energy < 0;
    if (starved || c.age > c.lifespan) { die(w, c, starved); alive--; }
    else if (c.energy >= Dv.threshold * (1 + PARAMS.elder.store * c.elder)) {   // elders store before dividing
      if (alive < Dv.maxCells) { cells.push(divide(w, c)); alive++; }
      else c.energy = Dv.threshold;   // the water is full: the cell waits at the threshold
    }
  }
  if (removed) {
    let k = 0;
    for (let i = 0; i < cells.length; i++) if (cells[i].dying <= fade) cells[k++] = cells[i];
    cells.length = k;
  }
}

// The mother continues as daughter A (keeps her id); daughter B is new and points to her.
// Chain adhesion: B may stay linked to A, inserted after her in the chain, so a chain grows from within.
function divide(w, c) {
  const rng = w.rng, Ch = PARAMS.chain;
  const gA = mutateGenome(c.g, rng), gB = mutateGenome(c.g, rng);
  const lumA = inheritGlow(c, rng), lumB = inheritGlow(c, rng);
  const max = chainMax(c);
  const link = max >= 2 && chainLength(c) < max && rng.chance(Ch.chance * smoothstep(Ch.from, Ch.full, c.g.coupling));
  let ox = gauss(rng), oy = gauss(rng);
  if (link && c.lb) { ox = c.lb.x - c.x; oy = c.lb.y - c.y; }        // daughters split along the chain axis
  else if (link && c.la) { ox = c.x - c.la.x; oy = c.y - c.la.y; }
  const off = c.r * PARAMS.division.spread / (Math.sqrt(ox * ox + oy * oy) || 1);
  ox *= off; oy *= off;

  const b = createCell(w, c.x + ox, c.y + oy, gB, c.energy * 0.5, c.id, c.spriteSeed);
  if (link) {
    b.la = c;
    b.lb = c.lb;
    if (c.lb) c.lb.la = b;
    c.lb = b;
  }
  b.held = c.held * 0.5;
  b.si = c.si * 0.5;
  b.klepto = c.klepto; b.plastids = c.plastids ? c.plastids.slice() : null;
  b.vx = c.vx; b.vy = c.vy;
  b.theta = c.theta;
  b.vigor = c.vigor;
  b.deg = driftDegree(w, c.deg);
  b.motif = inheritMotif(w, c.motif);
  c.motif = inheritMotif(w, c.motif);

  c.x -= ox; c.y -= oy;
  c.g = gA;
  c.energy *= 0.5;
  c.held *= 0.5;
  c.si *= 0.5;
  c.age = 0;
  c.parentId = null;
  c.elder *= 0.5;
  c.elderAge = 0;
  c.gen++;
  deriveTraits(c);
  if (link) copyHabit(b, c);
  c.lum = lumA;
  b.lum = lumB;
  c.lifespan = lifespanFor(c, rng);
  return b;
}

// Death returns nutrients: most are recycled in place, the rest sinks to the bottom as detritus.
function die(w, c, starved, cause) {
  c.dying = 1;
  unlink(c);
  lastNote(w, c);
  const give = c.held;
  const recycled = give * PARAMS.death.recycled;
  remin(w, c.x, c.y, recycled);
  exportDetritus(w, c.x, c.y, give - recycled);
  c.held = 0;
  releaseSilica(w, c);
  w.deaths[cause || (starved ? 'starved' : 'old')]++;
}

// Hypoxia: where oxygen runs short cells suffocate
function suffocate(w, dt) {
  const O = PARAMS.oxygen, cells = w.cells, o2 = w.fields.o2;
  for (let i = 0; i < cells.length; i++) {
    const c = cells[i];
    if (c.dying) continue;
    const ox = sampleField(o2, c.x, c.y);
    if (ox < O.hypoxic && w.rng.chance(O.kill * smoothstep(O.hypoxic, O.anoxic, ox) * dt)) die(w, c, true, 'hypoxia');
  }
}

// A newcomer from the open ocean: one cell of a new lineage drifts in at a side of the column
function immigrate(w, dt) {
  const Im = PARAMS.immigration, rng = w.rng;
  if (w.extinctTick >= 0) return;   // extinction is an ending: nobody drifts into water that has died
  if (!rng.chance(Im.rate * dt) || aliveCount(w) >= PARAMS.division.maxCells) return;
  const g = randomGenome(rng), spriteSeed = rng.int(0x7fffffff), left = rng.chance(0.5);
  g.depthPref *= Im.depthMax;
  const x = left ? 3 : W - 3, y = clamp(g.depthPref * H + gauss(rng) * 10, 8, H - PARAMS.world.floor - 8);
  const c = createCell(w, x, y, g, rng.range(Im.energyMin, Im.energyMax), null, spriteSeed);
  c.deg = w.music.rng.int(w.music.scale.length);
  c.motif = randomMotif(w.music.rng);
  w.cells.push(c);
  w.immigrants++;
  w.imported += c.held;   // it brings its nutrients from outside
}

// Encystment: a cell of a form that makes resting stages, short of nutrients for a while, turns into a cyst. It
// leaves quietly (no last note): the cyst keeps everything it held and sinks.
const CYST_KINDS = new Set(PARAMS.cyst.kinds);
function encyst(w, dt) {
  const Cy = PARAMS.cyst, cells = w.cells;
  for (let i = 0; i < cells.length && w.cysts.length < Cy.max; i++) {
    const c = cells[i];
    if (c.dying || c.fed > Cy.hungry || !CYST_KINDS.has(c.kind) || !w.rng.chance(Cy.rate * smoothstep(Cy.hungry, Cy.starving, c.fed) * dt)) continue;
    c.dying = 1;
    c.grazed = true;   // vanishes quietly
    unlink(c);
    w.cysts.push({
      x: c.x, y: c.y, floorY: H - PARAMS.world.floor + w.rng.range(0.5, 2), g: c.g, spriteSeed: c.spriteSeed, lum: c.lum, deg: c.deg, motif: c.motif,
      reserve: c.held, si: c.si, age: 0, aloft: 0, dormancy: w.rng.range(Cy.dormancyMin, Cy.dormancyMax),
    });
    c.held = 0;
    c.si = 0;
    w.encysted++;
  }
}

// Cysts sink and rest; a strong tide lifts some back into the water for a while. After dormancy they germinate in
// oxygenated water with nutrients (in the water faster than on the floor), or lose viability.
function updateCysts(w, dt) {
  const Cy = PARAMS.cyst, Td = PARAMS.tide, O = PARAMS.oxygen, f = w.fields, cysts = w.cysts, rng = w.rng;
  if (!cysts.length) return;
  const lift = Td.cysts * Math.max(0, w.tideStir - Td.lift) * dt, reach = H * PARAMS.mixing.tideDepth * w.spring;
  let alive = aliveCount(w), k = 0;
  for (let i = 0; i < cysts.length; i++) {
    const q = cysts[i];
    q.age += dt;
    if (q.aloft > 0) q.aloft -= dt;
    else if (q.y < q.floorY) q.y = Math.min(q.floorY, q.y + Cy.sink * dt);
    else if (lift > 0 && rng.chance(lift)) { q.y = q.floorY - rng.range(2, reach); q.aloft = rng.range(Td.aloftMin, Td.aloftMax); }
    if (q.age > Cy.viability) {
      remin(w, q.x, q.y, q.reserve);
      if (q.si) addField(f.si, q.x, q.y, q.si);
      continue;
    }
    const up = q.y < q.floorY - 1;
    if (q.age > q.dormancy && alive < PARAMS.division.maxCells && sampleField(f.o2, q.x, q.y) > O.hypoxic
        && sampleField(f.nut, q.x, q.y) > Cy.germNutrient && rng.chance((up ? Cy.germRate : Cy.germFloor) * dt)) {
      const c = createCell(w, q.x, q.y, q.g, Cy.germEnergy, null, q.spriteSeed);
      c.held = q.reserve;
      c.si = q.si || 0;
      w.germinated++;
      c.lum = q.lum;
      c.deg = q.deg;
      c.motif = q.motif;
      w.cells.push(c);
      alive++;
      continue;
    }
    cysts[k++] = q;
  }
  cysts.length = k;
}

// ===== Harmony =====
// The water chemistry: one root and one scale, every note quantised to it. Only one tonal centre at a time.
// Everything here runs inside the fixed tick, on its own seeded stream (so the music never changes the biology),
// and only produces note events; the Audio section turns them into sound.
const SCALE_NAMES = Object.keys(PARAMS.harmony.scales);
const NOTE_NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
const LISTEN2 = PARAMS.harmony.listen * PARAMS.harmony.listen;
const RECENT_TICKS = PARAMS.harmony.recent * PARAMS.time.tickRate;
const RV_MIN = PARAMS.cell.rMin * PARAMS.cell.drawScale;
const RV_MAX = PARAMS.cell.rMax * PARAMS.cell.drawScale * PARAMS.dino.scale;
const SINGERS = [];
const SCORE = new Float64Array(3);

// The key is chosen by the seed; the root stays fixed until elders move it (phase 5)
function createMusic(seed) {
  const k = hash32(seed ^ 0x5bd1e995), name = SCALE_NAMES[(k >>> 8) % SCALE_NAMES.length];
  return {
    rng: makeRng(hash32(seed + 0x9e3779b9)), root: k % 12, scaleName: name, scale: PARAMS.harmony.scales[name],
    rootCell: 0, rootChanges: 0, rootTick: -1e9, elders: [], droneEnds: [],
    tokens: PARAMS.voices.burst, ends: [], sounding: [], notes: [], pending: [], recent: [], onsets: 0, nextNote: 1, nextPhrase: 1,
  };
}

// A daughter (or a founder) may start one degree from where she came from
function driftDegree(w, deg) {
  const m = w.music, n = m.scale.length;
  if (!m.rng.chance(PARAMS.harmony.drift)) return deg;
  return (deg + (m.rng.chance(0.5) ? 1 : n - 1)) % n;
}

// ---- Lineage motifs: a short tune (scale steps from the cell's degree) on a Euclidean loop of its own pulse ----
function motifStep(rng) {
  const M = PARAMS.harmony.motif, r = rng.next();
  if (r < M.repeat) return 0;
  const size = rng.chance(M.leap) ? 2 : 1;
  return rng.chance(0.5) ? size : -size;
}

function randomMotif(rng) {
  const M = PARAMS.harmony.motif, grid = M.grids[rng.int(M.grids.length)];
  const len = Math.min(grid, M.notesMin + rng.int(M.notesMax - M.notesMin + 1));
  // Euclidean: len onsets spread evenly over the loop, then rotated so the tune starts on one of them (on the flash)
  const even = [];
  for (let j = 0; j < len; j++) even.push(Math.floor(j * grid / len));
  const r = even[rng.int(len)], slots = even.map((x) => (x - r + grid) % grid).sort((a, b) => a - b);
  const steps = [0];
  for (let i = 1; i < len; i++) steps.push(clamp(steps[i - 1] + motifStep(rng), M.low, M.high));
  return { grid, slots, steps };
}

// At division a motif is usually copied whole; now and then one note moves a step, or a note is added or dropped,
// so kin share a recognisable tune that slowly drifts down the lineage.
function inheritMotif(w, mo) {
  const M = PARAMS.harmony.motif, rng = w.music.rng;
  let slots = mo.slots, steps = mo.steps;
  if (rng.chance(M.mutate) && steps.length > 1) {
    const i = 1 + rng.int(steps.length - 1);
    steps = steps.slice();
    steps[i] = clamp(steps[i] + (rng.chance(0.5) ? 1 : -1), M.low, M.high);
  }
  if (rng.chance(M.grow)) {
    if (slots.length < Math.min(mo.grid, M.notesMax) && rng.chance(0.5)) {
      const s = 1 + rng.int(mo.grid - 1);
      if (!slots.includes(s)) {
        const i = slots.filter((x) => x < s).length;
        slots = [...slots.slice(0, i), s, ...slots.slice(i)];
        steps = [...steps.slice(0, i), clamp(steps[i - 1] + motifStep(rng), M.low, M.high), ...steps.slice(i)];
      }
    } else if (slots.length > M.notesMin) {
      const i = 1 + rng.int(slots.length - 1);
      slots = slots.filter((_, k) => k !== i);
      steps = steps.filter((_, k) => k !== i);
    }
  }
  return slots === mo.slots && steps === mo.steps ? mo : { grid: mo.grid, slots, steps };
}

// Interval class (0..6 semitones) between two pitch classes
function intervalClass(a, b) {
  const d = ((a - b) % 12 + 12) % 12;
  return d > 6 ? 12 - d : d;
}

// How much of each sound family a cell is, following its form as the sprite does:
// soft flagellates below the dinoflagellate range, then armoured dinoflagellates, then diatom glass
const FORM = { soft: 0, dino: 0, glass: 0 };
function formWeights(tb) {
  const Dn = PARAMS.dino, soft = 1 - smoothstep(Dn.from, Dn.full, tb), glass = smoothstep(Dn.fade, Dn.gone, tb);
  FORM.soft = soft; FORM.glass = (1 - soft) * glass; FORM.dino = (1 - soft) * (1 - glass);
  return FORM;
}

// How big the cell looks, 0..1 (dinoflagellates are the big cells): bigger sounds lower and slower
const looksBig = (c) => clamp((c.rv - RV_MIN) / (RV_MAX - RV_MIN), 0, 1);

// Register = depth and size: the anchor is the cell's degree in the octave nearest its place in the column
// (lower for bigger cells); a motif note moves `step` scale steps from it, keeping the tune's contour.
function notePitch(m, c, step) {
  const Hm = PARAMS.harmony, n = m.scale.length;
  const depth = clamp(c.y / (H - PARAMS.world.floor), 0, 1);
  const target = Hm.top - (Hm.top - Hm.bottom) * depth - Hm.sizeDrop * looksBig(c);
  const pc = m.root + m.scale[c.deg], d = c.deg + step, o = Math.floor(d / n);
  let midi = pc + 12 * Math.round((target - pc) / 12) + m.scale[d - o * n] + 12 * o - m.scale[c.deg];
  while (midi > Hm.top) midi -= 12;
  while (midi < Hm.bottom) midi += 12;
  return midi;
}

// Envelope by form, blended continuously: soft cells swell slowly and breathe, dinoflagellates are plucked wood,
// diatoms are struck glass that rings. Bigger cells are slower. Inner notes of a phrase are shorter.
function voiceShape(c, last, final) {
  // Within its family the size gene picks the instrument: felt piano .. pad, glockenspiel .. vibraphone
  const S = PARAMS.voices.shape, f = formWeights(c.g.timbre), [lo, hi] = GENES.size, b = (c.g.size - lo) / (hi - lo);
  const string = f.dino > 0 && PARAMS.dino.stringForms.includes(lineageDinoForm(c.spriteSeed)) ? 1 : 0;
  const lerp = (r) => r[0] + (r[1] - r[0]) * b;
  const form = c.kind === 7 ? 'cocco' : c.kind === 8 ? 'crypto' : '', SS = form ? S[form] : S.soft;   // celesta, kalimba
  const attack = f.soft * lerp(SS.attack) + f.dino * lerp(S.dino.attack) + f.glass * lerp(S.glass.attack);
  const rel = f.soft * lerp(SS.release) + f.dino * lerp(S.dino.release) * (1 + (S.string - 1) * string) + f.glass * lerp(S.glass.release);
  const release = last ? S.lastRelease : rel * (final ? 1 : S.inner);
  return { attack, release, soft: f.soft, dino: f.dino, glass: f.glass, big: b, string, form };
}

// Rule 7: the degree one step down, the same, or one step up, whichever sounds best against what the neighbours
// sang recently (pitch classes only: octaves come from depth). Reads degrees only, so the caller can apply all
// moves after every singer has listened, and the order of cells never matters.
function attractDegree(w, c) {
  const m = w.music, Hm = PARAMS.harmony, hs = w.hash, n = m.scale.length, cons = Hm.consonance;
  SCORE[0] = SCORE[1] = SCORE[2] = 0;
  let heard = 0;
  const ci = clamp(Math.floor(c.x / hs.s), 0, hs.cols - 1), cj = clamp(Math.floor(c.y / hs.s), 0, hs.rows - 1);
  for (let j = cj - 1; j <= cj + 1; j++) {
    if (j < 0 || j >= hs.rows) continue;
    for (let i = ci - 1; i <= ci + 1; i++) {
      if (i < 0 || i >= hs.cols) continue;
      const b = j * hs.cols + i;
      for (let k = hs.start[b], end = hs.start[b + 1]; k < end; k++) {
        const o = hs.items[k];
        if (o === c || o.dying || w.tick - o.flashTick > RECENT_TICKS) continue;
        const dx = c.x - o.x, dy = c.y - o.y;
        if (dx * dx + dy * dy >= LISTEN2) continue;
        // In a choir: with a neighbour in phase, or a chain mate, a unison would only double the same note
        const po = m.scale[o.deg], choir = o === c.la || o === c.lb || dsin(o.theta - c.theta + HALF_PI) > PARAMS.voices.lockCos;
        for (let s = 0; s < 3; s++) {
          const ic = intervalClass(m.scale[(c.deg + s + n - 1) % n], po);
          SCORE[s] += ic === 0 && choir ? Hm.choirUnison : cons[ic];
        }
        heard++;
      }
    }
  }
  if (!heard) return c.deg;
  SCORE[1] += Hm.stay * heard;
  let best = 1;
  if (SCORE[0] > SCORE[best]) best = 0;
  if (SCORE[2] > SCORE[best]) best = 2;
  return (c.deg + best + n - 1) % n;
}

// Each tick: flashing cells listen and retune (rule 7), then decide whether to sing their motif.
// A singer keeps singing for a short bout of flashes, so its tune returns, transposed as rule 7 moves its degree.
function singAndListen(w) {
  const m = w.music, V = PARAMS.voices, cells = w.cells;
  m.tokens = Math.min(V.burst, m.tokens + V.rate * TICK_DT);
  let k = 0;
  for (let i = 0; i < m.ends.length; i++) if (m.ends[i] > w.tick) { m.ends[k] = m.ends[i]; m.sounding[k++] = m.sounding[i]; }
  m.ends.length = k;
  m.sounding.length = k;
  k = 0;
  for (let i = 0; i < m.recent.length; i++) if (w.tick - m.recent[i] < 10 * PARAMS.time.tickRate) m.recent[k++] = m.recent[i];
  m.recent.length = k;

  updateElders(w);
  SINGERS.length = 0;
  for (let i = 0; i < cells.length; i++) if (!cells[i].dying && cells[i].flashTick === w.tick) SINGERS.push(cells[i]);
  if (SINGERS.length) {
    for (const c of SINGERS) c.nextDeg = attractDegree(w, c);
    for (const c of SINGERS) if (c.id !== m.rootCell) c.deg = c.nextDeg;   // the root holder keeps singing the root

    // The most locked-in cells first: colonies are heard over loners
    SINGERS.sort((a, b) => b.locked - a.locked || a.id - b.id);
    const Dr = PARAMS.drift, dark = w.surfaceLight < Dr.darkHi;
    for (const c of SINGERS) {
      if (c.elder >= PARAMS.elder.singFrom) { drone(w, c); continue; }   // elders drone instead of singing tunes
      if (c.energy < V.minEnergy) { c.bout = 0; continue; }
      const len = c.motif.slots.length;
      let sing, hold = false;
      if (c.bout > 0) { c.bout--; sing = m.tokens >= len; }                      // still in its bout
      else if (heardNote(w, c)) { hold = true; sing = m.tokens >= 1 && (c.la || c.lb || m.rng.chance(V.join)); }   // joins (chain mates always)
      else {
        const thrive = c.lum && dark ? 1 : Math.max(V.restFloor, smoothstep(0, V.thriveFull, c.vigor));
        const lock = smoothstep(0, V.lockedFull, c.locked);
        sing = m.rng.chance(V.start * thrive) && m.tokens >= len * (1 + V.lonerRoom * (1 - lock));
        if (sing) c.bout = m.rng.int(PARAMS.harmony.motif.boutMax);
      }
      if (!sing) continue;
      if (c.chainId) arpeggio(w, c);       // a chain arpeggiates its chord
      else if (hold) holdTone(w, c);       // a joiner holds a chord tone under the tune
      else startPhrase(w, c);
    }
  }
  if (w.visitors.length || w.disturb.length) startle(w);
  playPending(w);
}

// Phase 5: the oldest full elder holds the root. When it dies (or stops being an elder) the next oldest takes the
// root and its own note becomes the new tonal centre: the whole water modulates, announced by the new holder's drone.
// With no elder left the root stays where it was. A new key holds for rootRest s: a holder appointed sooner adopts it.
function updateElders(w) {
  const m = w.music, E = PARAMS.elder;
  let k = 0;
  for (let i = 0; i < m.droneEnds.length; i++) if (m.droneEnds[i] > w.tick) m.droneEnds[k++] = m.droneEnds[i];
  m.droneEnds.length = k;
  m.elders.length = 0;
  let holder = null, oldest = null;
  for (const c of w.cells) {
    if (c.dying || c.elder < E.singFrom) continue;
    m.elders.push(c);
    if (c.id === m.rootCell) holder = c;   // the holder keeps the root while it is still an elder
    if (c.elder < 1) continue;
    if (!oldest || c.elderAge > oldest.elderAge || (c.elderAge === oldest.elderAge && c.id < oldest.id)) oldest = c;
  }
  if (holder || !oldest) return;
  const pc = (m.root + m.scale[oldest.deg]) % 12;
  if (pc !== m.root && w.tick - m.rootTick >= PARAMS.harmony.rootRest * PARAMS.time.tickRate) {   // a fresh key holds a while
    m.rootChanges++;
    m.rootTick = w.tick;
    m.root = pc;
  }
  m.rootCell = oldest.id;
  oldest.deg = 0;
  oldest.droneNext = 0;   // the new holder announces the key
}

// An elder drones on its slow pulse, if a drone voice is free and its last drone has mostly faded
function drone(w, c) {
  const m = w.music, D = PARAMS.voices.drone, b = looksBig(c);
  if (w.tick < c.droneNext || m.droneEnds.length >= D.max) return;
  const attack = D.attack[0] + (D.attack[1] - D.attack[0]) * b, release = D.release[0] + (D.release[1] - D.release[0]) * b;
  const pc = (m.root + m.scale[c.deg]) % 12, midi = D.low + ((pc - D.low) % 12 + 12) % 12;
  const end = w.tick + Math.ceil((attack + release) * PARAMS.time.tickRate);
  m.droneEnds.push(end);
  c.droneEnd = end;
  c.droneNext = w.tick + Math.ceil((attack + release * D.again) * PARAMS.time.tickRate);
  m.onsets++;
  m.notes.push({
    id: m.nextNote++, phrase: m.nextPhrase++, tick: w.tick, cell: c.id, c, midi, pc, x: c.x, y: c.y, timbre: c.g.timbre,
    attack, release, soft: 1, dino: 0, glass: 0, last: false, startled: false, muffle: 0, drone: true, level: c.elder,
  });
}

// Pads: a soft cell singing near a droning elder holds its notes longer, as if the elder steadies it
function steadied(w, c) {
  const D = PARAMS.voices.drone, r2 = D.steady * D.steady;
  for (const e of w.music.elders) {
    if (e === c || e.droneEnd <= w.tick) continue;
    const dx = e.x - c.x, dy = e.y - c.y;
    if (dx * dx + dy * dy < r2) return true;
  }
  return false;
}

// Startle: cells brushed by a visitor blurt a staccato note, if the budget allows
function startle(w) {
  const m = w.music, V = PARAMS.voices, St = V.startle, wait = St.refractory * PARAMS.time.tickRate;
  for (const c of w.cells) {
    if (c.dying || w.tick - c.startleTick < wait) continue;
    let rate = 0;
    for (const v of w.visitors) if (brushedBy(v, c)) rate = Math.max(rate, St.rate[v.kind]);
    for (const d of w.disturb) {   // a fresh tap close by
      const dx = c.x - d.x, dy = c.y - d.y, r = PARAMS.hand.radius * 0.6;
      if (w.tick - d.t0 < PARAMS.time.tickRate && dx * dx + dy * dy < r * r) rate = Math.max(rate, St.rate.hand);
    }
    if (rate > 0 && m.rng.chance(rate * TICK_DT) && m.tokens >= 1 && m.ends.length < V.max) {
      c.startleTick = w.tick;
      m.tokens -= 1;
      emitNote(w, c, 0, false, true, m.nextPhrase++, true);
    }
  }
}

function brushedBy(v, c) {
  const Vs = PARAMS.visitors, r = PARAMS.voices.startle.reach;
  if (v.kind === 'sardines') {
    const dx = (c.x - v.x - v.dir * 4) / (Vs.sardines.rx + r), dy = (c.y - v.y) / (Vs.sardines.ry + r);
    return dx * dx + dy * dy < 1;
  }
  if (v.kind === 'salps') {
    const reach = Vs.salps.reach + r;
    for (let b = 0; b < v.alive.length; b++) {
      if (!v.alive[b]) continue;
      const q = salpBarrel(v, b), dx = c.x - q.x, dy = c.y - q.y;
      if (dx * dx + dy * dy < reach * reach) return true;
    }
    return false;
  }
  if (v.kind === 'jellies' || v.kind === 'combs') {   // brushed by a jelly's tentacles
    const reach = Vs[v.kind].r + r;
    for (const m of v.members) {
      if (!m.alive) continue;
      const q = jellyAt(v, m), dx = c.x - q.x, dy = c.y - q.y;
      if (dx * dx + dy * dy < reach * reach) return true;
    }
    return false;
  }
  const reach = Vs.sunfish.r + r, dx = c.x - v.x, dy = c.y - v.y;
  return dx * dx + dy * dy < reach * reach;
}

// A joiner holds one long chord tone under the neighbour's tune
function holdTone(w, c) {
  const m = w.music;
  m.tokens -= 1;
  c.noteTick = w.tick;
  if (m.ends.length < PARAMS.voices.max) emitNote(w, c, 0, false, true, m.nextPhrase++, false, PARAMS.harmony.hold);
}

// A chain's arpeggio: its cells sound in pitch order (up and back for a straight chain, round for rings and stars),
// spread over one period of the singer's pulse. Once per chain until it has rested.
const ARP = [];
function arpeggio(w, c) {
  const m = w.music, A = PARAMS.harmony.arp, head = c.head, period = 1 / c.g.omega;
  if (!head || w.tick - head.arpTick < A.rest * period * PARAMS.time.tickRate) return;
  const order = [];
  for (let k = head; k; k = k.lb) if (!k.dying) order.push({ k, p: notePitch(m, k, 0) });
  if (order.length < 2) return;
  order.sort((a, b) => a.p - b.p || a.k.id - b.k.id);
  ARP.length = 0;
  for (const o of order) ARP.push(o.k);
  if (c.habit === 0) for (let i = order.length - 2; i > 0; i--) ARP.push(order[i].k);
  for (let i = 0; ARP.length < A.minNotes; i++) ARP.push(ARP[i]);
  ARP.length = Math.min(ARP.length, A.maxNotes);
  if (m.tokens < ARP.length) return;
  m.tokens -= ARP.length;
  head.arpTick = w.tick;
  c.noteTick = w.tick;
  const phrase = m.nextPhrase++, step = period / ARP.length;
  for (let i = 0; i < ARP.length; i++) {
    m.pending.push({ due: w.tick + Math.round(i * step * PARAMS.time.tickRate), c: ARP[i], step: 0, phrase, final: i === ARP.length - 1 });
  }
}

// The motif's notes fall on its rhythm grid across one period of the cell's own pulse: fast pulses, quick tunes
function startPhrase(w, c) {
  const m = w.music, mo = c.motif, period = 1 / c.g.omega, phrase = m.nextPhrase++;
  m.tokens -= mo.slots.length;
  c.noteTick = w.tick;
  for (let i = 0; i < mo.slots.length; i++) {
    m.pending.push({
      due: w.tick + Math.round(mo.slots[i] / mo.grid * period * PARAMS.time.tickRate),
      c, step: mo.steps[i], phrase, final: i === 0 || i === mo.slots.length - 1,   // the first note holds the chord
    });
  }
}

// Notes come due; a note finds no free voice, or its singer gone, and is only seen as a flash
function playPending(w) {
  const m = w.music, P = m.pending;
  let k = 0;
  for (let i = 0; i < P.length; i++) {
    const p = P[i];
    if (p.due > w.tick) { P[k++] = p; continue; }
    if (!p.c.dying && m.ends.length < PARAMS.voices.max) emitNote(w, p.c, p.step, false, p.final, p.phrase);
  }
  P.length = k;
}

// Did a neighbour begin a phrase a moment ago?
function heardNote(w, c) {
  const hs = w.hash, since = w.tick - PARAMS.voices.joinWindow * PARAMS.time.tickRate;
  const ci = clamp(Math.floor(c.x / hs.s), 0, hs.cols - 1), cj = clamp(Math.floor(c.y / hs.s), 0, hs.rows - 1);
  for (let j = cj - 1; j <= cj + 1; j++) {
    if (j < 0 || j >= hs.rows) continue;
    for (let i = ci - 1; i <= ci + 1; i++) {
      if (i < 0 || i >= hs.cols) continue;
      const b = j * hs.cols + i;
      for (let k = hs.start[b], end = hs.start[b + 1]; k < end; k++) {
        const o = hs.items[k];
        if (o === c || o.noteTick < since || o.dying) continue;
        const dx = c.x - o.x, dy = c.y - o.y;
        if (dx * dx + dy * dy < LISTEN2) return true;
      }
    }
  }
  return false;
}

// A cell that dies (not one that is eaten) sounds one soft last note, if the budget allows
function lastNote(w, c) {
  const m = w.music;
  if (m.tokens < 1 || m.ends.length >= PARAMS.voices.max) return;
  m.tokens -= 1;
  emitNote(w, c, 0, true, true, m.nextPhrase++);
}

// Rule 7 within a phrase: a motif note that would form a semitone or a tritone with a note still sounding in the
// water bends one scale step, to whichever neighbour degree clashes least (the tune's first note stays put)
function clashes(m, pc) {
  let n = 0;
  for (let i = 0; i < m.sounding.length; i++) { const ic = intervalClass(pc, m.sounding[i]); if (ic === 1 || ic === 6) n++; }
  return n;
}

function bendStep(m, c, step) {
  const base = clashes(m, notePitch(m, c, step) % 12);
  if (!base || !step) return step;
  const down = clashes(m, notePitch(m, c, step - 1) % 12), up = clashes(m, notePitch(m, c, step + 1) % 12);
  if (down < base && down <= up) return step - 1;
  return up < base ? step + 1 : step;
}

function emitNote(w, c, step, last, final, phrase, startled, stretch) {
  const m = w.music, V = PARAMS.voices, Mu = V.muffle, sh = voiceShape(c, last, final);
  if (stretch) sh.release *= stretch;
  let midi = notePitch(m, c, last || startled ? step : bendStep(m, c, step));
  if (startled) {
    midi += 12 * V.startle.octaves;
    sh.attack = V.startle.attack;
    sh.release = V.startle.release;
  }
  if (!last && !startled && sh.soft > 0 && w.music.elders.length && steadied(w, c)) {
    sh.steady = true;
    sh.release *= 1 + V.drone.steadyHold * sh.soft;
    sh.attack *= 1 + V.drone.steadyAttack * sh.soft;
  }
  const muffle = smoothstep(Mu.from, Mu.full, sampleField(w.fields.graz, c.x, c.y));
  sh.release *= 1 - Mu.release * muffle;
  m.ends.push(w.tick + Math.ceil((sh.attack + sh.release) * PARAMS.time.tickRate));
  m.sounding.push(midi % 12);
  m.recent.push(w.tick);
  m.onsets++;
  m.notes.push({
    id: m.nextNote++, phrase, tick: w.tick, cell: c.id, c, midi, pc: midi % 12, x: c.x, y: c.y, timbre: c.g.timbre,
    attack: sh.attack, release: sh.release, soft: sh.soft, dino: sh.dino, glass: sh.glass, big: sh.big, string: sh.string, form: sh.form,
    last, startled: !!startled, muffle, steady: !!sh.steady,
  });
}

const keyName = (m) => NOTE_NAMES[m.root] + ' ' + m.scaleName.toUpperCase();

// ===== Persist =====
// A saved world is the same world: the snapshot holds everything the rules read (cells and their links, cysts,
// fields, grazers, wind, plumes, visitors, the harmonic field and voice budget, both random streams), so a restored
// world steps on exactly as if it had never stopped. Shared objects and cycles (chains, the cells notes point at)
// survive; references into PARAMS are kept as paths, so a restored world reads the very same constants. Render
// caches are left out and rebuilt. The snapshot is structured-cloneable (IndexedDB, and later a worker).
const SNAP_SKIP = new Set(['hash', 'kinds', 'scratch', 'grazScratch', 'siScratch', 'cyScratch', 'spr', 'along', 'songAt', 'songAtk', 'songRel', 'songLast', 'songDrone', 'pluckAt']);
let paramPaths = null;

function paramPathMap() {
  if (paramPaths) return paramPaths;
  paramPaths = new Map();
  const walk = (o, path) => {
    if (!o || typeof o !== 'object' || paramPaths.has(o)) return;
    paramPaths.set(o, path);
    for (const k of Object.keys(o)) walk(o[k], path.concat(k));
  };
  walk(PARAMS, []);
  return paramPaths;
}

function encodeSnap(v, memo) {
  if (!v || typeof v !== 'object') {
    if (typeof v === 'function') throw new Error('snapshot: a function in the world');
    return v;
  }
  if (memo.has(v)) return memo.get(v);
  let out;
  const path = paramPathMap().get(v);
  if (path) out = { $param: path };
  else if (v instanceof Rng) out = { $rng: v.s };
  else if (ArrayBuffer.isView(v)) out = v.slice();
  else if (Array.isArray(v)) {
    out = [];
    memo.set(v, out);
    for (let i = 0; i < v.length; i++) out.push(encodeSnap(v[i], memo));
    return out;
  } else {
    const proto = Object.getPrototypeOf(v);
    if (proto !== Object.prototype && proto !== null) throw new Error('snapshot: cannot store ' + (v.constructor && v.constructor.name));
    out = {};
    memo.set(v, out);
    for (const k of Object.keys(v)) if (!SNAP_SKIP.has(k)) out[k] = encodeSnap(v[k], memo);
    return out;
  }
  memo.set(v, out);
  return out;
}

// In place: markers become random streams and PARAMS objects again (a shared marker stays one shared object)
function decodeSnap(root) {
  const made = new Map(), seen = new Set();
  const revive = (v) => {
    if (!v || typeof v !== 'object' || ArrayBuffer.isView(v)) return v;
    if (made.has(v)) return made.get(v);
    if ('$rng' in v) { const r = new Rng(0); r.s = v.$rng; made.set(v, r); return r; }
    if ('$param' in v) { let o = PARAMS; for (const k of v.$param) o = o[k]; made.set(v, o); return o; }
    if (!seen.has(v)) {
      seen.add(v);
      for (const k of Object.keys(v)) v[k] = revive(v[k]);
    }
    return v;
  };
  return revive(root);
}

function snapshotWorld(w) {
  return { v: PARAMS.persist.version, world: encodeSnap(w, new Map()) };
}

// Restored objects come back with shapes of their own, and the hot loops run at half speed over them; cells and
// genomes are rebuilt in their usual shapes and every reference is pointed at the rebuilt ones. Fields a newer
// version added to cells keep their fresh defaults.
function reshape(w) {
  const swap = new Map(), genomes = new Map();
  const genome = (g) => { if (!genomes.has(g)) { const n = {}; for (const k of GENE_KEYS) n[k] = g[k]; genomes.set(g, n); } return genomes.get(g); };
  const visit = (v, seen) => {
    if (!v || typeof v !== 'object' || ArrayBuffer.isView(v) || seen.has(v) || v instanceof Rng) return;
    seen.add(v);
    if (v.spriteSeed !== undefined && v.g && !swap.has(v)) {   // a cell, living or still referred to
      const n = cellObject(v.id, v.parentId, v.x, v.y, genome(v.g), v.energy, v.theta, v.spriteSeed);
      for (const k of Object.keys(v)) if (k !== 'g') n[k] = v[k];
      if (v.glassW === undefined) n.glassW = smoothstep(PARAMS.dino.fade, PARAMS.dino.gone, n.g.timbre);   // saved before silica
      if (v.grazeK === undefined) deriveTraits(n);   // saved before coccolithophores and cryptophytes: re-derive form and niche
      if (v.hunter === undefined) {   // saved before Dinophysis hunted
        n.hunter = n.dinoW > 0.5 && lineageDinoForm(n.spriteSeed) === 'dinophysis';
        if (n.hunter) { n.klepto = 1; n.plastids = [hueRamp(n)]; }
      }
      swap.set(v, n);
    }
    for (const k of Object.keys(v)) visit(v[k], seen);
  };
  visit(w, new Set());
  const point = (v, seen) => {
    if (!v || typeof v !== 'object' || ArrayBuffer.isView(v) || seen.has(v) || v instanceof Rng) return;
    seen.add(v);
    for (const k of Object.keys(v)) {
      const n = swap.get(v[k]);
      if (n) v[k] = n; else point(v[k], seen);
    }
  };
  const seen = new Set();
  point(w, seen);
  for (const n of swap.values()) point(n, seen);
}

// The world, its fields and its music are copied onto a fresh world's own objects: their usual shapes, and any
// field a newer version added keeps the value a fresh world starts with
function restoreWorld(snap) {
  const w = decodeSnap(snap.world), fresh = createWorld(w.seed, 1, w.dayLength);
  reshape(w);
  const fields = Object.assign(fresh.fields, w.fields), music = Object.assign(fresh.music, w.music), deaths = Object.assign(fresh.deaths, w.deaths);
  Object.assign(fresh, w);
  fresh.fields = fields;
  fresh.music = music;
  fresh.deaths = deaths;
  return fresh;
}

// Runs inside the catch-up worker (built from this page's own simulation and notebook code): steps the world to the
// target it is given (the page moves it on as real time passes), records the notebook, shows a frame now and then.
function catchupWorker() {
  let w = null, target = 0;
  const run = () => {
    const t0 = performance.now(), S = NB.STRIDE;
    while (w.tick < target && performance.now() - t0 < PARAMS.persist.show * 1000) {
      for (let k = 0; k < 30 && w.tick < target; k++) { stepWorld(w); notebookSample(w); w.music.notes.length = 0; }
    }
    if (w.tick < target) {
      postMessage({ kind: 'progress', snap: snapshotWorld(w) });
      setTimeout(run, 0);   // lets the next target in
      return;
    }
    const rows = notebook.rows.slice(0, notebook.count * S);
    postMessage({ kind: 'done', snap: snapshotWorld(w), nb: notebookState(), rows }, [rows.buffer]);
    w = null;
  };
  self.onmessage = (e) => {
    const m = e.data;
    target = m.target;
    if (m.snap) { w = restoreWorld(m.snap); restoreNotebook(m.nb, [m.rows]); run(); }
  };
}

// ---- Storage: one IndexedDB store; 'world' holds the snapshot, 'rows:i' the notebook in chunks ----
function openStore() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(PARAMS.persist.db, 1);
    req.onupgradeneeded = () => req.result.createObjectStore('kv');
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function storeGet(db, keys) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction('kv', 'readonly'), st = tx.objectStore('kv'), out = {};
    for (const k of keys) st.get(k).onsuccess = (e) => { out[k] = e.target.result; };
    tx.oncomplete = () => resolve(out);
    tx.onerror = () => reject(tx.error);
  });
}

// puts: { key: value }, value undefined deletes the key. One transaction, so a save is all or nothing.
function storeWrite(db, puts) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction('kv', 'readwrite'), st = tx.objectStore('kv');
    for (const k of Object.keys(puts)) { if (puts[k] === undefined) st.delete(k); else st.put(puts[k], k); }
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
    tx.onabort = () => reject(tx.error);
  });
}

function storeClear(db) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction('kv', 'readwrite');
    tx.objectStore('kv').clear();
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

// ===== Audio =====
// Discrete, enveloped notes only: every oscillator starts, swells, fades to 0.0001 and is disconnected.
// voices -> ecosystem bus -> lowpass -> dry + reverb send + delay send -> master -> gentle compressor -> out.
// Deeper voices also send straight into the reverb, so the depths sound quieter and wetter.
const audio = { ctx: null, started: false, muted: false, master: null, bus: null, wet: null, waves: [], active: 0, drones: 0, played: 0 };

// Wave table along the timbre gene, built once. Soft cells: a warm triangle; dinoflagellates: wood, nearly a sine
// with a little body; diatoms: glass, a bright sine. The partner oscillator in playNote adds each family's colour.
function buildWaves(ctx) {
  const A = PARAMS.audio, waves = [];
  for (let i = 0; i < A.waves; i++) {
    const f = formWeights(i / (A.waves - 1)), real = new Float32Array(A.harmonics + 1), imag = new Float32Array(A.harmonics + 1);
    for (let n = 1; n <= A.harmonics; n++) {
      const soft = (n & 1 ? 1 : A.softEven) / (n * n);
      const wood = n === 1 ? 1 : n === 2 ? 0.12 : n === 3 ? 0.04 : 0;
      const glass = n === 1 ? 1 : n <= 5 ? A.glassBright / n : 0;
      imag[n] = f.soft * soft + f.dino * wood + f.glass * glass;
    }
    waves.push(ctx.createPeriodicWave(real, imag));
  }
  return waves;
}

// A dark stereo tail: decaying noise whose highs die first. Its own seeded stream, built once.
function buildImpulse(ctx) {
  const A = PARAMS.audio, rate = ctx.sampleRate, len = Math.floor(A.reverbSeconds * rate);
  const buf = ctx.createBuffer(2, len, rate), rng = makeRng(0x0ce4);
  for (let ch = 0; ch < 2; ch++) {
    const d = buf.getChannelData(ch);
    let lp = 0;
    for (let i = 0; i < len; i++) {
      const t = i / len, k = 1 - A.reverbDark * t;   // one-pole lowpass closing over the tail
      lp += (rng.next() * 2 - 1 - lp) * k;
      d[i] = lp * Math.pow(1 - t, 3) * Math.exp(-3 * t);
    }
  }
  return buf;
}

// Called from a user gesture: browsers only allow sound after one
function startAudio() {
  if (audio.ctx) { if (audio.ctx.state !== 'running') audio.ctx.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  const A = PARAMS.audio, ctx = new AC(), gain = (v) => { const g = ctx.createGain(); g.gain.value = v; return g; };
  const comp = ctx.createDynamicsCompressor();
  comp.threshold.value = A.comp.threshold; comp.knee.value = A.comp.knee; comp.ratio.value = A.comp.ratio;
  comp.attack.value = A.comp.attack; comp.release.value = A.comp.release;
  const out = gain(A.out), limit = ctx.createDynamicsCompressor();
  limit.threshold.value = A.limit.threshold; limit.knee.value = A.limit.knee; limit.ratio.value = A.limit.ratio;
  limit.attack.value = A.limit.attack; limit.release.value = A.limit.release;
  comp.connect(out); out.connect(limit); limit.connect(ctx.destination);
  const master = gain(A.master), bendLP = ctx.createBiquadFilter(), bendShelf = ctx.createBiquadFilter();
  bendLP.type = 'lowpass'; bendLP.frequency.value = A.bend.open; bendLP.Q.value = 0.7;
  bendShelf.type = 'highshelf'; bendShelf.frequency.value = A.bend.shelfHz; bendShelf.gain.value = 0;
  const bendPeak = ctx.createBiquadFilter();
  bendPeak.type = 'peaking'; bendPeak.frequency.value = A.bend.peakLo; bendPeak.Q.value = A.bend.peakQ; bendPeak.gain.value = 0;
  const air = ctx.createBiquadFilter();   // soft on the uppermost frequencies
  air.type = 'highshelf'; air.frequency.value = A.air.freq; air.gain.value = A.air.gain;
  master.connect(bendLP); bendLP.connect(bendShelf); bendShelf.connect(bendPeak); bendPeak.connect(air); air.connect(comp);

  const verb = ctx.createConvolver();
  verb.buffer = buildImpulse(ctx);
  verb.connect(master);
  const verbIn = gain(A.reverbSend);
  verbIn.connect(verb);

  const delay = ctx.createDelay(1), fb = gain(A.delayFeedback), dark = ctx.createBiquadFilter(), delayIn = gain(A.delaySend);
  delay.delayTime.value = A.delayTime;
  dark.type = 'lowpass'; dark.frequency.value = A.delayCutoff;
  delayIn.connect(delay); delay.connect(dark); dark.connect(fb); fb.connect(delay); dark.connect(master);

  const bus = gain(audio.muted ? 0.0001 : 1), lp = ctx.createBiquadFilter();   // bus and wet carry the music only
  lp.type = 'lowpass'; lp.frequency.value = A.busCutoff; lp.Q.value = 0.5;
  bus.connect(lp); lp.connect(master); lp.connect(verbIn); lp.connect(delayIn);
  const wet = gain(audio.muted ? 0.0001 : 1);
  wet.connect(verb);

  const Am = A.ambience, amb = gain(Am.gain), ambWet = gain(Am.wet);
  amb.connect(master); amb.connect(ambWet); ambWet.connect(verb);
  const noise = ctx.createBuffer(1, Math.floor(Am.noiseSeconds * ctx.sampleRate), ctx.sampleRate), nrng = makeRng(0x5ea);
  const nd = noise.getChannelData(0);
  for (let i = 0; i < nd.length; i++) nd[i] = nrng.next() * 2 - 1;
  Object.assign(audio, { ctx, master, bendLP, bendShelf, bendPeak, bus, wet, lp, fb, delay, delayIn, verbIn, amb, noise, waves: buildWaves(ctx), started: true });
  if (ctx.state !== 'running') ctx.resume();
}

// One note: the main wave and a partner oscillator through a lowpass and one envelope, panned by x.
// The partner is the family's colour: a slightly detuned twin that breathes (soft), the wood's high partial that
// dies fast (dinoflagellates), the glass's inharmonic ring (diatoms).
// An elder's drone: a sine sub and two soft pad partials, one swell and one long fade under a filter that opens and closes
function playDrone(n) {
  const A = PARAMS.audio, Dr = A.drone, ctx = audio.ctx;
  if (audio.drones >= Dr.maxNodes) return;
  const t0 = ctx.currentTime + A.lookahead, end = t0 + n.attack + n.release, f = 440 * Math.pow(2, (n.midi - 69) / 12);
  const sub = ctx.createOscillator(), padA = ctx.createOscillator(), padB = ctx.createOscillator();
  sub.frequency.value = f;
  padA.setPeriodicWave(audio.waves[0]); padA.frequency.value = f * 2; padA.detune.value = Dr.detune;
  padB.setPeriodicWave(audio.waves[0]); padB.frequency.value = f * 3; padB.detune.value = -Dr.detune;
  const subG = ctx.createGain(), padG = ctx.createGain(), filt = ctx.createBiquadFilter(), env = ctx.createGain();
  padG.gain.value = Dr.pad / Dr.gain;
  filt.type = 'lowpass'; filt.Q.value = 0.5;
  filt.frequency.setValueAtTime(Dr.cutLow, t0);
  filt.frequency.linearRampToValueAtTime(Dr.cutHigh, t0 + n.attack);
  filt.frequency.exponentialRampToValueAtTime(Dr.cutLow, end);
  env.gain.setValueAtTime(0.0001, t0);
  env.gain.linearRampToValueAtTime(Dr.gain * n.level, t0 + n.attack);
  env.gain.exponentialRampToValueAtTime(0.0001, end);
  const pan = ctx.createStereoPanner ? ctx.createStereoPanner() : null;
  const dry = ctx.createGain(), wet = ctx.createGain();
  dry.gain.value = 1 - Dr.wet;
  wet.gain.value = Dr.wet;
  const beat = ctx.createOscillator(), bloom = ctx.createOscillator(), bloomEnv = ctx.createGain();
  beat.frequency.value = f + A.droneBeat;                                    // a second sub, slowly beating
  bloom.setPeriodicWave(audio.waves[0]); bloom.frequency.value = f * 4;      // two octaves up, blooming late
  const bAt = t0 + (n.attack + n.release) * A.droneBloomAt;
  bloomEnv.gain.setValueAtTime(0.0001, t0);
  bloomEnv.gain.linearRampToValueAtTime(A.droneBloom / Dr.gain, bAt);
  bloomEnv.gain.exponentialRampToValueAtTime(0.0001, end);
  sub.connect(subG); beat.connect(subG); padA.connect(padG); padB.connect(padG); bloom.connect(bloomEnv); bloomEnv.connect(filt);
  subG.gain.value = 0.6;
  subG.connect(env); padG.connect(filt); filt.connect(env);
  let out = env;
  if (pan) { pan.pan.value = (n.x / W * 2 - 1) * Dr.pan; env.connect(pan); out = pan; }
  out.connect(dry); out.connect(wet);
  dry.connect(audio.bus); wet.connect(audio.wet);
  for (const o of [sub, beat, padA, padB, bloom]) { o.start(t0); o.stop(end + 0.05); }
  audio.drones++;
  audio.played++;
  sub.onended = () => {
    for (const node of [sub, beat, padA, padB, bloom, bloomEnv, subG, padG, filt, env, pan, dry, wet]) if (node) node.disconnect();
    audio.drones--;
  };
}

function playNote(n) {
  const A = PARAMS.audio, I = A.instruments, ctx = audio.ctx;
  if (audio.active >= A.maxNodes) return;
  const bs = 1 - (1 - n.big) * (1 - n.big);   // the mellow instrument (pad, vibraphone) takes over early as size grows
  const b = n.steady ? Math.max(bs, A.steadyPad) : bs;
  const sf = n.form ? 0 : n.soft;   // coccolithophores and cryptophytes play their own instruments
  const mixW = { piano: sf * (1 - b), pad: sf * b, celesta: n.form === 'cocco' ? n.soft : 0, kalimba: n.form === 'crypto' ? n.soft : 0, wood: n.dino * (1 - n.string), string: n.dino * n.string, glock: n.glass * (1 - b), vibe: n.glass * b };
  const depth = clamp(n.y / (H - PARAMS.world.floor), 0, 1), wetK = (A.wetMin + (A.wetMax - A.wetMin) * depth) * (n.startled ? A.startleDry : 1);
  const hv = hash01(n.id * 7 + 3) * 2 - 1, ht = hash01(n.id * 7 + 4);   // this note's own small variations
  const t0 = ctx.currentTime + A.lookahead + ht * A.humanTime, end = t0 + n.attack + n.release;
  let level = 0, c0 = 0, c1 = 0, c2 = 0;
  for (const k in mixW) { const q = mixW[k], P = I[k]; level += q * P.level; c0 += q * P.cut[0]; c1 += q * P.cut[1]; c2 += q * P.cut[2]; }
  const bright = (n.last ? 0.6 : 1) * (1 - PARAMS.voices.muffle.cutoff * n.muffle) * (n.startled ? A.startleBright : 1) * (1 + A.humanBright * hv);
  const peak = A.voiceGain * (1 + A.humanGain * hv) * level * (1 - A.depthQuiet * depth) * (n.last ? A.lastGain : 1) * (n.startled ? A.startleGain : 1);
  const freq = 440 * Math.pow(2, (n.midi - 69) / 12);

  // Shared chain: lowpass (strike -> swell -> fade), tremolo stage, envelope, pan, dry and wet sends
  const filt = ctx.createBiquadFilter(), trem = ctx.createGain(), env = ctx.createGain();
  filt.type = 'lowpass'; filt.Q.value = 0.3;
  filt.frequency.setValueAtTime(c0 * bright, t0);
  filt.frequency.linearRampToValueAtTime(c1 * bright, t0 + n.attack);
  filt.frequency.exponentialRampToValueAtTime(Math.max(60, c2 * bright), end);
  trem.gain.value = 1;
  env.gain.setValueAtTime(0.0001, t0);
  env.gain.linearRampToValueAtTime(peak, t0 + n.attack);
  env.gain.exponentialRampToValueAtTime(0.0001, end);
  const pan = ctx.createStereoPanner ? ctx.createStereoPanner() : null;
  const dry = ctx.createGain(), wet = ctx.createGain();
  dry.gain.value = 1 - wetK;
  wet.gain.value = wetK;
  filt.connect(trem); trem.connect(env);
  let out = env;
  if (pan) { pan.pan.value = (n.x / W * 2 - 1) * A.pan; env.connect(pan); out = pan; }
  out.connect(dry); out.connect(wet);
  dry.connect(audio.bus); wet.connect(audio.wet);
  const nodes = [filt, trem, env, pan, dry, wet], voices = [];

  // One partial: its own swell and its own fade (a share of the release), into the shared filter
  const voice = (ratio, gain, decay, wave, detune, late) => {
    const f = freq * ratio;
    if (f > A.partialMaxHz || gain < 0.01) return null;
    const o = ctx.createOscillator(), e = ctx.createGain(), stop = t0 + n.attack + n.release * decay;
    if (wave) o.setPeriodicWave(wave);
    o.frequency.value = f;
    if (detune) o.detune.value = detune;
    e.gain.setValueAtTime(0.0001, t0);
    e.gain.linearRampToValueAtTime(gain, t0 + n.attack * (late || 1));
    e.gain.exponentialRampToValueAtTime(0.0001, stop);
    o.connect(e); e.connect(filt);
    o.start(t0); o.stop(stop + 0.05);
    voices.push(o); nodes.push(e);
    return o;
  };
  for (const k of ['piano', 'celesta', 'kalimba', 'wood', 'string', 'glock', 'vibe']) {
    const q = mixW[k];
    if (q >= 0.04) for (const [r, g, d] of I[k].partials) voice(r, g * q, d);
  }
  const padWave = audio.waves[0];
  if (mixW.pad >= 0.04) {   // the pad breathes: a detuned twin and a slow vibrato at the note's own rate
    const a = voice(1, mixW.pad, 1, padWave), tw = voice(A.padTwin, mixW.pad * A.padTwinGain, 1, padWave), V = A.vibrato;
    const lfo = ctx.createOscillator(), depthG = ctx.createGain();
    lfo.frequency.value = V.rateMin + (V.rateMax - V.rateMin) * hash01(n.id * 31 + 7);
    depthG.gain.value = V.cents;
    lfo.connect(depthG);
    if (a) depthG.connect(a.detune);
    if (tw) depthG.connect(tw.detune);
    lfo.start(t0); lfo.stop(end + 0.05);
    nodes.push(lfo, depthG);
  }
  if (mixW.vibe >= 0.1) {   // the vibraphone's slow tremolo
    const P = I.vibe, k = P.tremDepth * mixW.vibe / 2, lfo = ctx.createOscillator(), depthG = ctx.createGain();
    lfo.frequency.value = P.tremolo * (0.9 + 0.2 * hash01(n.id * 13 + 5));
    depthG.gain.value = k;
    trem.gain.value = 1 - k;
    lfo.connect(depthG); depthG.connect(trem.gain);
    lfo.start(t0); lfo.stop(end + 0.05);
    nodes.push(lfo, depthG);
  }
  if (n.steady) voice(2, A.shimmer, 1, padWave, A.shimmerDetune, A.shimmerLate);   // a steadied pad shimmers an octave up, late
  if (!voices.length) { for (const node of nodes) if (node) node.disconnect(); return; }
  audio.active++;
  audio.played++;
  let left = voices.length;
  const done = () => {
    if (--left > 0) return;
    for (const node of [...voices, ...nodes]) if (node) node.disconnect();
    audio.active--;
  };
  for (const o of voices) o.onended = done;
}

// Drains the tick's note events. In time-lapse only a share of the phrases plays (about the real-time density),
// whole phrases so tunes stay whole; the simulation is unchanged. Every note that plays is also seen: its cell
// swells and sends out a ring (even when muted or before the first tap).
function hearNotes(w) {
  const notes = w.music.notes, keep = 1 / playSpeed();
  const sound = audio.started && !audio.muted && audio.ctx.state === 'running', at = performance.now() + PARAMS.audio.lookahead * 1000;
  for (const n of notes) {
    if (keep < 1 && hash01(Math.imul(n.phrase, 0x9e3779b1)) >= keep) continue;
    const c = n.c;
    c.songAt = at; c.songAtk = n.attack; c.songRel = n.release; c.songLast = n.last; c.songDrone = !!n.drone;
    if (n.startled) c.glowTick = w.tick;   // a startled cell flashes
    if (sound) { if (n.drone) playDrone(n); else playNote(n); }
  }
  notes.length = 0;
}

// The world turns the macros: nothing here is scripted, it only follows daylight, wind, blooms and visitors
let weatherAt = 0;
function audioWeather(w, now) {
  const Wt = PARAMS.audio.weather;
  if (!audio.started || now - weatherAt < Wt.update * 1000) return;
  weatherAt = now;
  let bio = 0, shadow = 0;
  for (const c of w.cells) if (!c.dying) bio += c.biomass;
  for (const v of w.visitors) if (v.x > -20 && v.x < W + 20) shadow = Math.max(shadow, Wt.shadow[v.kind] || 0);
  const t = audio.ctx.currentTime, glide = (param, v) => { param.setValueAtTime(param.value, t); param.linearRampToValueAtTime(v, t + Wt.update); };
  glide(audio.lp.frequency, (Wt.dark + (Wt.bright - Wt.dark) * w.surfaceLight) * (1 - shadow));
  glide(audio.fb.gain, Wt.echoCalm + (Wt.echoStorm - Wt.echoCalm) * w.wind);
  const Fl = PARAMS.audio.flutter;
  glide(audio.delay.delayTime, PARAMS.audio.delayTime * (1 + Fl.depth * (0.6 * Math.sin(waterT * Fl.rate) + 0.4 * Math.sin(waterT * Fl.rate2 + 1.3))));
  glide(audio.delayIn.gain, Wt.sendCalm + (Wt.sendStorm - Wt.sendCalm) * w.wind);
  glide(audio.verbIn.gain, Wt.roomClear + (Wt.roomBloom - Wt.roomClear) * clamp(bio / Wt.bloomFull, 0, 1));
}

// ---- Ambience ----
// A noise event: a stretch of the noise buffer through a filter (optionally sweeping), swelling and fading once
function noiseEvent(dur, peak, type, freq, q, panX, freqEnd, delay = 0) {
  const ctx = audio.ctx, t0 = ctx.currentTime + 0.05 + delay, end = t0 + dur;
  const src = ctx.createBufferSource();
  src.buffer = audio.noise;
  src.loop = true;
  const f = ctx.createBiquadFilter();
  f.type = type; f.Q.value = q;
  f.frequency.setValueAtTime(freq, t0);
  if (freqEnd) f.frequency.exponentialRampToValueAtTime(freqEnd, end);
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(Math.max(0.0002, peak), t0 + dur * 0.4);
  g.gain.exponentialRampToValueAtTime(0.0001, end);
  const pan = ctx.createStereoPanner ? ctx.createStereoPanner() : null;
  src.connect(f); f.connect(g);
  if (pan) { pan.pan.value = clamp(panX, -1, 1); g.connect(pan); pan.connect(audio.amb); } else g.connect(audio.amb);
  src.start(t0, ambRng.next() * audio.noise.duration);
  src.stop(end + 0.05);
  src.onended = () => { for (const node of [src, f, g, pan]) if (node) node.disconnect(); };
}

// A bubble's chirp: a small sine whose pitch rises as it rings down (smaller bubbles ring higher)
let bubbleBudget = 0, bubbleBudgetAt = 0;
function bubbleSound(x, size, seep) {
  if (!audio.started) return;
  const B = PARAMS.audio.ambience.bubble, ctx = audio.ctx, now = ctx.currentTime;
  bubbleBudget = Math.min(B.perSecond, bubbleBudget + (now - bubbleBudgetAt) * B.perSecond);
  bubbleBudgetAt = now;
  if (bubbleBudget < 1) return;
  bubbleBudget -= 1;
  const t0 = now + 0.02 + ambRng.next() * 0.05, dur = B.durMin + (B.durMax - B.durMin) * ambRng.next();
  const f0 = seep ? B.seepFreq * (0.8 + 0.4 * ambRng.next()) : B.freqMax - (B.freqMax - B.freqMin) * size;
  const osc = ctx.createOscillator(), g = ctx.createGain(), pan = ctx.createStereoPanner ? ctx.createStereoPanner() : null;
  osc.frequency.setValueAtTime(f0, t0);
  osc.frequency.exponentialRampToValueAtTime(f0 * B.rise, t0 + dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(B.gain * (seep ? 1.4 : 1), t0 + 0.004);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  osc.connect(g);
  if (pan) { pan.pan.value = (x / W * 2 - 1) * 0.8; g.connect(pan); pan.connect(audio.amb); } else g.connect(audio.amb);
  osc.start(t0);
  osc.stop(t0 + dur + 0.05);
  osc.onended = () => { for (const node of [osc, g, pan]) if (node) node.disconnect(); };
}

// Krill crackle: a train of tiny bandpassed noise clicks
function krillClicks(x) {
  const K = PARAMS.audio.krill, ctx = audio.ctx, n = K.trainMin + Math.floor(ambRng.next() * (K.trainMax - K.trainMin + 1));
  const f = K.freqMin + (K.freqMax - K.freqMin) * ambRng.next();
  for (let i = 0; i < n; i++) {
    const t0 = ctx.currentTime + 0.02 + i * K.gap * (0.7 + 0.6 * ambRng.next());
    const src = ctx.createBufferSource(), bp = ctx.createBiquadFilter(), g = ctx.createGain();
    const pan = ctx.createStereoPanner ? ctx.createStereoPanner() : null;
    src.buffer = audio.noise;
    bp.type = 'bandpass'; bp.frequency.value = f * (0.9 + 0.2 * ambRng.next()); bp.Q.value = K.q;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime(K.gain * (0.6 + 0.4 * ambRng.next()), t0 + 0.001);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + K.dur);
    src.connect(bp); bp.connect(g);
    if (pan) { pan.pan.value = clamp((x / W * 2 - 1) * 0.8 + (ambRng.next() - 0.5) * 0.3, -1, 1); g.connect(pan); pan.connect(audio.amb); } else g.connect(audio.amb);
    src.start(t0, ambRng.next() * (audio.noise.duration - 0.1));
    src.stop(t0 + K.dur + 0.02);
    src.onended = () => { for (const node of [src, bp, g, pan]) if (node) node.disconnect(); };
  }
}

// Each layer schedules its next overlapping event from the state of the world
const ambRng = makeRng(0xa3b1e);
const ambNext = { swell: 0, hum: 0, plume: 0, school: 0, krill: 0 };
function audioAmbience(w) {
  if (!audio.started) return;
  const Am = PARAMS.audio.ambience, t = audio.ctx.currentTime, wind = w.wind, r = () => ambRng.next();
  const lerp = (a, b, k) => a + (b - a) * k;
  if (t >= ambNext.swell) {   // the surface: soft and slow in calm water, loud, bright and quick in a storm
    const S = Am.swell;
    noiseEvent(lerp(S.durCalm, S.durStorm, wind) * (0.8 + 0.4 * r()), lerp(S.gainCalm, S.gainStorm, wind),
               'lowpass', lerp(S.freqCalm, S.freqStorm, wind) * (0.8 + 0.4 * r()), 0.6, r() * 1.6 - 0.8);
    ambNext.swell = t + lerp(S.everyCalm, S.everyStorm, wind) * (0.7 + 0.6 * r());
  }
  if (t >= ambNext.hum) {     // the deep: a low hum of the water column, darker at night
    const S = Am.hum;
    noiseEvent(S.dur, S.gain, 'lowpass', lerp(S.freqNight, S.freqDay, w.surfaceLight), 0.7, r() * 0.6 - 0.3);
    ambNext.hum = t + S.every * (0.8 + 0.4 * r());
  }
  if (w.pulses.length && t >= ambNext.plume) {   // an upwelling plume groans as it rises
    const S = Am.plume, pl = w.pulses[0];
    noiseEvent(S.dur, S.gain, 'lowpass', S.freq, S.q, pl.x / W * 2 - 1, S.freqEnd);
    ambNext.plume = t + S.every;
  }
  if (krillSeen.n > 0 && t >= ambNext.krill) {   // the swarm's crackle, saturating with its size
    const K = PARAMS.audio.krill, rate = K.rate * (1 - Math.exp(-krillSeen.n / K.half));
    krillClicks(krillSeen.x / krillSeen.n);
    ambNext.krill = t + (-Math.log(1 - r() * 0.999)) / rate;
  } else if (!krillSeen.n) ambNext.krill = t;
  const school = w.visitors.find((v) => v.kind === 'sardines' && v.x > -30 && v.x < W + 30);
  if (school && t >= ambNext.school) {           // a school's whoosh as it sweeps by
    const S = Am.school, up = r() < 0.5;
    noiseEvent(S.dur, S.gain, 'bandpass', up ? S.freq : S.freqEnd, S.q, school.x / W * 2 - 1, up ? S.freqEnd : S.freq);
    for (let k = 0; k < S.followers; k++) {   // the rest of the school, a beat behind and around
      const lag = (0.3 + 0.7 * r()) * S.lagMax, pan = school.x / W * 2 - 1 + (r() - 0.5) * 2 * S.spread, f = 0.85 + 0.3 * r();
      noiseEvent(S.dur * (0.6 + 0.3 * r()), S.gain * S.followGain * (0.6 + 0.4 * r()), 'bandpass', (up ? S.freq : S.freqEnd) * f, S.q, pan, (up ? S.freqEnd : S.freq) * f, lag);
    }
    ambNext.school = t + S.every * (0.7 + 0.6 * r());
  }
}

// The pitch nearest to semis above the root that the scale allows, in the given octave (MIDI)
function scaleNote(m, octave, semis) {
  let best = 0;
  for (const d of m.scale) if (Math.abs(d - semis % 12) < Math.abs(best - semis % 12)) best = d;
  return 12 * (octave + 1) + m.root + best + 12 * Math.floor(semis / 12);
}

const visitorNext = { school: 0, sunfish: 0, grain: 0, triGrain: 0, salp: 0, salpStep: 0, salpId: -1, jellies: 0, combs: 0 };
const jellyBeats = new Map();
// Sound halos (author): a visitor's sound sends one ring of its colour out from where it came from (render only)
const voiceRings = [];
function voiceRing(ramp, x, y, r) {
  if (audio.muted) return;
  voiceRings.push({ ramp, x, y, r, t: performance.now() });
  if (voiceRings.length > 40) voiceRings.shift();
}   // visitor id x 64 + jelly -> its last pulse count, to hear each new contraction

// Cyanobacteria's shimmer: grains scheduled at random, thicker where more is on screen
function audioCyano(w) {
  if (!audio.started) return;
  const A = PARAMS.audio;
  grainStream(w, A.cyanoGrains, 'grain', cyanoSeen, cyanoSeenX);   // the picocyanobacteria: tiny high grains
  grainStream(w, A.trichoGrains, 'triGrain', triSeen, triSeenX);    // Trichodesmium: lower, slower, warmer
}

function grainStream(w, C, key, seen, seenX) {
  const t = audio.ctx.currentTime, mean = seen / (TINT_W * TINT_H);
  const rate = C.rate * clamp((mean - C.from) / C.full, 0, 1);
  if (rate <= 0) { visitorNext[key] = t; return; }
  while (visitorNext[key] <= t + 0.05) {
