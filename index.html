  ink(CX + 2, cy0 + 2, 'SURFACE', COL.SLATE);
  ink(CX + 2, cy0 + ch - 7, 'FLOOR', COL.SLATE);
  if (solo >= 0) {   // the spread: one standard deviation either side, dithered
    const rb = rampBase(FORMS[solo].ramp);
    for (let c = 0; c < CW; c++) {
      const j = c * F + solo;
      if (!cols.has[c] || cols.n[j] < 0.5) continue;
      const a = Math.round(clamp(cols.depth[j] - cols.sd[j], 0, 1) * (ch - 1)), b = Math.round(clamp(cols.depth[j] + cols.sd[j], 0, 1) * (ch - 1));
      for (let k = a; k <= b; k++) if (bayer(CX + c, cy0 + k) < 0.5) put(CX + c, cy0 + k, rb + SHADOW);
    }
  }
  for (let f = 0; f < F; f++) {
    if (solo >= 0 && f !== solo) continue;
    chartLine(cy0, (c) => (cols.has[c] && cols.n[c * F + f] >= 0.5 ? Math.round(cols.depth[c * F + f] * (ch - 1)) : -1),
      rampBase(FORMS[f].ramp) + (solo >= 0 ? BRIGHT : HIGHLIGHT));
  }
  const NX = CX + CW + 3, L = w.surfaceLight, day = smoothstep(N.nightBelow, 0.7, L), now = new Array(F).fill(0);
  let deep = 0;
  for (let k = 0; k < ch; k++) {
    for (let i = 0; i < 7; i++) put(NX + i, cy0 + k, L < N.nightBelow ? COL.WATER : bayer(NX + i, cy0 + k) < day ? 3 : 2);
  }
  for (const c of w.cells) {
    if (c.dying) continue;
    const f = formOf(c);
    now[f]++;
    if (solo >= 0 && f !== solo) continue;
    if (f === solo) deep += clamp(c.y / column, 0, 1);
    put(NX + Math.floor(hash01(c.id * 7 + 3) * 7), cy0 + Math.round(clamp(c.y / column, 0, 1) * (ch - 1)), rampBase(FORMS[f].ramp) + HIGHLIGHT);
  }
  drawTimeAxis(cols, cy0 + ch + 3);

  const ly = cy0 + ch + 12, lx0 = P.x + Math.floor((P.w - (6 * 22 + 7)) / 2);
  for (let f = 0; f < F; f++) {
    let seen = now[f] > 0;
    for (let c = 0; c < CW && !seen; c++) seen = cols.n[c * F + f] > 0;
    const lx = lx0 + f * 22;
    drawIcon(lx, ly, f, !seen || (solo >= 0 && f !== solo));
    if (f === solo) for (let k = -1; k < 8; k++) put(lx + k, ly + 9, COL.FOAM);
    hit(lx - 7, ly - 4, 21, 16, () => { notebook.solo = notebook.solo === f ? -1 : f; });
  }
  if (solo < 0) inkCentre(ly + 13, 'ALL FORMS   TAP ONE TO FOLLOW', COL.SHAFT);
  else {
    inkCentre(ly + 13, FORMS[solo].name, COL.FOAM);
    inkCentre(ly + 21, 'NOW ' + now[solo] + (now[solo] ? '   AT ' + Math.round(deep / now[solo] * 100) + '% DEPTH' : ''), COL.SHAFT);
  }
}

// IV. The ledger: deaths by cause in the window, the population against the grazers and the nutrients, and visitors
function drawLedgerPage(w, y) {
  const N = PARAMS.notebook, P = N.page, CX = N.chart.x, CW = N.chart.w, x1 = P.x + P.w, S = NB.STRIDE, r = notebook.rows;
  drawSpanRow(y);
  const cols = notebookColumns(), last = (notebook.count - 1) * S, before = cols.t0 > 0 && cols.first > 0 ? (cols.first - 1) * S : -1;
  const deaths = CAUSES.map((k, i) => (notebook.count ? r[last + NB.DEATHS + i] - (before >= 0 ? r[before + NB.DEATHS + i] : 0) : 0));
  const total = deaths.reduce((s, v) => s + v, 0), most = Math.max(1, ...deaths);
  ink(P.x + 6, y + 11, 'DEATHS', COL.SHAFT);
  inkRight(x1 - 7, y + 11, String(total), COL.SHAFT);
  CAUSES.forEach((k, i) => {
    const ry = y + 20 + i * 9;
    ink(P.x + 6, ry, k.name, deaths[i] ? COL.FOAM : COL.SLATE);
    bar(52, ry + 1, 92, deaths[i] / most, k.ramp);
    inkRight(x1 - 7, ry, String(deaths[i]), deaths[i] ? COL.FOAM : COL.SLATE);
  });

  const series = [
    { name: 'NUTRIENTS', a: cols.nut, idx: rampBase(GOLD) + HIGHLIGHT },
    { name: 'GRAZERS', a: cols.graz, idx: rampBase(ROSE) + HIGHLIGHT },
    { name: 'CELLS', a: cols.pop, idx: COL.FOAM },
  ];
  let lx = P.x + 6;
  for (const s of [...series].reverse()) { ink(lx, y + 69, s.name, s.idx); lx += textWidth(s.name) + 8; }
  const cy0 = y + 78, ch = 110;
  chartBackground(cols, cy0, ch);
  for (const s of series) {   // each scaled to its own peak in the window
    let top = 0;
    for (let c = 0; c < CW; c++) if (cols.has[c]) top = Math.max(top, s.a[c]);
    if (top <= 0) continue;
    chartLine(cy0, (c) => (cols.has[c] ? ch - 1 - Math.round(s.a[c] / top * (ch - 1)) : -1), s.idx);
  }
  drawTimeAxis(cols, cy0 + ch + 3);

  const vy = cy0 + ch + 13, counts = VISITOR_INK.map(() => 0);
  dotted(CX, CX + CW - 1, vy + 6, COL.SLATE);
  for (const v of notebook.visits) {
    if (v.tick < cols.t0) continue;
    const i = VISITOR_INK.findIndex((k) => k.kind === v.kind), rb = rampBase(VISITOR_INK[i].ramp);
    const x = CX + (cols.t1 > cols.t0 ? Math.min(CW - 1, Math.floor((v.tick - cols.t0) / (cols.t1 - cols.t0) * CW)) : CW - 1);
    counts[i]++;
    put(x, vy, rb + BRIGHT);
    for (let k = 1; k < 6; k++) put(x, vy + k, rb + HIGHLIGHT);
  }
  lx = P.x + 6;
  VISITOR_INK.forEach((k, i) => {
    const text = k.name + ' ' + counts[i];
    ink(lx, vy + 11, text, rampBase(k.ramp) + HIGHLIGHT);
    lx += textWidth(text) + 9;
  });
}

// ===== Input =====
// One finger or mouse drag pans, two fingers pinch-zoom, the mouse wheel zooms at the cursor.
// The hand in the water: a tap scatters cells (any zoom); at zoom 1 a drag strums the cells it passes through and
// drags the water along; moving toward the surface opens the master filter, toward the deep closes it, and sideways
// travel makes the filter ring at a peak that follows the finger (left low, right high), until the finger lifts.
const input = { lastActivity: 0, pointers: new Map(), pinch: null, down: null, bend: 0, reso: 0, peakX: 0, plucks: 0, plucksAt: 0 };
const trail = [];

const toWorld = (p) => ({ x: cam.x + p.x / cam.zoom, y: cam.y + p.y / cam.zoom });

// Cells within reach of the finger's path from a to b (world units) pluck, each at most once per pluckRest
function strum(a, b, now) {
  const T = PARAMS.touch, ex = b.x - a.x, ey = b.y - a.y, len2 = ex * ex + ey * ey;
  input.plucks = Math.min(T.plucksPerSecond, input.plucks + (now - input.plucksAt) / 1000 * T.plucksPerSecond);
  input.plucksAt = now;
  for (const c of world.cells) {
    if (c.dying || now - (c.pluckAt || -1e9) < T.pluckRest * 1000) continue;
    const t = len2 ? clamp(((c.x - a.x) * ex + (c.y - a.y) * ey) / len2, 0, 1) : 0;
    const dx = c.x - (a.x + ex * t), dy = c.y - (a.y + ey * t), r = c.rv + T.touch;
    if (dx * dx + dy * dy > r * r || input.plucks < 1) continue;
    input.plucks -= 1;
    c.pluckAt = now;
    pluck(world, c);
  }
}

function toInternal(e) {
  const dpr = window.devicePixelRatio || 1;
  return { x: (e.clientX * dpr - view.ox) / view.scale, y: (e.clientY * dpr - view.oy) / view.scale };
}

function startPinch() {
  const [a, b] = [...input.pointers.values()];
  const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
  input.pinch = {
    d0: Math.max(1, Math.hypot(a.x - b.x, a.y - b.y)), zoom0: cam.zoom,
    wx: cam.x + mx / cam.zoom, wy: cam.y + my / cam.zoom,   // world point held under the fingers
  };
}

function setupInput() {
  const el = view.canvas;
  input.lastActivity = performance.now();
  const wake = () => { input.lastActivity = performance.now(); needsRender = true; };

  el.addEventListener('pointerdown', (e) => {
    const hud = hudVisibility(performance.now());
    wake();
    startAudio();
    el.setPointerCapture(e.pointerId);
    const p0 = toInternal(e);
    input.pointers.set(e.pointerId, p0);
    input.down = input.pointers.size === 1 ? { id: e.pointerId, x: p0.x, y: p0.y, t: performance.now(), moved: 0, hud } : null;
    if (input.pointers.size === 2) startPinch();
  });
  el.addEventListener('pointermove', (e) => {
    wake();
    const prev = input.pointers.get(e.pointerId);
    if (!prev) return;
    const p = toInternal(e);
    input.pointers.set(e.pointerId, p);
    const d0 = input.down;
    if (notebook.open) {   // the open notebook takes the finger: no panning, no strumming behind the page
      if (d0 && d0.id === e.pointerId) d0.moved = Math.max(d0.moved, Math.hypot(p.x - d0.x, p.y - d0.y));
      return;
    }
    if (input.pinch && input.pointers.size >= 2) {
      const [a, b] = [...input.pointers.values()];
      const d = Math.max(1, Math.hypot(a.x - b.x, a.y - b.y));
      const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
      cam.level = nearestLevel(input.pinch.zoom0 * d / input.pinch.d0);
      cam.zoom = ZOOMS[cam.level];
      cam.x = input.pinch.wx - mx / cam.zoom;
      cam.y = input.pinch.wy - my / cam.zoom;
      clampCamera();
    } else if (input.pointers.size === 1) {
      const d = input.down;
      if (d && d.id === e.pointerId) d.moved = Math.max(d.moved, Math.hypot(p.x - d.x, p.y - d.y));
      if (cam.level === 0 && d && d.moved > PARAMS.touch.tapMove) {   // zoomed out: the finger plays the water
        const a = toWorld(prev), b = toWorld(p), now = performance.now(), dt = Math.max(0.008, (now - (d.last || d.t)) / 1000);
        d.last = now;
        strum(a, b, now);
        world.inputs.push({ kind: 'wake', x: b.x, y: b.y, vx: (b.x - a.x) / dt, vy: (b.y - a.y) / dt });
        const T = PARAMS.touch, steps = Math.ceil(Math.hypot(b.x - a.x, b.y - a.y) / T.trailSpacing);
        for (let i = 1; i <= steps; i++) trail.push({ x: a.x + (b.x - a.x) * i / steps, y: a.y + (b.y - a.y) * i / steps, t: now });
        input.bend = clamp(input.bend - (b.y - a.y) / (H * T.bendSpan), -1, 1);   // toward the light opens, the deep closes
        setBend(input.bend, PARAMS.audio.bend.glide);
        input.reso = clamp(input.reso + Math.abs(b.x - a.x) / (W * T.resoSpan), 0, 1);   // sideways travel makes the filter ring
        input.peakX = b.x / W;
        setPeak(input.reso, input.peakX, PARAMS.audio.bend.glide);
      } else panBy(p.x - prev.x, p.y - prev.y);
    }
  });
  const release = (e) => {
    const d = input.down;
    const p = input.pointers.get(e.pointerId) || d;
    const tapped = d && d.id === e.pointerId && d.moved <= PARAMS.touch.tapMove && performance.now() - d.t < PARAMS.touch.tapMs;
    if (tapped && onNewWater(p) && !notebook.open) { seedNewWater(); input.down = null; }
    else if (tapped && onMusicGlyph(p) && (d.hud > 0 || notebook.open)) { setMuted(!audio.muted); input.down = null; }   // the music button
    else if (d && d.id === e.pointerId && notebook.open) { notebookRelease(d, p); input.down = null; }
    else if (d && d.id === e.pointerId) {
      const tap = d.moved <= PARAMS.touch.tapMove && performance.now() - d.t < PARAMS.touch.tapMs;
      if (tap && onGlyph(p) && d.hud > 0) openNotebook(true);   // the glyph answers only while it can be seen
      else if (tap) {   // a tap scatters the cells
        const q = toWorld(input.pointers.get(e.pointerId) || d);
        world.inputs.push({ kind: 'tap', x: q.x, y: q.y });
        ripples.push({ x: q.x, y: q.y, t: performance.now() });
      }
      input.down = null;
      if (input.reso > 0) { input.reso = 0; setPeak(0, input.peakX, PARAMS.audio.bend.back); }
      if (input.bend !== 0) { input.bend = 0; setBend(0, PARAMS.audio.bend.back); }   // the water forgets the hand
    }
    input.pointers.delete(e.pointerId);
    if (input.pointers.size < 2) input.pinch = null;
  };
  el.addEventListener('pointerup', (e) => { startAudio(); release(e); });
  el.addEventListener('pointercancel', release);

  el.addEventListener('wheel', (e) => {
    e.preventDefault();
    wake();
    if (notebook.open) { setSpan(notebook.span + (e.deltaY < 0 ? -1 : 1)); return; }   // the graphs zoom in time
    const p = toInternal(e);
    zoomAt(cam.level + (e.deltaY < 0 ? 1 : -1) * PARAMS.camera.wheelStep, p.x, p.y);
  }, { passive: false });

  window.addEventListener('keydown', (e) => {
    wake();
    if (e.key === 'm' || e.key === 'M') { if (audio.started) setMuted(!audio.muted); else startAudio(); return; }
    startAudio();
    if (e.key === 'n' || e.key === 'N') openNotebook(!notebook.open);
    else if (notebook.open && notebookKey(e.key)) e.preventDefault();
    else if (e.key === 'd' || e.key === 'D') debug.on = !debug.on;
    else if (e.key === '+' || e.key === '=') zoomAt(cam.level + 1, W / 2, H / 2);
    else if (e.key === '-' || e.key === '_') zoomAt(cam.level - 1, W / 2, H / 2);
    else if (e.key === ']') setSpeed(speedLevel + 1);
    else if (e.key === '[') setSpeed(speedLevel - 1);
  });
  window.addEventListener('resize', () => { resize(); needsRender = true; });
}

// ===== Debug =====
const debug = {
  on: false, history: [], nextSample: 0,
  frameMs: new Float64Array(PARAMS.debug.frameSamples), frameIdx: 0, frameCount: 0,
  droppedTicks: 0, checksum: null, sync: null, syncTick: 0,
};

// Called after every tick so samples and checksums land on exact ticks.
function debugSample(w) {
  const D = PARAMS.debug, minute = 60 * PARAMS.time.tickRate;
  if (w.tick >= debug.nextSample) {
    let depth = 0, n = 0;
    for (const c of w.cells) if (!c.dying) { depth += c.y; n++; }
    debug.history.push({ pop: n, nut: meanNutrient(w), depth: n ? depth / n / H : -1, light: w.surfaceLight, wind: w.wind });
    if (debug.history.length > D.historyLength) debug.history.shift();
    debug.nextSample += D.sampleEvery;
  }
  if (w.tick % minute === 0) debug.checksum = { minute: w.tick / minute, hash: worldChecksum(w) };
}

function recordFrame(ms) {
  debug.frameMs[debug.frameIdx] = ms;
  debug.frameIdx = (debug.frameIdx + 1) % debug.frameMs.length;
  debug.frameCount++;
}

// Mini-maps in the top-right corner: nutrients (green) with cells as dots, light (gold) beside it,
// and the camera's view as a dotted frame.
function drawFieldMaps(w) {
  const D = PARAMS.debug, { cols, rows } = PARAMS.grid, m = D.mapCell, green = rampBase(0), gold = rampBase(1);
  const node = (field, ramp, i, j, ox) => {
    const v = clamp(field[j * cols + i], 0, 1) * 4;
    for (let y = 0; y < m; y++) {
      for (let x = 0; x < m; x++) {
        const px = ox + i * m + x, py = D.mapY + j * m + y;
        let k = v | 0;
        if (bayer(px, py) < v - k) k++;
        put(px, py, ramp + (k > BRIGHT ? BRIGHT : k));
      }
    }
  };
  // Grazers (rose) below the nutrient map, scaled so the floor is dark and 2 is bright
  const rose = rampBase(ROSE), zy = rows * m + 2;
  for (let j = 0; j < rows; j++) {
    for (let i = 0; i < cols; i++) {
      node(w.fields.nut, green, i, j, D.mapX);
      const v = clamp(w.fields.graz[j * cols + i] / 2, 0, 1) * 4;
      for (let y = 0; y < m; y++) {
        for (let x = 0; x < m; x++) {
          const px = D.mapX + i * m + x, py = D.mapY + zy + j * m + y;
          let k = v | 0;
          if (bayer(px, py) < v - k) k++;
          put(px, py, rose + (k > BRIGHT ? BRIGHT : k));
        }
      }
    }
    node(w.fields.light, gold, 0, j, D.mapX + cols * m + 1);
  }
  for (const p of w.pulses) put(D.mapX + Math.floor(p.x / GRID_W * m), D.mapY + Math.floor(p.y / GRID_H * m), COL.GLOW);
  for (const c of w.cells) {
    if (!c.dying) put(D.mapX + Math.floor(c.x / GRID_W * m), D.mapY + Math.floor(c.y / GRID_H * m), COL.FOAM);
  }
  if (cam.zoom > 1) {
    const x0 = D.mapX + Math.floor(cam.x / GRID_W * m), y0 = D.mapY + Math.floor(cam.y / GRID_H * m);
    const x1 = x0 + Math.round(W / cam.zoom / GRID_W * m), y1 = y0 + Math.round(H / cam.zoom / GRID_H * m);
    for (let x = x0; x <= x1; x += 2) { put(x, y0, COL.GLOW); put(x, y1, COL.GLOW); }
    for (let y = y0; y <= y1; y += 2) { put(x0, y, COL.GLOW); put(x1, y, COL.GLOW); }
  }
}

function drawDebug(w) {
  const D = PARAMS.debug, pop = aliveCount(w);
  if (!debug.sync || w.tick - debug.syncTick >= D.syncEvery) { debug.sync = syncStats(w); debug.syncTick = w.tick; }
  const sy = debug.sync;
  const n = Math.min(debug.frameCount, debug.frameMs.length);
  const ms = Array.from(debug.frameMs.subarray(0, n)).sort((p, q) => p - q);
  const avg = n ? ms.reduce((s, v) => s + v, 0) / n : 0, p95 = n ? ms[Math.floor(n * 0.95)] : 0;
  const ck = debug.checksum ? pad(debug.checksum.minute, 2) + ' ' + debug.checksum.hash.toString(16).toUpperCase().padStart(8, '0') : '-';
  const lines = [
    'POP ' + pop + '  CYST ' + w.cysts.length + '  NUT ' + meanNutrient(w).toFixed(2),
    'SYNC ' + sy.local.toFixed(2) + ' LK ' + sy.locked.toFixed(2) + ' G ' + sy.global.toFixed(2),
    'CHAIN ' + sy.chains + ' MAX ' + sy.longest + ' IN ' + Math.round(sy.chained * 100) + '%',
    'VOX ' + (audio.started ? audio.active : w.music.ends.length) + '  ONS ' + (w.music.recent.length / 10).toFixed(1) + '  KEY ' + keyName(w.music),
    'MS ' + avg.toFixed(1) + '  P95 ' + p95.toFixed(1),
    'DROP ' + debug.droppedTicks,
    'CK ' + ck,
    'DAY ' + dayPhase(w).toFixed(2) + ' SUN ' + w.surfaceLight.toFixed(2) + ' WIND ' + w.wind.toFixed(2) + ' PL ' + w.pulses.length,
    'DIED S ' + w.deaths.starved + ' O ' + w.deaths.old + ' G ' + w.deaths.grazed + ' F ' + w.deaths.sardines + ' SP ' + w.deaths.salps,
    'ELD ' + w.music.elders.length + ' FULL ' + w.cells.filter((c) => !c.dying && c.elder >= 1).length + '  DRONE ' + (audio.started ? audio.drones : w.music.droneEnds.length) + '  ROOT CHG ' + w.music.rootChanges,
    'VISIT ' + (w.visitors.map((v) => v.kind.slice(0, 3).toUpperCase()).join(' ') || '-'),
  ];
  for (let i = 0; i < lines.length; i++) drawText(3, 6 + i * 7, lines[i], COL.FOAM, 1);
  drawFieldMaps(w);

  // Population (foam), mean nutrient (gold), mean cell depth (rose, down = deeper), sunlight (slate), wind (emerald)
  // over the last ~10 minutes; dotted slate line = cap
  const gy = D.graphY, gh = D.graphH, ib = view.ibuf;
  for (let y = gy; y < gy + gh; y++) for (let x = 0; x < W; x++) ib[y * W + x] = COL.WATER;
  for (let x = 0; x < W; x += 2) put(x, gy, COL.SLATE);
  const hist = debug.history, x0 = W - hist.length;
  for (let i = 0; i < hist.length; i++) {
    put(x0 + i, gy + gh - 1 - Math.round(hist[i].light * (gh - 1)), COL.SLATE);
    put(x0 + i, gy + gh - 1 - Math.round(hist[i].wind * (gh - 1)), rampBase(EMERALD) + BASE);
    if (hist[i].depth >= 0) put(x0 + i, gy + Math.round(hist[i].depth * (gh - 1)), rampBase(ROSE) + HIGHLIGHT);
    put(x0 + i, gy + gh - 1 - Math.round(hist[i].pop / PARAMS.division.maxCells * (gh - 1)), COL.FOAM);
    put(x0 + i, gy + gh - 1 - Math.round(clamp(hist[i].nut, 0, 1) * (gh - 1)), rampBase(1) + HIGHLIGHT);
  }
}

// ===== Loop =====
let world = null, seedLabel = '', lastTime = 0, acc = 0, needsRender = true, speedLevel = 0, lastLive = 0;   // lastLive: wall time the world last stepped on the page

// Time-lapse runs more of the same fixed ticks per second; the world stays deterministic.
function setSpeed(level) {
  speedLevel = clamp(level, 0, PARAMS.time.speeds.length - 1);
  needsRender = true;
}

// Lives the world on to now (time-lapse, the tail of a catch-up, the fixed ticks) and keeps it saved; returns the ticks run
function advance(now) {
  if (!lastTime) lastTime = now;
  const speed = playSpeed();
  const real = Math.min((now - lastTime) / 1000, 1);
  if (catchup.phase === 'worker') needsRender = true;   // the worker lives the world; the page only shows it
  else acc += real * speed;
  lastTime = now;
  if (ambientT < 0) ambientT = world.tick * TICK_DT;
  ambientT += real * Math.max(PARAMS.ambient.rate, speed);
  let ticks = 0;
  while (acc >= TICK_DT && ticks < PARAMS.time.maxTicksPerFrame * speed) {
    stepWorld(world);
    debugSample(world);
    notebookSample(world);
    hearNotes(world);
    acc -= TICK_DT;
    ticks++;
  }
  if (acc >= TICK_DT) { debug.droppedTicks += Math.floor(acc / TICK_DT); acc = 0; }
  if (catchup.phase !== 'worker') lastLive = Date.now();
  if (catchup.phase === 'tail' && world.tick >= catchupTarget()) endCatchup();
  if (keeper.db && now - keeper.lastSave > PARAMS.persist.every * 1000) saveWorld();
  return ticks;
}

function frame(now) {
  requestAnimationFrame(frame);
  const t0 = performance.now(), ticks = advance(now);
  // Everything visible is tied to simulation ticks or the camera, so other frames would be identical.
  if (ticks > 0 || needsRender) {
    const overlayMs = render(world, now);
    audioWeather(world, now);
    audioAmbience(world);
    needsRender = false;
    recordFrame(performance.now() - t0 - overlayMs);
  }
}

// ===== Init =====
function hashString(s) {
  let h = 0x811c9dc5;
  for (let i = 0; i < s.length; i++) h = Math.imul(h ^ s.charCodeAt(i), 16777619);
  return h >>> 0;
}

// With none of ?seed, ?stress, ?ff, ?day the page keeps one world that lives on between visits (saved in IndexedDB);
// any of them starts a scratch world that is never saved, so trying a seed never overwrites the kept one.
// ?seed= (number or word), ?debug, ?stress (start at the cell cap), ?ff=seconds (fast-forward),
// ?zoom=1..4 with ?at=x,y (world point to centre on), ?speed=1|2|4|8 (time-lapse), ?day=5|10|30 (minutes),
// ?notebook=1..4 (open the field notebook on that page), ?bench (how fast this device lives a world out of sight).
// M turns the music off, N opens the notebook.
function readOptions() {
  const q = new URLSearchParams(location.search);
  const kept = !q.has('seed') && !q.has('stress') && !q.has('ff') && !q.has('day') && !q.has('bench');
  let label = (q.get('seed') || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 12), seed;
  if (!label) {
    seed = crypto.getRandomValues(new Uint32Array(1))[0] % 1000000;   // the one non-seeded draw: picking the seed
    label = String(seed);
    if (!kept) try { q.set('seed', label); history.replaceState(null, '', location.pathname + '?' + q.toString()); } catch (e) { /* file:// may refuse */ }
  } else {
    seed = /^\d+$/.test(label) ? Number(label) >>> 0 : hashString(label);
  }
  const at = (q.get('at') || '').split(',').map(Number);
  return {
    seed, label, debug: q.has('debug'), stress: q.has('stress'), ff: Math.max(0, Number(q.get('ff')) || 0),
    zoom: Number(q.get('zoom')) || 1, atX: at.length === 2 ? at[0] : W / 2, atY: at.length === 2 ? at[1] : H / 2,
    speed: Number(q.get('speed')) || 1, notebook: Math.floor(Number(q.get('notebook')) || 0),
    dayLength: PARAMS.diel.dayMinutes.includes(Number(q.get('day'))) ? Number(q.get('day')) * 60 : PARAMS.diel.dayLength,
    kept, bench: q.has('bench'),
  };
}

// ---- The kept world: saved every few seconds and on leaving, found again on the next visit ----
// saved: what the last save wrote of the notebook, so the next one only writes the rows that changed
const keeper = { db: null, lastSave: 0, busy: false, off: false, saved: null };

function saveWorld() {
  const k = keeper;
  k.lastSave = performance.now();
  if (!k.db || k.busy || k.off || catchup.phase) return;   // mid catch-up the last save stands (and is caught up again)
  const R = PARAMS.persist.chunkRows, nb = notebookState(), chunks = Math.ceil(nb.count / R);
  const puts = {
    world: { v: PARAMS.persist.version, label: seedLabel, savedAt: Date.now(), snap: snapshotWorld(world), notebook: nb, chunks, prefs: { muted: audio.muted } },
  };
  const thinned = !k.saved || k.saved.every !== nb.every;   // a thinning rewrote every row
  for (let i = thinned ? 0 : Math.floor(k.saved.count / R); i < chunks; i++) puts['rows:' + i] = notebookChunk(i);
  for (let i = chunks; k.saved && i < k.saved.chunks; i++) puts['rows:' + i] = undefined;
  k.busy = true;
  storeWrite(k.db, puts)
    .then(() => { k.saved = { count: nb.count, every: nb.every, chunks }; })
    .catch(() => { k.saved = null; })   // the next save writes everything again
    .finally(() => { k.busy = false; });
}

async function loadWorld(db) {
  const rec = (await storeGet(db, ['world'])).world;
  if (!rec) return null;
  const keys = [];
  for (let i = 0; i < rec.chunks; i++) keys.push('rows:' + i);
  const rows = await storeGet(db, keys);
  const chunks = keys.map((k) => rows[k] || new Float32Array(0));
  if (rec.v < 2) for (const c of chunks) for (let o = 0; o < c.length; o += NB.STRIDE) c[o + NB.TICK] /= PARAMS.time.tickRate;   // rows kept ticks before v2
  return { rec, world: restoreWorld(rec.snap), rows: chunks };
}

// After an extinction: the kept world is let go and new water is seeded on reload
function seedNewWater() {
  keeper.off = true;
  storeClear(keeper.db).finally(() => location.reload());
}

// ---- Catching up: the kept world lives the time it was away ----
// phase: 'worker' (a worker lives the time out of sight; the page shows its frames), 'tail' (the page plays the
// rest, slowing to real time), '' (live). The target keeps moving: real time goes on while it catches up.
const catchup = { phase: '', base: 0, lived: 0, rested: 0, openedAt: 0, worker: null, bench: null };
const RENDER_KEYS = ['spr', 'tempo', 'vt', 'swimPh', 'ox', 'oy', 'along', 'glowTick', 'songAt', 'songAtk', 'songRel', 'songLast', 'songDrone', 'pluckAt'];

const catchupTarget = () => catchup.base + Math.floor((catchup.lived + (Date.now() - catchup.openedAt) / 1000) * PARAMS.time.tickRate);   // wall clock: it runs on while the phone sleeps
const tailTicks = () => PARAMS.persist.tail * PARAMS.time.tickRate;

// The simulation and notebook code of this very page, run in a worker
function workerSource() {
  const src = document.querySelector('script').textContent;
  const part = (a, b) => src.slice(src.indexOf('// ===== ' + a + ' ====='), src.indexOf('// ===== ' + b + ' ====='));
  return part('PARAMS', 'Audio') + part('Notebook', 'Input') + '\ncatchupWorker();\n';
}

// A frame from the worker replaces the world on screen; cells keep their sprites and swimming where they still live
function showWorld(snap) {
  const w = restoreWorld(snap), old = new Map();
  for (const c of world.cells) old.set(c.id, c);
  for (const c of w.cells) { const o = old.get(c.id); if (o) for (const k of RENDER_KEYS) c[k] = o[k]; }
  world = w;
  needsRender = true;
}

function startWorker(onMessage) {
  const url = URL.createObjectURL(new Blob([workerSource()], { type: 'text/javascript' }));
  const wk = new Worker(url);
  URL.revokeObjectURL(url);
  wk.onmessage = onMessage;
  wk.postMessage({ snap: snapshotWorld(world), nb: notebookState(), rows: notebook.rows.slice(0, notebook.count * NB.STRIDE), target: catchupTarget() - tailTicks() });
  return wk;
}

// away: seconds the world has not lived (closed, hidden, or still behind in a tail)
function catchUp(away) {
  const P = PARAMS.persist;
  if (catchup.worker) catchup.worker.terminate();
  catchup.lived = Math.min(away, P.maxAway);
  catchup.rested = away - catchup.lived;
  catchup.base = world.tick;
  catchup.openedAt = Date.now();
  if (catchup.rested > 0) notebook.rests.push({ tick: world.tick, s: catchup.rested });
  catchup.phase = 'tail';
  if (catchup.lived <= P.tail) return;
  try {
    catchup.worker = startWorker((e) => {
      const m = e.data;
      if (catchup.phase !== 'worker') return;
      showWorld(m.snap);
      if (m.kind === 'progress') { catchup.worker.postMessage({ target: catchupTarget() - tailTicks() }); return; }
      restoreNotebook(m.nb, [m.rows]);
      catchup.worker.terminate();
      catchup.phase = 'tail';
    });
    catchup.worker.onerror = () => { catchup.worker.terminate(); restRemainder(); };
    catchup.phase = 'worker';
  } catch (e) { restRemainder(); }
}

// Back on screen after being hidden (the page lived on in the phone's memory but nothing stepped it): the kept world
// catches up as if it had been closed. A tail left far behind goes back to the worker.
function resumeAfterGap() {
  if (!keeper.db || catchup.bench || catchup.phase === 'worker' || !lastLive) return;
  if (catchup.phase === 'tail') {
    const behind = (catchupTarget() - world.tick) / PARAMS.time.tickRate;
    if (behind > PARAMS.persist.tail) catchUp(behind);
    return;
  }
  const gap = (Date.now() - lastLive) / 1000;
  if (gap > PARAMS.persist.gap) catchUp(gap);
}

function onVisibility() {
  lastTime = 0;
  if (!document.hidden) {
    if (audio.ctx && audio.ctx.state !== 'running' && audio.started) audio.ctx.resume();
    resumeAfterGap();
    return;
  }
  saveWorld();
}

// Without a worker the page cannot live hours quickly: the time beyond the tail is rested instead
function restRemainder() {
  const behind = (catchupTarget() - world.tick) / PARAMS.time.tickRate - PARAMS.persist.tail;
  if (behind > 0) {
    catchup.lived -= behind;
    catchup.rested += behind;
    notebook.rests.push({ tick: world.tick, s: behind });
  }
  catchup.phase = 'tail';
}

function endCatchup() {
  catchup.phase = '';
  input.lastActivity = performance.now();   // the readout stays a while, then fades
  saveWorld();
}

// How fast the world runs on the page: the time-lapse chosen, or faster while the tail of a catch-up plays
function playSpeed() {
  const user = PARAMS.time.speeds[speedLevel], P = PARAMS.persist;
  if (catchup.phase === 'worker') return P.tailSpeed;
  if (catchup.phase !== 'tail') return user;
  const behind = (catchupTarget() - world.tick) / PARAMS.time.tickRate;
  return Math.max(user, 1 + (P.tailSpeed - 1) * Math.sqrt(clamp(behind / P.tail, 0, 1)));
}

// ?bench: a scratch world lived in the worker for a while; the readout shows how many times real time it ran
function startBench() {
  const t0 = performance.now(), tick0 = world.tick;
  catchup.phase = 'worker';
  catchup.bench = { result: 0 };
  catchup.base = 1e12;   // a target it never reaches
  catchup.worker = startWorker((e) => {
    if (catchup.phase !== 'worker') return;
    showWorld(e.data.snap);
    const secs = (performance.now() - t0) / 1000;
    catchup.bench.result = (world.tick - tick0) / PARAMS.time.tickRate / secs;
    if (secs < PARAMS.persist.bench) catchup.worker.postMessage({ target: 1e12 });
    else { catchup.worker.terminate(); catchup.phase = ''; catchup.bench.done = true; input.lastActivity = 1e12; }
  });
}

async function init() {
  const opts = readOptions();
  seedLabel = opts.label;
  let found = null;
  if (opts.kept && window.indexedDB) {
    try {
      keeper.db = await openStore();
      if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
    } catch (e) { keeper.db = null; }   // no storage (private window, blocked): a world for this visit only
    if (keeper.db) {
      try { found = await loadWorld(keeper.db); }
      catch (e) { found = null; await storeClear(keeper.db).catch(() => {}); }   // a save that cannot be read: new water, still kept
    }
  }
  if (found) {
    world = found.world;
    seedLabel = found.rec.label;
    restoreNotebook(found.rec.notebook, found.rows);
    keeper.saved = { count: found.rec.notebook.count, every: found.rec.notebook.every, chunks: found.rec.chunks };
    audio.muted = !!(found.rec.prefs && found.rec.prefs.muted);
    catchUp(Math.max(0, (Date.now() - found.rec.savedAt) / 1000));
  } else {
    world = createWorld(opts.seed, opts.stress ? PARAMS.division.maxCells : 0, opts.dayLength);
    if (opts.bench) startBench();
  }
  if (keeper.db) {
    saveWorld();
    window.addEventListener('pagehide', saveWorld);
  }
  document.addEventListener('visibilitychange', onVisibility);
  lastLive = Date.now();
  if ('serviceWorker' in navigator && window.isSecureContext && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
  debug.on = opts.debug;
  const ffTicks = Math.floor(opts.ff * PARAMS.time.tickRate);
  for (let i = 0; i < ffTicks; i++) { stepWorld(world); debugSample(world); notebookSample(world); world.music.notes.length = 0; }
  initRender(document.getElementById('screen'));
  cam.level = nearestLevel(opts.zoom);
  cam.zoom = ZOOMS[cam.level];
  cam.x = opts.atX - W / (2 * cam.zoom);
  cam.y = opts.atY - H / (2 * cam.zoom);
  clampCamera();
  setSpeed(Math.max(0, PARAMS.time.speeds.indexOf(opts.speed)));
  if (opts.notebook >= 1 && opts.notebook <= PAGES.length) { notebook.page = opts.notebook - 1; openNotebook(true); }
  setupInput();
  requestAnimationFrame(frame);
}

init();
</script>
